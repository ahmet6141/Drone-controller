name: config-checks

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Parametre dosyaları (PX4 v1.17 / ArduPilot 4.7.1 referansı)
        run: python3 tools/validate_params.py
      - name: Donanım bütçesi (limit kontrolleri)
        run: python3 tools/budget_calc.py --all
      - name: Sensör kataloğu (sürücü parametreleri ve seviye seçimleri)
        run: python3 tools/sensor_matrix.py
      - name: Bütçe kesinti senaryoları (paketler limitler içinde)
        run: python3 tools/scenarios.py
      - name: CAD yerleşimi (ağırlık merkezi, görüş alanları, tasarım kuralları)
        run: python3 cad/layout.py
      - name: Titreşim ve dayanım analizi (gimbal taşıyıcı kolu, sönümleyici, koruma direkleri)
        run: python3 cad/analysis.py
      - name: v2 bütünleşik gövde — yerleşim (ağırlık merkezi, boşluklar, EMI, görüş alanı)
        run: python3 cad/v2/layout_v2.py
      - name: v2 kol–kanal modülü titreşim ve dayanım analizi
        run: python3 cad/v2/analysis_v2.py
      - name: v2 varyant bütçesi (limit kontrolleri)
        run: python3 tools/budget_calc.py config/hardware/variants/tier-a-entegre.yaml
      - name: Tutarlılık testleri
        run: python3 -m unittest discover -s tests -v
