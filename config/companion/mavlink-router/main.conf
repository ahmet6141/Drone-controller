# mavlink-router yapılandırması (Jetson üzerinde)
# FC TELEM1 (MAVLink 2) -> Jetson UART -> UDP: yer istasyonu (QGC) + yerel uygulamalar.
# Sözdizimi: https://github.com/mavlink-router/mavlink-router/blob/master/examples/config.sample
# Not: ROS 2 trafiği bu yoldan değil, ayrı UART üzerinden uXRCE-DDS ile gider (docs/04 §3.1).

[General]
TcpServerPort = 5760
ReportStats = false
MavlinkDialect = common
# Ham MAVLink telemetri kaydı (PX4 ulog'a ek olarak)
Log = /var/log/dc7/mavlink
LogMode = while-armed
MaxLogFiles = 50

[UartEndpoint fc_telem1]
# Taşıyıcı karta göre değişir (ör. /dev/ttyTHS1); docs/companion-kurulum için bkz. config/companion/README.md
Device = /dev/ttyTHS1
Baud = 921600
FlowControl = true

[UdpEndpoint gcs]
# IP veri linki üzerinden yer istasyonu (QGroundControl 14550'yi dinler)
Mode = Normal
Address = 192.168.144.100
Port = 14550

[UdpEndpoint local_apps]
# Companion üzerindeki MAVLink istemcileri (MAVSDK, kamera bileşeni, tıkla-takip et)
Mode = Server
Address = 127.0.0.1
Port = 14540
