# Seviye A — EKONOMİK (Raspberry Pi) yapılandırma — önerilen başlangıç
# Raspberry Pi kameraları + kendi tasarımımız 2 eksen gimbal + uygun fiyatlı sensörler (docs/10).
# Pi 5'in iki 4 şeritli MIPI girişi: gimbal kamerası + aşağı (avuç) kamerası.
# Hesap: python3 tools/budget_calc.py config/hardware/tier-a-ekonomik.yaml
schema_version: 1

profile:
  id: tier-a-ekonomik
  name: "Seviye A — Ekonomik (Raspberry Pi)"
  platform: raspberry_pi
  summary: >-
    Raspberry Pi 5 8GB + AI HAT+ 2 (Hailo-10H) + ARK FPV (PX4 v1.17); Camera Module 3 (gimbal) ve
    Camera Module 3 Wide (avuç); STorM32 tabanlı 2 eksen gimbal; MTF-01 akış + lazer, VL53L8CX 8×8,
    VL53L1X; M10 GNSS; WFB-ng IP link. VIO yok (GNSS'siz hover: akış + lazer).

limits:
  max_auw_g: 1600
  min_tw_ratio: 2.2
  min_hover_time_min: 15
  max_hover_throttle: 0.35

components:
  - {name: "GEPRC MOZ7 V2 gövde (336 mm)", category: gövde, mass_g: 270, price_usd: 110}
  - {name: "Tam pervane koruması + alt ağ (PA12-CF, 3B baskı)", category: gövde, mass_g: 110, price_usd: 40, notes: "tahmini"}
  - {name: "Avuç iniş tutamağı (TPU + köpük, ≥120 mm)", category: gövde, mass_g: 40, price_usd: 15, notes: "tahmini"}
  - {name: "Üst plaka, bağlantılar, kablolama", category: kablolama, mass_g: 60, price_usd: 50, notes: "tahmini"}
  - {name: "ARK FPV uçuş kontrolcüsü (H743, IIM-42653 + ısıtıcı)", category: aviyonik, mass_g: 7.5, power_w: 1.5, price_usd: 195}
  - {name: "Raspberry Pi 5 8GB + Active Cooler + AI HAT+ 2 (Hailo-10H)", category: companion, mass_g: 90, power_w: 10, price_usd: 380, notes: "kütle ve güç tahmini; Pi 5 8GB $175 (PiShop, 10/2026), AI HAT+ 2 $200"}
  - {name: "Raspberry Pi Camera Module 3 (IMX708, 66° yatay) — gimbal", category: kamera, mass_g: 4, power_w: 0.3, price_usd: 25}
  - {name: "Kendi tasarım 2 eksen fırçasız gimbal (2× motor, STorM32, IMU, baskı parçalar, sönümleyici)", category: kamera, mass_g: 85, power_w: 2.5, price_usd: 95, notes: "tahmini, docs/10 §3"}
  - {name: "Raspberry Pi Camera Module 3 Wide (102° yatay) — aşağı/avuç", category: kamera, mass_g: 4, power_w: 0.3, price_usd: 38.5}
  - {name: "VL53L8CX 8×8 ToF (Pololu kartı) — aşağı", category: sensör, mass_g: 1, power_w: 0.5, price_usd: 25}
  - {name: "VL53L1X ToF — yukarı (baş üstü boşluk)", category: sensör, mass_g: 1, power_w: 0.1, price_usd: 15, notes: "fiyat tahmini"}
  - {name: "MicoAir MTF-01 optik akış + ToF lazer (8 m)", category: sensör, mass_g: 4.5, power_w: 0.5, price_usd: 35, notes: "fiyat tahmini"}
  - {name: "Holybro M10 GNSS + IST8310 pusula", category: sensör, mass_g: 32, power_w: 0.5, price_usd: 44}
  - {name: "RadioMaster XR4 ELRS alıcı + anten", category: haberleşme, mass_g: 5, power_w: 0.3, price_usd: 30, notes: "fiyat tahmini"}
  - {name: "WFB-ng: RTL8812AU/EU USB adaptör + antenler", category: haberleşme, mass_g: 20, power_w: 3, price_usd: 45, notes: "tahmini; BTK güç sınırı"}
  - {name: "Remote ID modülü (Open Drone ID)", category: haberleşme, mass_g: 10, power_w: 0.5, price_usd: 60, notes: "tahmini"}
  - {name: "BEC 5 V/5 A (Pi 5) + 12 V (gimbal) (dönüşüm kayıpları ≈ %10)", category: aviyonik, mass_g: 25, power_w: 2.0, price_usd: 30}

propulsion:
  motor_count: 4
  installation_factor: 0.90
  motor: {name: "EMAX ECO II 2807 1300KV", kv: 1300, mass_g: 47.6, price_usd: 24}
  prop: {name: "HQProp 7x4x3", diameter_in: 7.0, pitch_in: 4.0, blades: 3, mass_g: 8, price_usd: 3}
  esc: {name: "Holybro Tekko32 F4 50A (AM32)", continuous_a: 50, mass_g: 13.8, price_usd: 63}
  thrust_curve:
    # ECO II için yayımlanmış ara nokta verisi yok → aynı sınıf T-Motor F90 eğrisi VEKİL olarak kullanıldı.
    source: "VEKİL: T-Motor F90 1300KV + HQ 7x4x3 @ 24.2 V — https://www.ligpower.com/product/f90-fpv-motor.html"
    voltage_v: 24.2
    points:
      - [353, 52]
      - [948, 213]
      - [2361, 1059]
    throttle_points:
      - [0.3, 353]
      - [0.5, 948]
      - [1.0, 2361]

battery:
  name: "6S1P Molicel P50B (21700 Li-ion)"
  chemistry: li-ion
  cells_series: 6
  capacity_mah: 5000
  nominal_cell_v: 3.6
  mass_g: 451
  usable_fraction: 0.85
  max_continuous_a: 60
  price_usd: 80

ground_equipment:
  - {name: "RadioMaster TX15 (ELRS LR1121)", price_usd: 160}
  - {name: "WFB-ng yer istasyonu (RTL8812AU/EU + yönlü anten)", price_usd: 80, notes: "tahmini"}
