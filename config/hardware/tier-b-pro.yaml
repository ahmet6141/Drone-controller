# Seviye B — ÖNERİLEN PRO yapılandırma (varsayılan hedef)
# Kütle/güç/fiyat kaynakları: docs/02-donanim-analizi.md. "tahmini" notlu değerler ölçülerek güncellenecek.
# Hesap: python3 tools/budget_calc.py config/hardware/tier-b-pro.yaml
schema_version: 1

profile:
  id: tier-b-pro
  name: "Seviye B — Önerilen Pro"
  summary: >-
    Orin NX 16GB (Super) + ARK FPV (PX4 v1.17), SIYI A8 mini gimbal, global shutter aşağı kamera + 8×8 ToF,
    OAK-D Lite ile cuVSLAM VIO, RTK-hazır GNSS, DroneCAN akış/lidar, SIYI HM30 IP link.

limits:
  max_auw_g: 1750
  min_tw_ratio: 2.2          # batarya sürekli akım sınırı dahil
  min_hover_time_min: 15
  max_hover_throttle: 0.35

components:
  - {name: "GEPRC MOZ7 V2 gövde (336 mm)", category: gövde, mass_g: 270, price_usd: 110}
  - {name: "Tam pervane koruması + alt ağ (PA12-CF, 3B baskı)", category: gövde, mass_g: 110, price_usd: 40, notes: "tahmini"}
  - {name: "Avuç iniş tutamağı (TPU + köpük, ≥120 mm)", category: gövde, mass_g: 40, price_usd: 15, notes: "tahmini"}
  - {name: "Üst plaka, bağlantılar, kablolama", category: kablolama, mass_g: 70, price_usd: 60, notes: "tahmini"}
  - {name: "ARK FPV uçuş kontrolcüsü (H743, IIM-42653 + ısıtıcı)", category: aviyonik, mass_g: 7.5, power_w: 1.5, price_usd: 195}
  - {name: "Jetson Orin NX 16GB + Auvidea JNX120X + soğutucu", category: companion, mass_g: 130, power_w: 22, price_usd: 1815, notes: "modül ≈28 g türetilmiş; güç ortalama tahmini (MAXN SUPER tepe ≈40 W)"}
  - {name: "SIYI A8 mini gimbal kamera", category: kamera, mass_g: 95, power_w: 5, price_usd: 257}
  - {name: "Arducam OV9281 global shutter (aşağı, 130°)", category: kamera, mass_g: 8, power_w: 0.6, price_usd: 40, notes: "kütle/fiyat tahmini"}
  - {name: "VL53L8CX 8×8 ToF (aşağı)", category: sensör, mass_g: 3, power_w: 0.3, price_usd: 30, notes: "tahmini"}
  - {name: "VL53L1X ToF (yukarı, baş üstü boşluk)", category: sensör, mass_g: 2, power_w: 0.1, price_usd: 15}
  - {name: "Holybro H-Flow (PAA3905 + AFBR-S50, DroneCAN)", category: sensör, mass_g: 15.2, power_w: 0.6, price_usd: 145}
  - {name: "Holybro H-RTK F9P Ultralight GNSS", category: sensör, mass_g: 25, power_w: 0.8, price_usd: 279}
  - {name: "Holybro DroneCAN RM3100 pusula (direk üstü)", category: sensör, mass_g: 15, power_w: 0.2, price_usd: 66, notes: "kütle tahmini"}
  - {name: "Luxonis OAK-D Lite (global shutter stereo + IMU)", category: kamera, mass_g: 61, power_w: 3.5, price_usd: 269}
  - {name: "RadioMaster XR4 ELRS alıcı + anten", category: haberleşme, mass_g: 5, power_w: 0.3, price_usd: 30, notes: "fiyat tahmini"}
  - {name: "SIYI HM30 hava ünitesi + antenler", category: haberleşme, mass_g: 89, power_w: 6, price_usd: 650, notes: "güç ve set fiyatı doğrulanmadı"}
  - {name: "Remote ID modülü (Open Drone ID)", category: haberleşme, mass_g: 10, power_w: 0.5, price_usd: 60, notes: "tahmini"}
  - {name: "BEC 12 V/6 A + 5 V (dönüşüm kayıpları ≈ %10)", category: aviyonik, mass_g: 25, power_w: 4.1, price_usd: 25}

propulsion:
  motor_count: 4
  # Gövde gölgelemesi + koruma halkası/alt ağ itki kaybı (tahmini %10; itki standında ölçülecek)
  installation_factor: 0.90
  motor: {name: "T-Motor F90 2806.5 1300KV", kv: 1300, mass_g: 46.6, price_usd: 30}
  prop: {name: "HQProp 7x4x3", diameter_in: 7.0, pitch_in: 4.0, blades: 3, mass_g: 8, price_usd: 3}
  esc: {name: "Holybro Tekko32 F4 Metal 65A (AM32, akım sensörlü)", continuous_a: 65, mass_g: 15.8, price_usd: 95}
  thrust_curve:
    source: "T-Motor F90 1300KV + HQ 7x4x3 @ 24.2 V — https://www.ligpower.com/product/f90-fpv-motor.html"
    voltage_v: 24.2
    points:            # [itki_g, elektrik_gücü_W] (V×I, ESC girişi)
      - [353, 52]
      - [948, 213]
      - [2361, 1059]
    throttle_points:   # [gaz_oranı, itki_g] → THR_MDL_FAC tahmini
      - [0.3, 353]
      - [0.5, 948]
      - [1.0, 2361]

battery:
  name: "6S1P Molicel P50B (21700 Li-ion)"
  chemistry: li-ion
  cells_series: 6
  capacity_mah: 5000
  nominal_cell_v: 3.6
  mass_g: 451
  usable_fraction: 0.85
  max_continuous_a: 60
  price_usd: 80

ground_equipment:
  - {name: "RadioMaster TX16S MK3 (ELRS 2.4 GHz + 900 MHz Gemini)", price_usd: 200}
