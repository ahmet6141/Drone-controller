# Seviye C — ÜST SEVİYE yapılandırma
# Amaç: en iyi hover (RTK + üç IMU + geniş açılı VIO), uzun menzilli şeffaf IP link.
# Uçuş kontrolcüsü (ARKV6X) Auvidea JNX120X'in Pixhawk Autopilot Bus (PAB) yuvasında
# (yuva uyumluluğu üreticiyle teyit edilmeli). Gelecek yükseltme: Jetson T2000 (Q1 2027, yeni taşıyıcı).
# Hesap: python3 tools/budget_calc.py config/hardware/tier-c-ust.yaml
schema_version: 1

profile:
  id: tier-c-ust
  name: "Seviye C — Üst Seviye"
  summary: >-
    Orin NX 16GB (MAXN SUPER) + ARKV6X (PAB, 3 IMU), ARK X20 RTK + ARK Flow MR, OAK-D Pro W ile
    geniş açılı VIO, Doodle Labs mesh IP link. Dayanım seçeneği (6S2P) docs/02'de.

limits:
  max_auw_g: 1750
  min_tw_ratio: 2.2
  min_hover_time_min: 15
  max_hover_throttle: 0.35

