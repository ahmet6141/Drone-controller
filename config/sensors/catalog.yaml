# Sensör kataloğu: her görev için alternatifler ve uçuş yığını uyumluluğu (docs/11).
# Parametre adları ve enum değerleri resmi referanslara göre test edilir:
#   tools/data/px4_v1.17_params.json · tools/data/ardupilot_copter_4.7.1_params.json
# Rapor:  python3 tools/sensor_matrix.py            (özet + doğrulama)
#         python3 tools/sensor_matrix.py --markdown (karşılaştırma tabloları)
#
# Destek türleri (support):
#   native     uçuş kontrolcüsünde yerel sürücü, parametreyle açılır
#   dronecan   CAN veriyolu, standart DroneCAN mesajları (üreticiden bağımsız)
#   mavlink    sensör kendisi MAVLink mesajı yollar (OPTICAL_FLOW_RAD, DISTANCE_SENSOR, OPEN_DRONE_ID_*)
#   msp        MSP protokolü (yalnızca ArduPilot)
#   companion  Raspberry Pi / Jetson okur → ROS 2 → PX4 DDS girişi veya ArduPilot'a MAVLink (bridges)
# Parametre değeri "port": seri port seçimi (PX4: 101 TELEM1, 102 TELEM2, 201 GPS1 …;
#   ArduPilot: SERIALn numarası). serial_protocol: ArduPilot SERIALn_PROTOCOL değeri.
# Fiyatlar USD, 10/2026 yaklaşık; price_verified: false olanlar sipariş öncesi kontrol edilmeli.
schema_version: 1
retrieved: "2026-10-02"

roles:
  optical_flow:     {title: "Hareket (optik akış)", px4_bridge: sensor_optical_flow}
  rangefinder_down: {title: "Lazer irtifa (aşağı)", px4_bridge: distance_sensor}
  overhead:         {title: "Baş üstü mesafe (yukarı)", px4_bridge: distance_sensor}
  palm_tof:         {title: "Avuç: çok bölgeli ToF", companion_only: true}
  palm_thermal:     {title: "Avuç: termal doğrulama (opsiyonel)", companion_only: true}
  obstacle:         {title: "Engel algılama (360° / ileri)", px4_bridge: obstacle_distance}
  gnss:             {title: "GNSS"}
  compass:          {title: "Harici pusula"}
  remote_id:        {title: "Uzaktan kimlik (Remote ID)"}

bridges:
  px4_dds:
    note: "PX4 v1.17 uXRCE-DDS giriş konuları; companion'ın okuyabildiği her sensör buradan PX4'e girer"
    topics:
      distance_sensor: /fmu/in/distance_sensor
      obstacle_distance: /fmu/in/obstacle_distance
      sensor_optical_flow: /fmu/in/sensor_optical_flow
      vehicle_visual_odometry: /fmu/in/vehicle_visual_odometry
  ardupilot_mavlink:
    note: "companion → mavlink-router → FC; sensör verisi MAVLink mesajı olarak girer"
    params: {RNGFND1_TYPE: 10, FLOW_TYPE: 5, PRX1_TYPE: 2}
  companion_buses:
    raspberry_pi_5: ["I2C", "SPI", "UART (overlay ile birden fazla)", "USB 3.0 ×2", "MIPI CSI ×2"]
    jetson_orin_nx: ["I2C", "SPI", "UART", "USB 3.2", "MIPI CSI (taşıyıcıya bağlı)", "Ethernet"]

# Uyumluluk genişliği: tools/sensor_matrix.py bu listeleri referans verisinde sayar.
breadth:
  px4:
    rangefinder: [SENS_TFMINI_CFG, SENS_EN_TF02PRO, SENS_EN_VL53L0X, SENS_EN_VL53L1X, SENS_CM8JL65_CFG,
                  SENS_SF0X_CFG, SENS_EN_SF1XX, SENS_EN_TRANGER, SENS_EN_LL40LS, SENS_EN_MPDT,
                  SENS_LEDDAR1_CFG, SENS_ULAND_CFG, SENS_EN_MB12XX, SENS_EN_SR05, SENS_EN_PGA460]
    optical_flow: [SENS_TFLOW_CFG, SENS_EN_PMW3901, SENS_EN_PAW3902, SENS_EN_PAA3905, SENS_EN_PX4FLOW]
    obstacle: [SENS_EN_SF45_CFG]
    gnss: {param: GPS_1_PROTOCOL, exclude: [0]}
    dronecan: [UAVCAN_SUB_RNG, UAVCAN_SUB_FLOW, UAVCAN_SUB_GPS, UAVCAN_SUB_MAG, UAVCAN_SUB_BARO, UAVCAN_SUB_IMU]
  ardupilot:
    rangefinder: {param: RNGFND1_TYPE, exclude: [0, 36, 100]}   # None, Lua betiği, SITL
    optical_flow: {param: FLOW_TYPE, exclude: [0, 10]}          # None, SITL
    obstacle: {param: PRX1_TYPE, exclude: [0, 10, 12, 15]}      # None, SITL, AirSim, betik
    gnss: {param: GPS1_TYPE, exclude: [0, 7]}                   # None, HIL
    gimbal: {param: MNT1_TYPE, exclude: [0, 9]}                 # None, betik

options:
  # ---------------------------------------------------------------- hareket + irtifa
  - id: mtf01
    name: "MicoAir MTF-01 (akış + ToF lazer)"
    roles: [optical_flow, rangefinder_down]
    interface: UART
    specs: "akış 42° FOV, ≥ 8 cm; ToF 8 m (60 klux'ta 5 m), 100 Hz"
    mass_g: 4.5
    price_usd: 35
    price_verified: false
    match: "MTF-01"
    px4: {support: mavlink, params: {MAV_1_CONFIG: port},
          note: "OPTICAL_FLOW_RAD + DISTANCE_SENSOR; sensör çıkışı PX4 MAVLink'e ayarlanır (MicoAssistant); yalnızca gönderir → ARK FPV'de yalnız RX'li TELEM4 yeter (104)"}
    ardupilot: {support: mavlink, params: {FLOW_TYPE: 5, RNGFND1_TYPE: 10, RNGFND1_ORIENT: 25}, serial_protocol: 1,
                note: "ArduPilot belgesi: 115200, MAVLink1, 4.7+ için MAVx_OPTIONS=2; sensör çıkışı mav-apm"}
    notes: "Akış + lazer tek modülde en ucuz çözüm; Seviye A seçimi"

  - id: matek_3901_l0x
    name: "Matek 3901-L0X (PMW3901 + VL53L0X)"
    roles: [optical_flow]
    interface: UART (MSP)
    specs: "dahili lidar ArduPilot belgesine göre ≤ 1,2 m → ayrı lazer şart"
    mass_g: null
    price_usd: 20
    price_verified: false
    px4: {support: companion, params: {}, note: "PX4'te MSP sensör girişi yok → Pi okur, /fmu/in/sensor_optical_flow"}
    ardupilot: {support: msp, params: {FLOW_TYPE: 7, RNGFND1_TYPE: 32}, serial_protocol: 32}
    notes: "ArduPilot'ta en ucuz yol; TF-Luna ile birlikte ≈ $42"

  - id: thoneflow_3901u
    name: "ThoneFlow-3901U (PMW3901)"
    roles: [optical_flow]
    interface: UART
    specs: "yalnızca akış, ≥ 8 cm; ayrı lazer şart"
    mass_g: null
    price_usd: 20
    price_verified: false
    px4: {support: native, params: {SENS_TFLOW_CFG: port}}
    ardupilot: {support: companion, params: {FLOW_TYPE: 5},
                note: "ArduPilot listesinde yok → companion üzerinden MAVLink"}
    notes: "PX4'te yerel sürücülü en ucuz akış"

  - id: pmw3901_spi
    name: "PMW3901 SPI kartı (Bitcraze / Pimoroni tipi)"
    roles: [optical_flow]
    interface: SPI
    specs: "yalnızca akış; FC'de harici SPI gerekir (çoğu kartta yok)"
    mass_g: null
    price_usd: 20
    price_verified: false
    px4: {support: native, params: {SENS_EN_PMW3901: 1}}
    ardupilot: {support: native, params: {FLOW_TYPE: 2}}
    notes: "Pi 5'in SPI'ına bağlanıp companion ile de okunabilir"

  - id: h_flow
    name: "Holybro H-Flow (PAA3905 + AFBR-S50 + IMU)"
    roles: [optical_flow, rangefinder_down]
    interface: DroneCAN
    specs: "kaliteli akış + lidar, CAN üzerinden tek kablo"
    mass_g: 15.2
    price_usd: 145
    price_verified: true
    match: "H-Flow"
    px4: {support: dronecan, params: {UAVCAN_ENABLE: 2, UAVCAN_SUB_FLOW: 1, UAVCAN_SUB_RNG: 1}}
    ardupilot: {support: dronecan, params: {CAN_P1_DRIVER: 1, CAN_D1_PROTOCOL: 1, FLOW_TYPE: 6, RNGFND1_TYPE: 24}}
    notes: "Seviye B seçimi"

  - id: ark_flow_mr
    name: "ARK Flow MR (PAA3905 + AFBR-S50LX85D)"
    roles: [optical_flow, rangefinder_down]
    interface: DroneCAN
    specs: "lidar 8 cm – 50 m (PX4 belgesi)"
    mass_g: 5
    price_usd: 350
    price_verified: true
    match: "ARK Flow MR"
    px4: {support: dronecan, params: {UAVCAN_ENABLE: 2, UAVCAN_SUB_FLOW: 1, UAVCAN_SUB_RNG: 1}}
    ardupilot: {support: dronecan, params: {CAN_P1_DRIVER: 1, CAN_D1_PROTOCOL: 1, FLOW_TYPE: 6, RNGFND1_TYPE: 24}}
    notes: "Seviye C seçimi"

  - id: tfmini_s
    name: "Benewake TFmini-S"
    roles: [rangefinder_down]
    interface: UART / I2C
    specs: "0,1–12 m, 70 klux'ta çalışır"
    mass_g: 5
    price_usd: 45
    price_verified: false
    px4: {support: native, params: {SENS_TFMINI_CFG: port}}
    ardupilot: {support: native, params: {RNGFND1_TYPE: 20, RNGFND1_ORIENT: 25}, serial_protocol: 9,
                note: "I2C ile RNGFND1_TYPE=25"}
    notes: "Güneşli / yüksek uçuşta MTF-01'e ek lazer"

  - id: tf_luna
    name: "Benewake TF-Luna"
    roles: [rangefinder_down, overhead]
    interface: UART / I2C
    specs: "0,2–8 m, ±6 cm, 250 Hz, ≤ 0,35 W, 2° FOV"
    mass_g: 5
    price_usd: 22
    price_verified: false
    px4: {support: companion, params: {},
          note: "PX4 belgesinde yalnızca RaccoonLab DroneCAN adaptörüyle; UART çerçevesi TFmini ile aynı → SENS_TFMINI_CFG doğrulanacak"}
    ardupilot: {support: native, params: {RNGFND1_TYPE: 27, RNGFND1_ORIENT: 25}, serial_protocol: 9,
                note: "ArduPilot belgesi: seri 27 (BenewakeTF03), I2C 25"}
    notes: "En ucuz uzun menzilli lazer"

  - id: vl53l1x
    name: "ST VL53L1X (tek nokta ToF)"
    roles: [overhead, rangefinder_down]
    interface: I2C
    specs: "4 m, 50 Hz; güneşte menzil düşer → aşağı yönde yalnızca iç mekân"
    mass_g: 1
    price_usd: 15
    price_verified: false
    match: "VL53L1X"
    px4: {support: native, params: {SENS_EN_VL53L1X: 1}}
    ardupilot: {support: native, params: {RNGFND1_TYPE: 16, RNGFND1_ADDR: 41, RNGFND1_ORIENT: 24},
