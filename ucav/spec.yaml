    base_d_m: 0.012               # varsayım
  lights:                         # renkler: iskele kırmızı, sancak yeşil, dikey uçlarında beyaz strobe
    - {name: "Nav_L", kind: "nav", color: "red", where: "raked_tip_le", side: "L", y_m: 1.868}
    - {name: "Nav_R", kind: "nav", color: "green", where: "raked_tip_le", side: "R", y_m: 1.868}
    - {name: "Strobe_L", kind: "strobe", color: "white", where: "fin_tip_te", side: "L"}
    - {name: "Strobe_R", kind: "strobe", color: "white", where: "fin_tip_te", side: "R"}
    - {name: "Turret_Ring", kind: "status", color: "turquoise", where: "turret_collar"}
  markings:
