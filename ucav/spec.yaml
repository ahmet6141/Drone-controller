stability:
  cg_s_m: 1.232                   # tasarım CG (U_Root burada: Blender X = −1,232, Z = 0,006)
  cg_z_m: 0.006
  cg_range_s_m: [1.219, 1.245]    # ön SM %15, arka SM %5
  np_s_m: 1.258
  np_pct_mac: 34.1
  cg_pct_mac: 24.1
  static_margin_pct_mac: 10.0
  method: >-
    x_np = [a_wb·x_ac,w + F_h·x_ac,h + F_g·x_g − Cmα_f·c̄] / (a_wb + F_h + F_g).
    a_h: Helmbold, AR_etkin = AR_h·(1 + 1,9·k·h_dikey/b_h); dε/dα: DATCOM; F_h = η_h·a_h·S_h,açık/S·(1 − dε/dα);
