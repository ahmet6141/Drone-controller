# -----------------------------------------------------------------------------------------------------
# Blender kontrol paneli (U_Root özel özellikleri) — sürücü aralıkları. Fiziksel sınırlar yukarıdaki
# control_surfaces bloklarındadır; rig bunları ayrıca kırpar. shapes uç boşluklarını bu aralığın ve fiziksel
# sınırların birleşiminde çakışma olmayacak şekilde hesaplar.
# -----------------------------------------------------------------------------------------------------
rig:
  ranges_deg:
    aileron: [-25, 25]            # + = sağa yatış (diferansiyel 1,67:1 → yukarı ≤ 20°, aşağı ≤ 12°)
    flap: [0, 35]                 # iç + dış flap birlikte; mekanik sınır 30°
    elevator: [-25, 25]           # + = firar kenarı aşağı
    rudder: [-25, 25]             # + = firar kenarı sancağa; burun tekeri ∓30° (yalnız takım açık)

