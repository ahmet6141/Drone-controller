# -----------------------------------------------------------------------------------------------------
landing_gear:
  product: "JP Hobby ER-150 15 mm ×3 (20 kg sınıfı, 'inside'; ünite 160 g, 26×102×32 mm, 12 kg·cm, 90°, 8,4 V'ta 5 s)"
  ground_z_m: -0.2904             # takım açık, statik yükte
  sequence:                       # Blender: gear 0 → 1 tek sürücü; kapak–bacak–kapak
    doors_open: [0.00, 0.15]
    legs: [0.15, 0.85]
    doors_close: [0.85, 1.00]
    times_s: {door: 1.0, leg: 5.0}
    note: "Kapak sırası ArduPilot Lua ile; JP V1 sıralayıcı kapakları açık bırakır. Link kaybında takım iner."
  main:
    pivot: [1.2825, 0.33, -0.042]       # sol; sağ ayna. %42 veterde, kök bloğunda
    leg_length_m: 0.22                   # pivot–aks, yüksüz
    rake_aft_deg: 12.0                   # bacak geriye yatık
    static_sag_m: 0.008                  # statik amortisör çökmesi (bacak boyunca)
    stroke_m: 0.015
    retract_deg: 90                      # boylamasına eksen etrafında İÇE
    retract_direction: "inward"
    wheel_d_m: 0.0825
    wheel_w_m: 0.026                     # varsayım. Kuyuya bugün 22,5 mm sığar (kuyu tavanı arka-iç köşede kanat üst
                                         # derisiyle sınırlı; gear.tyre_fit_width). Tavan yükseltilirse 26 mm'ye döner.
    hub_d_m: 0.040                       # varsayım
    strut_d_m: 0.015                     # amortisör gövdesi. varsayım
    slider_d_m: 0.010                    # alt kayar boru. varsayım
    brake: true
    unit_span_y_m: [0.23, 0.33]          # ER-150 ünitesi kök bloğunda açıklık boyunca
    mount_plate: "3 mm G10, sokete ve kök kaburgalarına bağlı"
    well:                                # tekerlek kuyusu (kanat kökü + gövde alt yanı + kök kaportası)
      s_m: [1.279, 1.374]
      y_m: [0.070, 0.160]
      depth_m: 0.036
    leg_slot_w_m: 0.026                  # katlanmış bacak yuvası genişliği (bacak kapağıyla örtülür). varsayım
    doors:
      wheel: {hinge: "inboard", open_deg: 92}     # kuyu kapağı, gövde–kaporta kenarından menteşeli, 1 servo
      leg: {attach: "strut"}                      # bacağa bağlı kapak, yuvayı örter
  nose:
    pivot: [0.42, 0.0, -0.056]
    leg_length_m: 0.208                  # pivot–aks, yüksüz
    rake_aft_deg: 0.0
    retract_deg: 90                      # yanal eksen etrafında GERİYE
    retract_direction: "aft"
    wheel_d_m: 0.070
    wheel_w_m: 0.022                     # varsayım
    hub_d_m: 0.034                       # varsayım
    strut_d_m: 0.014                     # varsayım
    slider_d_m: 0.010                    # varsayım
    steer_deg: 30                        # U_GearSteer_N, servo yönlendirme
    stroke_m: 0.015                      # ER-150 15 mm (ana takımla aynı). varsayım
    well:
      s_m: [0.400, 0.667]
      half_width_m: 0.026                # varsayım
      roof_z_m: -0.012                   # akü kızağının altı. varsayım
    doors:
      clamshell: {count: 2, open_deg: 95, strut_notch: {s_m: [0.402, 0.448], half_width_m: 0.010}}   # varsayım: çentik
  reference:                             # panel değerleri — sizing.py geometriden yeniden hesaplar
    main_axle_s_m: 1.328
    retracted_main_wheel: [1.328, 0.115, -0.042]
    retracted_nose_wheel_s_m: 0.628     # panel 0,620 (statik boyla); uçuşta amortisör açık → 0,42 + 0,208
    track_m: 0.66
    wheelbase_m: 0.908
    cg_height_m: 0.296
    tip_back_deg: 18.0
    tip_back_aft_cg_deg: 15.7
    overturn_deg: 46.9
    nose_load_pct: 10.6
    static_loads_n: {main_each: 51.3, nose: 12.2}
    prop_clearance_mm: 218
    prop_strike_deg: 13.6
    prop_clearance_at_6deg_mm: 122
    cowl_contact_deg: 22.5
    stab_tip_contact_deg: 20.4
    wingtip_clearance_mm: 366
    bank_to_wingtip_deg: 13.1
    turret_clearance_mm: 156
    belly_clearance_mm: 191

