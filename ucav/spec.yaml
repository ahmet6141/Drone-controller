      - {name: "Seri", text: "001", h_m: 0.010, role: "accent", where: "fin_root", h_fin_m: 0.055}
      - {name: "Kriko", text: "KRİKO", h_m: 0.004, role: "accent", where: "jack", s_m: [0.80, 1.62], tri_m: 0.010}
    antenna_doubler: {length_x_chord: 1.35, w_m: 0.014, t_m: 0.0012, screw_d_m: 0.0016}   # bıçak anten tabanı

# -----------------------------------------------------------------------------------------------------
# Blender kontrol paneli (U_Root özel özellikleri) — sürücü aralıkları. Fiziksel sınırlar yukarıdaki
# control_surfaces bloklarındadır; rig bunları ayrıca kırpar. shapes uç boşluklarını bu aralığın ve fiziksel
# sınırların birleşiminde çakışma olmayacak şekilde hesaplar.
# -----------------------------------------------------------------------------------------------------
rig:
  ranges_deg:
    aileron: [-25, 25]            # + = sağa yatış (diferansiyel 1,67:1 → yukarı ≤ 20°, aşağı ≤ 12°)
    flap: [0, 35]                 # iç + dış flap birlikte; mekanik sınır 30°
    elevator: [-25, 25]           # + = firar kenarı aşağı
    rudder: [-25, 25]             # + = firar kenarı sancağa; burun tekeri ∓30° (yalnız takım açık)

# -----------------------------------------------------------------------------------------------------
# İniş takımı: JP Hobby ER-150 15 mm ×3, tamamı elektrikli, üç tekerlekli
# -----------------------------------------------------------------------------------------------------
landing_gear:
  product: "JP Hobby ER-150 15 mm ×3 (20 kg sınıfı, 'inside'; ünite 160 g, 26×102×32 mm, 12 kg·cm, 90°, 8,4 V'ta 5 s)"
  ground_z_m: -0.2904             # takım açık, statik yükte
  door_sawtooth: {pitch_m: 0.012, flank_deg: 36.0}   # kapak/kuyu dudağı testere dişi (yalnız deri katmanında). varsayım
  sequence:                       # Blender: gear 0 → 1 tek sürücü; kapak–bacak–kapak
    doors_open: [0.00, 0.15]
    legs: [0.15, 0.85]
    doors_close: [0.85, 1.00]
    times_s: {door: 1.0, leg: 5.0}
    note: "Kapak sırası ArduPilot Lua ile; JP V1 sıralayıcı kapakları açık bırakır. Link kaybında takım iner."
  main:
    pivot: [1.2825, 0.33, -0.042]       # sol; sağ ayna. %42 veterde, kök bloğunda
    leg_length_m: 0.22                   # pivot–aks, yüksüz
    rake_aft_deg: 12.0                   # bacak geriye yatık
    static_sag_m: 0.008                  # statik amortisör çökmesi (bacak boyunca)
    stroke_m: 0.015
    retract_deg: 90                      # boylamasına eksen etrafında İÇE
    retract_direction: "inward"
    wheel_d_m: 0.0825
    wheel_w_m: 0.026                     # varsayım. Kuyuya bugün 20,5 mm sığar: toplu tekerde tavana ≥ 2,5 mm pay (AERO-06);
                                         # tavan arka-iç köşede kanat üst derisiyle sınırlı (gear.tyre_fit_width).
    hub_d_m: 0.040                       # varsayım
    strut_d_m: 0.015                     # amortisör gövdesi. varsayım
    slider_d_m: 0.010                    # alt kayar boru. varsayım
    brake: true
    unit_span_y_m: [0.218, 0.320]        # ER-150 gövdesi (102 mm) kök bloğunda açıklık boyunca, pim kaportasının 3 mm içinde
    unit_placement: "bacak yuvasının ARKASINDA (ön kenar = yuva arka kenarı + 2,5 mm), 26 mm kenar düşey, 32 mm veter
      boyunca: Ø30 merkez soket / Ø27 panel borusu / Ø25 takviye borusunun arkasında (AERO-01). Pime 3 mm G10 plaka"
    unit_clearance_m: 0.0025             # ünite ↔ bacak yuvası ön kenarı / CF boru dış çapı en az pay. varsayım
    mount_plate: "3 mm G10, sokete ve kök kaburgalarına bağlı"
    well:                                # tekerlek kuyusu (kanat kökü + gövde alt yanı + kök kaportası)
      s_m: [1.279, 1.374]
      y_m: [0.0675, 0.160]               # iç duvar 2,5 mm içe: toplu tekerde duvara ≥ 2,5 mm (AERO-06)
      depth_m: 0.039                     # tavan −0,021 (kalın kanat bölgesinde; incelen arka-iç köşede kanat üst derisi − 1,5 mm)
    leg_slot_w_m: 0.026                  # katlanmış bacak yuvası genişliği (bacak kapağıyla örtülür). varsayım
    leg_slot_front_extra_m: 0.002        # yuvanın ön kenarı ayrıca öne: toplu kayar boru/çatal tacına ≥ 2,5 mm. varsayım
    doors:
      wheel: {hinge: "inboard", open_deg: 92}     # kuyu kapağı, gövde–kaporta kenarından menteşeli, 1 servo
      leg: {attach: "strut"}                      # bacağa bağlı kapak, yuvayı örter
  nose:
    # Pivot s 0,42 → 0,53: ER-150 ünitesi ve kuyu sökülebilir burun modülü ekinin (s 0,40) tamamen arkasında (P5).
    # Pivot 12 mm alçaldı ve bacak 12 mm kısaldı: 12 mm çatal ofsetinin (iz/trail) toplu tekerde tavan payını
    # yemesini önler; statik aks yüksekliği ve sıkışma değişmez.
    pivot: [0.53, 0.0, -0.068]
    leg_length_m: 0.196                  # pivot–aks (bacak boyunca), yüksüz
    trail_m: 0.012                       # çatal ofseti: aks, yönlendirme ekseninin 12 mm gerisinde (≈ 0,34 R; shimmy'ye karşı)
    rake_aft_deg: 0.0
    retract_deg: 90                      # yanal eksen etrafında GERİYE
    retract_direction: "aft"
    wheel_d_m: 0.070
    wheel_w_m: 0.022                     # varsayım
    hub_d_m: 0.034                       # varsayım
    strut_d_m: 0.014                     # varsayım
    slider_d_m: 0.010                    # varsayım
    steer_deg: 30                        # U_GearSteer_N, servo yönlendirme
    stroke_m: 0.015                      # ER-150 15 mm (ana takımla aynı). varsayım
    well:
      s_m: [0.510, 0.766]
      half_width_m: 0.026                # varsayım
      roof_z_m: -0.012                   # akü kızağının altı. varsayım
      # Tıkaç cebi: bacak tıkacı (U_Door_N_3, trunnion bloğuna bağlı) takım açıkken kuyunun önünde bu cepte durur
      plug_pocket: {length_m: 0.022, half_width_m: 0.0145, top_above_pivot_m: 0.022}
    doors:
      clamshell: {count: 2, open_deg: 95, strut_notch: {s_m: [0.512, 0.546], half_width_m: 0.010}}   # varsayım: çentik
      strut_plug: {attach: "knuckle"}    # U_Door_N_3: takım topluyken çentiği deriyle aynı hizada kapatır (F2)
  reference:                             # panel değerleri — sizing.py geometriden yeniden hesaplar
    main_axle_s_m: 1.328
    retracted_main_wheel: [1.328, 0.115, -0.042]
    retracted_nose_wheel_s_m: 0.726     # uçuşta amortisör açık → 0,53 + 0,196 (çatal ofseti toplu konumda yukarı bakar)
    track_m: 0.66
    wheelbase_m: 0.785
    cg_height_m: 0.296
    tip_back_deg: 18.0
    tip_back_aft_cg_deg: 15.7
    overturn_deg: 47.9
    nose_load_pct: 12.0
    static_loads_n: {main_each: 50.5, nose: 13.8}
    prop_clearance_mm: 218
    prop_strike_deg: 13.2         # pervane 25 mm geride (uzatma mili); ≥ 13° şartı sağlanır
    prop_clearance_at_6deg_mm: 119
    cowl_contact_deg: 19.6        # ters motor: kaporta çenesi (s ≈ 2,175) kritik; pervane çarpmasının 6,4° üstünde
    stab_tip_contact_deg: 20.4
    wingtip_clearance_mm: 366
    bank_to_wingtip_deg: 13.1
    turret_clearance_mm: 156
    belly_clearance_mm: 191

