    hub_d_m: 0.034                # varsayım (görsel)
    hub_len_m: 0.020              # varsayım (8 mm göbek + rondela)
    blade_max_chord_m: 0.036      # r/R ≈ 0,30'da. varsayım (görsel)
    blade_tip_chord_m: 0.016      # varsayım
    tip_band_m: 0.020             # pala uçlarında turuncu uyarı bandı (RAL 2005)
    rpm_max: 9000
    rpm_static: 8260
    alternatives: "15x8 veya 17x6 itici"
  spinner:
    d_m: 0.064
    base_s_m: 2.207               # lüle halkasına 2 mm. varsayım
    tip_s_m: 2.285
    material: "Al"
  cowl:                           # PA-CF motor kaportası
    s_from_m: 2.060
    s_to_m: 2.205
    wall_m: 0.0016
    top_outer_z_m: 0.233          # silindir başı üstünde 5 mm boşluk
    cheek_left: {s_from_m: 2.075, s_to_m: 2.185, z_from_m: 0.085, z_to_m: 0.165, bulge_m: 0.016}   # susturucu yanağı. varsayım
    cheek_right: {s_from_m: 2.075, s_to_m: 2.185, z_from_m: 0.085, z_to_m: 0.165, bulge_m: 0.010, louvers: 4, louver_angle_deg: 36}   # "köpekbalığı solungacı". varsayım
    scuff_pad: {s_m: 2.12, material: "TPU", t_m: 0.002}   # kaporta altında sürtünme pabucu
  intake:                         # sırt hava alığı, sınır tabaka ayırıcılı (jet hava alığı gibi okunur)
