    - {name: "GNSS_2", kind: "puck", s_m: 0.70, y_m: -0.035, internal: true, d_m: 0.028, h_m: 0.008}
    - {name: "Telemetry", kind: "dipole", s_m: 0.80, y_m: 0.0, internal: true, h_m: 0.060}
    - {name: "Blade_V", kind: "blade", s_m: 0.95, y_m: 0.0, side: "bottom", h_m: 0.060, chord_root_m: 0.040, chord_tip_m: 0.018, sweep_deg: 36}   # video/veri bağı. varsayım
    - {name: "Blade_D", kind: "blade", s_m: 1.36, y_m: 0.0, side: "top", h_m: 0.045, chord_root_m: 0.034, chord_tip_m: 0.016, sweep_deg: 36}    # yedek RC alıcısı. varsayım
  pitot:                          # sol glove hücum kenarında
    side: "L"
    y_m: 0.17
