    s_to_m: 1.72                  # sırta karıştığı yer
    mouth_w_m: 0.075
    mouth_h_m: 0.036
    diverter_m: 0.008             # sınır tabaka ayırıcı yüksekliği
    lip_r_m: 0.003                # dudak yarıçapı. varsayım
    area_cm2: 27
  exhaust_ring:                   # "lüle" halka soğutma çıkışı (spinner çevresinde)
