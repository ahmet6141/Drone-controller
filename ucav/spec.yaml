# -----------------------------------------------------------------------------------------------------
# Baskı (FDM)
# -----------------------------------------------------------------------------------------------------
print:
  bed_default_mm: [256, 256, 256]
  bed_alt_mm: [220, 220, 250]
  bed_margin_mm: 6                # her kenarda pay
  bed_margin_root_block_220_mm: 5 # 220 tablada %15,5 kök bloğu için
  te_min_mm: {wing: 1.5, tail: 1.0, control_surface: 1.0}   # tail ve control_surface varsayım
  joint_groove_mm: [0.4, 0.3]     # segment eklerinde V-oluk (genişlik, derinlik) = panel çizgisi
  filaments:
    LW-PLA: {density_g_cm3: 0.65, solid_density_g_cm3: 1.25, tg_c: 55, note: "colorFabb aktif köpüren PLA; 230–245 °C, akış %55–60"}
    LW-ASA: {density_g_cm3: 0.75, tg_c: 95, note: "kuyruk konisi (ısı bölgesi). yoğunluk varsayım"}
    PETG:   {density_g_cm3: 1.27, tg_c: 80}
    PA-CF:  {density_g_cm3: 1.20, tg_c: 150}
    TPU:    {density_g_cm3: 1.21, tg_c: -30}
  walls_mm:
    wing_skin: 0.6
    d_box: 1.2                    # HK → ana kiriş, +1 çevre
    glove_root_skin: 0.8
    fuselage_skin: 0.8
    tail_cone_lw_asa: 1.0
    tail_skin: 0.5
    control_surface_skin: 0.5
    lattice: 0.45                 # ±45° geodezik iç kafes, ≈ 70 mm aralık
    segment_end_ribs_petg: 1.2
    hinge_knuckles: 1.2
    frames_petg: 1.6
    cowl_pa_cf: 1.6
    tpu_pad: 2.0
    hatch_petg: 1.6
  zones:                          # parça bölgesi → malzeme ve et
    - {zone: "fuselage_nose",   s_m: [0.00, 0.40], material: "LW-PLA", wall_mm: 0.8}
    - {zone: "fuselage_mid",    s_m: [0.40, 1.55], material: "LW-PLA", wall_mm: 0.8}
    - {zone: "tail_cone",       s_m: [1.55, 2.06], material: "LW-ASA", wall_mm: 1.0}
    - {zone: "cowl",            s_m: [2.06, 2.205], material: "PA-CF", wall_mm: 1.6}
    - {zone: "exhaust_ring",    s_m: [2.19, 2.205], material: "PA-CF", wall_mm: 1.6}
    - {zone: "wing_panel",      material: "LW-PLA", wall_mm: 0.6}
    - {zone: "root_block",      material: "LW-PLA", wall_mm: 0.8}
    - {zone: "glove_strake",    material: "LW-PLA", wall_mm: 0.8}
    - {zone: "root_fairing",    material: "PA-CF", wall_mm: 1.6}
    - {zone: "control_surface", material: "LW-PLA", wall_mm: 0.5}
    - {zone: "stab",            material: "LW-PLA", wall_mm: 0.5}
    - {zone: "stab_root_fillet", material: "PA-CF", wall_mm: 1.6}
    - {zone: "fin",             material: "LW-PLA", wall_mm: 0.5}
    - {zone: "hatch",           material: "PETG", wall_mm: 1.6}
    - {zone: "intake",          material: "PA-CF", wall_mm: 1.6}
    - {zone: "frames",          material: "PETG", wall_mm: 1.6}
    - {zone: "gear_doors",      material: "PETG", wall_mm: 1.2}
    - {zone: "turret_collar",   material: "PETG", wall_mm: 1.6}
    - {zone: "tip_cap",         material: "LW-PLA", wall_mm: 0.6}
  heat_rule: {radius_m: 0.150, no_material: "LW-PLA", around: ["cylinder", "muffler"]}
  segments:
    wing_outer_panel: {y_from_m: 0.36, count: 7, length_m: 0.210, tip_cap_m: 0.07, orientation: "dik (açıklık Z'de, profil tabla köşegeninde)"}
    root_block: {y_from_m: 0.1025, count: 2, length_m: 0.130, note: "glove strake ve kök kaportası ayrı parça"}
    fuselage_nose_module: {s_m: [0.00, 0.40], parts: ["burun konisi", "taret yakası", "modül halkası"]}
    fuselage_rings:               # x = 1,55 flanşı halka sınırı olmalı → 6 + 3 halka (panel 8 diyordu). varsayım
      - {s_m: [0.40, 1.55], count: 6}
      - {s_m: [1.55, 2.06], count: 3}
    cowl: {parts: ["kaporta", "lüle halkası", "sol yanak", "sağ yanak"]}
    aileron: {count: 4, length_m: 0.1825}
    flap_out: {count: 4, length_m: 0.175}
    flap_in: {count: 1}
    stab_half: {count: 2}
    elevator: {count: 2}
    fin: {count: 2}
    rudder: {count: 1}
    tail_orientation: "%25 ok ekseni Z'de, 30° eğik basılır (dikey Z 185 mm, stabilize Z 214 mm)"
  spar_tubes:                     # CF borular (basılmaz). Konum: sol yarı; sağ ayna
    - {name: "centre_socket",   name_tr: "Merkez soket (G10 köprüde 4° açılı)", od_mm: 30, id_mm: 27, length_m: 0.40, qty: 2, y_m: [0.0, 0.40], chord_fraction: 0.28}
    - {name: "panel_tube",      name_tr: "Panel borusu ve birleştirici (0,30 m sokete girer)", od_mm: 27, id_mm: 25, length_m: 1.04, qty: 2, y_m: [0.06, 1.10], chord_fraction: 0.28}
    - {name: "inner_reinforce", name_tr: "Soket ağzında iç takviye", od_mm: 25, id_mm: 22, length_m: 0.35, qty: 2, y_m: [0.20, 0.55], chord_fraction: 0.28}
    - {name: "tip_tube",        name_tr: "Uç borusu", od_mm: 16, id_mm: 14, length_m: 0.70, qty: 2, y_m: [1.00, 1.70], chord_fraction: 0.28}
    - {name: "step_bushing",    name_tr: "Kademeli CF burç", od_mm: 25, id_mm: 16, length_m: 0.10, qty: 2, y_m: [1.00, 1.10], chord_fraction: 0.28}
    - {name: "rear_spar",       name_tr: "Arka kiriş (yalnız panelde)", od_mm: 8, id_mm: 6, length_m: 1.44, qty: 2, y_m: [0.38, 1.82], chord_fraction: 0.65}
    - {name: "incidence_pin",   name_tr: "Açı pimi, dolu CF", od_mm: 6, id_mm: 0, length_m: 0.10, qty: 2, y_m: [0.31, 0.41], chord_fraction: 0.60}   # konum varsayım
    - {name: "longeron",        name_tr: "Gövde longeronu", od_mm: 8, id_mm: 6, length_m: 1.66, qty: 4}
    - {name: "stab_spar",       name_tr: "Stabilize kirişi (30° oklu)", od_mm: 12, id_mm: 10, length_m: 0.56, qty: 2}
    - {name: "stab_rear_rod",   name_tr: "Stabilize arka çubuğu", od_mm: 6, id_mm: 4, length_m: 0.50, qty: 2}
    - {name: "fin_spar",        name_tr: "Dikey kirişi", od_mm: 8, id_mm: 6, length_m: 0.32, qty: 2}
  g10_bridge: {plates: 2, t_mm: 3, h_mm: 45, length_mm: 300, bolts: "boru başına 2×M4"}
  estimates: {print_mass_kg: 3.33, print_hours: 316, segment_count: 125}   # panel tahmini. Kurulan plan (printprep, 256 tabla):
                                                                       # 89 basılı parça, 3,62 kg, ≈267 h → out/print_report.md

# -----------------------------------------------------------------------------------------------------
# sizing.py --check toleransları (türetilen değer ile yukarıdaki referans arasındaki izinli fark)
# -----------------------------------------------------------------------------------------------------
checks:
  rel_default: 0.010              # oranlar, alanlar, hacim katsayıları: %1
  abs:
    length_m: 0.003               # konum ve uzunluk: 3 mm
    clearance_mm: 4.0
    angle_deg: 0.35
    pct_mac: 0.6                  # statik marj, NP ve CG yüzdesi
    speed_ms: 0.15
    mass_kg: 0.005
