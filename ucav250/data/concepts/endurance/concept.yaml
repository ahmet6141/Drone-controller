# YK-250 concept study 'endurance' (MALE-type) - generated by calc.py, do not edit by hand
meta:
  project: YK-250 (ucav250)
  concept_key: endurance
  name_tr: Dayanım (MALE tipi)
  phase: concept trade study - first-pass sizing
  date: '2026-10-05'
  generated_by: ucav250/data/concepts/endurance/calc.py
  run: PYTHONPATH=. python3 ucav250/data/concepts/endurance/calc.py
  frame: X aft from the nose tip, Y starboard, Z up from the fuselage datum line through the nose tip; SI units, angles in
    degrees
  scope: civil EO/IR surveillance and research platform with a UCAV/MALE look; payload is sensors and mission equipment only
    - no weapons, hardpoints, pylons or release mechanisms
  libraries:
  - analysis/aerolib.py
  - analysis/stablib.py
  - analysis/sizinglib.py
  - analysis/structlib.py
  - analysis/aero.py
  - design/oml.py
  runtime_s: 235.7
configuration:
  propulsion: single Limbach L 275 EF pusher, Mejzlik 32x18 2B on an 80 mm hub spacer, annular cooling exit around the spinner
  tail: upright V-tail (41 deg dihedral, NACA 0012, ruddervators) + ventral bumper skid
  wing_position: shoulder (on the fuselage top, saddle fairing), two halves joined on the centre line
  gear: 'fixed tricycle: GFRP spring bow + faired TOST 200x50 wheels, steerable faired nose leg'
  fuselage: slim single fuselage 0.44 m wide, chined lower half, upswept tail cone to the engine bay
  planform: straight taper, AR 15.0, taper 0.45, unswept quarter chord, NLF(1)-0416 16 % root to 13 % tip, 2.5 deg washout,
    inboard take-off flaps
  layout: payload bay on the CG between two interconnected fuel cells; EO/IR turret in the chin; battery, avionics and parachute
    forward; engine aft
