    chosen:
      AR: 15.0
      ws_Pa: 467.2
    rule: max endurance among points meeting span <= 6.8 m, tip chord >= 0.25 m, VS <= 24 m/s, field rolls <= 200 m (L/b is
      reported, not a limit)
    finding: endurance rises with wing loading because the process minimum-gauge skins make wing mass scale with area, while
      the loiter CL is capped by the 1.2 VS margin; the optimum therefore sits on the 24 m/s stall limit, and at that loading
      the span limit decides the aspect ratio
  flaps:
    with_takeoff_flaps:
      endurance_h: 14.769
      to_roll_m: 173.58
    without_flaps:
      endurance_h: 15.678
      to_roll_m: 233.14
      violations:
      - take-off roll
    landing_flap_rejected: with the incidence set for a level fuselage in loiter, any landing flap lowers the touch-down attitude
      below the 3 deg mains-first target (nose-wheel-first risk); the flaps are take-off flaps only (15 deg), giving a flat
      lift-off below the rotation-authority speed
    decision: keep inboard plain take-off flaps
  propeller:
    mejzlik_32x18_2B:
      endurance_h: 14.769
      roc_sl_m_s: 4.3522
      to_roll_m: 173.58
      loiter_rpm_3000m: 4133.5
    mejzlik_31x12_3B:
      endurance_h: 14.159
      roc_sl_m_s: 5.0885
      to_roll_m: 152.63
      loiter_rpm_3000m: 4852.9
    decision: 32x18 2B (endurance); 31x12 3B is the climb/hot-day option
  tail_type:
    variants:
      upright_V:
        dDq_m2: 0.0
        dm_kg: 0.0
        junctions: 2
        Q: 1.03
        notes: 2 identical panels (one mould pair), root on the engine-bay frame, tips clear of ground; panel wakes cross
          the upper prop disc (outer 40 % of each panel outside the disc)
        endurance_h: 14.769
      inverted_V:
        dDq_m2: 0.0044634
        dm_kg: 9.7732
        junctions: 2
        Q: 1.03
        tip_z_m: -0.74861
        extra_gear_height_m: 0.55309
        notes: 'proverse roll-yaw coupling and prop guard, but the tips hang 0.26 m below the ground line of the upright-V
          layout: the gear would grow by 0.55 m (bow mass, drag, tip-over) - rejected'
        endurance_h: 9.7206
      T_tail:
        dDq_m2: 0.00057122
        dm_kg: 1.2214
        junctions: 3
        Q: 1.05
        notes: fin carries the stabiliser loads (+50 % fin mass, T-fitting 0.3 kg), deep-stall exposure with a high-AR wing,
          flutter-critical; stabiliser well clear of the prop
        endurance_h: 14.109
      Y_tail:
        dDq_m2: 0.0013582
        dm_kg: 0.76728
        junctions: 3
        Q: 1.04
        notes: 'V + ventral fin (MQ-9 style): ventral fin is the prop guard but adds a surface and a junction; the ventral
          bumper skid of the V layout does the guard job for 0.1 kg'
        endurance_h: 14.289
    decision: upright V-tail with a ventral bumper skid
    purser_campbell_note: V-tail total area equals S_h + S_v for the same volume coefficients (stablib.v_tail_projection),
      so the gain is in junctions, parts count and the ground-clearance-free geometry, not in area
  landing_gear:
    fixed_faired:
      endurance_h: 14.769
      gear_Dq_m2: 0.0091027
    retractable:
      endurance_h: 14.034
      dDq_m2: -0.0081924
      dm_kg: 2.45
      basis: 'components.yaml: custom electric retract (SAGITTA) 11.5 kg vs fixed 9.1 kg, +1.0 kg bays/doors (estimate), minus
        the 0.95 kg fairings; 90 % of the gear drag removed'
    decision: 'fixed tricycle with fairings: retraction buys -0.73 h for a retraction failure mode, gear bays in the CG zone
      (where the fuel cells and payload bay sit) and no purchasable unit'
