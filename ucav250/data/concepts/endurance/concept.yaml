flags:
- sea-level loiter at 3577 rpm is below the Limbach 4000-6000 rpm regular-flight band (3000 m loiter is inside it); confirm
  idle/low-load operation with Limbach or loiter at >= 1500 m
- sea-level rate of climb 4.35 m/s is below the 4.9 m/s baseline target with the 32x18 2B propeller (prop-limited, not engine-limited);
  the 31x12 3B option trades endurance for climb
- 'loiter power fraction 0.198 is below the lowest BSFC point (0.20): BSFC linearly extrapolated (+60 g/kWh per -0.1); a light-load
  dyno map is needed'
- flutter, wing torsional stiffness and aileron reversal of the AR 15 wing are not analysed here (CS-LUAS.629 clearance to
  1.2 VD = 68.5 m/s)
- aft-body closure from 0.44 m to the 0.30 m cowl lip in 0.10 m relies on the pusher inflow (prop suction) and the cooling
  exit flow; confirm with CFD; the 80 mm prop hub spacer needs Limbach approval
- lift-off is flat (ground attitude, 15 deg take-off flap) because the tail cannot rotate against the high thrust line below
  30.4 m/s; the autopilot take-off law must hold the nose wheel down until the wing lifts the aircraft
