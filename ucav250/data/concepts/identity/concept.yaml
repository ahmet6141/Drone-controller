# YK-250 concept study 'identity' (UCAV-styled MALE) - generated by calc.py, do not edit by hand
meta:
  project: YK-250 (ucav250)
  concept_key: identity
  name_tr: Kimlik (UCAV görünümlü MALE)
  phase: concept trade study - first-pass sizing
  date: '2026-10-05'
  generated_by: ucav250/data/concepts/identity/calc.py
  run: PYTHONPATH=. python3 ucav250/data/concepts/identity/calc.py
  frame: X aft from the nose tip, Y starboard, Z up; Z = 0 on the centre-body chine line; SI units, angles in degrees
  scope: civil EO/IR surveillance and research platform with a UCAV look; payload is sensors and mission equipment only -
    no weapons, munitions, hardpoints, pylons or release mechanisms
  method: 'the reviewed endurance study (ucav250/data/concepts/endurance/calc.py) is imported as a library: same propulsion,
    polars, lifting line, structures, mission, performance and constraint equations; this file adds the identity geometry,
    drag items, chassis, ground geometry, trades and outputs'
  libraries:
  - analysis/aerolib.py
  - analysis/stablib.py
  - analysis/sizinglib.py
  - analysis/structlib.py
  - analysis/aero.py
  - design/oml.py
  - data/concepts/endurance/calc.py
  runtime_s: 234.29
configuration:
  propulsion: single Limbach L 275 EF pusher, Mejzlik 32x18 2B on an 80 mm hub spacer; dorsal S-duct cooling inlet with chevron
    lip and boundary-layer diverter, downdraft baffles, annular exit around the spinner
  tail: 'Y-tail: canted V panels (40 deg, NACA 0012, ruddervators) + ventral fin whose tip skid guards the propeller disc'
  wing_position: mid wing on the chine line; two halves joined by a spar tongue/fork through a spar tunnel in the fuselage;
    LERX-type root glove
  gear: 'fixed tricycle: GFRP spring bow + TOST 200x50 wheels in spats, steerable faired nose leg'
  fuselage: chined, faceted superellipse sections (upper facets n 1.35, lower n 1.75, flat chin n 2.4), pointed chined nose
    with pitot boom, chin EO/IR turret, dorsal engine hump, boxy round cowl
  planform: tapered (lambda 0.42), LE sweep 12 deg (c/4 10.4 deg), AR 14.0, NLF(1)-0416 16 % -> 13 %, washout 3.0 deg, dihedral
    2.5 deg, inboard take-off flaps
  layout: payload bay on the CG under the spar tunnel, between two interconnected fuel cells; turret, battery, avionics, PDU
    and parachute forward; engine aft
  transport_breakdown: 2 wing halves (spar tongue/fork, 2 main pins + drag pins), 2 V-tail panels, propeller; fuselage with
    ventral fin, nose leg and main bow in one crate
