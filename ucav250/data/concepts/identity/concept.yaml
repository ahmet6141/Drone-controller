# YK-250 concept 'identity' - generated by calc.py; do not edit by hand.
meta:
  concept: identity
  project: YK-250 (ucav250)
  date: '2026-10-05'
  name_tr: YK-250 'Kimlik' — en güçlü UCAV görünümü, görevi bozmadan
  scope: Civil EO/IR surveillance / research UAV with a UCAV look. Payload is EO/IR sensors and mission equipment only; no
    weapons, munitions, hardpoints, pylons or release mechanisms.
  how_to_run: PYTHONPATH=. python3 ucav250/data/concepts/identity/calc.py (from the repository root)
  method: "(first-pass sizing, closed loop, SI units):\n    m0 -> geometry (wing from W/S and AR, tail from volume coefficients,\
    \ fuselage generated around the packaging\n    keep-outs, wing placed for the static-margin target) -> drag build-up (aerolib)\
    \ + lifting line on the actual\n    wing sections (aero.surface_analysis, tripped polars x 1.15) -> mission segments (sizinglib)\
    \ with the\n    Mejzlik 32x18 2B table and the part-load BSFC of the Limbach L 275 EF at the actual power setting\n  \
    \  -> sizinglib.MassModel(payload + fixed equipment + fuel fraction + airframe fraction(m0)) -> m0, repeated\n    until\
    \ m0 changes by less than 0.02 kg."
  frame: X aft from the nose tip (FS), Y starboard, Z up; Z = 0 on the centre-fuselage chine line; SI
  runtime_s: 337.79
  feasible: true
sources:
  baseline: ucav250/data/research/baseline.yaml
  engine: ucav250/data/research/engine.yaml
  aero: ucav250/data/research/aero.yaml
  components: ucav250/data/research/components.yaml
  comparables: ucav250/data/research/comparables.yaml
  materials: ucav250/data/research/materials.yaml
  standards: ucav250/data/research/standards.yaml
  raymer: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify'
  hoerner: Hoerner, Fluid-Dynamic Drag (1965) - textbook value as recalled, verify
  this: computed in ucav250/data/concepts/identity/calc.py
estimates:
  keepout_clearance_m:
    value: 0.02
    basis: shell sandwich ~6 mm + frame flange ~10 mm + 4 mm gap
  engine_cooling_gap_m:
    value: 0.025
    basis: baffle + cooling-air gap around cylinders and intake
  tank_bay_length_m:
    value: 0.36
    basis: forward bladder bay length (each bladder ~23-26 L conformal)
  aft_tank_length_ratio:
    value: 1.0
    basis: aft bladder bay length / forward
  engine_intake_half_width_m:
    value: 0.11
    basis: throttle bodies + filters between the cylinder roots; width not published (engine.yaml envelope gives only the
      0.2946 m height); +/-0.04 m, needs the Limbach STEP
  turret_inside_m:
    value: 0.09
    basis: 'E180 envelope: pan motor + isolators above the mount plane'
  chine_FF_factor:
    value: 1.05
    basis: 'sharp longitudinal chines: vortex shedding at alpha/beta != 0; no published correlation used'
  Q_wing_filleted:
    value: 1.0
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify (high/mid
      or well-filleted wing Q = 1.0)'
  Q_wing_unfilleted:
    value: 1.04
    basis: shoulder wing meeting a sharp chine at < 90 deg corner angle without fillet (junction separation); estimate between
      Raymer 1.0 and 1.1
  Q_tail_Y:
    value: 1.05
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify (1.03 V-tail,
      +0.02 for the extra ventral junction)'
  Q_tail_conv:
    value: 1.04
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify (conventional
      tail 1.04-1.05)'
  Q_fuselage:
    value: 1.0
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify'
  cooling_flush_factor:
    value: 1.25
    basis: 'NACA flush inlet / S-duct: lower ram recovery than a scoop -> more spill and duct loss; engineering estimate'
  leakage_protuberance_frac:
    value: 0.05
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify (2-5 % for
      propeller aircraft; upper value used)'
  antenna_probe_DQ_m2:
    value: 0.0015
    basis: 2 blade antennas + ADS-B blade + pitot boom + lights; drag area estimate
  turret_Cd_frontal:
    value: 0.4
    basis: Hoerner, Fluid-Dynamic Drag (1965) - textbook value as recalled, verify (sphere 0.47 subcritical; partly buried
      ball ~0.3-0.5)
  gear_interference:
    value: 1.2
    basis: gear-to-fuselage interference factor; engineering estimate
  gear_DQ:
    value:
      wheel_bare: 0.25
      wheel_faired: 0.13
      strut_streamlined: 0.05
      strut_round: 0.3
      flat_spring_leg: 1.4
      fork_bare: 1.0
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify Table 12.6
      (D/q per frontal area)'
  retract_residual_frac:
    value: 0.05
    basis: door gaps / well leakage left after retraction, fraction of faired gear drag
  base_Cd_hoerner:
    value: C_Db = 0.029/sqrt(C_Df)
    basis: Hoerner, Fluid-Dynamic Drag (1965) - textbook value as recalled, verify ch. 3, base drag behind a body with turbulent
      boundary layer; ignores pusher-propeller suction (conservative)
  structure_maturity_margin:
    value: 0.1
    basis: conceptual bottom-up structure omits joints, local reinforcement, sealant; +10 % allowance
  flap_dClmax_plain:
    value: 0.9
    basis: 'Raymer, Aircraft Design: A Conceptual Approach, 6th ed. (2018) - textbook value as recalled, verify Table 12.2
      plain flap; dCLmax = 0.9 dClmax (Sflapped/S) cos(L)'
  flap_TO_fraction:
    value: 0.6
    basis: take-off flap setting gives ~60 % of the landing increment
  flap_dCm_per_dCL:
    value: -0.25
    basis: flap load centroid near 50 % chord -> dCm_c/4 ~ -0.25 dCL
  tail_CLmax_down:
    value: 0.8
    basis: V-tail panel with full-up ruddervators (30 % chord), AR ~5
  K_N_datcom:
    value: 0.0013
    basis: DATCOM Fig. 5.2.3.1-8 typical 0.001-0.002 for a body with x_m/l ~0.45
  K_Rl_datcom:
    value: 1.5
    basis: DATCOM Reynolds factor at fuselage Re ~7e6
  cn_beta_min_per_rad:
    value: 0.057
    basis: 0.001 per deg, usual minimum weathercock stability for GA/UAV
  sm_limits:
    value:
    - 0.05
    - 0.25
    basis: static margin band for an autopilot-flown UAV (estimate)
  prop_spacer_m:
    value: 0.06
    basis: prop plane >= 0.1 D behind the cowl exit (engine.yaml pusher note) -> 60 mm spacer
  spinner_dia_m:
    value: 0.14
    basis: covers the 72 mm prop flange + 32x18 hub
  cowl_exit_annulus_outer_dia_m:
    value: 0.27
    basis: exit area 0.040 m2 (baseline cooling.exit_area_m2) around the spinner
  gear_stroke_m:
    value: 0.2
    basis: effective vertical deflection of the spring bow, baseline.yaml design_loads.landing (0.18-0.22 m for n_inertia
      4.0-4.47); +0.05 m belly clearance at full stroke
  gear_leg_ref_height_m:
    value: 0.3
    basis: height the baseline 2.5 kg bow / 2.0 kg nose leg is assumed to have
  gear_fairings_kg:
    value: 1.0
    basis: 3 wheel spats + 3 leg fairings, secondary sandwich ~0.6 m2
  retract_mech_delta_kg:
    value: 2.75
    basis: 'components.yaml: custom electric retraction +2 to +3.5 kg vs fixed (mid)'
  retract_bays_doors_kg:
    value: 2.5
    basis: 5 doors ~0.25 m2 + hinges/links + well close-outs + cut-out reinforcement + up/down-lock sensors
  retract_well_volume_m3:
    value: null
    basis: '3 wells: leg length x 0.19 m wheel x 0.085 m, +30 % clearance'
  cooling_ducts_extra_kg:
    value: 0.3
    basis: two NACA inlets + S-ducts to the cylinder baffles
  prop_spacer_kg:
    value: 0.15
    basis: 60 mm aluminium spacer + longer bolts
