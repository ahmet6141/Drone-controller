    value: 0.4
    tag: estimate
    ref: endurance study payload_bay_length_m
    basis: research payload bay (nadir hatch) centred on the CG under the wing spar tunnel, between two interconnected fuel
      cells (same rule as the endurance study)
  wing_root_le_z_m:
    value: -0.015
    tag: estimate
    basis: 'mid wing: root chord plane 15 mm below the centre-body chine so the NLF(1)-0416 thickness straddles the chine;
      the spar tongue runs through a tunnel at this height'
  ventral_skid_lead_angle_deg:
    value: 14.0
    tag: estimate
    basis: the skid tip lies below the line through the propeller-disc bottom inclined at 14 deg (typical tail-down attitude
      at the prop-strike limit), so in any tail-down rotation the skid touches before the blade tip
  length_over_span_max:
    value: 0.65
    tag: estimate
    ref: comparables.yaml#recommended_ranges.length_m.basis
    basis: long-span endurance comparables 0.51-0.60, short-span tactical types 0.73-0.83; the chined UCAV forebody is accepted
      up to 0.65 (soft limit of this concept; the endurance study uses 0.60)
trades:
  propulsion:
    pusher_direct_drive:
      selected: true
      reasons:
      - nose and chin are free for the chined UCAV nose and the EO/IR turret field of view (11 of 13 comparables with a known
        layout are pushers, comparables.yaml)
      - propeller wake stays off the NLF wing root and the turret; the V-tail and ventral fin sit ahead of the disc
      - 'cost: installation factor 0.95 (baseline), ducted cooling needed (no prop wash over the cylinders), the cylinders
        are 0.05-0.18 m ahead of the prop flange -> steep cowl closure, propeller ground clearance sets the gear height'
    tractor:
      selected: false
      reasons:
      - 'the nose belongs to the propeller: no chined UCAV nose, the turret moves under the fuselage behind the nose gear
        and its forward view is blocked; the slipstream scrubs the fuselage and the wing root (NLF lost there)'
      - 'rejected for this concept: it contradicts the identity brief and the EO/IR field of view'
