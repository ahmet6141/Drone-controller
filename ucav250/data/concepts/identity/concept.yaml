flags:
- 'sea-level loiter at 3625 rpm is below the Limbach 4000-6000 rpm regular-flight band (3000 m loiter: 4186 rpm); confirm
  low-load operation with Limbach'
- sea-level rate of climb 4.24 m/s is below the 4.9 m/s baseline target with the 32x18 2B propeller (prop-limited, as in the
  endurance study); the 31x12 3B option trades endurance for climb
- empty-mass fraction 0.624 (incl. 5 % growth) is above the comparables range 0.55-0.62
- aft cowl closure from the 0.48 m cylinder bay to the 0.32 m cowl lip in 0.10 m (mean 39 deg) relies on the pusher inflow
  and the annular cooling exit, as in the endurance study (no base drag booked); confirm with CFD; the 80 mm hub spacer needs
  Limbach approval
- chine vortex drag (5 % on the fuselage), the S-duct ram recovery (0.88) and the swept-wing corrections are estimates; confirm
  the faceted forebody in a wind-tunnel or CFD campaign (sideslip, chine vortex, turret wake)
- 'lifting line neglects sweep in the loading; quarter-chord sweep 10.4 deg is at the 10 deg validity edge of aero.py: tip-stall
  margin (washout 3 deg, stall onset eta 0.38) must be confirmed with a vortex-lattice/CFD run'
- flutter, wing torsion (swept-wing bending-torsion coupling) and aileron reversal not analysed (CS-LUAS.629 clearance to
  1.2 VD = 68.4 m/s)
- abort landing at MTOM needs a 222 m ground roll (> 200 m field rule); end-of-mission landing is inside it; lift dumping
  with ailerons up is the mitigation (same finding as the endurance study)
- 'lift-off is flat (ground attitude + take-off flap): the high thrust line limits rotation authority; the take-off law must
  hold the nose wheel down until the wing lifts the aircraft (as in the endurance study)'
