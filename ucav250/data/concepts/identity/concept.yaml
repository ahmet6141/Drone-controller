configuration:
  propulsion: single pusher, direct drive, Limbach L 275 EF + Mejzlik 32x18 2B, 60 mm spacer
  tail: 'Y-tail: upright V-tail (canted twin surfaces, ruddervators) + ventral fin with skid (prop guard)'
  wing_position: shoulder wing on the chine line, blended LERX-type root fillets
  gear: 'fixed tricycle, faired: GFRP spring bow mains (0.20 m stroke) + steerable damped nose leg, spats'
  fuselage_style: chined/faceted superellipse sections, n_top 1.25, n_bot 1.6; dorsal engine hump with flush NACA inlets;
    chin EO/IR turret
  planform: tapered (lambda 0.45), leading-edge sweep 10.0 deg, quarter-chord 8.2 deg, dihedral 2.5 deg, washout 3.0 deg
  transport_breakdown: 2 outer wing panels (side-of-body joints), 2 V-tail panels, propeller, main gear bow (4 bolts); fuselage
    with centre box, ventral fin and nose leg = 1 crate
  reasons_tr:
  - 'İtici: burun ve çene tareti açık görür; köşeli, sivri UCAV burnu ancak itici ile mümkün.'
  - 'Y-kuyruk: dik V kanatçıklar UCAV görünümünü verir, karın yüzgeci pervaneyi ve kuyruğu yere sürtünmeye karşı korur ve
    yön kararlılığına katkı verir; ters V ise takımı uzatırdı.'
  - 'Omuz kanat köşe çizgisinde: taşıyıcı kutu yakıt torbaları ve faydalı yük bölmesinin üstünden geçer, kök kaplamaları gövde-kanat
    geçişini UCAV gibi birleştirir.'
  - 'Sabit kaplamalı takım: katlanır takım bu sınıfta hem kütle hem dayanımda kaybettiriyor (tablo).'
  - 'Faydalı yük bölmesi ağırlık merkezinde, yakıt öne/arkaya iki torbaya bölünmüş: yük olsa da olmasa da ağırlık merkezi
    kayması küçük, kuyruk küçük kalır.'
trade_studies:
  propulsion:
  - option: pusher, direct drive (selected)
    pros_tr: Burun ve çene EO/IR görüş alanı açık; sivri, köşeli UCAV burnu mümkün; pervane izi gövdeyi yalamaz.
    cons_tr: Kurulum verimi 0,95 (baseline); motor kanatçıklarına pervane rüzgârı yok -> kanallı soğutma; boxer silindirleri
      pervane göbeğinin 30-170 mm önünde -> kısa ve küt arka kaporta (taban sürüklemesi hesaplandı); pervane yerden yüksek
      olmalı -> uzun iniş takımı.
  - option: tractor
    pros_tr: Soğutma kolay (pervane rüzgârı), kurulum verimi ~1,0; motor öne -> ağırlık merkezi öne, kuyruk kolu uzar.
    cons_tr: 'Burun pervaneye ayrılır: UCAV burnu ve çene tareti kaybolur, taret gövde altına iner ve iniş takımı/pervane
      izi görüşü kapatır; pervane izi gövde ve kanat kökü sürtünmesini artırır. Kimlik hedefiyle çelişir -> reddedildi.'
  tail:
    Y_tail_selected:
      S_panels_m2: 1.0763
      S_ventral_m2: 0.055552
      mtow_kg: 147.93
      cd0: 0.033965
      actuators: 2
      junctions: 3
    conventional_H_plus_fin:
      mtow_kg: 149.59
      cd0: 0.034093
      actuators: 2
      junctions: 2
      note_tr: Aynı hacim katsayıları; pervane koruması için ayrı kuyruk kızağı gerekir; UCAV görünümü zayıf.
    inverted_V:
      panel_tip_drop_below_root_m: 0.73204
      note_tr: Ters V panel uçları kökün 0.73 m altına iner; kalkış dönüşünde yerle temas etmemesi için iniş takımı yaklaşık
        bu kadar uzamalı (kütle + sürükleme) ve panel uçları egzoz/pervane bölgesine yaklaşır. Reddedildi.
    decision_tr: 'Dik V-kuyruk (kanted ikiz kanatçık görünümü) + karın yüzgeci (Y-kuyruk): karın yüzgeci pervane koruyucu
      ve kuyruk kızağıdır, yön kararlılığına da katkı verir.'
  landing_gear:
    fixed_faired_selected:
      mtow_kg: 147.93
      cd0: 0.033965
      gear_DQ_m2: 0.0066808
      gear_mass_kg: 10.903
      endurance_at_design_mtom_h: 9.9943
    retractable:
      mtow_for_mission_kg: 154.82
      cd0: 0.031202
      endurance_at_design_mtom_h: 8.0176
      mass_delta_items_kg:
        mechanism_EMAs_locks: 2.75
        bays_doors_cutout_reinforcement: 2.5
        fuselage_plug_for_wells: computed (fuselage_plug_for_wells)
      extra_parts:
      - 3 retraction EMAs (Volz DA 26 class) + controller
      - 3 down-locks + 3 up-locks with sensors
      - 5 doors + hinges + linkages
      - gear sequencing in the FCS
      - emergency free-fall/spring extension
      - well close-outs and seals
      new_failure_modes_tr:
      - takım açılmazsa gövde üstü iniş (taret ve pervane hasarı)
      - kapı açık kalması / sıkışması
      - kilit sensörü hatası
      packaging_tr: Ana takım kuyuları yakıt torbaları ve faydalı yük bölmesiyle aynı yerde (ağırlık merkezi); ön takım kuyusu
        çene tareti ve aviyonikle çakışır -> gövde uzaması gerekir.
      cost_tr: Satın alınabilir 100-200 kg sınıfı katlanır takım yok (components.yaml); özel elektrikli tasarım (SAGITTA mimarisi)
        + nitelendirme testleri gerekir.
    fixed_unfaired:
      mtow_for_mission_kg: 154.0
      cd0: 0.04627
      endurance_at_design_mtom_h: 8.631
    decision_tr: 'Sabit, kaplamalı (tekerlek kılıfı + profilli bacak) üç tekerlekli takım. Katlanır takım sürüklemeyi azaltır
      ama kütle, yakıt torbası/taret ile yer çakışması, maliyet ve arıza kipleri bunu fazlasıyla geri alır: aynı görevde MTOW
      artar, aynı MTOW''da dayanım azalır.'
