# YK-250 concept study 'production' (twin boom, H tail, pusher) - generated by calc.py, do not edit by hand
meta:
  project: YK-250 (ucav250)
  concept_key: production
  name_tr: Üretim (en düşük maliyet, risk ve bakım yükü)
  phase: concept trade study - first-pass sizing
  date: '2026-10-05'
  generated_by: ucav250/data/concepts/production/calc.py
  run: PYTHONPATH=. python3 ucav250/data/concepts/production/calc.py
  quick_run: false
  frame: X aft from the nose tip, Y starboard, Z up from the pod datum line through the nose tip; SI units, angles in degrees
  scope: civil EO/IR surveillance and research platform with a UCAV look; payload is sensors and mission equipment only -
    no weapons, hardpoints, pylons or release mechanisms
  libraries:
  - analysis/aerolib.py
  - analysis/stablib.py
  - analysis/sizinglib.py
  - analysis/structlib.py
  - analysis/aero.py
  - design/oml.py
  shared_chain:
    module: ucav250/data/concepts/endurance/calc.py (imported, not modified)
    functions:
    - Prop (Mejzlik table, J-similarity, density scaling)
    - lapse
    - engine_torque_wot
    - bsfc_g_kwh (part load incl. generator)
    - tripped_chars / strip_profile_drag
    - build_aero
    - fit_polar
    - level_point
    - best_loiter
    - best_range
    - climb_point
    - fly
    - solve_loiter_for_fuel
    - solve_loiter_for_endurance
    - solve_range
    - ceiling
    - gust_limit
    - vn_summary
    - constraint_diagram
    - loading_cases
    - gear_mass
    - surface_mac
    this_file:
    - Pod geometry
    - constant-chord centre + tapered outer wing
    - booms and H tail (V tail for the trade)
    - drag build-up items
    - wing/boom/tail/chassis/shell masses
    - layout and CG
    - H-tail stability
    - slipstream-aided rotation and take-off
    - ground geometry
    - trades
    - packaging
    - 3-view
  runtime_s: 597.39
configuration:
  propulsion: single Limbach L 275 EF pusher at the aft end of the pod, Mejzlik 32x18 2B on an 80 mm hub spacer between the
    tail booms, annular cooling exit around the spinner, cowl flap
  tail: twin CFRP tube booms (1.12 m apart) + constant-chord H stabiliser in the propeller slipstream (split elevator) + two
    identical fins, 35 deg LE sweep, 12 deg outward cant
  wing_position: 'shoulder: constant-chord centre section bolted on the pod chassis (4 bolts), tapered outer panels with spar
    tongue + 2 pins + drag pin at y = +/-1.00 m'
  gear: 'fixed tricycle: GFRP spring bow with faired legs + TOST 200x50 wheels without spats (trade: spats buy < 0.1 h), steerable
    nose leg'
  fuselage: 'short chined pod 2.67 m long, 0.46 m wide: continuous chine rising from the nose to the thrust line, dorsal engine
    hump behind the wing'
  planform: constant chord 0.581 m to y = 1.00 m, then linear taper 0.60 to the tip, straight unswept quarter chord, NLF(1)-0416
    16 % throughout, 3.0 deg linear washout on the outer panels, no flaps
  structure: chassis (aluminium sheet metal + extrusions, 7075 machined hard points, 4130 engine truss) carries every point
    load; bolt-on composite shell panels are non-structural; wing and tail in OOA prepreg (one composite process line)
  layout: payload bay on the CG between two identical interconnected fuel cells; EO/IR turret in the chin; battery, avionics
    and parachute forward; engine aft
  transport_breakdown:
    pod_without_propeller_m: 2.6655
    centre_section_span_m: 2.0
    outer_panel_m: 2.0204
    tail_unit_booms_stab_fins_m:
    - 2.289
    - 1.3183
