        overall_length_m: 3.6545
        fuselage_length_m: 3.6545
        longest_piece_m: 3.4845
        moulds: 15
        servos: 6
        prop_strike_deg: 11.888
        tail_bumper_deg: 17.0
        gear_height_rule: prop_liftoff
        l_h_m: 1.1198
        plug_m: 0.6
        violations:
        - take-off roll
      single_fuselage_V_with_takeoff_flaps:
        endurance_h: 11.449
        empty_kg: 91.91
        to_roll_m: 211.68
        V_rotation_m_s: 30.2
        servos: 8
        violations:
        - take-off roll
        note: endurance-concept remedy (15 deg plain flaps on the centre section, 2 more actuators)
    decision: twin boom + H tail
    reasons:
    - 'field: the stabiliser sits in the propeller slipstream, so full up elevator rotates the aircraft at 19.9 m/s instead
      of 30.3 m/s: lift-off at 1.1 VS without flaps (TO roll 163 vs 227 m)'
    - 'transport and handling: longest piece 2.67 m vs 3.48 m (one-piece fuselage); the tail unit comes off pre-rigged with
      4 bolts'
    - 'maintenance: the engine bay is open on top and both sides (no tail roots on the cowl); the propeller is guarded laterally
      by the booms; the short pod puts every bay within arm''s reach'
    - 'risk: twin-boom H/inverted-V tails are the structurally proven layout of the 50-300 kg runway class (comparables.yaml
      configuration_census: Shadow, Pioneer, Scout, Ranger, Aerostar, Primoco); the split elevator and two rudders leave no
      single servo failure with a free-floating pitch/yaw surface'
    - booms are bought CFRP tubes (no mould); stabiliser one mould, fins one pair
    costs_accepted:
    - endurance +0.85 h vs the V variant, 2 more servos, +1 moulds
    - 'stabiliser in the propeller wake (2/rev blade-passage loading, acoustic fatigue): stiff, well-damped stabiliser, 0.5
      D or more gap, vibration survey'
    - boom/tail flutter and the boom-to-wing joints need a GVT and rational analysis (FAA Report 45 is not valid for boom
      tails, standards.yaml FLU-001) - the same applies to the V tail
    - 'less MALE/UCAV-like silhouette than a single fuselage: shape language carried by the chined pod, the dorsal engine
      hump and the swept, outward-canted fins'
  flaps:
    none:
      endurance_h: 13.188
      to_roll_m: 162.84
      ldg_roll_m: 169.3
    centre_section_plain_flaps_15deg:
      endurance_h: 12.34
      to_roll_m: 155.66
      S_flapped_over_S: 0.24079
      added_mass_kg: 1.56
    decision: no flaps
    reason: the slipstream-aided rotation already gives a lift-off at 1.1 VS within the 200 m roll; the boom saddles split
      the centre-section flap into short pieces (small flapped area), so flaps would add 2 actuators, hinges and wiring for
      little gain
  tip_thickness:
    constant_16pct:
      endurance_h: 13.188
      wing_kg: 19.045
    tapered_to_13pct:
      endurance_h: 13.268
      wing_kg: 18.956
    decision: constant 16 %
    reason: one rib family (all ribs scaled copies), conical outer skins, deeper tip spar; the 13 % tip gains less than 0.2
      h
  chassis_material:
    aluminium:
      endurance_h: 13.188
      chassis_kg: 9.8838
    cfrp:
      endurance_h: 14.145
      chassis_kg: 7.79
    decision: aluminium
    reason: 'MIL-HDBK-5 A-basis allowables (no composite qualification programme for the most loaded, most detailed parts:
      every hard point, gear and engine load path), flat-pattern parts cut and bent from CAD without tooling, visible damage,
      field-repairable with rivets and doublers, isotropic fitting design; costs +0.96 h'
  propeller:
    mejzlik_32x18_2B:
      endurance_h: 13.188
      roc_sl_m_s: 4.0647
      to_roll_m: 162.84
      loiter_rpm_3000m: 4306.2
    mejzlik_31x12_3B:
      endurance_h: 12.746
      roc_sl_m_s: 4.8129
      to_roll_m: 143.38
      loiter_rpm_3000m: 5023.9
    decision: 32x18 2B (research primary); 31x12 3B is the climb/hot-day option on the same hub
  landing_gear:
    fixed:
      endurance_h: 13.188
    retractable:
      endurance_h: 12.833
      dDq_m2: -0.014179
      dm_kg: 2.45
    decision: 'fixed tricycle (brief): no retraction mechanism, no bays in the CG zone, no purchasable 100-200 kg retract
      unit (components.yaml)'
  propulsion_layout:
    pusher:
      endurance_h: 13.188
    tractor_estimate:
      endurance_h: 12.885
      dDq_m2: 0.0033263
      dm_kg: 0.3
      basis: slipstream dynamic-pressure increase T/(A q) on 60 % of the pod wetted area at the 3000 m loiter, +0.3 kg longer
        nose leg for propeller clearance (estimate)
    decision: pusher
    reasons:
    - two-stroke premix exhaust (oil mist) and the propeller disc stay behind the EO/IR turret and its window; the turret
      keeps the chin with a free forward/nadir field of view
    - 11 of 13 comparables with a known layout are pushers (comparables.yaml)
    - the propeller between the booms is guarded laterally and its wake drives the stabiliser
    tractor_advantages_not_taken:
    - propeller wash cools the cylinders on the ground (no CHT-limited ground runs)
    - simpler cowl and cooling inlets
