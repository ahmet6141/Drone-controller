    stall_corner_ws_Pa:
      '10.0': 467.4
      '11.0': 467.7
      '12.0': 467.6
      '13.0': 467.5
      '14.0': 467.2
    chosen:
      AR: 12.0
      ws_Pa: 467.6
    rule: 'production rule: the best endurance among the stall-corner points whose outer panel is not longer than the constant-chord
      centre section + 5 cm (2.05 m): all three wing pieces share one transport case and one handling fixture (same rule as
      the centre-section span); research AR band 10-13 (comparables.yaml: above about 13 spar depth, hinge space and ground
      handling get hard)'
    finding: between AR 10 and 12 the wing mass changes by only a few hundred grams (skins dominate and the area is set by
      the stall corner), so the lower AR saves almost nothing in cost or mass but costs endurance; above AR 12 the outer panels
      outgrow the centre-section case
  tail_configuration:
    variants:
      twin_boom_H:
        endurance_h: 13.188
        empty_kg: 88.649
        tail_and_booms_kg: 7.0172
        pod_shell_kg: 6.2481
        chassis_kg: 9.8838
