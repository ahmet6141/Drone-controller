flags:
- 'sea-level loiter at 3727 rpm is below the Limbach 4000-6000 rpm regular-flight band (3000 m loiter: 4306 rpm); confirm
  low-load operation with Limbach or loiter >= 1500 m'
- sea-level rate of climb 4.07 m/s is below the 4.9 m/s baseline target with the 32x18 2B propeller (propeller-limited, not
  engine-limited); the 31x12 3B option trades endurance for climb
- 'stabiliser in the propeller slipstream: 2/rev blade-passage pressure loading and acoustic fatigue of the stabiliser and
  elevators must be covered by a vibration survey and a fatigue test; slipstream-dependent pitch trim (power changes) to be
  handled by the autopilot'
- boom/tail flutter (boom bending 13 Hz, torsion, stabiliser bending) and the wing (AR 12) are not analysed here; CS-LUAS.629
  clearance to 1.2 VD = 68.4 m/s needs a GVT and rational analysis (Report 45 not valid for boom tails)
- aft-pod closure from 0.45 m to the 0.30 m cowl lip relies on the pusher inflow and the cooling exit flow (same as the endurance
  chain); confirm with CFD; the 80 mm hub spacer needs Limbach approval
- 'abort landing at MTOM needs a 214 m ground roll (> 200 m factored target, < 300 m strip): no flaps and the shoulder-wing
  incidence keep lift on the wheels; aileron-up lift dumping and an operating limit (fuel jettison is not provided) cover
  it'
- rotation speed relies on the slipstream over the stabiliser (actuator-disk estimate); without slipstream credit the take-off
  roll is 205 m (lift-off 29.1 m/s); verify in taxi tests
