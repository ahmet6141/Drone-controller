halka:
  name: HALKA
  name_tr: Kutu / birleşik kanat
  summary_tr: Alçak, geriye ok açılı ön kanat; sırttaki dikey kuyruğun tepesinden
    çıkan ileri ok açılı arka kanat; kanat uçlarında ikisini birleştiren dikey plakalar
    (kutu kanat). Aynı açıklıkta indüklenmiş sürükleme ~%20 daha düşük; 5,5 m açıklıkla
    tek parça taşınabilir kanat yarıları.
  pitch_tr: Arka kanatta yükseliş dümenleri, ön kanatta kanatçık/flap, dikey kuyrukta
