hancer:
  name: HANÇER
  name_tr: Köşeli taşıyıcı gövde + kanalli itici fan
  summary_tr: 'Elmas kesitli, keskin kenar çizgili (chine) taşıyıcı gövde ön kenar
    uzantılarıyla (LERX) kanada kaynaşır; dışa eğik ikiz dikey kuyruk + hareketli
    yatay kuyruk; pervane bir kanal (duct) içinde: daha sessiz, yerde güvenli, jet
    görünümlü arka bölüm.'
  pitch_tr: Hareketli yatay stabilizatör (stabilator) + dışa eğik ikiz dümen, kanatçık/flap
