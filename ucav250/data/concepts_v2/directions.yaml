manta:
  name: MANTA
  name_tr: Kanat-gövde birleşik (BWB)
  summary_tr: 'Taşıyıcı merkez gövde (BWB) yüksek açıklıklı dış kanatlara kesintisiz
    geçer; motor sırttaki omurga kaportasında, itici pervane iki dışa eğik dikey kuyruk
    arasında korunur. Geniş iç hacim: yakıt, faydalı yük ve aviyonik ağırlık merkezinin
    üzerinde; içeri katlanır iniş takımı.'
  pitch_tr: Merkez gövde ve dış kanat arka kenarındaki eleron/elevonlar + eğik ikiz
    dümen-yükseliş (ruddervator)
