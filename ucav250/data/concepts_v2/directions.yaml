ok:
  name: OK
  name_tr: Kanard-itici, ok kanat + kanatucu dümen
  summary_tr: 'Burunda kanard, arkada geriye ok açılı ana kanat ve kanat uçlarından
    kıvrılarak yükselen dikey dümenler: kuyruk yok. Kanard önce perdövites yapar,
    ana kanat stall''a girmez (doğal stall koruması). İtici pervane gövde sonunda,
    altında ventral koruma kanadı.'
  pitch_tr: Kanard üzerinde yükseliş dümeni; ana kanatta kanatçık, kanat ucu dikeylerinde
    dümen
  gear_retractable: false
