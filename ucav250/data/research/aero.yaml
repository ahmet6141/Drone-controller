propeller_operating_points:
  tag: estimate
  source: https://www.mejzlik.eu/propulsion-system-data
  method: Mejzlik tables (ISA sea level) interpolated linearly in rpm and flight speed; outside the tabulated rpm range a cubic CT(J)/CQ(J) fit of the upper-rpm rows
    is used (flagged). WOT = prop torque equals the L 275 EF datasheet WOT torque (engine.yaml); '20kW_class' scales that torque by 20/18.87. Cruise = rpm at which
    thrust equals the estimated thrust required, efficiency = T V / P (isolated propeller; no installation, blockage or pusher-wake losses).
  drag_estimate_for_thrust_required:
    mass_kg: 150.0
    S_m2: 3.0
    AR: 12.0
    CD0: 0.035
    e: 0.75
    tag: estimate
    source: ucav250/data/research/comparables.yaml
    basis: MTOW, S and AR = comparables.yaml recommended_ranges nominals; CD0 0.035 and e 0.75 as in its consistency check; D = q S CD0 + W^2/(q S pi e AR), ISA sea
      level
    thrust_required_N: {V_25_m_s: 106.8, V_30_m_s: 104.2, V_35_m_s: 112.8, V_40_m_s: 128.9, V_45_m_s: 150.8}
