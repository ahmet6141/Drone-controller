# CORRECTIONS (synthesis cross-check, 2026-10-05; see ucav250/data/research/baseline.yaml)
# Hand-written sections only. The generated block below is NOT edited; it still shows the old static
# points (static_wot_L275EF 512 N / 6001 rpm for '0161') until aero_polars.py is fixed and re-run.
