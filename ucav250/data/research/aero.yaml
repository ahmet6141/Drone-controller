# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - AIRFOILS AND PROPELLER
# Civil surveillance / research UAV with a UCAV/MALE look, ~250 cc piston engine (Limbach L 275 EF class,
# 18-20 kW). Payload: EO/IR sensors and mission equipment only.
#
# Conventions
#   - SI units, explicit in key names (m, m2, kg, s, N, W, Pa, m/s, rpm, deg). Non-dimensional aerodynamic
#     coefficients (cl, cd, cm) are section values; cm is about the quarter chord, nose-up positive.
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "paper" = technical report or journal paper (NASA/NACA reports, arXiv). "estimate" values carry a "basis".
#   - Everything between the "BEGIN/END GENERATED" markers at the end of this file is produced by
#     ucav250/data/research/aero_polars.py (NeuralFoil polars, section geometry, Mejzlik-table propeller
#     operating points). Re-run it with:  python3 ucav250/data/research/aero_polars.py --update-yaml
#     The hand-written sections quote numbers from that block; re-check them if the block is regenerated
#     with different settings.
#   - Reynolds keys: Re_0.8e6 = chord Reynolds number 0.8 x 10^6. "n9" = n_crit 9 (clean), "n5" = n_crit 5
#     (task-defined rough case), "trip" = transition fixed at 0.075c on both surfaces (insects/rain/erosion).
#   - Air properties: ISA (ISO 2533); dynamic viscosity from Sutherland's law (1.458e-6, 110.4 K).
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: airfoils and propeller
  phase: research
  date: "2026-10-05"
  scope: >-
    Wing and tail airfoil selection for a MALE-style UAV wing at chord Reynolds numbers of about 0.5-2.5e6
    (chord 0.3-0.67 m, 25-45 m/s, sea level to 4500 m), and fixed-pitch propellers (26-34 in, 2 or 3 blades,
    pusher or tractor) for an 18-20 kW two-stroke at 4000-7500 rpm.
  related_files:
    - ucav250/data/research/engine.yaml        # L 275 EF WOT curve, propeller interface, earlier prop estimate
    - ucav250/data/research/comparables.yaml   # MTOW, wing area, span, AR, cruise speed nominals
    - ucav250/data/research/aero_polars.py     # script that produced the generated block
    - ucav250/data/airfoils/*.dat              # UIUC coordinates in Selig format
  files_written:
    dat_files: [naca4415.dat, n63415.dat, naca23015.dat, nlf416.dat, fx63137.dat, e1210.dat, sd7062.dat, ls417.dat,
                naca642415.dat, nlf0115.dat, nlf1015.dat, n0009sm.dat, naca0010.dat, n0012.dat, n63012a.dat]
    dat_format: >-
      Selig order (TE -> upper surface -> LE -> lower surface -> TE), first line = original UIUC title. Ordinates
      are the UIUC values unchanged; Lednicer files (nlf416, ls417, fx63137, e1210, n0012, n63415, n63012a) were
      re-ordered, and naca23015.dat was cleaned ("......" placeholders and the trailing "100.00 0.0000" line
      removed, bracketed TE ordinates "(0.0016)" kept as numbers).
    not_written: >-
      naca4412.dat and naca4418.dat (added candidates) were deliberately not written: the UIUC copies have only
      17 points per side, and any file named naca44xx.dat bypasses the exact analytic NACA generator in
      ucav250/design/oml.py (airfoil_coords uses the built-in generator only when no .dat file exists). They
      are analysed from analytic ordinates (aerosandbox).

