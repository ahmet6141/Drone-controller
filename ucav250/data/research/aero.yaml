# -----------------------------------------------------------------------------------------------------
# DESIGN POINT (what the polars were evaluated for)
# -----------------------------------------------------------------------------------------------------
design_point:
  aircraft_nominals:
    mtow_kg: {value: 150.0, source: *u_comparables, tag: estimate, basis: comparables.yaml recommended_ranges.mtow_kg.nominal}
    wing_area_m2: {value: 3.0, source: *u_comparables, tag: estimate, basis: comparables.yaml recommended_ranges.wing_area_m2.nominal}
    span_m: {value: 6.0, source: *u_comparables, tag: estimate, basis: comparables.yaml recommended_ranges.span_m.nominal}
    taper_ratio_assumed: {value: 0.5, tag: estimate, source: *u_comparables, basis: "assumed for this study; gives root chord 0.667 m, tip chord 0.333 m, MAC ~0.52 m"}
  air_properties_ISA:
    source: *u_iso2533
    tag: standard
    sea_level: {density_kg_m3: 1.225, dynamic_viscosity_Pa_s: 1.789e-5, kinematic_viscosity_m2_s: 1.461e-5}
    altitude_3000_m: {density_kg_m3: 0.9091, dynamic_viscosity_Pa_s: 1.694e-5, kinematic_viscosity_m2_s: 1.863e-5}
    altitude_4500_m: {density_kg_m3: 0.7768, dynamic_viscosity_Pa_s: 1.645e-5, kinematic_viscosity_m2_s: 2.117e-5}
  chord_reynolds_number:
    tag: estimate
    source: *u_iso2533
    basis: Re = V c / nu with the ISA viscosities above
    sea_level:     {c0p30_V25: 0.51e6, c0p30_V36: 0.74e6, c0p30_V45: 0.92e6, c0p45_V30: 0.92e6, c0p45_V36: 1.11e6, c0p60_V30: 1.23e6, c0p60_V36: 1.48e6, c0p60_V45: 1.85e6}
    altitude_3000_m: {c0p30_V25: 0.40e6, c0p30_V36: 0.58e6, c0p45_V30: 0.72e6, c0p45_V36: 0.87e6, c0p60_V30: 0.97e6, c0p60_V45: 1.45e6}
    altitude_4500_m: {c0p30_V30: 0.43e6, c0p45_V36: 0.77e6, c0p60_V36: 1.02e6, c0p60_V45: 1.28e6}
    note: >-
      The task grid (Re 0.8, 1.5, 2.5e6) brackets the wing: root chords at fast cruise reach ~2e6, the mean chord
      sits at ~0.9-1.2e6 at sea level and 0.7-0.9e6 at 3000 m, and the tip falls to ~0.4-0.6e6 at altitude. Tails
      (chord ~0.25-0.35 m) run at 0.4-0.9e6, so Re 0.5e6 was added for the tail sections.
  aircraft_lift_coefficient:
    tag: estimate
    source: *u_comparables
    basis: CL = m g / (0.5 rho V^2 S), m = 150 kg, S = 3.0 m2
    sea_level: {V25: 1.28, V30: 0.89, V35: 0.65, V40: 0.50, V45: 0.40}
    altitude_3000_m: {V25: 1.73, V30: 1.20, V35: 0.88, V40: 0.67, V45: 0.53}
    altitude_4500_m: {V30: 1.40, V35: 1.03, V40: 0.79, V45: 0.62}
  section_cl_used_in_polars:
    cl_cruise: {value: 0.6, tag: estimate, source: *u_comparables, basis: "~36 m/s at sea level, or ~40 m/s at 3000 m"}
    cl_loiter: {value: 0.9, tag: estimate, source: *u_comparables, basis: "best-endurance ~30 m/s at sea level; at 3000-4500 m loiter cl is 1.1-1.4, so cd at cl 1.1 and 1.3 is also tabulated"}

# -----------------------------------------------------------------------------------------------------
# METHOD, VALIDATION AND CORRECTIONS
# -----------------------------------------------------------------------------------------------------
method:
  polars:
    tool: NeuralFoil 0.3.3, model_size large (xlarge spot-checked at Re 1.5e6), aerosandbox 4.2.8 Kulfan fit of the coordinates
    source: *u_nf_code
    tag: estimate
    sweep: "alpha -4..16 deg in 0.25 deg steps as tasked; extended to 22 deg only to locate cl_max (several sections stall above 16 deg)"
    cases:
      ncrit9: clean surface, low-turbulence air (free transition, e^N n_crit 9)
      ncrit5: task-defined rough/contaminated case (free transition, n_crit 5). Physically this models higher free-stream turbulence; it moves transition forward but does not trip the boundary layer
      tripped: transition fixed at x/c 0.075 on both surfaces - the trip station of NASA TP-1861 and close to NACA 'standard roughness' (0.08c, NACA Rep. 824). Used as the insect/rain/erosion case
    metrics_definitions:
      cl_max: peak cl in -4..22 deg (cl_max_within_alpha_m4_16deg also given)
      drag_bucket_cl_range: contiguous cl range around cd_min with cd <= 1.10 cd_min
      cm_c4_at_cl_cruise: cm about c/4 at cl 0.6 (pre-stall branch)
      endurance_cl15_over_cd_max: max of cl^1.5/cd (section endurance figure)
      post_stall_cl_ratio_at_alpha_clmax_plus3deg: cl(alpha_clmax + 3 deg) / cl_max (1 = flat top, < 0.85 = sharp drop)
      stall_type_gault: Gault (1957) correlation with the upper ordinate at x/c 0.0125 (>= 2.2 % c trailing-edge stall; 1.75-2.2 combined; 1.2-1.75 leading-edge; < 1.2 thin-airfoil), boundaries read from TN 3963 Fig. 1 for Re 1-3e6 (+/- 0.2 % c)
  validation_against_wind_tunnel:
    nlf416_cl_max_Re_3e6:
      experiment: {value: 1.69, source: *u_tp1861, tag: paper, note: "transition free and fixed (0.075c) gave no significant difference"}
      neuralfoil: {value: 1.80, tripped: 1.79, source: *u_nf_code, tag: estimate, basis: generated block validation_vs_wind_tunnel}
      ratio_experiment_over_neuralfoil: {value: 0.94, tag: estimate, source: *u_tp1861, basis: 1.69 / 1.80}
    nlf416_cm_c4_at_cl_0:
      experiment: {value: -0.09, source: *u_tp1861, tag: paper}
      neuralfoil: {value: -0.0995, tripped: -0.0945, source: *u_nf_code, tag: estimate}
    nlf416_alpha_zero_lift_deg:
      experiment: {value: -3.8, source: *u_tp1861, tag: paper}
      neuralfoil: {value: -4.04, tripped: -3.82, source: *u_nf_code, tag: estimate}
    ls417_l_over_d_at_cl_1p0_transition_fixed:
      experiment: {value: [65, 85], re_range: [2.0e6, 6.0e6], source: *u_tnd7428, tag: paper}
      neuralfoil_tripped: {value: [76.1, 94.2], re: [2.0e6, 6.0e6], source: *u_nf_code, tag: estimate}
      implied_cd_factor: {value: [1.17, 1.11], tag: estimate, source: *u_tnd7428, basis: NeuralFoil L/D divided by experimental L/D}
    ls417_cl_max:
      experiment: {value: "> 2.0", source: *u_tnd7428, tag: paper}
      neuralfoil_tripped: {value: [1.93, 2.14], re: [2.0e6, 6.0e6], source: *u_nf_code, tag: estimate}
  recommended_corrections_for_sizing:
    cl_max_factor: {value: 0.94, tag: estimate, source: *u_tp1861, basis: NLF(1)-0416 experiment / NeuralFoil at Re 3e6; apply to every NeuralFoil section cl_max before 3-D corrections}
    cd_factor_tripped: {value: 1.15, tag: estimate, source: *u_tnd7428, basis: LS(1)-0417 fixed-transition L/D at cl 1.0 is 11-17 % below NeuralFoil}
    cd_factor_clean: {value: 1.05, tag: estimate, source: *u_nf_paper, basis: "XFoil-type free-transition drag is usually a few percent low at these Re; no in-range experiment checked here"}
    design_rule: >-
      Size endurance and climb on the 'tripped' polars x 1.15 (a production composite wing will not keep a
      reliable laminar run after insect strikes, rain and LE erosion; NASA TP-2256 also reports rain-induced
      trim changes on NLF airplanes and recommends fixed-transition testing as standard). Treat the clean (n9)
      polars as upside only.
    source: *u_tp2256
    tag: estimate
  model_and_coordinate_checks:
    model_size_sensitivity:
      value: "xlarge vs large at Re 1.5e6 / n9, all 17 sections: cl_max within 0.015, cd_min within 1.6 %, cm within 0.003, (L/D)max within 3.2 %"
      source: *u_nf_code
      tag: estimate
    uiuc_naca4415_file_deviation:
      value: >-
        The UIUC naca4415.dat is NOT the exact NACA 4415: its upper surface lies 2.5e-3 c (x/c 0.0125) to
        4.2e-3 c (x/c 0.0025) below the NACA equations and its LE point is at y = 0.00075. NeuralFoil at Re 1.5e6
        (n9): UIUC file cl_max 1.656, cm(cl 0.6) -0.082; analytic NACA 4415 cl_max 1.714, cm -0.101. Use the
        analytic NACA 4415 for design (see generated coordinate_source_check).
      source: *u_uiuc_coord
      tag: estimate
    uiuc_naca0010_file:
      value: "17 points per side; NeuralFoil results identical to the analytic NACA 0010 (cl_max 1.428 vs 1.429), but the LE between x/c 0 and 0.0125 is unresolved for lofting"
      source: *u_uiuc_coord
      tag: estimate
    uiuc_n0012_file: {value: "matches the analytic NACA 0012 to < 1e-5 c", source: *u_uiuc_coord, tag: estimate}
    side_effect_on_existing_code:
      value: >-
        ucav250/design/oml.py airfoil_coords('naca4415') and ('naca0010') now read the UIUC .dat files written
        here instead of the built-in NACA generator (its fallback runs only when no file exists). The cached
        polars ucav250/data/polars/naca4415_*.json were computed from the analytic shape. If NACA 4415 or 0010
        stay in the design, either load them under an analytic name or delete/rename the two .dat files.
      source: *u_uiuc_coord
      tag: estimate

# -----------------------------------------------------------------------------------------------------
# CANDIDATES (geometry and polars are in the generated block; literature facts here)
# -----------------------------------------------------------------------------------------------------
airfoil_candidates:
  wing:
    - id: naca4415
      name: NACA 4415
      file: ucav250/data/airfoils/naca4415.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca4415.dat"
      t_over_c: {value: 0.150, x_over_c: 0.30, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Classic 4-digit section with documented clean and standard-roughness data", source: *u_r824, tag: paper}
        - {text: "NACA 44-series of 12-15 % thickness keep comparatively good cl_max with standard roughness (Report 824: rough 64-series cl_max exceeds rough 24-, 44- and 230-series 'except for the NACA 44-series airfoils of 12 to 15 percent thickness')", source: *u_r824, tag: paper}
        - {text: "cl_max substantially lower than LS(1)-0417 and NLF(1)-0416 (TP-1861 Fig. 36 comparison)", source: *u_tp1861, tag: paper}
        - {text: "Wing section of the RQ-2 Pioneer (comparables.yaml)", source: *u_comparables, tag: paper}
        - {text: "UIUC file deviates from the NACA equations near the LE - use analytic ordinates", source: *u_uiuc_coord, tag: estimate}
    - id: n63415
      name: NACA 63(2)-415
      file: ucav250/data/airfoils/n63415.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/n63415.dat"
      t_over_c: {value: 0.150, x_over_c: 0.35, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "6-series laminar section; low-drag range depends on laminar flow; NeuralFoil bucket at Re 1.5e6 n9 is cl -0.06..0.71 and cd at cl 1.1 jumps to 0.0119 (bucket edge)", source: *u_nf_code, tag: estimate}
        - {text: "Report 824: smooth and rough cl_max are essentially equal only for the 6 %-thick 6-series sections - thicker ones lose cl_max with standard roughness; roughness strips more than 0.20c from the LE have little effect", source: *u_r824, tag: paper}
    - id: naca23015
      name: NACA 23015
      file: ucav250/data/airfoils/naca23015.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca23015.dat"
      t_over_c: {value: 0.150, x_over_c: 0.30, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Near-zero cm (NeuralFoil -0.003 at cl 0.6) - lowest trim drag of the cambered set", source: *u_nf_code, tag: estimate}
        - {text: "Stall: Report 824 Table II - wing with NACA 23015.6 root / 23009 tip: 'Very abrupt stall, left wing stalling very rapidly, for all conditions'", source: *u_r824, tag: paper}
        - {text: "Gault: 230-series stalls are 'definitely inconsistent' with the ordinate correlation (leading-edge/combined stall despite a large LE ordinate)", source: *u_tn3963, tag: paper}
    - id: nlf416
      name: NASA NLF(1)-0416
      file: ucav250/data/airfoils/nlf416.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/nlf416.dat"
      t_over_c: {value: 0.16, x_over_c: 0.32, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Designed for a light single-engine GA airplane: low drag at cl 0.4 (Re 4e6) and at climb cl 0.5-1.0; cl_max must not depend on laminar flow ('if the leading edge of the wing is contaminated by insect remains ... the cl_max should not decrease')", source: *u_tp1861, tag: paper}
        - {text: "Measured cl_max ~1.69 at Re 3e6; roughness at 0.075c had no significant effect on cl_max at any Re (1-9e6)", source: *u_tp1861, tag: paper}
        - {text: "cm(cl 0) ~ -0.09, alpha_L0 ~ -3.8 deg, both nearly independent of Re", source: *u_tp1861, tag: paper}
        - {text: "Stall: turbulent trailing-edge separation; LE peak does not collapse up to the maximum angle tested (gentle stall)", source: *u_tp1861, tag: paper}
        - {text: "With transition fixed, no higher cruise drag and lower climb drag than comparable turbulent airfoils: 'if laminar flow is not achieved, nothing is lost relative to the NASA low-speed airfoils'", source: *u_tp1861, tag: paper}
    - id: fx63137
      name: Wortmann FX 63-137
      file: ucav250/data/airfoils/fx63137.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/fx63137.dat"
      t_over_c: {value: 0.137, x_over_c: 0.31, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "High-lift low-Re section (human-powered aircraft Puffin II / Liverpuffin per UIUC title); cm about -0.21 (NeuralFoil)", source: *u_uiuc_db, tag: paper}
        - {text: "Thin cusped aft section (t/c 1.2 % at x/c 0.9) - poor hinge/flap depth and fragile TE in production composite", source: *u_uiuc_coord, tag: estimate}
    - id: e1210
      name: Eppler E1210
      file: ucav250/data/airfoils/e1210.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/e1210.dat"
      t_over_c: {value: 0.159, x_over_c: 0.22, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Eppler general-aviation section (UIUC title); 5.2 % camber with forward maximum thickness; highest NeuralFoil cl_max of the set (~2.0 at Re 1.5e6) but cd_min ~0.008", source: *u_nf_code, tag: estimate}
        - {text: "No wind-tunnel data located for Re 0.5-3e6; tripped cl_max drops 0.23 at Re 1.5e6 - the largest roughness loss in the set", source: *u_nf_code, tag: estimate}
    - id: sd7062
      name: Selig/Donovan SD7062 (reference)
      file: ucav250/data/airfoils/sd7062.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/sd7062.dat"
      t_over_c: {value: 0.14, x_over_c: 0.27, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Low-Reynolds-number model section (YK-38 wing); NeuralFoil shows good performance at Re 0.8-2.5e6 but no wind-tunnel data above model Re were located", source: *u_uiuc_db, tag: paper}
    - id: naca4412
      name: NACA 4412 (analytic ordinates)
      file: null
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca4412.dat"
      t_over_c: {value: 0.12, x_over_c: 0.30, source: *u_r824, tag: paper}
      notes: [{text: "Added as tip partner of NACA 4415; alpha_L0 -4.2 deg and cm -0.10 match NLF(1)-0416 closely (NeuralFoil)", source: *u_nf_code, tag: estimate}]
    - id: naca4418
      name: NACA 4418 (analytic ordinates)
      file: null
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca4418.dat"
      t_over_c: {value: 0.18, x_over_c: 0.30, source: *u_r824, tag: paper}
      notes: [{text: "Added as deep-root option; worst tripped drag of the 4-digit set (cd 0.0141 at cl 0.9, Re 1.5e6)", source: *u_nf_code, tag: estimate}]
    - id: ls417
      name: NASA LS(1)-0417 (GA(W)-1)
      file: ucav250/data/airfoils/ls417.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/ls417.dat"
      t_over_c: {value: 0.17, x_over_c: 0.39, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "cl_max > 2.0 and L/D at cl 1.0 of 65-85 for Re 2-6e6 (transition fixed)", source: *u_tnd7428, tag: paper}
        - {text: "cm about -0.12 (NeuralFoil); highest box area after NACA 4418", source: *u_nf_code, tag: estimate}
    - id: naca642415
      name: NACA 64(2)-415
      file: ucav250/data/airfoils/naca642415.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca642415.dat"
      t_over_c: {value: 0.15, x_over_c: 0.37, source: *u_uiuc_coord, tag: paper}
      notes: [{text: "6-series; Report 824: rough 64-series cl_d 0.4 sections keep higher cl_max than rough 24/230-series (but not than 44-series 12-15 %)", source: *u_r824, tag: paper}]
    - id: nlf0115
      name: NASA NLF(1)-0115
      file: ucav250/data/airfoils/nlf0115.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/nlf0115.dat"
      t_over_c: {value: 0.15, x_over_c: 0.43, source: *u_uiuc_coord, tag: paper}
      notes: [{text: "Low cm (-0.05) NLF section; NeuralFoil drag rises sharply above cl 0.6 (cd 0.0121 at cl 0.9, Re 0.8e6) - unsuited to MALE loiter cl", source: *u_nf_code, tag: estimate}]
    - id: nlf1015
      name: NASA NLF(1)-1015
      file: ucav250/data/airfoils/nlf1015.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/nlf1015.dat"
      t_over_c: {value: 0.15, x_over_c: 0.41, source: *u_uiuc_coord, tag: paper}
      notes:
        - {text: "Designed for a high-altitude long-endurance UAV: 15 %, Re 0.7-2e6, low drag cl 0.4 (dash) to 1.5 (max endurance); LTPT results confirm design except cl_max", source: *u_hale1015, tag: paper}
        - {text: "Best clean endurance figure of the set (NeuralFoil 209 at Re 1.5e6) but worst when tripped (81) and cm -0.19", source: *u_nf_code, tag: estimate}
  tail:
    - id: n0009sm
      name: NACA 0009 (smoothed UIUC ordinates)
      file: ucav250/data/airfoils/n0009sm.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/n0009sm.dat"
      t_over_c: {value: 0.09, x_over_c: 0.31, source: *u_uiuc_coord, tag: paper}
      notes: [{text: "UIUC has no unsmoothed NACA 0009; the smoothed file differs from the equations by < 8e-4 c", source: *u_uiuc_db, tag: paper}]
    - id: naca0010
      name: NACA 0010
      file: ucav250/data/airfoils/naca0010.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/naca0010.dat"
      t_over_c: {value: 0.10, x_over_c: 0.30, source: *u_uiuc_coord, tag: paper}
    - id: n0012
      name: NACA 0012
      file: ucav250/data/airfoils/n0012.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/n0012.dat"
      t_over_c: {value: 0.12, x_over_c: 0.30, source: *u_uiuc_coord, tag: paper}
      notes: [{text: "Report 824 Fig. 33 shows NACA 0012 wind-tunnel and flight drag agreeing within experimental error", source: *u_r824, tag: paper}]
    - id: n63012a
      name: NACA 63-012A (UIUC has no plain 63-012)
      file: ucav250/data/airfoils/n63012a.dat
      uiuc_url: "https://m-selig.ae.illinois.edu/ads/coord/n63012a.dat"
      t_over_c: {value: 0.12, x_over_c: 0.35, source: *u_uiuc_coord, tag: paper}
      notes: [{text: "'A' modification = straight aft surfaces (easy to build) but leading-edge stall type at the tail Re", source: *u_tn3963, tag: paper}]

# -----------------------------------------------------------------------------------------------------
# RECOMMENDATION
# -----------------------------------------------------------------------------------------------------
recommendation:
  wing:
    root:
      airfoil: NASA NLF(1)-0416
      file: ucav250/data/airfoils/nlf416.dat
      t_over_c: {value: 0.16, source: *u_tp1861, tag: paper}
    tip:
      airfoil: NLF(1)-0416 thickness-scaled to 13 % (camber line unchanged, thickness x 0.8125)
      file: ucav250/data/airfoils/nlf416.dat
      how_to_build: "ucav250/design/oml.py resampled('nlf416', thickness_scale=0.8125)"
      t_over_c: {value: 0.13, tag: estimate, source: *u_tp1861, basis: derived section; only the 16 % parent was tunnel-tested}
      fallback: constant NLF(1)-0416 (16 %) root to tip - fully covered by TP-1861 data; costs ~1-2 % wing profile drag (tip region only)
    spanwise_loft: linear in t/c from root to tip; same mean line keeps alpha_L0 and cm constant along the span
    washout_deg: {value: [2.0, 3.0], tag: estimate, source: *u_nf_code, basis: "tip cl_max at Re 0.6-0.8e6 (1.56-1.61, x 0.94 -> 1.47-1.51) is ~0.15 below root cl_max at Re 1.5-2.5e6; geometric washout restores root-first stall with taper 0.5. Confirm with the lifting-line in sizing."}
    reasons:
      spar_depth_and_fuel:
        root_spar_depth_at_x0p30_m: {value: 0.106, tag: estimate, source: *u_comparables, basis: "t/c 0.159 at x/c 0.30 x root chord 0.667 m (S 3.0 m2, b 6.0 m, taper 0.5)"}
        tip_spar_depth_at_x0p30_m: {value: 0.043, tag: estimate, source: *u_comparables, basis: "13 % section x tip chord 0.333 m"}
        box_area_x0p20_x0p65_over_c2: {root: 0.0639, tip: 0.0519, tag: estimate, source: *u_nf_code, basis: generated geometry (PCHIP integration of the outer mould line)}
        oml_box_volume_both_wings_m3: {value: 0.092, inboard_70pct_span: 0.077, tag: estimate, source: *u_comparables, basis: "integral of box area x c^2 over the trapezoidal planform; outer mould line, before skin/spar/rib deductions"}
        comparison: {naca4415_4412_pair_m3: 0.088, naca4418_4412_pair_m3: 0.099, ls417_constant_m3: 0.112, tag: estimate, source: *u_comparables}
        fuel_check: {required_fuel_volume_m3: 0.0446, tag: estimate, source: *u_comparables, basis: "33 kg (comparables fuel fraction 0.22 x 150 kg) / 740 kg/m3 (engine.yaml); needs ~58 % of the inboard-70 % OML box volume as an integral tank, or a fuselage tank"}
      trim_drag:
        cm_c4_at_cl_0p6: {value: -0.104, tripped: -0.096, source: *u_nf_code, tag: estimate}
        comparison: "-0.08..-0.10 for NACA 4415/4412, 63-415, SD7062, E1210; -0.12 LS(1)-0417; -0.19 NLF(1)-1015; -0.21 FX 63-137; ~0 NACA 23015"
        tail_download_difference_vs_fx63137_N: {value: 45, tag: estimate, source: *u_comparables, basis: "delta cm 0.11 x q 551 Pa (30 m/s SL) x S 3.0 m2 x MAC 0.5 m / tail arm 2.0 m (assumed)"}
      stall_behaviour:
        - {text: "Trailing-edge stall with a non-collapsing LE peak (oil-flow and pressure data)", source: *u_tp1861, tag: paper}
        - {text: "Gault ordinate 2.42 % c -> trailing-edge region at Re 1-3e6", source: *u_tn3963, tag: paper}
        - {text: "NeuralFoil post-stall ratio 0.96 (cl 3 deg past cl_max), vs 0.89 for NACA 23015", source: *u_nf_code, tag: estimate}
      roughness_robustness:
        - {text: "cl_max unaffected by roughness at 0.075c (Re 1-9e6) - the stall speed does not depend on a clean LE", source: *u_tp1861, tag: paper}
        - {text: "Tripped endurance figure cl^1.5/cd at Re 1.5e6: NLF(1)-0416 117.6 (best of the set) vs NACA 4415 85.9, 63(2)-415 89.2, LS(1)-0417 86.9, FX 63-137 124.8 (but cm -0.21), NLF(1)-1015 80.6", source: *u_nf_code, tag: estimate}
        - {text: "Tripped cd at cl 1.1, Re 0.8e6 (altitude loiter): NLF(1)-0416 0.0150, NACA 4415 0.0173, NACA 4412 0.0146, 63(2)-415 0.0151, E1210 0.0159", source: *u_nf_code, tag: estimate}
        - {text: "Clean-to-tripped cd ratio at cl 0.6, Re 1.5e6: 1.67 (NACA 4415 1.83, 63(2)-415 1.88, LS(1)-0417 2.09, NLF(1)-1015 2.11)", source: *u_nf_code, tag: estimate}
      key_section_data_Re_1p5e6:
        source: *u_nf_code
        tag: estimate
        clean_n9: {cl_max: 1.714, alpha_cl_max_deg: 15.0, cd_min: 0.0060, cl_at_cd_min: 0.20, drag_bucket_cl: [0.08, 0.49], cd_cl0p6: 0.00683, cd_cl0p9: 0.00755, cd_cl1p1: 0.00839, l_over_d_max: 131.7, endurance_max: 144.5}
        tripped: {cl_max: 1.709, cd_min: 0.0108, cd_cl0p6: 0.01144, cd_cl0p9: 0.01228, cd_cl1p1: 0.01302, l_over_d_max: 95.7, endurance_max: 117.6}
        design_values_after_corrections: {cl_max: 1.61, cd_cl0p9_tripped: 0.0141, tag: estimate, basis: "cl_max x 0.94; tripped cd x 1.15"}
    alternatives:
      documented_turbulent_pair:
        root: NACA 4415 (analytic ordinates)
        tip: NACA 4412 (analytic ordinates)
        why: >-
          Best-documented, simplest to loft; cm and alpha_L0 similar to NLF(1)-0416. NeuralFoil tripped endurance is
          lower (85.9 vs 117.6 at Re 1.5e6) and the box volume ~5 % smaller.
        source: *u_r824
        tag: paper
      laminar_upside_if_surface_can_be_kept_clean:
        airfoil: NLF(1)-1015
        why: designed for exactly this Re and endurance cl, but the largest roughness penalty and cm -0.19
        source: *u_hale1015
        tag: paper
    rejected:
      - {airfoil: NACA 23015, reason: "very abrupt stall (Report 824) despite near-zero cm", source: *u_r824, tag: paper}
      - {airfoil: Wortmann FX 63-137, reason: "cm -0.21 (trim drag, wing torsion) and thin cusped TE unsuited to production composite control surfaces", source: *u_nf_code, tag: estimate}
      - {airfoil: Eppler E1210, reason: "cd_min ~0.008, no validation data, largest roughness cl_max loss", source: *u_nf_code, tag: estimate}
      - {airfoil: "NACA 63(2)-415 / 64(2)-415", reason: "bucket ends near cl 0.7 - drag rises at loiter cl 1.1-1.3; laminar-dependent", source: *u_nf_code, tag: estimate}
      - {airfoil: NLF(1)-0115, reason: "drag rises above cl 0.6 (loiter penalty)", source: *u_nf_code, tag: estimate}
      - {airfoil: LS(1)-0417, reason: "thickest but cm -0.12 and cd rise above cl 0.9 clean; keep as backup if a deeper spar is needed", source: *u_tnd7428, tag: paper}
  tail:
    airfoil: NACA 0012
    file: ucav250/data/airfoils/n0012.dat
    applies_to: horizontal and vertical tail, or V-tail panels
    reasons:
      - {text: "Highest cl_max of the symmetric candidates at tail Re: 1.26 (Re 0.5e6) and 1.34 (Re 0.8e6) vs 1.02-1.27 for 0009/0010/63-012A; clean and tripped values equal", source: *u_nf_code, tag: estimate}
      - {text: "Gentlest stall of the set: post-stall ratio 0.91 at Re 0.5-0.8e6 (0010: 0.68-0.78, 0009: 0.65-0.70, 63-012A: 0.66-0.84); Gault ordinate 1.89 % c = combined/trailing-edge stall at Re ~1e6, the others leading-edge", source: *u_tn3963, tag: paper}
      - {text: "12 % depth gives room for a spar, hinge line and servo in a 0.25-0.35 m chord and better torsional stiffness for flutter margin", source: *u_uiuc_coord, tag: estimate}
      - {text: "Drag cost is small: cd_min 0.0056 vs 0.0050 (0010) at Re 0.8e6; tripped/clean cd_min ratio 1.9-2.3 for all four (0012: 2.0)", source: *u_nf_code, tag: estimate}
      - {text: "UIUC n0012.dat equals the NACA equations; wind-tunnel and flight drag agree (Report 824 Fig. 33)", source: *u_r824, tag: paper}
    alternative: {airfoil: NACA 0010, reason: "~10 % lower cd_min and lighter; accept leading-edge stall type and 5-7 % lower cl_max at Re 0.5-0.8e6", source: *u_nf_code, tag: estimate}
  production_notes:
    - {text: "Specify LE erosion tape/paint on the first 8-10 % chord and design performance on the tripped polars; NLF(1)-0416 loses no cl_max when contaminated", source: *u_tp1861, tag: paper}
    - {text: "Standard roughness (0.011 in grains over 0.08c) is 'considerably more severe than ... usual manufacturing irregularities' but 'considerably less severe than ... ice or mud' - treat it as the bad-day service case", source: *u_r824, tag: paper}
    - {text: "Keep a blunt or finite TE (~0.4 % c) for manufacturing; TP-1861 found a blunt-TE wedge did not change cl_max and only slightly raised cd_min", source: *u_tp1861, tag: paper}
    - {text: "Rain caused stick-fixed nose-down trim changes on NLF airplanes - keep elevator trim authority for a cm shift of ~+0.01 (NeuralFoil clean -0.104 -> tripped -0.096)", source: *u_tp2256, tag: paper}

