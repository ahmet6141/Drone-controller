corrections:
  - id: C-AERO-01
    date: "2026-10-05"
    location: propellers.recommendation.pusher_primary.static_thrust_N (+ static_thrust_N_for_sizing, caveats, why, comparison_with_engine_yaml_estimate, pusher_alternative.static_thrust_N rpm)
    issue: >-
      The stated method ("CT0/CQ0 at 5500 rpm scaled with n^2") and the number did not agree. Mejzlik sheet 0161
      (re-read): static 451 N and 23.15 N m at 5500 rpm, the top tabulated row. aero_polars.py extrapolates above
      the table with a cubic CT(J)/CQ(J) fit through all speeds, whose CQ(0) is 7 % below that row (CT(0) 5 %
      below), so perf() drops from 451 N to 430 N between 5500 and 5501 rpm and the WOT balance lands at
      6001 rpm / 512 N. Anchoring the n^2 scaling to the 5500 rpm row gives the L 275 EF torque balance at
      5790 rpm, 500 N, 15.56 kW, tip Mach 0.724. Same check for 31x12 3B (sheet 0164): 5960 rpm, 551 N
      (thrust unchanged, rpm was 6104).
    fix: >-
      Hand-written values corrected: 32x18 2B static 500 N at 5790 rpm (sizing value 460 N = 500 x 0.92);
      31x12 3B static rpm 5960. Cruise points (inside the tables) and WOT in-flight points are unchanged; the
      40 m/s and 20 m/s WOT points also use the fit above 5500 rpm and carry the same few-percent uncertainty.
    recommended_code_fix: >-
      In aero_polars.perf(), extrapolate each speed's rows from the nearest tabulated row with constant CT and CQ
      at that row's J (true J-similarity), or blend the fit to match the table at its last row; then re-run
      --update-yaml.
    source: "https://www.mejzlik.eu/files/0161-zanzottera-motor-305hs-mejzlik-32x18-2b.pdf"
    tag: estimate

