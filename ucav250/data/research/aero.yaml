  screening_rule: static WOT equilibrium 5000-6500 rpm, static tip Mach <= 0.76, WOT at 40 m/s below 7500 rpm (prop loads the engine in flight), cruise rpm at 30
    m/s >= 3500; ranked by mean partial-throttle efficiency at 30/35/40 m/s
