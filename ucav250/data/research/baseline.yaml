# -----------------------------------------------------------------------------------------------------
# TURKISH REGULATION (summary; full text in standards.yaml#turkey_regulation)
# -----------------------------------------------------------------------------------------------------
regulation_turkey:
  document: {value: "SHGM SHT-IHA (2026), in force 30 July 2026, transition to 31 July 2027", source: *s_shtiha, tag: standard}
  class: {value: "M2 if MTOM < 150 kg; M3 at 150 kg and above", source: *s_shtiha, tag: standard, clause: "Madde 8(1)"}
  airworthiness: {value: "SHGM airworthiness certificate (ucusa elverislilik belgesi) for M2; technical code not yet published - propose CS-LUAS + STANAG 4703", source: *s_shtiha, tag: standard, clause: "Madde 8(5)"}
  software_certification: {value: "SHGM software certification of flight-control and ground-station software; embedded compliance module executing IHATTYS commands", source: *s_shtiha, tag: standard, clause: "Madde 8(6), 23(3)-(4)"}
  mandatory_functions: {value: ["remote ID", "IHATTYS-fed geofence", "C2-loss automatic recovery to a predefined area or flight termination", "BTK-compliant radios"], source: *s_shtiha, tag: standard, clause: "Madde 18(1), 23"}
  registration_and_pilot: {value: "tescil + P2 pilot (class 3 medical) for flights above 120 m or beyond 3000 m; P2 flights within a light-aircraft operator", source: *s_shtiha, tag: standard, clause: "Madde 11(2), 15, 19"}

