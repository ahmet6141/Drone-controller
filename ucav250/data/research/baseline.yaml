# CROSS-CHECKS between the research files (done in this synthesis)
# -----------------------------------------------------------------------------------------------------
cross_checks:
  corrections_applied:
    - {id: C-COMP-01, file: comparables.yaml, what: "MTOW nominal 150 / max 180 kg are Turkish class M3; regulatory_cap 149.9 kg added (SHT-IHA re-read)"}
    - {id: C-COMP-02, file: comparables.yaml, what: "fuel volume conversion 750 -> 740 kg/m3 (33 kg = 44.6 L)"}
    - {id: C-COMP-03, file: comparables.yaml, what: "payload band assumed a 10-20 kg gimbal; the selected turret is 1.55 kg (HD59 datasheet re-read)"}
    - {id: C-ENG-01, file: engine.yaml, what: "generator output at the 3800 rpm loiter about 405 W (not 550 W); voltage about 34 V rectified"}
    - {id: C-ENG-02, file: engine.yaml, what: "loiter (24-28 % power) is below the lowest BSFC point; note added, extrapolated point held here"}
    - {id: C-ENG-03, file: engine.yaml, what: "cross-reference to the aero.yaml propeller (same 0.81 x 0.46 m)"}
    - {id: C-AERO-01, file: aero.yaml, what: "32x18 2B static thrust 512 -> 500 N (5790 rpm), sizing value 470 -> 460 N; the script's cubic extrapolation did not match the stated n^2 method (Mejzlik sheet re-read); 31x12 3B static rpm 6104 -> 5960"}
    - {id: C-CMP-01, file: components.yaml, what: "SG750 bus voltage at loiter rpm about 34 V: controller must boost"}
    - {id: C-CMP-02, file: components.yaml, what: "generator margin at loiter about 1.15-1.7x, not 2.3-2.9x"}
    - {id: C-CMP-03, file: components.yaml, what: "gear screening factors are ground-reaction factors; inertia factor 5.3-6.2 exceeds the standards target; >= 0.18-0.22 m stroke needed"}
    - {id: C-CMP-04, file: components.yaml, what: "flap hinge moment at VF >= 37.3 m/s (CS-LUAS.345(b)) instead of 30-33 m/s"}
  verified_without_change:
    - {item: "Limbach L 275 EF 18 kW / 7500 rpm, 7 kg, option masses", source: *s_lim_web, tag: manufacturer}
    - {item: "SG750 800 W at 7500 rpm, 1 kW for 3 min, 440 g, 'will integrate'; UST 048 '25 kg MTOW' phrase confirmed as printed (still treated as an editorial error)", source: *s_ust048, tag: paper}
    - {item: "SHT-IHA class boundaries, airworthiness certificate for M2/M3, tescil rule", source: *s_shtiha, tag: standard}
    - {item: "NCAMP MTM45-1 ETW = 200 degF wet, Tg wet 339.46 degF, ETW B-basis values used in materials.yaml spec_ready", source: *s_ncud, tag: standard}
    - {item: "Mejzlik 32x18 2B 334 g, CW/CCW, static table", source: *s_mz0161, tag: manufacturer}
    - {item: "Volz DA 26 torque/voltage/mass; Trillium HD59-LLVV mass/size/power; Galaxy GRS 4/240 data; Primoco One 150 data", source: *s_cmp, tag: estimate}
    - {item: "arithmetic re-done: engine fuel-flow table, altitude lapse, cooling airflow, comparables power fit and stall table, standards gust/landing example, materials torque and AM knock-downs, aero thrust required", source: *s_engine, tag: estimate}
  loiter_fuel_flow:
    tag: estimate
    source: *s_engine
    basis: "145 kg, S 3.0, AR 12, CD0 0.035, e 0.75, 30 m/s EAS, propeller efficiency 0.786 x 0.95, electrical 303 W / 0.85 generator efficiency, bsfc_curve above"
    sea_level: {drag_N: 101.1, prop_shaft_W: 4063, total_shaft_W: 4419, power_fraction: 0.246, bsfc_g_per_kWh: 573, fuel_flow_kg_per_h: 2.53}
    altitude_3000_m: {tas_m_per_s: 34.8, prop_shaft_W: 4716, total_shaft_W: 5073, power_fraction: 0.282, bsfc_g_per_kWh: 551, fuel_flow_kg_per_h: 2.80}
    endurance_h: {sea_level: 10.9, altitude_3000_m: 9.8, basis: "(31.9 kg - 0.2 unusable - 10 % reserve - 1.0 climb/taxi) / fuel flow"}
    conclusion: "consistent with the comparables 10-13 h band; endurance is fuel-volume and part-load-BSFC limited, not power limited"
  power_and_thrust:
    takeoff_thrust_to_weight: {value: 0.32, tag: estimate, source: *s_mz0161, basis: "460 N / (145 x 9.80665)"}
    power_loading_kg_per_kW: {value: 8.1, tag: estimate, source: *s_comp, basis: "145 / 18; comparables power-class median 8.0"}
    power_available_3000m_W: {value: 12470, tag: estimate, source: *s_hirth4201}
  electrical_margin:
    tag: estimate
    source: *s_ust048
    generator_at_loiter_W: {with_32x18_3800rpm: 405, with_31x12_4450rpm: 475}
    load_W: {continuous: 303, peak_hd59: 383, peak_e180_growth: 443}
    conclusion: >-
      Thin margin at loiter: continuous load uses 64-75 % of the estimated output and growth-payload peaks exceed it
      (battery covers peaks). Sizing must check it; options: get the ePropelled output curve, loiter at >= 4400 rpm
      (31x12 3B or a lower-pitch prop), duty-cycle the 42 W pitot heater, or keep the 28 V alternator fallback.
  geometry_consistency:
    - {check: "stall speed <= 24 m/s clean at CLmax 1.40 needs W/S <= 50.4 kg/m2; baseline 48.3 passes (23.5 m/s)", tag: estimate, source: *s_comp}
    - {check: "fuel 43.1 L fits the 45 L bladder; aero.yaml wing box (inboard 70 %) 0.077 m3 could take it as an integral tank alternative", tag: estimate, source: *s_aero}
    - {check: "engine width 0.397 m must fit the aft fuselage (cheek blisters/inlets if the fuselage is narrower)", tag: paper, source: *s_ust61}
    - {check: "propeller hub >= 0.59 m above ground at the critical attitude (0.18 m clearance + 0.406 m radius)", tag: standard, source: *s_csvla}

