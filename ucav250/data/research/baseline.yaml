# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - BASELINE (synthesis of the six research files)
# Civil surveillance / research UAV with a UCAV/MALE look, one ~250 cc piston engine.
# Payload: EO/IR sensors and mission equipment only. No weapons, munitions, hardpoints, pylons or release
# mechanisms anywhere in this file or in the files it summarises.
#
# What this file is
#   The recommended STARTING INPUTS for the concept trade study and sizing phase (spec.yaml v1,
#   analysis/sizing.py). It picks one value (plus a range) for every input the sizing needs, keeps the
#   source and tag of the research value it came from, and records the cross-checks between the files.
#   It does not replace the research files: every block names the research file and key it came from ("ref").
#
# Conventions
#   - SI units, named in the key (m, m2, kg, s, N, N_m, Pa, W, V, m_per_s, kg_per_h, degC). Angles in deg.
#   - Every number carries "source" (URL, via YAML alias to the sources list, or a research-file path) and
#     "tag": manufacturer | datasheet | standard | paper | vendor | estimate.
#     A value copied from a research file keeps that file's source and tag. A value computed here is tagged
#     estimate and carries a "basis" with the formula and inputs.
#   - "ref" = research file and key the value came from (ucav250/data/research/<file>#<key path>).
#   - Corrections made to the research files during this synthesis are listed in cross_checks.corrections_applied
#     and in the "corrections" list inside each corrected file.
# Date: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: research baseline for concept/sizing
  phase: research -> sizing hand-over
  date: "2026-10-05"
  scope: >-
    Civil EO/IR surveillance and research UAV, runway operation, single Limbach L 275 EF two-stroke twin,
    MTOM strictly below 150 kg (Turkish class M2). Payload is EO/IR sensors and mission equipment only.
  files_synthesised:
    - ucav250/data/research/engine.yaml
    - ucav250/data/research/comparables.yaml
    - ucav250/data/research/standards.yaml
    - ucav250/data/research/aero.yaml
    - ucav250/data/research/aero_polars.py
    - ucav250/data/airfoils/*.dat
    - ucav250/data/research/components.yaml
    - ucav250/data/research/materials.yaml
  how_to_use: >-
    sizing.py reads design_point, engine, propeller, aero, mass_targets and design_loads as its first-iteration
    inputs, then replaces the estimates with its own results. materials_to_use / processes / fasteners map
    onto the spec.yaml materials / processes keys of ARCHITECTURE.md section 9. Every value tagged estimate is
    a starting guess the sizing phase must confirm or replace. open_items lists what must be obtained from
    suppliers or tests before design freeze.

