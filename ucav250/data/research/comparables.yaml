    - ruag_ranger_ads95
    - aerostar
    - bae_phoenix
    - primoco_one_150
    - elbit_hermes_180
    - tai_gozcu
  tag: estimate
  basis: computed from the per-aircraft values (each cited in its entry) with the formulas above
