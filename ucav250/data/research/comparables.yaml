        20: 158.0
    basis: >-
      Power-class specific power median 12.75 W/N (IQR 11.12-14.92) gives 144.0 kg at 18 kW and 160.0 kg at 20 kW;
      the MTOW-vs-power fit gives 148.0-158.0 kg. Direct power matches: Primoco 150 kg / 18.4 kW, Scout 159 kg /
      16.4 kW, Phoenix 175 kg / 19 kW, Pioneer 205 kg / 19.4 kW (short-endurance, high wing loading). Nominal 150
      kg = 8.3 kg/kW at 18 kW (matches engine.yaml). Above ~180 kg (>= 10 kg/kW) only short-endurance,
      high-wing-loading 1980s designs exist; keep it as the hard ceiling.
  span_m:
    min: 5.5
    nominal: 6.0
    max: 6.8
    tag: estimate
    basis: >-
      Core-set trend b = 1.555 m^0.249 gives 5.4 m at 150 kg (1-sigma 4.63-6.31 m). Endurance-optimised types (>=
      10 h) have b/m^(1/3) = 1.042-1.22 (median 1.095), i.e. 5.54-6.48 m at 150 kg. A 10-14 h engine-limited
      design belongs in that group; the MALE look also calls for a long slender wing. 6.0 m (index 1.13) is the
      nominal; 6.8 m is the practical limit for one-piece-per-side transport panels.
  wing_loading_kg_m2:
    min: 45.0
    nominal: 50.0
    max: 60.0
    tag: estimate
    basis: >-
      Core set 53.68-83.58 kg/m2 (median 58.56; only Pioneer 72.5 and Ranger 83.6 from published areas, the rest
      estimated); Shadow v2 ~47 (est.). The high values belong to catapult/arrested or skid-landing tactical
      types. For runway operation with fixed-pitch prop and an engine-limited endurance mission, keep stall speed
      <= 24 m/s (86 km/h, below Aerostar's published 90 km/h): F15 with CLmax 1.4 (clean, no flap) gives W/S <=
      50.4 kg/m2, CLmax 1.8 (plain/slotted flap) gives <= 64.8 kg/m2. Nominal 50 kg/m2 -> V_s = 23.1 m/s at CLmax
      1.5.
    stall_speed_check_m_s:
      45_kg_m2:
        CLmax_1.3: 23.5
        CLmax_1.5: 21.9
        CLmax_1.8: 20.0
      50_kg_m2:
        CLmax_1.3: 24.8
        CLmax_1.5: 23.1
        CLmax_1.8: 21.1
      55_kg_m2:
        CLmax_1.3: 26.0
        CLmax_1.5: 24.2
        CLmax_1.8: 22.1
      60_kg_m2:
        CLmax_1.3: 27.2
        CLmax_1.5: 25.3
        CLmax_1.8: 23.1
  wing_area_m2:
    min: 2.5
    nominal: 3.0
    max: 3.6
    tag: estimate
    basis: >-
      S = MTOW / (W/S): 125 kg / 50 = 2.5 m2 ... 180 kg / 50 = 3.6 m2; nominal 150 / 50 = 3.0 m2. Comparables:
      Pioneer 2.83, Ranger 3.41, Shadow RQ-7B ~3.0 (est.), Aerostar ~3.8 (est.).
  aspect_ratio:
    min: 10.0
    nominal: 12.0
    max: 13.0
    tag: estimate
    basis: >-
      Tactical comparables AR 6-9.6 (Shadow RQ-7B ~6 est., Scout ~8.3 est., Pioneer 9.4, Ranger 9.6); endurance
      types higher (Aerostar ~15 est., Penguin B 13.8). b = 6.0 m with S = 3.0 m2 gives AR 12 and a 0.50 m mean
      chord (Re ~ 0.9-1.0e6 at 28-30 m/s, sea level). Above AR ~13 the 0.45 m chord makes spar depth, flap/aileron
      hinge space and ground handling hard at this size.
  fuel_fraction:
    min: 0.18
    nominal: 0.22
    max: 0.26
    tag: estimate
    basis: >-
      Comparables 0.15-0.32 (median 0.20, several from mass balance). Sanity check: at 150 kg, S = 3.0 m2, AR 12,
      CD0 0.030-0.040, e 0.75, eta_p 0.72, cruise shaft power is 4.0-4.7 kW at 30 m/s (see consistency_check);
      adding ~0.6 kW shaft for ~0.4 kW electrical load and using the engine.yaml light-load BSFC of ~540 g/kWh (30
      % power point; may be worse below) gives ~2.5-3.0 kg/h. 0.22 x 150 = 33 kg (~44 l at 750 kg/m3) gives ~11-13
      h before reserves.
  payload_mass_kg:
    min: 20.0
    nominal: 27.0
    max: 35.0
    tag: estimate
    basis: >-
      Payload fraction: core set median 0.2085 (IQR 0.1625-0.2475), power class median 0.1695 -> 24-37 kg at 150
      kg. Mass balance at 150 kg with empty fraction 0.60 and fuel fraction 0.18-0.26 leaves 21-33 kg, so 20-35 kg
      is the usable band. Nominal 27 kg = 150 - 90 (empty) - 33 (fuel). Covers a 10-20 kg stabilised EO/IR gimbal
      plus datalink/mission computer.
  empty_mass_fraction:
    min: 0.55
    nominal: 0.6
    max: 0.62
    tag: estimate
    basis: >-
      Core-set median 0.6 (range 0.455-0.727). 0.60 x 150 = 90 kg (equal to Primoco One 150's published 90 kg
      empty mass). Retractable gear (absent in all comparables) would cost ~2-4 % of MTOW and must be paid for
      from this budget.
  length_m:
    min: 3.0
    nominal: 3.4
    max: 3.8
    tag: estimate
    basis: >-
      Length/span: core median 0.693; short-span tactical types 0.73-0.83 (Shadow, Pioneer, Scout, Ranger,
      Primoco, Hermes 180), long-span endurance types 0.51-0.60 (AR5, LUNA NG, T-20, RQ-21A, Aerostar). A
      MALE-style single fuselage at b = 6.0 m with L/b 0.50-0.63 gives 3.0-3.8 m.
  height_m: {min: 0.8, nominal: 1.0, max: 1.3, tag: estimate, basis: Comparables 0.66-1.30 m (on gear / skids).}
  cruise_speed_m_s:
    min: 25.0
    nominal: 30.0
    max: 36.0
    tag: estimate
    basis: >-
      Comparables: 25 m/s (LUNA NG) to 50 m/s (Ranger); endurance types 25-33 m/s. Best-endurance CL ~0.9-1.0 at
      W/S 50 kg/m2 occurs at 28-30 m/s.
  endurance_h_expected:
    min: 10.0
    nominal: 11.0
    max: 13.0
    tag: estimate
    basis: >-
      ff 0.22 with hourly fuel fraction 0.017-0.020 /h (2.5-3.0 kg/h at 150 kg; between the tactical and
      four-stroke endurance groups, appropriate for an EFI two-stroke at light load) -> 11-13 h; ~10 h with a 10 %
      reserve.
  service_ceiling_m: {min: 3600.0, nominal: 4500.0, max: 5500.0, tag: estimate, basis: "Comparables 2,750-5,944 m (median ~4,600 m); EFI keeps mixture correct with altitude."}
  configuration_guidance:
    - >-
      Pusher propeller at the rear of a single fuselage keeps the nose/belly EO/IR turret field of view clear (11
      of 13 comparables are pushers).
    - >-
      A V or inverted-V tail on a single fuselage, or a tailless delta (TUSAS GOLGE), gives the UCAV/MALE look;
      twin booms give the tactical look and are the structurally proven choice in this class.
    - >-
      No aircraft in this comparable set (all below 300 kg) uses retractable gear. Fixed tricycle gear (runway) is
      the class norm; retractable gear is a look/drag choice that must be justified by mass budget.
    - Composite airframe (GFRP/CFRP with foam or Nomex sandwich) is universal in the class.
  consistency_check:
    design_point:
      mtow_kg: 150.0
      span_m: 6.0
      wing_area_m2: 3.0
      aspect_ratio: 12.0
      oswald_e: 0.75
      eta_prop: 0.72
    cruise_shaft_power:
      CD0_0.03_h0m_V28:
        CL: 1.02
        L_over_D: 15.3
        shaft_power_W: 3746.6
      CD0_0.03_h0m_V30:
        CL: 0.889
        L_over_D: 15.3
        shaft_power_W: 3995.4
      CD0_0.03_h0m_V34:
        CL: 0.693
        L_over_D: 14.7
        shaft_power_W: 4710.6
      CD0_0.03_h1500m_V28:
        CL: 1.18
        L_over_D: 14.9
        shaft_power_W: 3843.5
      CD0_0.03_h1500m_V30:
        CL: 1.03
        L_over_D: 15.3
        shaft_power_W: 4017.9
      CD0_0.03_h1500m_V34:
        CL: 0.802
        L_over_D: 15.2
        shaft_power_W: 4568.9
      CD0_0.04_h0m_V28:
        CL: 1.02
        L_over_D: 13.3
        shaft_power_W: 4306.9
      CD0_0.04_h0m_V30:
        CL: 0.889
        L_over_D: 13.1
        shaft_power_W: 4684.4
      CD0_0.04_h0m_V34:
        CL: 0.693
        L_over_D: 12.2
        shaft_power_W: 5713.6
      CD0_0.04_h1500m_V28:
        CL: 1.18
        L_over_D: 13.2
        shaft_power_W: 4327.4
      CD0_0.04_h1500m_V30:
        CL: 1.03
        L_over_D: 13.3
        shaft_power_W: 4613.1
      CD0_0.04_h1500m_V34:
        CL: 0.802
        L_over_D: 12.8
        shaft_power_W: 5435.3
    climb_estimate:
      rate_of_climb_m_s: 4.91
      basis: >-
        (P_mcp * eta_climb - P_req * eta_cruise) / W with P_mcp = 16.2 kW (engine.yaml), eta_climb 0.65, P_req =
        4.6 kW shaft at 30 m/s; sea level.
    breguet_endurance_estimate_h:
      V28: 15.7
      V30: 14.6
    breguet_basis: >-
      E = eta_p (L/D) / (c g V) * ln(1/(1-ff)), eta_p 0.72, L/D 13, c = 540 g/kWh (engine.yaml 30 % power point),
      ff 0.22; no climb, reserve or electrical load (upper bound).
    conclusion: >-
      At 150 kg the 18 kW engine runs at ~25-30 % power in cruise, leaving ample climb/hot-high margin; endurance
      is limited by part-load BSFC and fuel volume, not by power. This supports MTOW up to ~170-180 kg if runway
      length and climb are verified in sizing.
    tag: estimate
    basis: >-
      parabolic-polar point performance at the nominal design point (inputs in design_point); a cross-check only,
      not a substitute for the sizing phase

uncertainties:
  - >-
    Wing areas are published for only two class members (Pioneer: NPS thesis via UIUC model; Ranger:
    ru.wikipedia). Shadow RQ-7B (chord from a third-party model), Scout (Ranger chord) and Aerostar (stall-speed
    method, CLmax assumed 1.5) are estimates (+/-20 %). Wing-loading and AR statistics therefore carry roughly
    +/-15 % uncertainty.
  - >-
    Several manufacturer pages (Textron Systems, Aeronautics, MDPI statistics paper) returned HTTP 403 to
    automated fetches; Aerostar current-standard values come from a search-engine extract of the manufacturer
    page.
  - >-
    Secondary sources disagree for many types (e.g. Ranger MTOW 275/285 kg and 31.5 kW / 38 hp / 45 CV; Primoco
    endurance 10/15 h and power 18.4 kW / 20 hp / 25 hp; Hermes 90 MTOW 85/115 kg). The value used is stated with
    the alternatives in 'note'.
  - >-
    Fuel masses for Aerostar, Primoco and T-20 are mass-balance or burn-rate estimates (upper bounds); fuel
    fraction statistics are therefore indicative.
  - >-
    Engine power is unpublished for Tekever AR5, Hermes 90, Integrator and Shadow v2/Block III; these are excluded
    from power statistics.
  - >-
    Military types dominate the class; the YK-250 civil role (EO/IR only) does not change the airframe statistics,
    but civil certification (e.g. EASA specific category / SORA) may push empty mass up.
