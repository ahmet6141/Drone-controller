# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - COMPARABLE AIRCRAFT
# Civil surveillance / research UAV with a UCAV/MALE look, sole powerplant ~250 cc piston (18-20 kW).
# Payload: EO/IR sensors and mission equipment only. No weapons-related data are recorded here.
#
# Conventions
#   - SI units, explicit in key names (m, m2, m3, kg, s, W, m/s, Pa). Endurance also as value_h for reading.
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "paper" = third-party published document: government article, thesis-derived model, reference directory,
#     trade press or encyclopedia. The exact kind is in sources[].kind; "confidence" (high/medium/low) grades it.
#     "estimate" values carry a "basis". "as_published" keeps the original wording/units for traceability.
#   - Conversions: 1 lb = 0.45359237 kg, 1 ft = 0.3048 m, 1 kt = 0.514444 m/s, 1 hp = 745.7 W, g0 = 9.80665 m/s2.
#     Published fuel volumes are converted with 720 kg/m3 (gasoline/avgas) unless stated otherwise.
#   - Derived ratios, statistics and recommended ranges are computed (formulas in statistics.formulas).
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: comparable aircraft
  phase: research
  date: '2026-10-05'
  scope: >-
    Fixed-wing piston UAVs of about 50-285 kg MTOW (core power class 12-40 kW) used to set target ranges for an
    18-20 kW (Limbach L 275 class) civil surveillance UAV. Helicopters, electric and jet aircraft excluded.
    Penguin B (21.5 kg) included for scaling only.
  counts:
    aircraft_listed: 19
    core_set: 16
    power_class_12_40kW: 10
  related_files: [ucav250/data/research/engine.yaml]

