aircraft:
  - id: shadow_200_rq7b
    name: AAI (Textron Systems) RQ-7B Shadow 200 (14 ft wing, pre-v2)
    manufacturer: AAI Corporation / Textron Systems
    country: USA
    entry_into_service: 2002 (RQ-7A), RQ-7B from ~2004
    in_power_class_12_40kW: true
    include_in_statistics: true
    statistics_note: >-
      Family representative for Shadow 200 (most complete, self-consistent mass data). The current extended-wing
      v2 is listed separately and not counted twice.
    geometry:
      span_m: {value: 4.27, as_published: "4.27 m (14 ft) [RQ-7B]", source: *u_desig_q7, tag: paper, confidence: medium}
      length_m: {value: 3.41, as_published: 11 ft 2 in (3.41 m), source: *u_wiki_shadow, tag: paper, confidence: medium, note: "RQ-7A: 3.40 m (designation-systems)"}
      height_m: {value: 0.91, as_published: "0.91 m (3 ft 0 in) [RQ-7A]", source: *u_desig_q7, tag: paper, confidence: medium, note: Wikipedia 1.0 m; Army Technology 0.86 m}
      wing_area_m2:
        value: 3.032
        source: *u_tensor_shadow
        tag: estimate
        confidence: low
        basis: >-
          S = b x c. Wing is constant-chord (Wikipedia: 'high-wing, constant chord'); c = 0.71 m taken from the
          third-party 6-DoF model of the extended-wing RQ-7B (4.42 m2 / 6.22 m). Uncertainty +/-20 %.
    mass:
      mtow_kg: {value: 170.1, as_published: "Max GW: 375 lbs", source: *u_aai_ndia2007, tag: manufacturer, confidence: high}
      empty_mass_kg:
        value: 90.0
        as_published: 'Empty Weight: 90kg'
        source: *u_armytech_shadow
        tag: paper
        confidence: low
        note: >-
          Barnard: frame 95.8 kg + avionics 3.3 kg; Wikipedia 186 lb/77 kg (inconsistent). MTOW - payload - fuel =
          99-108 kg is an upper bound.
      payload_mass_kg:
        value: 29.48
        as_published: 'Max payload wt: 65 lbs'
        source: *u_aai_ndia2007
        tag: manufacturer
        confidence: high
        note: Barnard 27.2 kg, Army Technology 25.3 kg
      fuel_volume_m3:
        value: 0.057
        as_published: RQ-7B - 57l
        source: *u_armytech_shadow
        tag: paper
