      Primoco, Gozcu, Hermes 90, LUNA NG, GOLGE); tractor only Phoenix (single) and AR5 (twin, wing-mounted).
      Pusher keeps the nose/belly free for the EO/IR turret and the prop out of the sensor view.
    tail: >-
