# -----------------------------------------------------------------------------------------------------
# STATISTICS
# -----------------------------------------------------------------------------------------------------
statistics:
  formulas:
    F1_mtow_per_kW: m_TO / (P_max / 1000)   [kg/kW]  (power loading)
    F2_specific_power: P_max / (m_TO * g0)     [W/N]   (g0 = 9.80665 m/s2)
    F3_wing_loading: m_TO / S                [kg/m2] (multiply by g0 for N/m2 = Pa)
    F4_aspect_ratio: b^2 / S
    F5_mean_chord: S / b                   [m]
    F6_empty_mass_fraction: m_empty / m_ref    (m_ref = MTOW of the same, self-consistent data set)
    F7_payload_fraction: m_payload / m_TO
    F8_fuel_fraction: >-
      m_fuel / m_TO;  m_fuel = V_fuel * rho_fuel when only a volume is published (rho = 720 kg/m3 gasoline, 800
      kg/m3 JP-8)
    F9_endurance_per_fuel_fraction: E / ff                  [h]  (linear, crude)
    F10_breguet_endurance_constant: 'K = E / ln(1 / (1 - ff))   [h]; prop-aircraft Breguet: K = eta_p (L/D) / (c g V) with c in kg/J'
    F11_hourly_fuel_fraction: ff / E                  [1/h] (average fuel burn per hour as a share of MTOW)
    F12_length_to_span: L / b
    F13_span_cube_root_mass: b / m_TO^(1/3)          [m/kg^(1/3)] (geometric-similarity span index)
    F14_power_law_fit: >-
      y = a * x^n by least squares on ln(y) = ln(a) + n ln(x); sigma = RMS residual in ln space; band =
      exp(+/-sigma)
    F15_stall_speed: V_s = sqrt(2 (m g0 / S) / (rho CLmax)),  rho = 1.225 kg/m3
  dataset_rules:
    - >-
      One entry per airframe family (variants of the same family are listed but include_in_statistics: false).
    - 'core_set = all entries with include_in_statistics: true (piston, fixed-wing, MTOW 61-285 kg).'
    - power_class_set = core_set entries with published P_max between 12 and 40 kW.
    - >-
      Percentiles use linear interpolation (numpy default). Values tagged estimate are included and flagged in
      *_basis fields.
    - >-
      Penguin B (21.5 kg) is excluded from all class statistics; it is shown only in the span trend check and the
      stall-method calibration.
  core_set:
    - shadow_200_rq7b
    - shadow_600
    - pioneer_rq2a
    - iai_scout
    - ruag_ranger_ads95
    - aerostar
    - bae_phoenix
    - primoco_one_150
    - elbit_hermes_180
    - tai_gozcu
    - tekever_ar5
    - elbit_hermes_90
    - rheinmetall_luna_ng
    - tusas_golge
    - av_t20
    - insitu_rq21a
  power_class_set:
    - shadow_200_rq7b
    - shadow_600
    - pioneer_rq2a
