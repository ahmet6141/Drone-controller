        dimensions_m: {value: [0.037, 0.026, 0.016], source: *u_dronetag, tag: manufacturer}
        mass_kg: {value: 0.016, source: *u_dronetag, tag: manufacturer}
        broadcast: {value: "Bluetooth 2.4 GHz, up to 3 km; internal GNSS and BT antennas, external BT via MMCX", source: *u_dronetag, tag: manufacturer}
        power: {value: "internal Li-Po 3.7 V 200 mAh (8-18 h) or 5 V micro-USB / 3.3 V EXT header", source: *u_dronetag, tag: manufacturer}
        protection: {value: "IP43, -20 to +60 degC", source: *u_dronetag, tag: manufacturer}
        price: {value: 139.0, currency: EUR, source: *u_dronetag, tag: manufacturer, note: "USD 149"}
      - id: uavionix_pingrid
        manufacturer: uAvionix
        model: pingRID
        mass_kg: {value: 0.021, source: *u_pingrid, tag: manufacturer, note: "via_search_excerpt"}
        standards: {value: "ASTM F3411-22a", source: *u_pingrid, tag: manufacturer}
      - id: veronte_rid_variant
        note: The Veronte 1x Remote ID variant (0.208 kg) integrates Remote ID in the autopilot (see autopilots).
        source: *u_veronte_cl
        tag: manufacturer
    recommended:
      item_id: veronte_autopilot_1x
      reasons:
        - Developed to DO-178C/DO-254 with a dissimilar supervisor and built-in flight-termination logic. That matches CS-LUAS.1412 / SHT-IHA Madde 18 emergency-recovery requirements (standards.yaml CRASH-005), which an open-source autopilot does not document.
        - 8-54 V redundant power inputs. It runs from the 28 V avionics rail or directly from a 48 V-class bus with no extra regulator; IP67, -40 to +65 degC.
        - Integrated pitot/static sensors, dual GNSS ports, transponder RF port, Ethernet, dual RS-485 (Volz actuators) and CAN FD in 0.2 kg.
        - Factory variants with ADS-B In or Remote ID reduce the box count. Embention partners with VISIONAIRtronics (recommended PDU).
      recommended_set:
        autopilot: {item_id: veronte_autopilot_1x, variant: ADS-B, mass_kg: 0.209}
        prototype_autopilot: {item_id: cubepilot_cube_orange_plus, note: "iron bird and early flight tests with ArduPilot"}
        air_data: {item_id: aeroprobe_heated_pitot_static, note: "28 V / 42 W heater, pneumatic to Veronte; PowerBox Pitot HASA (DroneCAN) as a second, dissimilar airspeed source"}
        gnss_antennas: {item_id: calian_hc977exf, quantity: 2}
        primary_datalink: {item_id: silvus_sc4200ep, note: "module variant 0.137 kg dual-band; 2x2 MIMO C2 + IP video; needs a 12 V rail (9-20 V input)"}
        backup_c2_link: {item_id: microhard_pddl2450, note: "or 900 MHz pDDL900; independent C2 path"}
        datalink_antennas: {item_id: southwest_antennas_1001_202, quantity: 2}
        transponder: {item_id: uavionix_ping200x, note: "TSO'd Mode S ES ADS-B Out, 50 g; ADS-B In from the Veronte ADS-B variant or pingRX Pro"}
        remote_id: {item_id: dronetag_beacon, note: "or Veronte RID variant; Turkish SHGM Remote ID rules to be confirmed"}
      mass_estimate_kg:
        value: 0.62
        source: *u_veronte_cl
        tag: estimate
        basis: "0.209 Veronte + 0.020 Aeroprobe probe + 0.048 HASA + 2 x 0.008 GNSS + 0.137 Silvus module + 0.050 Microhard enclosed-board est. + 2 x 0.023 antennas + 0.050 ping200X + 0.016 Dronetag + 0.03 transponder antenna est. = 0.62 kg; excludes harness and coax (sizing allowance)"
      risks:
        - Veronte and Silvus prices are on request and may dominate the avionics cost.
        - "Spectrum: Silvus band choice must follow Turkish BTK allocations (2.4 GHz ISM is the safe default)."
        - The ping200X and pingRX values come from search excerpts; get the current datasheets from uAvionix.

  # ===================================================================================== 5
  electrical:
    summary: >-
      Engine-driven generation (engine.yaml), a buffer battery that also starts the engine through
      the starter/generator, a redundant PDU with separate avionics, servo and payload rails, and
      monitoring over CAN.
    generator_integration:
      - id: epropelled_sg750
        reference: "engine.yaml - recommended.configuration / installation_items.sg750_starter_generator_kg"
        power_continuous_W: {value: 800.0, source: *u_ust048, tag: paper}
        power_peak_W: {value: 1000.0, source: *u_ust048, tag: paper, note: "for 180 s"}
        output: {value: "50 V AC 3-phase at 7500 rpm; needs a rectifier/regulator (ePropelled iPS-class controller)", source: *u_ust048, tag: paper}
        mass_kg: {value: 0.44, source: *u_ust048, tag: paper, note: "101 mm dia x 28.6 mm"}
        power_electronics: {value: "ePropelled iPS750 takes the 3-phase starter/generator output and provides a DC output with battery back-up (used on the Apus 15 with the SG750)", source: *u_ep_apus, tag: paper}
        power_electronics_mass_kg: {value: 0.40, source: *u_ust048, tag: estimate, basis: "engine.yaml generator_power_electronics estimate; iPS750 mass not published"}
        dc_bus_voltage_V: {value: null, note: "iPS750 output voltage not published; a 48 V-class bus is assumed (rectified 50 V AC 3-phase about 45-67 V depending on rpm)"}
      - id: limbach_alternator_28v
        reference: "engine.yaml - generator.options (fallback)"
        output_V: {value: 28.0, source: *u_lim_web, tag: manufacturer}
        output_current_A: {value: 45.0, source: *u_lim_web, tag: manufacturer}
        power_W: {value: 1260.0, source: *u_lim_web, tag: estimate, basis: "28 V x 45 A"}
        mass_kg: {value: 5.2, source: *u_lim_web, tag: manufacturer, note: "incl. voltage transformer; plus 2.3 kg 12 V starter set"}
    buffer_batteries:
      - id: lifepo4_14s2p_a123
        kind: custom pack from purchasable cells (pack built by a battery integrator)
        cell: {value: "A123 / Lithium Werks ANR26650M1-B, LiFePO4, 26 x 65 mm, 3.3 V, 2.5 Ah, 50 A continuous, 120 A 10 s pulse, -30 to +55 degC, > 1000 cycles at 100 % DoD", source: *u_a123, tag: datasheet}
        cell_mass_kg: {value: 0.076, source: *u_a123, tag: datasheet}
        configuration: 14S2P (48 V class)
        voltage_nominal_V: {value: 46.2, source: *u_a123, tag: estimate, basis: "14 x 3.3 V"}
        capacity_C: {value: 18000.0, source: *u_a123, tag: estimate, basis: "2 x 2.5 Ah = 5.0 Ah"}
        energy_J: {value: 831600.0, source: *u_a123, tag: estimate, basis: "5.0 Ah x 46.2 V = 231 Wh"}
        current_continuous_A: {value: 100.0, source: *u_a123, tag: estimate, basis: "2 x 50 A"}
        mass_kg: {value: 2.43, source: *u_a123, tag: estimate, basis: "28 cells x 0.076 = 2.13 kg + 0.30 kg BMS, case, wiring"}
        hold_up_time_s: {value: 1660.0, source: *u_a123, tag: estimate, basis: "231 Wh x 0.8 / 400 W = 27.7 min after generator loss"}
      - id: lifepo4_8s2p_a123
        kind: custom pack (28 V class; for the Limbach 28 V alternator fallback)
        voltage_nominal_V: {value: 26.4, source: *u_a123, tag: estimate, basis: "8 x 3.3 V; 28.8 V at 3.6 V/cell"}
        energy_J: {value: 475200.0, source: *u_a123, tag: estimate, basis: "5.0 Ah x 26.4 V = 132 Wh"}
        mass_kg: {value: 1.47, source: *u_a123, tag: estimate, basis: "16 x 0.076 + 0.25"}
        hold_up_time_s: {value: 950.0, source: *u_a123, tag: estimate, basis: "132 Wh x 0.8 / 400 W"}
      - id: liion_12s2p_molicel_p45b
        kind: custom pack, higher energy alternative
        cell: {value: "Molicel INR-21700-P45B, 3.6 V, 4.5 Ah (16.2 Wh), 45 A continuous, 70 g max", source: *u_p45b, tag: datasheet}
        voltage_nominal_V: {value: 43.2, source: *u_p45b, tag: estimate, basis: "12 x 3.6 V"}
        energy_J: {value: 1400400.0, source: *u_p45b, tag: estimate, basis: "9.0 Ah x 43.2 V = 389 Wh"}
        mass_kg: {value: 1.98, source: *u_p45b, tag: estimate, basis: "24 x 0.070 + 0.30"}
        note: About 2x the energy per kg of LiFePO4, but lower thermal-runaway margin; needs cell-level fusing and venting in the bay.
      - id: earthx_etx680c
        manufacturer: EarthX (USA)
        model: ETX680C LiFePO4 aircraft battery (12 V)
        voltage_nominal_V: {value: 13.2, source: *u_earthx, tag: vendor, note: "via_search_excerpt"}
        capacity_C: {value: 44640.0, source: *u_earthx, tag: vendor, note: "12.4 Ah at 1C"}
        dimensions_m: {value: [0.150, 0.086, 0.115], source: *u_earthx, tag: vendor}
        mass_kg: {value: 1.77, source: *u_earthx, tag: vendor, note: "3.9 lb; 24 V ETX900-24 is 4.04 kg (8.9 lb)"}
        assessment: Off-the-shelf with built-in BMS, but 12 V only; the 24 V version is heavy.
    power_distribution:
      - id: vat_1000w_pdu
        manufacturer: VISIONAIRtronics GmbH (Austria)
        model: 1000 W Power Distribution Unit
        battery_inputs_V: {value: [24.0, 55.0], source: *u_vat1000, tag: manufacturer, note: "two inputs with automatic lossless switch-over"}
        umbilical_input_V: {value: [28.0, 60.0], source: *u_vat1000, tag: manufacturer}
        outputs:
          - {name: "output 1 (avionics)", voltage_V: [12.0, 28.0], current_A: 5.5, power_W: 150.0, redundant: true, source: *u_vat1000, tag: manufacturer}
          - {name: "output 2 (servo)", voltage_V: [6.0, 28.0], current_A: 25.0, power_W: 500.0, redundant: true, source: *u_vat1000, tag: manufacturer}
          - {name: "output 3 (payload)", voltage_V: [12.0, 28.0], current_A: 18.0, power_W: 500.0, redundant: false, source: *u_vat1000, tag: manufacturer}
          - {name: "low power", voltage_V: 5.0, redundant: true, source: *u_vat1000, tag: manufacturer}
        redundancy: {value: "avionics, servo and 5 V outputs each from two independent supplies, each able to carry 100 % load", source: *u_vat1000, tag: manufacturer}
        monitoring: {value: "RS-232 (57600 8N1) and CAN (1 Mbit/s): voltages, currents, internal temperature", source: *u_vat1000, tag: manufacturer}
        mass_kg: {value: 1.600, source: *u_vat1000, tag: manufacturer}
        dimensions_m: {value: [0.235, 0.195, 0.0545], source: *u_vat1000, tag: manufacturer, note: "example"}
        protection: {value: "IP67, MIL-DTL-38999 connectors, thermostatic redundant fan outputs, -40 to +55 degC", source: *u_vat1000, tag: manufacturer}
        price: {value: null, note: "price on request"}
      - id: vat_1800w_pdu
        manufacturer: VISIONAIRtronics
        model: 1800 W PDU
        battery_inputs_V: {value: [24.0, 60.0], source: *u_vat1800, tag: manufacturer, note: "LiPo 10-14S, LiFe 10-14S"}
        outputs: {value: "2x avionics 12-28 V, 2x servo 6-28 V, 2x payload 12-28 V, 2x 5 V", source: *u_vat1800, tag: manufacturer}
        mass_kg: {value: 2.5, source: *u_vat1800, tag: manufacturer, note: "about"}
        dimensions_m: {value: [0.235, 0.260, 0.055], source: *u_vat1800, tag: manufacturer, note: "about"}
      - id: esensi_pmu
        manufacturer: Esensi (ODTU Teknokent, Ankara, Turkey)
        model: PMU Power Management Unit
        inputs_V: {value: [40.0, 60.0], source: *u_esensi, tag: datasheet, note: "battery and shore inputs"}
        total_power_W: {value: 1500.0, source: *u_esensi, tag: datasheet}
        outputs: {value: "4 x 7 V 100 W; 6 x 14 V 100 W; 2 x 14 V 50 W; 8 x 28 V 20 W; 8 x 28 V 50 W; 10 x 28 V 100 W; 2 x 28 V 300 W; each switchable, V/I/T monitored, soft current limits", source: *u_esensi, tag: datasheet}
        interfaces: {value: "2 x CAN, 2 x K-type thermocouple inputs, analogue inputs", source: *u_esensi, tag: datasheet}
        mass_kg: {value: 2.5, source: *u_esensi, tag: datasheet}
        dimensions_m: {value: [0.360, 0.190, 0.070], source: *u_esensi, tag: datasheet}
        operating_temperature_degC: {value: [-30.0, 55.0], source: *u_esensi, tag: datasheet}
        assessment: Domestic (Turkish) supplier with many switched channels; heavier and larger than the VAT 1000 W.
      - id: cuav_can_pmu
        manufacturer: CUAV
        model: CAN PMU (power monitor, not a distributor)
        mass_kg: {value: 0.076, source: *u_cuav_pmu, tag: manufacturer, note: "via_search_excerpt"}
        input_V: {value: [6.0, 62.0], source: *u_cuav_pmu, tag: manufacturer}
        current_measurement_A: {value: 110.0, bound: max, source: *u_cuav_pmu, tag: manufacturer}
        role: Prototype current/voltage sensing only.
    servo_power_rails:
      voltage_V: {value: 28.0, source: *u_volz_da26, tag: estimate, basis: "Volz DA 26 rated 28 V (12-32 V), DA 30 rated 28 V (24-32 V); PDU servo output 6-28 V set to 28 V"}
      peak_current_A:
        value: 13.0
        source: *u_volz_da26
        tag: estimate
        basis: "6 x DA 26 peak 1.3 A + 2 x DA 30 peak 2.6 A = 13.0 A (all at once, conservative) vs 25 A PDU servo output"
      average_power_W:
        value: 60.0
        source: *u_volz_da26
        tag: estimate
        basis: "about 25 % of rated current on average in turbulence: 0.25 x (6 x 22.4 + 2 x 36.4) = 52 W, rounded up"
      architecture: Two independent servo feeds from the redundant PDU output; left and right wing surfaces on different feeds so that one feed failure leaves symmetric partial control. RS-485 bus split the same way.
    load_budget_estimate:
      tag: estimate
      source: *u_vat1000
      basis: "sum of recommended items, continuous; sizing phase owns the final budget"
      autopilot_W: 15.0
      datalink_primary_W: 24.0
      backup_link_ecu_misc_W: 25.0
      transponder_rid_W: 2.0
      gimbal_average_W: 20.0
      servos_average_W: 60.0
      lights_W: 15.0
      pitot_heater_W: 42.0
      engine_ecu_pump_ignition_W: 70.0
      total_continuous_W: 273.0
      total_with_gimbal_peak_W: 353.0
      generator_margin_note: "SG750 800 W continuous gives about 2.3-2.9x margin; battery charging uses part of it."
    recommended:
      item_id: vat_1000w_pdu
      architecture: >-
        48 V-class primary DC bus fed by SG750 + iPS-class rectifier/regulator, buffered by a
        14S2P LiFePO4 pack (also the starting source). VISIONAIRtronics 1000 W PDU makes a
        redundant 28 V servo rail, a redundant 28 V avionics rail and a 24 V payload rail; a small
        28-to-12 V DC-DC module (estimate 0.1 kg) feeds the Silvus radio and lights. Fallback
        with the Limbach 28 V alternator: 28 V primary bus and 8S2P LiFePO4; the PDU accepts it
        (24-55 V input) but with small margin at low state of charge.
      reasons:
        - Redundant avionics and servo outputs from two independent supplies, dual battery inputs with lossless switch-over and an umbilical input - the failure tolerance a civil SORA/CS-LUAS safety case needs - in 1.6 kg, about 0.9 kg less than the 1800 W unit or the Esensi PMU.
        - Its 24-55 V input range matches both the 48 V-class SG750 bus and the 28 V alternator fallback.
        - CAN and RS-232 health telemetry; IP67, MIL-DTL-38999 connectors, -40 to +55 degC.
        - Partnership with Embention (Veronte) shortens integration.
      buffer_battery_choice: {item_id: lifepo4_14s2p_a123, reason: "LiFePO4 thermal stability for a pack carried for 10+ h next to fuel; 28 min hold-up at 400 W after generator loss; 100 A for engine starting"}
      mass_estimate_kg:
        value: 4.53
        source: *u_vat1000
        tag: estimate
        basis: "PDU 1.60 + battery 2.43 + 12 V DC-DC 0.10 + main fuses/contactor 0.40 (generator and power electronics counted in engine.yaml)"
      risks:
        - iPS750 output voltage and its compatibility with the 14S LiFePO4 float voltage (about 50 V) must be confirmed with ePropelled.
        - 1.6 kg PDU plus 2.4 kg battery is about 2.7 % of MTOW; a custom eFuse PDU could save about 1 kg but needs qualification work.

  # ===================================================================================== 6
  fuel_system:
    summary: >-
      Gasoline/oil 50:1 (engine.yaml, 740 kg/m3). Nominal 33 kg of fuel (comparables.yaml) is
      about 0.045 m3 (45 L). EFI supply with return line: inline pump to the injector rail,
      mechanical 2.5 bar regulator, excess back to the tank (UST 018 p.61).
    requirements_screening:
      fuel_volume_m3: {value: 0.0446, source: "ucav250/data/research/comparables.yaml#recommended_ranges.fuel_fraction", tag: estimate, basis: "0.22 x 150 kg = 33 kg / 740 kg/m3"}
      max_fuel_flow_kg_per_s: {value: 0.00215, source: "ucav250/data/research/engine.yaml#recommended.fuel_flow", tag: estimate, basis: "18 kW x 430 g/kWh = 7.74 kg/h (10.5 L/h)"}
      required_pump_capacity_kg_per_s:
        value: 0.00269
        source: *u_csluas_meta
        tag: standard
        basis: "CS-LUAS fuel flow >= 1.25 x take-off consumption for pump systems (standards.yaml FUEL-002): 9.7 kg/h (13.1 L/h), plus the return flow the regulator needs"
      rail_pressure_Pa: {value: 2.5e+5, source: *u_ust018_p61, tag: paper, note: "Limbach L 275 EF mechanical regulator, gauge"}
    tanks:
      - id: atl_ultralight_bladder
        manufacturer: Aero Tec Laboratories (ATL, USA)
        model: custom UAV fuel bladder (flexible)
        wall_thickness_m: {value: {ultralight: 0.00025, crashworthy: 0.00102, self_sealing: 0.00216}, source: *u_atl, tag: manufacturer, note: "0.010 in, 0.040 in, 0.085 in; via_search_excerpt"}
        temperature_range_degC: {value: [-50.0, 95.0], source: *u_atl, tag: manufacturer}
        altitude_max_m: {value: 18288.0, source: *u_atl, tag: manufacturer, note: "60,000 ft"}
        fuels: {value: "motor gasoline, diesel, avgas, JP-8/JP-10/JP-TS", source: *u_atl, tag: manufacturer}
        mass_kg:
          value: 0.6
          source: *u_atl
          tag: estimate
          basis: "45 L box 0.60 x 0.32 x 0.24 m has 0.83 m2 surface; 0.25 mm coated-fabric wall at about 1300 kg/m3 = 0.33 kg/m2 -> 0.27 kg wall + about 0.3 kg fittings/flanges"
        note: Needs a smooth, fully supporting composite cavity with no sharp edges, and tie-down tabs. Custom geometry is made to the fuselage bay shape.
        price: {value: null, note: "custom quote"}
      - id: rigid_aluminium_tank
        kind: make (welded 5052-H32 aluminium)
        mass_kg: {value: 2.8, source: *u_atl, tag: estimate, basis: "0.83 m2 x 1.0 mm x 2680 kg/m3 = 2.2 kg + baffles, bosses and welds about 0.6 kg"}
        note: Robust and easy to certify for leaks, but about 2 kg heavier and must fit through access panels.
      - id: integral_composite_tank
        kind: make (fuselage/wing structure as tank)
        mass_kg: {value: 1.4, source: *u_atl, tag: estimate, basis: "fuel-resistant liner/sealant 0.5-1.0 kg over 0.83 m2 + fittings; no separate shell"}
        note: Lightest structurally, but sealing a composite sandwich structure against gasoline over a long life is a known problem; not recommended.
    pumps_and_regulation:
      - id: limbach_efi_supply_kit
        description: Inline 12 V electric pump + mechanical 2.5 bar regulator at the rail end + filter; supplied with / specified by the engine maker.
        mass_kg: {value: 0.35, source: *u_ust018_p61, tag: estimate, basis: "engine.yaml installation_items.fuel_pump_regulator_filter_kg"}
        power_W: {value: [10.0, 20.0], source: *u_ust050, tag: paper, note: "typical UAV electric fuel pump draw"}
        life_s: {value: [2.52e+6, 5.4e+6], source: *u_ust050, tag: paper, note: "700-1500 h for a good UAV pump"}
        requirements: {value: "positive displacement preferred; must tolerate running dry and sand ingress", source: *u_ust050, tag: paper}
      - id: micro_piston_efi_pump
        description: Self-priming single-cylinder positive-displacement piston pump for small EFI engines (supplier not named in the source).
        flow_kg_per_s: {value: [3.3e-4, 5.8e-4], source: *u_ust_2s_fuel, tag: paper, note: "20-35 g/min; via_search_excerpt"}
        pressure_Pa: {value: 4.0e+5, source: *u_ust_2s_fuel, tag: paper}
