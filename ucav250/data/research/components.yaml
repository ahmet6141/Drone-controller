      item_id: trillium_hd59_llvv
      reasons:
        - 1.55 kg with a 180x EO zoom and dual-FOV LWIR covers day/night civil surveillance (border, pipeline, SAR, wildfire) at the range a 4-5 km altitude UAV needs.
        - Complete public datasheet (mass, size, power, field of regard, interfaces). ITAR-free configurations ease export to and operation in Turkey.
        - Runs on the 24 V payload rail (10-30 V with external regulation); 20 W average / 100 W peak fits the electrical budget.
        - The same family offers an MWIR upgrade (MLVV, 1.9 kg) in the same 147 x 202 mm envelope, so the bay does not change.
