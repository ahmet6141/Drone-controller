        verdict: not recommended for the baseline
        reasons:
          - No purchasable retractable system exists for 100-200 kg; the only catalogue system (Aero Telemetry) weighs about 27 kg.
          - "Custom electric retraction (SAGITTA, ILot) costs about 11.5-13 kg total, i.e. about +2 to +3.5 kg vs fixed, plus bays, doors and their structure in the fuselage."
          - Keep a retractable variant only if the MALE look/drag trade study shows a clear endurance gain; then copy the SAGITTA architecture (TOST wheels, Zimmer damper, over-centre lock, Volz DA 26 drives).
      risks:
        - TOST speed rating 36 m/s; if the sizing phase pushes VLOF/VTD above about 33 m/s, qualify the tyres on a drum (as DLR did) or move to the 4 in Tria wheel.
        - Spring bows have little damping; check bounce and shimmy (nose) in the structures/dynamics phase.

