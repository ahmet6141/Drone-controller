    recommended:
      item_id: volz_da26
      companion_item_id: volz_da30
      allocation:
        - {function: "aileron, 1 per side", item: volz_da26, quantity: 2, note: "1.5:1-2:1 horn ratio for about 4-5 Nm continuous at the surface"}
        - {function: "ruddervator / elevator + rudder", item: volz_da26, quantity: 2}
        - {function: "nose-wheel steering", item: volz_da26, quantity: 1, note: "SAGITTA (150 kg) used the DA-26 class for steering, retraction and brakes"}
        - {function: "wheel-brake master-cylinder actuator", item: volz_da26, quantity: 1, note: "SAGITTA: 5 Nm on a 20 mm lever = 250 N vs 132 N required"}
        - {function: "flap, 1 per side", item: volz_da30, quantity: 2, note: "screening hinge moment 9-12 Nm vs 8 Nm rated / 16 Nm peak"}
      mass_installed_kg:
        value: 3.28
        source: *u_volz_da26
        tag: estimate
        basis: "6 x 0.270 (DA 26) + 2 x 0.630 (DA 30) = 2.88 kg datasheet + 0.40 kg horns, pushrods, frames (estimate)"
      reasons:
        - Industrial UAV-grade actuator - brushless, contactless sensor, IP67, MIL-STD-810 tested, > 3 million cycles - with a published, complete datasheet and installation drawing.
        - Runs directly on the 28 V servo rail (12-32 V), so no 8.4 V conversion is needed.
        - RS-485 versions report position, current, voltage and temperatures; the redundant-interface option takes two power feeds. Health monitoring supports a civil safety case (SORA / CS-LUAS).
        - In service on aircraft of this mass class - Schiebel Camcopter S-100 (datasheet) and the 150 kg DLR SAGITTA demonstrator (brakes, steering, retraction).
        - The same family offers a duplex DA 26-D (5 Nm rated, 12 Nm peak) and DA 30-D. A later move to fault-tolerant primary controls needs no supplier change.
        - "Commonality: one actuator type for 6 of 8 functions; the DA 30 adds flap torque."
      risks:
        - Price and lead time are not public. Ask for a quote early.
        - The DA 26 rated torque (2.7 Nm) is below the screening aileron hinge moment at VA (3.45 Nm). A horn ratio of at least 1.5 is required; recheck when the hinge moments are known.
        - "Flutter: with one actuator per surface, a disconnected actuator leaves a free-floating surface (standards.yaml FLU-003, CS-LUAS.629(f)). Mass balance or dual actuators must be decided in the structures phase."

  # ===================================================================================== 2
  landing_gear:
    summary: >-
      No catalogue landing-gear set exists for a 100-200 kg fixed-wing UAV; both DLR (SAGITTA,
      150 kg) and the Warsaw Institute of Aviation (<= 100 kg) had to design their own. The
      purchasable parts are the wheels, tyres, brakes, master cylinders and dampers (sailplane,
      ultralight and LSA suppliers), plus actuators. Legs and attachment fittings are made in house.
    design_loads_screening:
      tag: estimate
      source: *u_csluas_meta
      basis: >-
        MTOW 150 kg, 85 % on mains (SAGITTA static split 85/15), sink 2.40 m/s (CS-LUAS),
        lift = 2/3 W during impact. Energy into main gear E = 0.5 m_main v^2 + (1 - 2/3) m_main g d.
        A linear spring gear needs d = 0.12-0.15 m deflection for a main-gear load factor of about 4.6-5.6.
        An oleo (efficiency 0.8) needs about 0.07 m stroke (SAGITTA used 70 mm).
      static_load_per_main_tyre_N: 625.0
      static_load_nose_tyre_N: 221.0
      main_impact_energy_J: {value: 417.0, source: *u_csluas_meta, tag: estimate, basis: "0.5 x 127.5 kg x 2.40^2 + (1/3) x 127.5 kg x 9.81 x 0.12 m"}
      main_peak_force_spring_gear_N: {value: 6950.0, source: *u_csluas_meta, tag: estimate, basis: "linear spring, F = 2 E / d with d = 0.12 m (both legs together)"}
      braking_force_total_N: {value: 388.0, source: *u_sagitta, tag: paper, note: "SAGITTA value at 150 kg (mu 0.8, safety 1.5); 18 Nm per wheel at r = 0.095 m"}
      landing_kinetic_energy_J: {value: 67500.0, source: *u_sagitta, tag: estimate, basis: "0.5 x 150 kg x (30 m/s)^2; SAGITTA sized its brake disc for 150 kJ at 49 m/s"}
      gfrp_spring_bow_mass_kg:
        value: [0.8, 2.5]
        source: *u_csluas_meta
        tag: estimate
        basis: >-
          Ideal strain-energy mass for a width-tapered E-glass UD bow (600 MPa, 40 GPa, 1/3
          volume efficiency, FoS 1.5) is 0.8 kg; constant section 3.5 kg. Practical 1.5-2.5 kg
          incl. axle fittings.
    items:
      # ---- reference systems (complete gear designs in this mass class) ----
      - id: sagitta_retractable_gear
        kind: reference_design (not for sale)
        description: >-
          DLR / Airbus SAGITTA demonstrator, MTOW 150 kg, landing mass 125 kg. Electric retractable
          tricycle. Telescopic spring/oil damper legs (Zimmer Group industrial damper + coil spring),
          anodised aluminium with steel sliding parts. Over-centre side-strut locks. EMA retraction.
          Steerable nose wheel via EMA and toothed belt.
        mtow_kg: {value: 150.0, source: *u_sagitta, tag: paper}
        main_leg_mass_kg: {value: 4.0, source: *u_sagitta, tag: paper, note: "each, flight version"}
        nose_leg_mass_kg: {value: 3.5, source: *u_sagitta, tag: paper}
        total_gear_mass_kg: {value: 11.5, source: *u_sagitta, tag: estimate, basis: "2 x 4.0 + 3.5"}
        static_split: {value: "about 85 % main / 15 % nose; static CG 143 mm ahead of MLG", source: *u_sagitta, tag: paper}
        design_sink_speed_m_s: {value: 2.5, source: *u_sagitta, tag: paper}
        max_horizontal_speed_m_s: {value: 49.0, source: *u_sagitta, tag: paper}
        max_drop_force_N: {value: 5000.0, source: *u_sagitta, tag: paper, note: "design limit; measured 4500 N max at 2.5 m/s and 0-49 m/s"}
        shock_stroke_m: {value: 0.070, source: *u_sagitta, tag: paper, note: "calculated 67.5 mm + 2.5 mm margin"}
        spring_rate_N_per_m: {value: {main: 12400.0, nose: 3300.0}, source: *u_sagitta, tag: paper}
        nose_steering_range_deg: {value: {right: 23.0, left: 90.0}, source: *u_sagitta, tag: paper, note: "90 deg left is used for retraction stowage"}
        tyre: {value: "200 mm OD on 88.9 mm (3.5 in) rim; TOST Aero Max II 3.5 in or Aero Mini 150 sailplane wheels; static 2.5 kN, peak 4 kN; manufacturer speed rating 36 m/s, qualified to 49 m/s on DLR drum", source: *u_sagitta, tag: paper}
        brakes: {value: "steel disc 120 mm OD x 4 mm, floating caliper, hydraulic, one master cylinder for both mains pushed by a Volz DA-26 class EMA (PWM 1000-2000 us = brake torque)", source: *u_sagitta, tag: paper}
        brake_disc_diameter_m: {value: 0.120, source: *u_sagitta, tag: paper}
        brake_force_required_N: {value: 132.0, source: *u_sagitta, tag: paper, note: "at actuator; DA-26 gives 250 N on a 20 mm lever"}
        lessons: >-
          The first aluminium flight legs bent aft under spin-up and gave 11.6 kN peaks vs 5.8 kN
