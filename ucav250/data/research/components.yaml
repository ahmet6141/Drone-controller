        mass_kg: {value: null, note: "not published"}
        heritage: {value: "used on the V-BAT UAS", source: *u_reventec, tag: manufacturer}
    recommended:
      item_id: atl_ultralight_bladder
      system: >-
        One ATL ultralight (0.25 mm) bladder of about 45 L in a composite fuselage bay near the
        CG; small rigid header/collector tank (about 0.3 L, flop pickup) feeding the Limbach EFI
        pump kit with return line to the header; Andair GAS10-70 or GAS375 gascolator before the
        pump; Gill capacitive level probe in the main bladder plus a low-level switch in the header;
        roll-over valve + check valve on the vent; obp AN6 dry-break coupling for refuel/defuel.
      reasons:
        - About 2 kg lighter than a welded aluminium tank of the same volume, and it conforms to the fuselage bay; ATL bladders are a standard UAV solution with documented fuel compatibility, -50 to +95 degC and 18 km altitude rating.
        - A flexible bladder does not crack from engine vibration and has better crash survivability; the crashworthy 1.02 mm material is an upgrade path if the safety case needs it.
        - The header tank keeps the pickup submerged in manoeuvres and gives the CS-LUAS unusable-fuel/feed checks a small, testable volume.
      mass_estimate_kg:
        value: 1.73
        source: *u_atl
        tag: estimate
        basis: "bladder 0.60 + header tank 0.15 + gascolator 0.15 + dry-break 0.067 + vent valves 0.10 + level sensor 0.06 + lines/fittings 0.30 + low-level switch 0.03 + tank straps 0.27 = 1.73 kg (EFI pump/regulator 0.35 kg counted in engine.yaml)"
      risks:
        - Bladder price and lead time (custom tooling) unknown; ask ATL early.
        - The fuel CG travel and slosh must be checked in the packaging phase; baffles are not possible in a bladder, so use foam or a segmented bladder if needed.

