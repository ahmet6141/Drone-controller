      independent of failed systems (CRASH-005, SHT-IHA Madde 18), and navigation/anti-collision
      lights. With a pusher propeller, the termination sequence must stop the engine before the
      parachute deploys, and the canopy must leave the fuselage forward of the propeller disc.
