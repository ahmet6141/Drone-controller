    recommended:
      item_id: tost_sb_max2_70_50_20
      configuration: >-
        Fixed tricycle. Main gear: one GFRP spring bow (custom_gfrp_main_bow) with two TOST 3.5 in
        SB Max II 70-50-20 disc-brake wheels, BZT M calipers and 200x50 6 PR tyres; one master
        cylinder pushed by a Volz DA 26 (SAGITTA brake concept). Nose gear: steerable leg with
        industrial damper + coil spring, TOST LR Max II wheel, Volz DA 26 steering.
      mass_estimate_kg:
        value: 9.1
        source: *u_tost
        tag: estimate
        basis: "main: GFRP bow 2.0 + 2 x 1.79 (wheel 0.86 + BZT M 0.40 + tyre 0.45 + tube 0.08) + axles/brackets 0.40 + master cylinder and lines 0.20 = 6.18; nose: leg 2.0 + LR Max II 0.365 + tyre 0.45 + tube 0.08 = 2.90; total 9.08 kg. Brake and steering EMAs (2 x 0.27 kg) are counted under control_surface_actuators."
      reasons:
        - The only wheel/tyre/brake set with a documented flight history on a 150 kg UAV (DLR SAGITTA), and with complete catalogue masses.
        - Tyre static capacity is about 3x the static main-wheel load; brake torque (100 Nm) is about 5x the need. The parts are sailplane-certified (EASA Form 1 available from TOST).
        - About 1.8 kg per braked wheel. The Matco W40B is 1.84 kg without tyre; the Matco W51LXT is 4.2 kg.
        - A fixed bow with this wheel set (about 9.1 kg total, or 9.6 kg with its two EMAs) is about 2 kg lighter than SAGITTA's retractable gear (11.5 kg incl. EMAs) and has no retraction failure mode or gear bays. Comparables show no retractable gear in this class.
