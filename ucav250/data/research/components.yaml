# -----------------------------------------------------------------------------------------------------
# CATEGORIES
# Common item shape: {value, source, tag, [note], [basis]}
# -----------------------------------------------------------------------------------------------------
categories:

  # ===================================================================================== 1
  control_surface_actuators:
    summary: >-
      UAV-grade electromechanical rotary actuators. Industrial units (Volz DA series, Hitec/MPX SG-BL
      CAN series) run on a 24-28 V rail, have brushless motors, contactless position sensors,
      sealed metal cases and serial feedback. Hobby-derived HV servos (MKS, Hitec D-series) are
      light and cheap but run on 6-8.4 V and are rated only to about -10..+60 degC.
    hinge_moment_screening:
      tag: estimate
      source: "ucav250/data/research/comparables.yaml#recommended_ranges"
      basis: >-
        H = Ch q S_cs c_cs. Wing 3.0 m2, span 6.0 m, taper 0.5 (root 0.667 m, tip 0.333 m).
        Aileron 40 % semispan outboard, cf/c 0.25 (c 0.104 m, S 0.125 m2 per side). Flap 42 %
        semispan inboard, cf/c 0.28 (c 0.160 m, S 0.201 m2 per side). Ruddervator 0.9 m x 0.105 m
        (S 0.0945 m2 per side). |Ch| 0.30 at full deflection (plain unbalanced surface,
        Ch_delta about -0.6/rad, plus Ch_alpha term), 0.12 at 1/3 deflection, 0.50-0.55 for flaps
        at 30-40 deg. VA 38 m/s, VD 55 m/s, flap speed 30-33 m/s (assumed, sizing phase decides).
        Sea-level density 1.225 kg/m3. Accuracy about +/-50 %; replace with VLM/NeuralFoil
        hinge-moment data in sizing.
      aileron_full_deflection_at_VA_Nm: 3.45
      aileron_one_third_deflection_at_VD_Nm: 2.9
      ruddervator_full_deflection_at_VA_Nm: 2.63
      flap_35deg_at_30_m_s_Nm: 8.85
      flap_35deg_at_33_m_s_Nm: 11.8
      conclusion: >-
        Ailerons and tail surfaces need about 3-4 Nm at the surface, flaps about 9-12 Nm. With the
        CS-LUAS.395 system-load factor of 1.25 (standards.yaml CTL-001) and a 1.5 margin on the
        screening value, primary surfaces want at least about 5 Nm available and flaps at least
        about 15 Nm (peak). DA 26 (2.7 Nm rated, 5.0 Nm peak) suits primary surfaces with a 1.5:1
        to 2:1 horn ratio; DA 30 (8 Nm rated, 16 Nm peak) suits flaps directly.
    items:
