    flight_termination:
      - id: veronte_integrated_fts
        description: Veronte 1x dissimilar supervisor with FTS function; commands engine kill and parachute deployment on geofence breach, C2 loss (after the SHT-IHA recovery-area logic) or autopilot failure.
        source: *u_veronte_ust
        tag: manufacturer
        note: via_search_excerpt
      - id: independent_fts_channel
        kind: architecture (make from purchased parts)
        description: >-
          Independent FTS receiver on its own power (backup cell) driving two solid-state switches:
          (1) ECU/ignition and fuel-pump power cut, (2) parachute igniter. No wiring to the
          autopilot except a status line, as in the Rotorama FTS concept (own MCU, own receiver,
          only the power path shared). Arming via a guarded command; inadvertent-activation
          protection as CS-LUAS.1412 requires.
        reference_product: {value: "Rotorama FTS: own MCU and receiver input, 50 A continuous / 200 A peak switch, 36 x 36 mm, EUR 20.59 (multirotor battery cut-off)", source: *u_rotorama, tag: manufacturer}
        mass_kg: {value: 0.15, source: *u_rotorama, tag: estimate, basis: "receiver 0.02 + controller/switch board 0.03 + backup cell 0.05 + wiring 0.05"}
    lights:
      - id: aveoflash_lp_lsa
        manufacturer: Aveo Engineering (Czech Republic)
        model: AveoFlashLP LSA (3-in-1 position/nav/strobe)
        dimensions_m: {value: [0.100, 0.045, 0.030], source: *u_aveo, tag: datasheet}
        mass_kg: {value: 0.083, source: *u_aveo, tag: datasheet}
        supply_voltage_range_V: {value: [9.0, 32.0], source: *u_aveo, tag: datasheet}
        power_position_W: {value: 3.3, source: *u_aveo, tag: datasheet}
        power_strobe_W: {value: 5.3, source: *u_aveo, tag: datasheet, note: "26.5 W peak; 50 flashes/min; synchronised between units"}
        mounting: {value: "M5 stainless screws, wingtip; adapters and composite fairings available", source: *u_aveo, tag: datasheet}
        price: {value: null, note: "not checked"}
      - id: firehouse_arc_v
        manufacturer: Firehouse Technology (USA)
        model: ARC V drone anti-collision strobe
        mass_kg: {value: 0.013, source: *u_arcv, tag: vendor, note: "via_search_excerpt"}
        output: {value: "1100 lm, visible 4 statute miles (6.4 km)", source: *u_arcv, tag: vendor}
        note: Battery-powered add-on; a backup or ground-crew visibility aid, not a 28 V installed light.
    recommended:
      item_id: galaxy_grs_4_240
      reasons:
        - Rated 240 kg / 240 km/h (66.7 m/s); 150 kg gives a 1.6 mass margin and covers the expected VD of about 55 m/s.
        - The only candidate with a complete public data table - opening shock (13.1 kN), canopy timing, minimum rescue height, descent rate, container shapes - and a manned-aviation test basis (ASTM F2316-12 canopy, DULV).
        - Rocket extraction pulls the canopy clear of a tumbling airframe and of the pusher propeller disc, and works from 70 m at low speed.
        - "Mass 5.9 kg (3.9 % of MTOW) and about 0.008 m3: similar to the UAVOS 200 (4.5 kg, 0.025 m3 compartment) but with better-documented performance."
      recommended_set:
        parachute: {item_id: galaxy_grs_4_240}
        flight_termination: {item_ids: [veronte_integrated_fts, independent_fts_channel]}
        lights: {item_id: aveoflash_lp_lsa, quantity: 3, note: "two wingtip units (red/green + strobe) and one tail/top unit (white + strobe)"}
      mass_estimate_kg:
        value: 6.30
        source: *u_grs4240
        tag: estimate
        basis: "GRS 4/240 5.90 + 3 x AveoFlash 0.083 + independent FTS 0.15 = 6.30 kg"
      risks:
        - Opening shock about 8.9 g at 150 kg means a dedicated hard point and bridle routing in the fuselage structure (ultimate case, CRASH-004).
        - The rocket is a pyrotechnic; storage, transport (dangerous goods) and 6-year exchange add operating cost. UAVOS 200 (ballistic) has similar handling; the non-pyrotechnic Fruity Chutes option is not rated for this mass.
        - Descent 5.5-6.9 m/s will damage the airframe on landing; the parachute is an emergency (ultimate-load) system, not a recovery method for routine use.

