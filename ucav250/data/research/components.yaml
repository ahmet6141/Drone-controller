# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - PURCHASABLE SUBSYSTEMS (COMPONENTS)
# Civil surveillance / research UAV, about 100-150 kg MTOW, one ~250 cc piston engine (engine.yaml).
# Payload: EO/IR sensors and mission equipment only. No weapons, hardpoints, pylons or release
# mechanisms are considered anywhere in this file.
#
# Conventions
#   - SI units, named in the key suffix: _m, _m2, _m3, _kg, _N, _Nm, _Pa, _W, _V, _A, _J, _C, _Hz,
#     _bit_per_s, _kg_per_s, _degC, _deg (angles, per ARCHITECTURE.md), _deg_per_s (angular speed).
#     Non-SI catalogue units (lb, in, oz, Ah, Wh, kgf.cm, km/h, psi) are kept only inside "note" text.
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "paper" also covers trade-journal articles (UST, Inside Unmanned Systems, Shephard).
#     Values tagged "estimate" carry a "basis".
#   - "read_from_drawing": the value was read from a datasheet drawing, not from a table.
#   - "via_search_excerpt": the page refused automated fetching (HTTP 403/404); the value was read from
#     the search-engine excerpt of that page. Treat with lower confidence and confirm before freeze.
#   - null = not published / not found. Each item has a "missing" list where relevant.
#   - Prices: only where public. Currency is named; most aerospace items are "price on request".
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: components
  phase: research
  date: "2026-10-05"
  scope: >-
    Purchasable subsystems for a 100-150 kg civil EO/IR surveillance UAV: control-surface
    actuators, landing gear, EO/IR gimbals (1-5 kg), avionics (autopilot, air data, GNSS, datalink,
    ADS-B/transponder, Remote ID), electrical system, fuel system, recovery and safety (parachute,
    flight termination, lights). One recommended item per category, with reasons.
  design_point_assumed:
    note: >-
      Used only for the screening checks in this file. Taken from comparables.yaml
      (recommended_ranges) and engine.yaml (recommended engine). The sizing phase must redo the
      checks with its own numbers.
    mtow_kg: {value: 150.0, source: "ucav250/data/research/comparables.yaml#recommended_ranges.mtow_kg", tag: estimate, basis: "nominal of 125-180 kg range"}
    wing_area_m2: {value: 3.0, source: "ucav250/data/research/comparables.yaml#recommended_ranges.wing_area_m2", tag: estimate, basis: "W/S 50 kg/m2"}
    span_m: {value: 6.0, source: "ucav250/data/research/comparables.yaml#recommended_ranges.span_m", tag: estimate, basis: "AR 12"}
    cruise_speed_m_s: {value: 30.0, source: "ucav250/data/research/comparables.yaml#recommended_ranges.cruise_speed_m_s", tag: estimate, basis: "best-endurance speed band 28-30 m/s"}
    engine: {value: "Limbach L 275 EF + ePropelled SG750 starter/generator", source: "ucav250/data/research/engine.yaml#recommended", tag: estimate, basis: "engine research recommendation"}
    landing_sink_speed_m_s:
      value: 2.40
      source: "http://jarus-rpas.org/wp-content/uploads/2023/06/jar_07_doc_CS_LUAS.pdf"
      tag: standard
      basis: "CS-LUAS App. H H.2(b): V = 0.51 (M g / S)^0.25 = 2.40 m/s at 50 kg/m2 (standards.yaml LDG-001)"

