# RECOMMENDED SET - MASS SUMMARY (purchased subsystems only; harness, structure and engine excluded)
# -----------------------------------------------------------------------------------------------------
recommended_mass_summary:
  tag: estimate
  source: "this file, categories.*.recommended"
  note: Sums the recommended items' masses as estimated above. The sizing phase owns the mass budget.
  control_surface_actuators_kg: 3.28
  landing_gear_fixed_tricycle_kg: 9.1
  eo_ir_gimbal_kg: {value: 1.75, source: *u_tr_hd59, tag: estimate, basis: "HD59-LLVV 1.55 (datasheet) + isolator/mount 0.20 (estimate); bay allowance 4.0 kg"}
  avionics_kg: 0.62
  electrical_kg: 4.53
  fuel_system_kg: 1.73
  recovery_and_safety_kg: 6.30
  total_kg: 27.31
  total_fraction_of_mtow: {value: 0.182, source: "ucav250/data/research/comparables.yaml#recommended_ranges.mtow_kg", tag: estimate, basis: "27.31 kg / 150 kg nominal MTOW"}

open_items:
  - Quotes and lead times for Volz DA 26/DA 30, Veronte 1x, Silvus, Trillium HD59, Galaxy GRS 4/240, TOST wheels and ATL bladder (none publish prices).
  - Trillium gimbal mounting ICD/STEP and isolator recommendation.
  - ePropelled iPS750 output voltage, mass and starter-mode current; compatibility with a 14S LiFePO4 float voltage.
  - Current uAvionix ping200X / pingRX Pro datasheets (site blocked automated access).
  - Turkish rules for Remote ID, transponder carriage and datalink frequencies (SHGM, BTK).
  - Hinge-moment coefficients from the aero phase to confirm DA 26 horn ratios and DA 30 flap sizing.
  - Galaxy GRS 4/240 container choice (B1-B12) against the fuselage packaging and the pusher-propeller exclusion zone.

uncertainties:
  - Several manufacturer pages (uAvionix, Embention, Aeroprobe, Fruity Chutes bundle list, CACI) refused automated access; their numbers were taken from search-engine excerpts and are flagged "via_search_excerpt".
  - Volz mounting-hole patterns were read from datasheet drawings (+/-0.1 mm as labelled); confirm against the Volz STEP files.
  - The HD59 power figure (20 W average) is published for the family; the LLVV may draw less.
  - Hinge moments, landing-gear loads, bow mass, battery and bladder masses are screening estimates (+/-30-50 %); they size the selection only, not the parts.
  - The TOST 200x50 tyre static capacity is 200 kg in the 2026 catalogue but 2.5 kN (255 kg) in the SAGITTA paper and a US dealer listing; the lower value is used.
