# -----------------------------------------------------------------------------------------------------
# CANDIDATES
# Common item shape: {value, unit, source, tag, [rpm], [note], [basis]}
# null = not published / not found; the "missing" list says what to request from the manufacturer.
# -----------------------------------------------------------------------------------------------------
candidates:

  # ---------------------------------------------------------------------------------- 1
  - id: limbach_l275_ef
    manufacturer: Limbach Flugmotoren GmbH (Koenigswinter, Germany)
    model: L 275 EF
    status: in production, listed on manufacturer web page 2026
    variant_notes: >-
      "E" = one spark plug per cylinder. "F" = port fuel injection with full engine management (2015).
      The design is the 1972 L 275, with more than 2000 carburettor engines sold by 2015 (UST 018 p.58).
    displacement_m3: {value: 274.0e-6, source: *u_lim_web, tag: manufacturer}
    bore_m: {value: 0.066, source: *u_lim_ds_275ef, tag: datasheet}
    stroke_m: {value: 0.040, source: *u_lim_ds_275ef, tag: datasheet}
    compression_ratio: {value: 8.0, source: *u_ust018_p60, tag: paper, note: "8.0:1 geometric; effective < 8:1 (UST 018 p.65)"}
    cycle: 2-stroke, loop scavenged, piston-port intake (no reed/rotary valve)
    cylinders: 2
    layout: horizontally opposed (boxer), 180 deg crankpins; one-piece forged 16MnCr5 crankshaft, 3 ball main bearings (twin front)
    cooling: air-cooled, finned cylinders plus finned heat sinks on cylinder ends (needs ram/ducted air)
    ignition: electronic, ECU-controlled timing (37 deg BTDC high rpm ... 25 deg BTDC low rpm), coils mounted on airframe, 14 mm plugs
    max_power_W: {value: 18000.0, rpm: 7500, source: *u_lim_web, tag: manufacturer}
    max_power_hp: {value: 24.0, rpm: 7500, source: *u_ust018_p66, tag: paper, note: "at least 24 bhp at 7500 rpm with standard exhaust"}
    takeoff_power_W:
      value: 17150.0
      rpm: 6950
      source: *u_ust018_p66
      tag: paper
      note: "Normal take-off just under 7000 rpm for about 23 bhp (17.15 kW). Engine typically kept below 7000 rpm."
    max_continuous_power_W:
      value: 16200.0
      rpm: 6000
      source: *u_lim_ds_275ef
      tag: estimate
      basis: >-
        Not published. Limbach states regular flight is between 4000 and 6000 rpm (UST 018 p.66).
        The datasheet WOT curve gives 21.8 hp = 16.2 kW at 6000 rpm, so that point is taken as
        the design maximum continuous power.
    max_torque_Nm: {value: 25.0, rpm_range: [4000, 6000], source: *u_lim_ds_275ef, tag: datasheet}
    rpm_limits:
      operating_range_rpm: {value: [4000, 7500], source: *u_ust018_p66, tag: paper}
      hard_cut_rpm: {value: 8000, source: *u_ust018_p61, tag: paper}
    wot_curve_read_from_datasheet:
      source: *u_lim_ds_275ef
      tag: datasheet
      note: >-
        Read from the datasheet WOT chart. Uncertainty is about +/-0.3 hp, +/-0.3 Nm and
        +/-4 g/HPh. Power from torque cross-checks within 1.5 %. SFC was converted with
        mechanical hp.
      rpm:            [4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500]
      power_hp:       [14.4, 16.2, 18.4, 20.0, 21.8, 22.8, 24.0, 25.3]
      power_W:        [10740, 12080, 13720, 14910, 16260, 17000, 17900, 18870]
      torque_Nm:      [25.3, 25.4, 25.9, 25.6, 25.7, 24.7, 24.0, 23.7]
      sfc_g_per_HPh:  [348, 355, 359, 372, 357, 344, 323, 309]
      sfc_kg_per_J:   [1.297e-7, 1.322e-7, 1.336e-7, 1.386e-7, 1.331e-7, 1.281e-7, 1.203e-7, 1.150e-7]
      sfc_g_per_kWh:  [467, 476, 481, 499, 479, 461, 433, 414]
    bsfc_typical_g_per_kWh:
      value: 456
      source: *u_ust018_p66
      tag: paper
      note: '"Specific fuel consumption is in the region of 340 g/hph" (= 456 g/kWh mech hp, 462 g/kWh PS).'
    dry_mass_kg:
      value: 7.0
      source: *u_lim_web
      tag: manufacturer
      note: >-
        Excludes the ECU and wiring, fuel pump and supply line, starter and generator
        (UST 018 p.66). The datasheet's "approx. 15 kg" conflicts; see sources.lim_ds_275ef.
    installation_items:
      starter_set_12V_400W_kg: {value: 2.3, source: *u_lim_web, tag: manufacturer, note: "datasheet lists starter 12/24 V 0.2 kW (conflict)"}
      alternator_14V_95A_kg: {value: 5.2, source: *u_lim_web, tag: manufacturer}
      alternator_28V_45A_incl_voltage_transformer_kg: {value: 5.2, source: *u_lim_web, tag: manufacturer}
      legacy_28V_automotive_generator_kg: {value: 4.5, source: *u_ust018_p66, tag: paper}
      sg750_starter_generator_kg:
        value: 0.44
        source: *u_ust048
        tag: paper
        note: "ePropelled SG750 with all ancillaries, 101 mm dia x 28.6 mm; announced in 2023 for the L 275 EF ('will integrate')."
      heat_sinks_kg: {value: 0.0, source: *u_ust018_p60, tag: paper, note: "Finned heat sinks are standard on the EF and counted in the 7 kg (on the L 275 E they are a +0.6 kg option)."}
      ecu_wiring_coils_kg: {value: 0.8, tag: estimate, source: *u_ust018_p61, basis: "Not published. Small motorsport-class ECU (Trijekt) 0.3-0.5 kg, harness 0.2-0.3 kg, 2 coils 0.1-0.2 kg."}
      fuel_pump_regulator_filter_kg: {value: 0.35, tag: estimate, source: *u_ust018_p61, basis: "Not published. Inline 12 V pump plus mechanical 2.5 bar regulator plus filter and fittings."}
      exhaust_kg: {value: 1.0, tag: estimate, source: *u_hirth_4201, basis: "Limbach standard is 2 x 200 mm open stacks (mass not published, about 0.5 kg). Allowing for silencers needed for a civil UAV, scaled from the Hirth 4201 twin exhaust at 1.15 kg."}
    dimensions_m:
      length_prop_hub_to_generator_coupling_flange: {value: 0.2214, source: *u_ust018_p61, tag: paper}
      width_incl_spark_plug_caps: {value: 0.3968, source: *u_ust018_p61, tag: paper}
      height_to_top_of_intake_covers: {value: 0.2946, source: *u_ust018_p61, tag: paper}
      note: Envelope L x W x H = 0.221 x 0.397 x 0.295 m without starter-generator. See the installation block for datum distances.
    mounting:
      type: 4 threaded bosses on rear face of crankcase; engine cantilevered from a mounting plate tied into the airframe
      bolt_size: {value: M8, source: *u_ust018_p61, tag: paper, note: '"tied via 8 mm bolts to a mounting plate"; L 275 E datasheet detail reads "M8 ... deep - 4 places"'}
      bolt_pattern: see installation.mount.bolt_pattern_estimate (datasheet labels illegible)
      isolators: {value: optional "Damper Shock Mount", source: *u_lim_ds_275ef, tag: datasheet, note: "New mounts and vibration dampers announced 2023 (UST 048)."}
    propeller_interface:
      description: >-
        Propeller hub on a brass spool, press fit with a keyway, retained by a bolt at the crank
        nose. The flange for the timing wheel is on the same spool. A starter ring gear is added
        to the hub when the starter is fitted.
      source: *u_ust018_p60
      tag: paper
      bolt_pattern: null
      missing: Hub drawing with flange OD, bolt circle, bolt size and spigot diameter (illegible in the published raster).
    propeller_recommendation: see recommended.propeller (Limbach publishes no propeller recommendation)
    fuel: {value: "92 RON (or better) gasoline + fully synthetic 2-stroke oil 50:1", source: *u_lim_web, tag: manufacturer}
    oil_mix_ratio: {value: 50, source: *u_lim_web, tag: manufacturer}
    generator:
      options:
        - {name: Limbach alternator 14 V 95 A, power_W: 1330, voltage_V: 14, mass_kg: 5.2, source: *u_lim_web, tag: manufacturer, note: "power = 14 V x 95 A (nominal product)"}
        - {name: Limbach alternator 28 V 45 A incl. voltage transformer, power_W: 1260, voltage_V: 28, mass_kg: 5.2, source: *u_lim_web, tag: manufacturer}
        - {name: datasheet listing, power_W: 1000, voltage_V: 28, mass_kg: null, source: *u_lim_ds_275ef, tag: datasheet}
        - {name: ePropelled SG750 starter/generator, power_W: 800, peak_power_W: 1000, peak_duration_s: 180, voltage: "50 V AC 3-phase at 7500 rpm (needs rectifier/regulator)", mass_kg: 0.44, source: *u_ust048, tag: paper}
    starter_options:
      - {name: Starter set 12 V 0.4 kW, mass_kg: 2.3, mounting: "plate at base of crankcase, drives ring gear on prop hub", source: *u_lim_web, tag: manufacturer}
      - {name: ePropelled SG750 starter/generator on crank rear, mass_kg: 0.44, source: *u_ust048, tag: paper}
      - {name: hand start by spinning propeller (ground crew), source: *u_ust018_p61, tag: paper}
    ecu:
      supply_V: {value: 12, source: *u_ust048, tag: paper, note: "A new ECU with CAN, throttle-servo control and a 24 V option (internal DC-DC) was announced in 2023."}
      altitude_compensation: linear offsets on ambient pressure and air temperature (sensors in ECU / engine bay)
      telemetry: EGT and CHT readable by the flight control system (not used by the ECU)
      source: *u_ust018_p61
      tag: paper
    tbo_s:
      value: null
      source: *u_lim_tb913
      tag: manufacturer
      note: Not published (TB 9.13 covers four-strokes only). See recommended.tbo_planning_s for a planning value.
    altitude_capability: ECU altitude compensation, no published ceiling or power lapse. See installation.altitude.
    price: {value: null, note: "price on request; not public"}
    documentation_quality: >-
      Good. Public datasheet with 3-view and WOT power/torque/SFC curves, an in-depth engineering
      dossier (UST 018) giving key installation dimensions, and an EASA-approved manufacturer
      organisation for its certified four-strokes.
    missing:
      - TBO and maintenance intervals
      - CHT/EGT limits
      - Mount bolt-pattern and prop-hub drawings (vector/STEP)
      - Confirmation of SG750 availability, and an alternator/regulator output curve versus rpm
      - CW/CCW rotation availability for a pusher

