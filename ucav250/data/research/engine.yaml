# -----------------------------------------------------------------------------------------------------
# RECOMMENDED ENGINE for a 100-150 kg surveillance UAV
# -----------------------------------------------------------------------------------------------------
recommended:
  engine_id: limbach_l275_ef
  configuration: >-
    Limbach L 275 EF (EFI), direct drive, ePropelled SG750 starter/generator on the crank rear
    (or the Limbach 28 V 45 A alternator if the SG750 is not released), Limbach ECU, standard
    stacks plus silencers, and an isolated M8 four-point rear mount.
  justification:
    power: >-
      18 kW maximum, about 17 kW for take-off and about 16 kW continuous at 6000 rpm. This is
      the most power among the dedicated, documented UAV boxer twins in the 275 cc class
      (Sky Power SP-275: 15.8-16 kW). At 150 kg MTOW the power loading is 8.3 kg/kW. Sky Power
      places a 16 kW 275 cc twin at 100-150 kg MTOW, and the estimated static thrust with a
      0.81 m prop is about 400-480 N (T/W about 0.3 at 150 kg).
    mass: >-
      7.0 kg bare. With a starter/generator it is the lightest EFI option. The 3W-275 is equal on
      mass but carburetted with no generator. The SP-275 FI is 9.25 kg without subcomponents.
    generator: >-
      SG750 gives 800 W (1 kW for 3 min) for 0.44 kg and also acts as the starter. The heavier
      proven fallback is the 28 V 45 A alternator (about 1.26 kW, 5.2 kg) plus the 12 V 0.4 kW
      starter (2.3 kg).
    efficiency: >-
      EFI WOT SFC is 414-499 g/kWh (datasheet curve), about 456 g/kWh typical (UST). That is
      15-40 % better than the carburettor L 275 E at part rpm. The ECU compensates for altitude
      and temperature.
    availability: >-
      Current catalogue item (limflug.de, 2026). The type has been built since 1972 (>2000
      carburettor units by 2015). The manufacturer is an established German aero-engine maker
      with an EASA-approved organisation for its certified four-strokes.
    documentation: >-
      The best public installation data of the 200-300 cc UAV candidates: datasheet 3-view with
      WOT power/torque/SFC curves, plus a detailed engineering dossier with envelope, crank-axis
      offset, mount bolt size, fuel-system pressure and rev limit.
    risks:
      - Single spark plug per cylinder, so no ignition redundancy (Sky Power SP-275 has twin spark).
      - TBO, CHT/EGT limits and maintenance intervals are not published. Obtain them before the design freeze.
      - SG750 integration was announced in 2023 as "will integrate". Confirm its production status.
      - Mount bolt pattern and prop-hub dimensions are not legible in public drawings. Request a STEP/DXF file.
      - The "aimed at 25 kg MTOW UAV" phrase in UST 048 appears to be an editorial error (an 18 kW engine would give a 1.4 kg/kW power loading). It is not used.
  backup_engine_id: skypower_sp275_fi_ts_ros
  backup_reason: >-
    Twin-spark redundancy, starter-generator on the rear output shaft, explicitly positioned for
    100-150 kg MTOW, and more than 1000 units built. It is 2.25 kg heavier and has less power,
    and no dimensions, SFC or generator data are public.
  power_ratings_W:
    max: {value: 18000.0, rpm: 7500, source: *u_lim_web, tag: manufacturer}
    takeoff: {value: 17150.0, rpm: 6950, source: *u_ust018_p66, tag: paper}
    max_continuous: {value: 16200.0, rpm: 6000, source: *u_lim_ds_275ef, tag: estimate, basis: "WOT curve at 6000 rpm, upper end of the manufacturer's 4000-6000 rpm cruise band"}
  fuel_flow:
    note: >-
      Percent is of 18 kW maximum power. The WOT curve does not directly give propeller-curve
      part-load SFC. Two-stroke engines often reach their best SFC at 50-80 % load (Hirth 4201
      best point 435 vs 483 g/kWh rated; Moulton 2007 3W-100i B2 best 406 g/kWh at 55 % power
      vs 485 g/kWh at maximum). The L 275 EF's own WOT minimum is at maximum rpm (414 g/kWh).
      The assumed BSFC is held near the UST typical value at 50-75 %, with a light-load penalty
      at 30 % (throttling, scavenging and combustion stability). Uncertainty is +/-12 %.
    density_basis_kg_per_m3: 740.0
    points:
      - power_fraction: 1.00
        shaft_power_W: 18000.0
        bsfc_g_per_kWh: 430
        bsfc_kg_per_J: 1.194e-7
        fuel_flow_kg_per_s: 2.150e-3
        fuel_flow_kg_per_h: 7.74
        fuel_flow_L_per_h: 10.5
        source: *u_lim_ds_275ef
        tag: estimate
        basis: "Datasheet WOT SFC 414-433 g/kWh at 7000-7500 rpm (read_from_curve)"
      - power_fraction: 0.75
        shaft_power_W: 13500.0
        bsfc_g_per_kWh: 460
        bsfc_kg_per_J: 1.278e-7
        fuel_flow_kg_per_s: 1.725e-3
        fuel_flow_kg_per_h: 6.21
        fuel_flow_L_per_h: 8.4
        source: *u_ust018_p66
        tag: estimate
        basis: "UST typical 340 g/hph = 456 g/kWh; datasheet WOT 461-481 g/kWh at 5000-6500 rpm"
      - power_fraction: 0.50
        shaft_power_W: 9000.0
        bsfc_g_per_kWh: 470
        bsfc_kg_per_J: 1.306e-7
        fuel_flow_kg_per_s: 1.175e-3
        fuel_flow_kg_per_h: 4.23
        fuel_flow_L_per_h: 5.7
        source: *u_ust018_p66
        tag: estimate
        basis: "Cruise band 4000-6000 rpm (UST); peers improve 10-15 % at part load, but the WOT curve worsens mid-rpm, so held at about the typical value + 3 %"
      - power_fraction: 0.30
        shaft_power_W: 5400.0
        bsfc_g_per_kWh: 540
        bsfc_kg_per_J: 1.500e-7
        fuel_flow_kg_per_s: 0.811e-3
        fuel_flow_kg_per_h: 2.92
        fuel_flow_L_per_h: 3.95
        source: *u_moulton_2007
        tag: estimate
        basis: "Light-load penalty of about +15 % over the 50 % point (throttled two-stroke). Moulton shows BSFC rising again below 1/4 throttle. Treat as a conservative loiter value."
  propeller:
    tag: estimate
    source: *u_w3_annex_a
    basis: >-
      Limbach publishes no propeller. Peer 200-275 cc recommendations: 3W-275 34x12 in;
      DLE-222 32x10 to 34x10; DA-200 30x13 to 32x12 (2-blade) and 29x12-13 (3-blade). Those are
      low-pitch, high-thrust hobby choices. For a 30-40 m/s surveillance cruise, a higher
      pitch-to-diameter ratio (about 0.55-0.65) is chosen. Diameter is capped so the helical tip
      speed stays at or below about 250 m/s at take-off rpm for noise; at 5500 rpm,
      D = 0.81 m gives 233 m/s. A 0.81 x 0.46 m 2-blade prop should absorb about 14-15 kW
      static near 5300-5600 rpm (Cp about 0.045-0.05), which is within the engine's 25 Nm torque
      plateau. Cruise J at 35 m/s and 4800-5200 rpm is about 0.5-0.55. Verify with the
      propeller/performance model in the sizing phase.
    tractor:
      blades: 2
      diameter_m: {value: 0.81, range: [0.76, 0.86], tag: estimate, source: *u_w3_annex_a}
      pitch_m: {value: 0.46, range: [0.41, 0.51], tag: estimate, source: *u_w3_annex_a}
    pusher:
      blades: 2
      diameter_m: {value: 0.81, range: [0.76, 0.86], tag: estimate, source: *u_w3_annex_a}
      pitch_m: {value: 0.46, range: [0.41, 0.51], tag: estimate, source: *u_w3_annex_a}
      note: >-
        Use a pusher-hand blade, or order the opposite engine rotation if available (Limbach:
        unconfirmed; Sky Power and 3W offer it). Keep the prop plane at least 0.1-0.15 D behind
        the fuselage/cowl trailing edge to limit wake-induced blade loading and noise.
    three_blade_alternative:
      diameter_m: {value: 0.76, tag: estimate, source: *u_da200}
      pitch_m: {value: 0.41, range: [0.38, 0.46], tag: estimate, source: *u_da200}
      note: Smaller disc for ground or tail-boom clearance, at about 2-4 % lower efficiency.
    tip_speed_check_m_per_s:
      tag: estimate
      source: *u_iso2533
      basis: "pi x D x rpm / 60 (static, no forward speed); speed of sound 340.3 m/s at ISA sea level"
      d_0p81_at_rpm: {"5000": 212, "5500": 233, "6000": 254, "6500": 276, "7000": 297}
  installed_engine_group_mass:
    configuration: L 275 EF + SG750 starter/generator + ECU + fuel pump/regulator + exhaust with silencers + isolated mount + servo/sensors
    items_kg:
      engine_bare:                {value: 7.00, source: *u_lim_web, tag: manufacturer}
      ecu_harness_ignition_coils: {value: 0.80, source: *u_ust018_p61, tag: estimate, basis: "not published; ECU and coils mount on the airframe"}
      fuel_pump_regulator_filter: {value: 0.35, source: *u_ust018_p61, tag: estimate, basis: "inline pump + 2.5 bar mechanical regulator + filter/fittings"}
      starter_generator_sg750:    {value: 0.44, source: *u_ust048, tag: paper}
      generator_power_electronics: {value: 0.40, source: *u_ust048, tag: estimate, basis: "3-phase rectifier/regulator or ePropelled iPS-class controller, mass not published"}
      generator_adapter_coupling: {value: 0.15, source: *u_ust018_p61, tag: estimate, basis: "flexible coupling and adapter plate on the crank rear"}
      exhaust_with_silencers:     {value: 1.00, source: *u_hirth_4201, tag: estimate, basis: "Hirth 4201 twin exhaust 1.15 kg; Limbach stacks lighter"}
      engine_mount_isolators_bolts: {value: 0.70, source: *u_ust018_p61, tag: estimate, basis: "Al/CFRP mount plate + 4 elastomer isolators + 4 x M8 hardware for a 9 kg cantilevered engine"}
      throttle_servo_cht_egt_sensors: {value: 0.12, source: *u_ust018_p61, tag: estimate}
    total_kg: {value: 10.96, range: [10.0, 12.5], tag: estimate, source: *u_lim_web, basis: "sum of the items above"}
    alternative_legacy_alternator_config_kg:
      value: 17.57
      tag: estimate
      source: *u_lim_web
      basis: "7.0 engine + 0.8 ECU + 0.35 pump + 5.2 alternator (28 V 45 A incl. transformer) + 2.3 starter set + 1.0 exhaust + 0.8 mount + 0.12 sensors"
    excluded: propeller and spinner (est. 0.6-1.0 kg), fuel tank and fuel, cowling and cooling ducts, battery, firewall
  electrical:
    generator_output_W: {value: 800, rpm: 7500, source: *u_ust048, tag: paper}
    generator_output_at_cruise_W:
      value: 550
      rpm: 5200
      tag: estimate
      source: *u_ust048
      basis: "PM generator output roughly proportional to rpm when voltage-limited: 800 x 5200/7500. Confirm with the ePropelled curve."
    engine_own_consumption_W:
      value: 70
      tag: estimate
      source: *u_ust048
      basis: "ECU + 2 injectors + fuel pump + 2 coils at 12 V, about 5-6 A. L 2400 DX draws 9 A at 28 V for a 4-cylinder with larger pumps."
    ecu_supply_V: {value: 12, source: *u_ust048, tag: paper}
  tbo_planning_s:
    value: 1.80e+6
    tag: estimate
    source: *u_hirth_2301
    basis: >-
      500 h (1.8e6 s) planning value. Hirth 23-series UAV two-strokes state a 500 h TBO;
      Limbach has not published one. 3W warranty is 1200 h / 36 months. Confirm with Limbach.

# -----------------------------------------------------------------------------------------------------
# INSTALLATION (recommended engine: Limbach L 275 EF)
# Engine axes: x along crankshaft, positive toward the propeller; z perpendicular to the cylinder
# plane; y along the cylinder axes.
# -----------------------------------------------------------------------------------------------------
installation:
  envelope_m:
    length_prop_hub_face_to_generator_coupling_flange: {value: 0.2214, source: *u_ust018_p61, tag: paper}
    width_y_incl_spark_plug_caps: {value: 0.3968, source: *u_ust018_p61, tag: paper}
    height_z_cylinder_side_to_intake_cover_top: {value: 0.2946, source: *u_ust018_p61, tag: paper}
    crank_axis_to_cylinder_side_extreme_z: {value: 0.060, source: *u_ust018_p61, tag: paper, note: "lowest point = cylinder fins in UST orientation; datasheet front view shows 60 mm, read_from_drawing"}
    crank_axis_to_intake_cover_extreme_z: {value: 0.2346, source: *u_ust018_p61, tag: estimate, basis: "294.6 - 60.0 mm; datasheet label reads 23x.6, consistent"}
    length_with_sg750_estimate: {value: 0.26, tag: estimate, source: *u_ust048, basis: "221.4 mm + SG750 28.6 mm + adapter about 10 mm"}
    note: >-
      Intake throttle bodies with hemispherical mesh filters stand on one side of the crank axis.
      The datasheet drawing shows them hanging below and the UST orientation has them on top.
      Either orientation is possible with EFI; confirm the permitted attitude with Limbach.
  datum_distances_m:
    prop_hub_face_to_crankcase_mount_face:
      value: 0.1814
      source: *u_lim_ds_275ef
      tag: datasheet
      note: "read_from_drawing (side view). Label legible as 181.4 and consistent with 221.4 - 40.0 mm; pixel-scale check within 3 %."
    crankcase_mount_face_to_generator_coupling_flange: {value: 0.040, source: *u_lim_ds_275ef, tag: datasheet, note: read_from_drawing}
    crankcase_mount_face_to_rearmost_accessory: {value: 0.0522, source: *u_lim_ds_275ef, tag: datasheet, note: "read_from_drawing; rear bracket/sensor"}
    prop_flange_outer_diameter_estimate: {value: 0.072, source: *u_lim_ds_275ef, tag: estimate, basis: "scaled from the EF side view at 2.07 px/mm; +/-5 mm"}
    starter_ring_gear_diameter_estimate: {value: 0.080, source: *u_lim_ds_275ef, tag: estimate, basis: "scaled from the EF front view; +/-5 mm"}
  mount:
    type: rear-crankcase 4-boss cantilever mount to a plate tied into the airframe
    bolts: {value: "4 x M8, about 12 mm thread engagement (datasheet detail 'M8 .. deep - 4 places')", source: *u_lim_ds_275e, tag: datasheet, note: "M8 confirmed by UST 018 p.61; depth label partly legible"}
    bolt_pattern_estimate:
      tag: estimate
      source: *u_lim_ds_275e
      basis: >-
        Scaled from the L 275 E datasheet detail "Bolt pattern for engine mount". Labels are
        illegible; ratios were fitted to partially legible "5x.x / 3x.x" labels. Hole centres
        (y, z) relative to the crank axis in the mount face are about (-0.0295, +/-0.051) and
        (+0.052, +/-0.031) m, +/-0.003 m. Use for packaging only, not for drilling. Request the
        drawing from Limbach.
      holes_yz_m: [[-0.0295, 0.051], [-0.0295, -0.051], [0.052, 0.031], [0.052, -0.031]]
    isolators: {value: "Limbach optional damper shock mount; new mounts/dampers announced 2023", source: *u_ust048, tag: paper}
    mount_guidance:
      - {text: "Tension-free mounting on an aluminium crankcase; thrust angle set by the mount plate", source: *u_w3_manual, tag: manufacturer}
      - {text: "Large two-strokes of this class must run on shock absorbers, including during break-in", source: *u_dle222_manual, tag: manufacturer}
  propeller_flange:
    description: Hub on a brass spool (press fit + keyway), bolt at crank nose, timing-wheel flange on the same spool; starter ring gear on the hub
    source: *u_ust018_p60
    tag: paper
    bolt_pattern: {value: "6 holes at 60 deg plus 6 interleaved holes (L 275 E hub detail); diameters illegible", source: *u_lim_ds_275e, tag: datasheet}
    crankshaft_bearings: {value: "front: 2 x ball bearings 20 mm dia x 8 mm wide; rear: 1 x 12 mm wide", source: *u_ust018_p60, tag: paper, note: "Twin front bearings take propeller bending load out of the crankshaft (UST 018 p.65)."}
  cooling:
    method: Ram/ducted air over cylinder fins and the bolted finned heat sinks (2 x M5 each). No fan, so a pusher needs ducted inlets.
    source: *u_ust018_p60
    tag: paper
    manufacturer_history: {text: "Before the heat sinks were added it was difficult to keep cylinder temperatures low", source: *u_ust018_p64, tag: paper}
    guidance_peer_manufacturer:
      - {text: "Direct the incoming air onto the cylinders with a close-fitting air guide (baffle); avoid stagnant hot air behind cylinders", source: *u_w3_manual, tag: manufacturer}
      - {text: "Outlet area about 4x the inlet area for unbaffled model-style installs (e.g. 20 cm2 in, 80 cm2 out)", source: *u_w3_manual, tag: manufacturer}
      - {text: "Crankcase temperature max 55 degC", source: *u_w3_manual, tag: manufacturer}
      - {text: "Push configuration raises cooling and integration demands; pull gives cleaner airflow", source: *u_sky_faq, tag: manufacturer}
    cht_limits_degC:
      note: Limbach CHT limits are not published. Peer values follow.
      short_term_full_throttle: {value: 250, source: *u_w3_manual, tag: manufacturer}
      critical_seizure_risk: {value: 270, source: *u_w3_manual, tag: manufacturer}
      minimum_to_avoid_deposits: {value: 180, source: *u_w3_manual, tag: manufacturer}
      peer_uav_twin_head_max: {value: 280, source: *u_ust001_hirth, tag: paper, note: "Hirth S1218 UAV twin"}
      design_limit_continuous: {value: 240, tag: estimate, source: *u_w3_manual, basis: "10 degC margin below the 3W short-term 250 degC; replace with the Limbach limit when obtained"}
    cht_sensor: {value: "14 mm spark-plug thermocouple (Limbach optional)", source: *u_lim_ds_275ef, tag: datasheet}
    cooling_airflow_estimate:
      tag: estimate
      source: *u_moulton_2007
      basis: >-
        Energy balance at 18 kW. Fuel 7.74 kg/h x 43.4 MJ/kg = 93.3 kW, so brake efficiency is
        about 19.3 %. Small air-cooled two-strokes reject about 15-25 % of fuel energy to the
        cooling air (peer engine test literature), giving Q about 14-20 kW (about 0.8-1.1 x brake
        power). The cooling-air temperature rise across a baffled fin pack is 30-50 K (assumed).
        m_dot = Q / (cp x dT) with cp = 1005 J/(kg K).
      heat_to_cooling_air_W_at_max_power: {value: 17000.0, range: [14000.0, 20000.0], tag: estimate, source: *u_moulton_2007}
      mass_flow_kg_per_s_at_max_power: {value: 0.42, range: [0.29, 0.66], tag: estimate, source: *u_moulton_2007}
      volume_flow_m3_per_s_sea_level_at_max_power: {value: 0.35, tag: estimate, source: *u_iso2533, basis: "0.42 kg/s / 1.225 kg/m3"}
      mass_flow_kg_per_s_at_50pct_power: {value: 0.22, tag: estimate, source: *u_moulton_2007, basis: "heat rejection scaled with fuel flow 4.23/7.74"}
      inlet_area_m2_first_cut: {value: 0.031, tag: estimate, source: *u_iso2533, basis: "0.42 kg/s / (1.225 kg/m3 x 11 m/s), with inlet velocity ratio about 0.4 at a 28 m/s climb"}
      exit_area_m2_first_cut: {value: 0.040, tag: estimate, source: *u_w3_manual, basis: "about 1.3 x inlet, for heated-air density drop and a controlled exit velocity; use the 3W 4x rule if the installation is not baffled"}
      ground_running: Pusher installations get no prop-wash over the cylinders. Limit static ground runs by CHT, or add a ground-cooling blower.
  exhaust:
    standard: {value: "2 x individual 200 mm stacks open to atmosphere, bolted to each cylinder; EGT sensor provision", source: *u_ust018_p60, tag: paper}
    tuned_option: {value: "980 mm tuned pipes: +20 % power at 6000 rpm, +15 % at 7500 rpm, better SFC; 400 mm pipe option also offered", source: *u_ust018_p66, tag: paper}
    egt_degC:
      note: Limbach EGT values are not published. Peer UAV twin values follow (measured 110 mm downstream of the exhaust port).
      wot: {value: 680, source: *u_ust001_hirth, tag: paper}
      part_load: {value: 720, source: *u_ust001_hirth, tag: paper}
      design_gas_temperature_near_port: {value: 750, tag: estimate, source: *u_ust001_hirth, basis: "peer maximum 720 degC + 30 degC margin"}
      pipe_outer_wall_estimate: {value: [400, 600], tag: estimate, source: *u_ust001_hirth, basis: "uninsulated steel pipe wall typically 100-300 K below gas temperature"}
    integration_rules:
      - {text: "Use flexible muffler brackets on the reinforced part of the muffler", source: *u_w3_manual, tag: manufacturer}
      - {text: "Muffler and manifold must be well cooled; keep the ignition/ECU out of the cylinder hot-air stream", source: *u_w3_manual, tag: manufacturer}
      - {text: "Keep composites at least 25-50 mm from pipes, or use a heat shield; low-Tg plastics are not allowed near the exhaust", tag: estimate, source: *u_ust001_hirth, basis: "derived from the EGT levels above"}
  vibration:
    configuration: {value: "boxer twin, separate crankpins at 180 deg; both cylinders fire simultaneously (one combined power stroke per revolution)", source: *u_lim_ds_275e, tag: datasheet}
    primary_forces: {value: "largely balanced; residual rocking couple from the crankpin offset, counterbalanced by the outer crank webs (no other damping)", source: *u_ust018_p62, tag: paper}
    dominant_loading: {value: "mass forces dominate over firing forces at about 6000 rpm (low compression)", source: *u_ust018_p62, tag: paper}
    excitation_frequencies_Hz:
      tag: estimate
      source: *u_ust018_p66
      basis: "1st order = rpm/60 (firing and rocking couple); 2nd order = 2-blade blade-passing"
      idle_2000rpm_1st_order: 33.3
      cruise_5000rpm_1st_order: 83.3
      cruise_5000rpm_2nd_order: 166.7
      takeoff_6950rpm_1st_order: 115.8
    isolator_target:
      value: "rigid-body mount modes at or below 15-20 Hz; keep the gimbal/EO-IR isolator modes away from 80-120 Hz and 160-240 Hz"
      tag: estimate
      source: *u_ust018_p66
      basis: "isolation needs f_exc / f_n > sqrt(2), preferably > 2; lowest excitation is 1st order at idle (assumed 2000 rpm, about 33 Hz)"
    propeller_balance: {text: "Only fully balanced, flat, accurately bored propellers; blade-tip track within 0.5 mm; spinner balanced with the prop", source: *u_w3_manual, tag: manufacturer}
  fuel_system:
    supply: {value: "inline electric pump feeds one end of the rail; mechanical regulator at the other end holds 2.5 bar; excess returns to the tank (return line required)", source: *u_ust018_p61, tag: paper}
    rail_pressure_Pa: {value: 2.5e+5, source: *u_ust018_p61, tag: paper}
    injectors: {value: "1 solenoid injector per cylinder, below the butterfly", source: *u_ust018_p61, tag: paper}
    fuel: {value: "92 RON or better gasoline + synthetic 2-stroke oil 50:1", source: *u_lim_web, tag: manufacturer}
    tank_notes: Size the return line like the supply line. Fit a filter in the tank and a fuel-proof pendulum pickup (3W practice).
    tank_notes_source: *u_w3_manual
    tank_notes_tag: manufacturer
  altitude:
    compensation: {value: "ECU linear offset on ambient pressure and air temperature", source: *u_ust018_p61, tag: paper}
    power_lapse_model:
      formula: P(h) / P0 = sigma(h)^1.23   (sigma = ISA density ratio)
      tag: estimate
      source: *u_hirth_4201
      basis: >-
        Fitted to the Hirth 4201 published full-throttle altitude curve (naturally aspirated EFI
        boxer twin, same class). The exponent is 1.22-1.24 for every point from 1000 to 6000 m.
        sigma is from ISO 2533.
      standard_source: *u_iso2533
      l275ef_power_W_at_altitude:
        altitude_m: [0, 1000, 2000, 3000, 4000, 4500, 6000]
        sigma:      [1.000, 0.907, 0.822, 0.742, 0.669, 0.634, 0.539]
        power_W:    [18000, 15970, 14140, 12470, 10970, 10280, 8410]
  starting:
    options: SG750 starter/generator (preferred), Limbach 12 V 0.4 kW starter on crankcase base driving a ring gear on the prop hub (2.3 kg), or hand propping on the ground
    source: *u_lim_web
    tag: manufacturer

open_items:
  - Request from Limbach the L 275 EF installation drawing (STEP/DXF) with mount bolt pattern, prop-hub bolt circle and spigot, and the permitted installation attitude.
  - Request TBO, maintenance intervals, CHT/EGT limits, idle rpm and maximum continuous rating.
  - Confirm SG750 release status, its output-vs-rpm curve and the rectifier/controller mass. Otherwise baseline the 28 V 45 A alternator (5.2 kg).
  - Confirm whether counter-rotating (pusher) crank rotation is available, or plan a pusher-hand propeller.
  - Request a quote and lead time (price not public).
  - In parallel, request the Sky Power SP-275 FI TS ROS 3D model, SFC map and starter-generator data as the backup.
  - Propeller final selection by performance model (sizing phase); candidate suppliers to be researched separately.
