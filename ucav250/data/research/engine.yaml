# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - ENGINE
# Civil surveillance / research UAV, 80-200 kg MTOW class, sole powerplant ~200-300 cc piston engine.
# Payload: EO/IR sensors and mission equipment only.
#
# Conventions
#   - SI units, explicit in key names or in a "unit" field (m, kg, s, N, Pa, W, K / degC named).
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "paper" is also used for trade-journal engineering dossiers (Unmanned Systems Technology),
#     which quote the manufacturer's engineers directly.
#   - Values tagged "estimate" carry a "basis" explaining the reasoning.
#   - HP conversions: 1 hp (mechanical) = 745.7 W. Limbach charts are labelled "HP"; the datasheet
#     equates 18 kW = 24 HP, which fits mechanical hp (24.1 hp) better than PS (24.5 PS).
#     Using PS instead would change derived g/kWh values by about +1.4 %.
#   - Values read off raster drawings/curves are marked "read_from_drawing" or "read_from_curve".
#     Their uncertainty is given explicitly.
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: engine
  phase: research
  date: "2026-10-05"
  scope: >-
    Purchasable UAV piston engines of about 200-300 cc that can be the only powerplant of an
    80-200 kg MTOW fixed-wing UAV. Wankel and hobby engines near the range are included for
    comparison. The recommended engine is for a 100-150 kg surveillance UAV.
  hp_mechanical_to_W: 745.7
  fuel_density_kg_per_m3:
    value: 740.0
    tag: estimate
    source: "https://www.engineeringtoolbox.com/fuels-higher-calorific-values-d_169.html"
    basis: >-
      Gasoline 737 kg/m3 (Engineering ToolBox; EN 228 allows 720-775 kg/m3 at 15 degC). A 50:1
      premix with about 870 kg/m3 synthetic oil gives 0.98 x 737 + 0.02 x 870 = 740 kg/m3.
      This value is used for all L/h conversions.
  fuel_lower_heating_value_J_per_kg:
    value: 43.4e+6
    tag: estimate
    source: "https://www.engineeringtoolbox.com/fuels-higher-calorific-values-d_169.html"
    basis: Gasoline LHV 43.4 MJ/kg (Engineering ToolBox table), used only for energy-balance estimates.

