    cfrp_twill_wet_layup_vacbag:
      name: Carbon/epoxy 2x2 twill 200-245 g/m2, wet lay-up with laminating epoxy, vacuum-bag consolidated, post-cured
      kind: composite
      process: Wet (hand) lay-up + vacuum bag, room-temperature cure + post-cure per resin supplier
      tag: estimate
      source: *u_se84lv
      basis: >-
        No public B-basis data for a specific wet lay-up system was found. Values are scaled from the
        Gurit RC200T twill mean values (Vf 0.55) by fibre volume (fibre-dominated properties) and
        a process factor for voids and waviness: tension 0.95, compression 0.85, ILSS 0.70. The
        order of magnitude of the process penalty agrees with Abdurohman 2026 (UD carbon: hand
        lay-up 508 MPa, vacuum bag 686 MPa, infusion 774 MPa).
      cross_check_source: *u_process_cmp
      fibre_volume_fraction: {value: 0.42, range: [0.35, 0.45], tag: estimate, basis: "typical for vacuum-bagged wet lay-up of woven carbon; measure by ASTM D3171 on witness panels"}
      cured_ply_thickness_m:
        fabric_200gsm: {value: 2.6600e-04, tag: estimate, basis: "CPT = FAW/(rho_f Vf) = 200/(1790*0.42)/1000 m"}
        fabric_245gsm: {value: 3.2600e-04, tag: estimate, basis: "245/(1790*0.42)/1000 m"}
      density_kg_per_m3: {value: 1420.0, tag: estimate, basis: "0.42*1790 + 0.58*1150 (cured laminating epoxy ~1150 kg/m3)"}
      tg_degC: {value: 80.0, range: [60.0, 110.0], tag: estimate, basis: "depends on resin and post-cure; RT-cure laminating epoxies post-cured at 50-80 degC reach Tg 60-100 degC. Take the resin supplier value; use MOL = wet Tg - 28 degC"}
      elastic:
        E1_Pa: {value: 4.6300e+10, tag: estimate, basis: "60.6 GPa x 0.42/0.55"}
        E2_Pa: {value: 4.6300e+10, tag: estimate, basis: balanced twill}
        G12_Pa: {value: 3.0000e+09, tag: estimate, basis: "PW RTD 3.73 GPa x 0.8 (lower Vf, resin-rich)"}
        nu12: {value: 0.05, tag: estimate}
      strength_Pa:
        RT_dry_mean:
          Xt: {mean: 5.2200e+08, basis: "719 x 0.42/0.55 x 0.95"}
          Xc: {mean: 4.9300e+08, basis: "759 x 0.42/0.55 x 0.85"}
          S_ult: {mean: 7.0000e+07, basis: "Performance Composites std CF fabric S = 90 MPa at Vf 0.50, x 0.42/0.50 x 0.93"}
          ILSS: {mean: 5.2000e+07, basis: "74.8 x 0.70"}
        design_RTD_estimate:
          basis: "0.75 x mean (hand-process CV ~ 10 %, B ~ mean (1 - 2.5 CV)); use with CS-LUAS hot/wet factor 2.0 and manufacturing factor 1.2 (standards.yaml CMP-003b)."
          Xt: 3.9200e+08
          Xc: 3.7000e+08
          S: 3.1500e+07
          S_basis: "0.75 x 0.60 x S_ult; 0.60 = NCAMP PW RTD ratio S_0p2 / S_5pct, so S is a 0.2 % offset-equivalent value"
          ILSS: 3.9000e+07

