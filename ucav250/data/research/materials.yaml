    tag: standard
    table: MIL-HDBK-5G Table 3.7.4.0(b1)
    density_kg_per_m3: 2796.0
    E_Pa: 7.1016e+10
    E_c_Pa: 7.2395e+10
    G_Pa: 2.6890e+10
    nu: 0.33
    A_basis_Pa:
