# =====================================================================================================
# 1. COMPOSITES
# =====================================================================================================
composites:
  notes: >-
    Strength keys: Xt/Xc = 1-direction (fibre / warp) tension / compression, Yt/Yc = 2-direction
    (transverse / fill), S_0p2 = in-plane shear at 0.2 % offset, S_5pct = in-plane shear at 5 %
    strain (or ultimate if lower), ILSS = short-beam strength (as measured). Each strength is
    {b_basis, mean} in Pa; b_basis null means NCAMP did not publish a recommended value (reason in
    "nb"). Moduli are mean values (moduli have no statistical basis).
  laminae:
    # -------------------------------------------------------------------------------------------
    cfrp_ud_ooa_prepreg_as4_145:
      name: Carbon/epoxy UD tape prepreg, Solvay MTM45-1 / 12K AS4, 145 g/m2, 32 % resin weight
      kind: composite
      process: Out-of-autoclave prepreg, oven vacuum-bag cure ("MH" cycle, see cure)
      source: *u_ncamp_ud
      tag: standard
      cure:
        description: >-
          Vacuum >= 28 inHg (95 kPa below atmosphere) throughout; ramp 0.6-3 K/min to 79-88 degC,
          dwell >= 3 h; ramp to 121 +/- 6 degC, dwell >= 3 h; cool under vacuum to <= 60 degC;
          free-standing post-cure 177 +/- 6 degC for 1-2 h (ramp <= 19 K/h above 121 degC).
        source: *u_nps81451
        tag: standard
      fibre_areal_weight_kg_per_m2: {value: 0.145, source: *u_ncamp_ud, tag: standard, note: grade 145 in the material designation}
      resin_content_mass_fraction: {value: 0.32, source: *u_ncamp_ud, tag: standard}
      cured_ply_thickness_m: {value: 1.3970e-04, source: *u_ncamp_ud, tag: standard, note: NCAMP normalising CPT}
      fibre_volume_fraction:
        value: 0.580
        tag: estimate
        source: *u_hex_ppt
        basis: "Vf = FAW / (rho_fibre * CPT) (Hexcel Prepreg Technology appendix B) = 145 / (1790 * 0.1397e-3 * 1000); rho_fibre AS4 = 1.79 g/cm3 (Hexcel 8552 data sheet)."
      density_kg_per_m3:
        value: 1542.0
        tag: estimate
        source: *u_hex_ppt
        basis: "Rule of mixtures 0.580 * 1790 + 0.420 * 1200; cured MTM45-1 resin density not published, 1200 kg/m3 assumed (SE 84LV cured resin 1220, 8552 1300). Uncertainty +/- 25 kg/m3."
      tg_dry_degC: {value: 203.0, source: *u_ncamp_ud, tag: standard, method: DMA SACMA SRM 18R-94}
      tg_wet_degC: {value: 170.8, source: *u_ncamp_ud, tag: standard}
      max_operating_temperature_wet_degC:
        value: 142.8
        tag: estimate
        source: *u_cw_tg
