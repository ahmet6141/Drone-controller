open_items:
  - "AGATE (agate.niar.wichita.edu) was unreachable (503 / TLS) - the Toray T700G/2510 UD and 7781/2510 B-basis reports could not be read; only the 2510 PW report (ORNL mirror) was used as a cross-check."
  - "MIL-HDBK-5G (1994) values used; confirm against the current MMPDS edition before certification (paywalled)."
  - "MTM45-1 cured resin density is not published in the documents read; laminate densities assume 1200 kg/m3 (+/-25 kg/m3 on laminate density)."
  - "MTM45-1 free-standing post-cure at 177 degC exceeds the ROHACELL WF limit (130 degC): use WF-HT, post-cure before core bonding, or co-cure with the MH 121 degC step only and qualify the reduced Tg."
  - "AIREX C70 maximum processing temperature not found in the TDS read; get the 3A processing guide before using it with 121 degC prepreg cures."
  - "Wet lay-up and infusion allowables are estimates scaled from prepreg data; run a coupon programme (ASTM D3039/D6641/D3518/D2344, 3 batches) for the chosen resin before using them in primary structure."
  - "Hart-Smith elastic-trough formula stated from the standard derivation (OCR of CR-112235 equations unreadable); verify before using it for primary bonds."
  - "ISO 898-1, ISO 3506-1, ISO 286 and ISO 2768 values come from secondary reproductions (Wikipedia, RapidDirect); confirm against purchased standards."
  - "Screw property classes available per ISO 4762/7380/4014/4017 and the NAS1068 configuration were not verified from primary sources."
  - "Bearing allowables are NCAMP pin-bearing values (e/D 3, QI); bolt-bearing with clamp-up and countersunk heads need joint-specific data or tests."
  - "Composite pin-bearing B-basis for 7781 glass not extracted (Table 5.8 of the 7781 report) - add if glass laminates carry bolted loads."
  - "Fatigue data (S-N) for 4130 welded clusters and composite bolted joints under piston-engine vibration not collected here."
