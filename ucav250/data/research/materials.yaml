    source: *u_wiki_fit
    tag: standard
    note: "Upper and lower deviations [upper, lower] in m from nominal, by nominal diameter range (over lower_m up to and including upper_m). H = hole, lower-case = shaft."
    ranges_m: [[0.0, 3.0e-3], [3.0e-3, 6.0e-3], [6.0e-3, 10.0e-3], [10.0e-3, 18.0e-3], [18.0e-3, 30.0e-3], [30.0e-3, 50.0e-3], [50.0e-3, 80.0e-3]]
    H7: [[10.0e-6, 0.0], [12.0e-6, 0.0], [15.0e-6, 0.0], [18.0e-6, 0.0], [21.0e-6, 0.0], [25.0e-6, 0.0], [30.0e-6, 0.0]]
    g6: [[-2.0e-6, -8.0e-6], [-4.0e-6, -12.0e-6], [-5.0e-6, -14.0e-6], [-6.0e-6, -17.0e-6], [-7.0e-6, -20.0e-6], [-9.0e-6, -25.0e-6], [-10.0e-6, -29.0e-6]]
    h6: [[0.0, -6.0e-6], [0.0, -8.0e-6], [0.0, -9.0e-6], [0.0, -11.0e-6], [0.0, -13.0e-6], [0.0, -16.0e-6], [0.0, -19.0e-6]]
    p6: [[12.0e-6, 6.0e-6], [20.0e-6, 12.0e-6], [24.0e-6, 15.0e-6], [29.0e-6, 18.0e-6], [35.0e-6, 22.0e-6], [42.0e-6, 26.0e-6], [51.0e-6, 32.0e-6]]
    k6: [[6.0e-6, 0.0], [9.0e-6, 1.0e-6], [10.0e-6, 1.0e-6], [12.0e-6, 1.0e-6], [15.0e-6, 2.0e-6], [18.0e-6, 2.0e-6], [21.0e-6, 2.0e-6]]
    f7: [[-6.0e-6, -16.0e-6], [-10.0e-6, -22.0e-6], [-13.0e-6, -28.0e-6], [-16.0e-6, -34.0e-6], [-20.0e-6, -41.0e-6], [-25.0e-6, -50.0e-6], [-30.0e-6, -60.0e-6]]
    H8: [[14.0e-6, 0.0], [18.0e-6, 0.0], [22.0e-6, 0.0], [27.0e-6, 0.0], [33.0e-6, 0.0], [39.0e-6, 0.0], [46.0e-6, 0.0]]
    fit_formulas: "clearance_max = ES(hole) - ei(shaft); clearance_min = EI(hole) - es(shaft); negative clearance = interference"
    check: "IT6 and IT7 widths agree with ISO 286-1 i = 0.45 D^(1/3) + 0.001 D (um) for every range (IT6 ~ 10 i, IT7 ~ 16 i, rounded)."
  fits_for_pins_and_bushings:
    source: *u_wiki_fit
    tag: standard
    H7_g6: "sliding fit - hinge pins turning in bushings, clevis pins, control-surface hinge bolts (assemble by hand, turn freely)"
    H7_h6: "location fit - removable dowels and spigots, assembled without force, slide when lubricated"
    H7_p6: "press fit - bushings and bearings pressed into metal fittings (cold press), not removed in service"
    H8_f7: "close running fit - slower pivots, actuator rod ends with some misalignment"
    H7_k6: "transition fit - gears/hubs on shafts, assembly with a mallet"
    yk250_rules:
      tag: estimate
      text: >-
        Press fits (H7/p6) only in metal housings (Al, steel, Ti); in carbon/epoxy laminates bond
        bushings with EA 9394 using a clearance of 0.05-0.15 mm on diameter (H8/f7-like) - an
        interference fit splits the laminate. Bronze or stainless bushings in aluminium fittings for
        all rotating joints; steel pins (4130/17-4PH/Ti) with H7/g6.
    example_10_to_18mm:
      H7_g6_clearance_m: [6.0e-6, 35.0e-6]
      H7_h6_clearance_m: [0.0, 29.0e-6]
      H7_p6_interference_m: [0.0, 29.0e-6]
      note: "computed with the fit formulas above (min, max)"
