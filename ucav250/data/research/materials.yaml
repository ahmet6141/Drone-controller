      tag: standard
      N12: 50.0e-6
      N11: 25.0e-6
      N10: 12.5e-6
      N9: 6.3e-6
      N8: 3.2e-6
      N7: 1.6e-6
      N6: 0.8e-6
      N5: 0.4e-6
      N4: 0.2e-6
      N3: 0.1e-6
      N2: 0.05e-6
      N1: 0.025e-6
    as_machined_standard_Ra_m: {value: 3.2e-6, source: *u_hubs, tag: vendor, note: "reducible to 0.4 um with extra operations"}
    recommended_Ra_m:
      tag: estimate
      general_machined_surfaces: 3.2e-6
      mating_and_sealing_faces: 1.6e-6
      bushing_bores_and_press_fit_seats: 0.8e-6
      hinge_pins_and_shaft_journals: 0.4e-6
      adhesive_bond_metal_surfaces_after_grit_blast: [2.0e-6, 6.0e-6]
      composite_tool_surface_for_painted_aero_skin: 0.4e-6
      basis: Common drawing practice for the listed functions; bond surfaces per adhesive supplier surface-prep instructions (DP490 TDS gives grit-blast/etch procedures, no Ra value).

