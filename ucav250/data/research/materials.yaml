    cfrp_twill_prepreg_se84lv_rc200t:
      name: Carbon/epoxy 2x2 twill prepreg 200 g/m2 HEC fibre (T700/TR50S class), Gurit SE 84LV RC200T
      kind: composite
      process: Low-temperature prepreg (80-120 degC), vacuum bag or autoclave; post-cure not required
      source: *u_se84lv
      tag: manufacturer
      basis_of_values: mean of a single batch, cured 10 h at 85 degC; strengths and moduli normalised to Vf 55 %
      fibre_areal_weight_kg_per_m2: {value: 0.200, source: *u_se84lv, tag: manufacturer, note: "RC200T = 200 g/m2"}
      resin_content_mass_fraction: {value: 0.42, source: *u_se84lv, tag: manufacturer, note: uncured}
      cured_ply_thickness_m: {value: 2.3000e-04, source: *u_se84lv, tag: manufacturer}
      fibre_volume_fraction: {range: [0.47, 0.53], source: *u_se84lv, tag: manufacturer}
      density_kg_per_m3:
        value: 1500.0
        tag: estimate
        source: *u_se84lv
        basis: "Vf = 200/(1800*0.23e-3*1000) = 0.483; 0.483*1800 + 0.517*1220 (cured resin density 1.22 g/cm3 from the same data sheet)."
      tg_degC:
        cure_80C_12h: {value: 95.0, source: *u_se84lv, tag: manufacturer}
        cure_85C_10h: {value: 105.0, source: *u_se84lv, tag: manufacturer}
        cure_120C_1h: {value: 125.0, source: *u_se84lv, tag: manufacturer}
        method: DMA ASTM D7028 (dry)
      max_operating_temperature_degC:
        value: 70.0
        tag: estimate
        source: *u_se84lv
        basis: >-
          Wet Tg not published. Assumed wet Tg ~ dry Tg - 20 K = 105 degC (120 degC cure), MOL = wet
          Tg - 28 = 77 degC, rounded down to 70 degC. Restrict to light-coloured skins
          (absorptivity <= 0.5, 66 degC per standards.yaml CMP-001b) or secondary parts.
      elastic:
        E1_t_Pa: {value: 6.0600e+10, source: *u_se84lv, tag: manufacturer}
        E2_t_Pa: {value: 6.1600e+10, source: *u_se84lv, tag: manufacturer}
        E1_c_Pa: {value: 5.8300e+10, source: *u_se84lv, tag: manufacturer}
        E2_c_Pa: {value: 5.9000e+10, source: *u_se84lv, tag: manufacturer}
        G12_Pa: {value: 3.8000e+09, tag: estimate, source: *u_ncamp_pw, basis: "not published; taken equal to the MTM45-1 AS4 PW RTD value (matrix dominated, similar Vf)"}
        nu12: {value: 0.05, tag: estimate, source: *u_ncamp_pw, basis: as for the plain weave}
      strength_Pa:
        RT_dry_mean:
          Xt: {mean: 7.1900e+08}
          Yt: {mean: 6.6200e+08}
          Xc: {mean: 7.5900e+08}
          Yc: {mean: 7.3100e+08}
          flexural: {mean: 8.4700e+08}
          ILSS: {mean: 7.4800e+07}
        design_RTD_estimate:
          tag: estimate
          basis: >-
            B-basis-like = mean x 0.878 (as-built Vf 0.483 instead of the normalised 0.55) x 0.82
            (single batch; B ~ mean (1 - 2.2 CV) with CV 8 %). In-plane shear from the PW data (RTD
            B-basis S_0p2). Use only with the CS-LUAS hot/wet factor 2.0 (T <= 70 degC) of
            standards.yaml CMP-003b, because no hot/wet data exist.
          Xt: 5.1800e+08
          Yt: 4.7700e+08
          Xc: 5.4600e+08
          Yc: 5.2600e+08
          S_0p2: 3.6335e+07
          ILSS: 5.3900e+07

