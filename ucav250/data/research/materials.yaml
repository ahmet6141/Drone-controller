# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - MATERIALS, PROCESSES, FASTENERS, TOLERANCES
# Civil surveillance / research UAV, 100-150 kg MTOW class, single ~250 cc piston engine.
# Payload: EO/IR sensors and mission equipment only (no weapons, no hardpoints, no release mechanisms).
#
# Conventions
#   - SI units only: m, kg, s, N, Pa, N*m, kg/m3; temperatures in degC (key suffix _degC).
#     Strengths and moduli are in Pa (e.g. 1.6548e+09 = 1654.8 MPa).
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "standard" is used for public design-allowable databases that follow a handbook procedure
#     (MIL-HDBK-5G, NCAMP/CMH-17 B-basis reports), for ISO/SAE/ESA/FAA documents, and for
#     encyclopedia reproductions of ISO tables (marked "secondary" in the source notes).
#     Values tagged "estimate" carry a "basis" that explains the reasoning.
#   - Imperial values were converted exactly from the printed source value:
#       1 ksi = 6.894757 MPa, 1 Msi = 6.894757 GPa, 1 psi = 6894.757 Pa, 1 in = 25.4 mm,
#       1 lb/in3 = 27679.9 kg/m3, 1 lbf = 4.448222 N, T[degC] = (T[degF] - 32) / 1.8.
#   - Composite environments (NCAMP / CMH-17 naming):
#       CTD = cold temperature dry, -54 degC (-65 degF)
#       RTD = room temperature dry, 24 degC (75 degF)
#       ETD = elevated temperature dry, 93 degC (200 degF)
#       ETW = elevated temperature wet, 93 degC (200 degF), moisture-saturated (85 % RH, 63 degC)
#       ETW2 = elevated temperature wet, 121 degC (250 degF)
#   - Statistical basis:
#       B-basis = 90 % of the population exceeds the value with 95 % confidence.
#       A-basis = 99 % of the population exceeds the value with 95 % confidence.
#       S-basis = specification minimum (MIL-HDBK-5), no statistical guarantee.
#       mean / typical = average test value, NOT a design allowable.
#     Which basis to use (A for single load path, B for redundant structure) and the composite
#     special factors are set in standards.yaml (STR-* and CMP-* items); they are not repeated here.
#   - Lamina strengths of carbon prepregs are NCAMP values normalised to the nominal cured ply
#     thickness (fibre-dominated properties); matrix-dominated properties are as measured.
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: materials_processes_fasteners_tolerances
  phase: research
  date: "2026-10-05"
  scope: >-
    Design data for building a 100-150 kg UAV airframe with industrial processes: composite laminae
    (out-of-autoclave carbon/epoxy prepreg UD and woven, 200 g/m2 twill prepreg, carbon wet lay-up
    and infusion, E-glass/epoxy, aramid/epoxy), sandwich cores, structural adhesives, aircraft
    metals (Al 7075/2024/6061/5052, 4130 steel, Ti-6Al-4V, 304 stainless), process design rules
    (composite moulding, CNC milling, sheet metal, 4130 tube welding, SLS/FDM printing), fasteners
    (ISO screws, nutplates, quarter-turn, inserts, joint geometry, torques) and tolerances
    (ISO 2768, ISO 286, surface finish).
  how_to_use: >-
    "spec_ready" at the end of the file is the short list of design values in the schema of
    ARCHITECTURE.md (materials / processes). Use it in code. The sections above it hold the full
    source data (every environment and basis) so that later phases can change the selection.
    Composite design values in spec_ready are B-basis ETW (93 degC, wet) values. They cover a skin
    temperature up to 84 degC (black paint, CMP-001b in standards.yaml), so the CS-LUAS hot/wet
    factor is 1.0 (CMP-003b). Apply the other factors of standards.yaml on top.
  material_choice_summary: >-
    Primary composite system: Solvay (ex-Cytec/ACG) MTM45-1 out-of-autoclave prepreg family, oven
    vacuum-bag cure. It has public NCAMP B-basis data for AS4 UD tape (145 g/m2), AS4 3K plain
    weave (193 g/m2) and 7781 E-glass (293 g/m2) with the same resin, cure and Tg, which gives one
    consistent allowables set for the whole airframe. Gurit SE 84LV (80-120 degC cure, vacuum bag)
    RC200T 2x2 twill is given as a lower-cost cosmetic/secondary twill skin option with
    manufacturer mean data only.
  related_files:
    standards: ucav250/data/research/standards.yaml (factors of safety, A/B-basis rules, composite special factors, solar skin temperature)
    fastener_catalog: ucav250/design/fastener_catalog.py (head dimensions, clearance holes, torque table used by code)
    structures_library: ucav250/analysis/structlib.py (lug_axial uses Ftu and Fbru from here)

