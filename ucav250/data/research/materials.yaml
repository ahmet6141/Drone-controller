metals:
  notes: >-
    Values as printed in MIL-HDBK-5G (1994), converted to SI. Bearing values (Fbru, Fbry) are
    "dry pin" values at edge-distance ratio e/D = 1.5 and 2.0 (MIL-HDBK-5 section 1.4.7.1); for
    e/D between 1.5 and 2.0 interpolate linearly, below 1.5 not allowed. Fsu is the ultimate shear
    strength. Use A-basis for single-load-path parts and B-basis for redundant parts
    (standards.yaml STR rules). S-basis = specification minimum.
