    title: "NATO AEP-83 Light Unmanned Aircraft Systems Airworthiness Requirements (STANAG 4703), Edition A Version 1, Ratification Draft 1, letter of promulgation dated 4 Sep 2014 (113 pages)"
    tag: standard
    notes: >-
      Published on gov.uk by the UK MoD. This is the ratification draft. The promulgated edition is
      sold as STANAG 4703:2016 / AEP-83:2016 (see stanag4703_sai). The 2016 numbers were not
      compared. Annex B landing-gear tables and figures were read from the rendered PDF pages.
      Scope: fixed-wing light UAS with MTOW not greater than 150 kg and impact energy above 66 J.
      Wording convention: "must" = requirement, "should" = acceptable argument (AMC-like).
  - id: stanag4703_sai
    url: &u_stanag4703_sai "https://infostore.saiglobal.com/en-us/Standards/STANAG-4703-2016-737548_SAIG_NATO_NATO_1791832/"
    title: STANAG 4703 (2016) catalogue entry (paywalled), promulgated edition
