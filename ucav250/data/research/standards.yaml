  # ---------------- engine mount ----------------
  - id: ENG-001
    category: engine_mount
    item: Engine torque load cases
    value: >-
      (1) take-off torque x factor with 75 % of the flight condition A limit loads;
      (2) maximum-continuous torque x factor with 100 % of the flight condition A limit loads
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.361(a)
    source: *u_csluas
    tag: standard
    note: CS-VLA 361(a)(1) applies the take-off case to the mean torque (no factor). The factor applies to the MCP case (CS-VLA 361(b)). CS-23 and CS-LUAS apply the factor to both.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 361(a), value: same cases, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.361(a), value: same cases, source: *u_far23, tag: standard}
      - {document: CS-LUAS, clause: "Appendix F (d)(2) simplified criteria", value: "max take-off torque with limit loads at n1", source: *u_csluas, tag: standard}
  - id: ENG-002
    category: engine_mount
    item: Limit engine torque factor on mean torque (piston engines)
    value:
      cs_luas_and_far23:
        five_or_more_cylinders: 1.33
        four_cylinders: 2.0
        three_cylinders: 3.0
        two_cylinders: 4.0
        wankel: 1.33
        electric: "maximum peak torque over the speed range"
      cs_vla_four_stroke:
        five_or_more_cylinders: 1.33
        four_cylinders: 2.0
        three_cylinders: 3.0
        two_cylinders: 4.0
        one_cylinder: 8.0
      cs_vla_two_stroke:
        three_or_more_cylinders: 2.0
        two_cylinders: 3.0
        one_cylinder: 6.0
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.361(c),(d); CS-VLA 361(b); FAR 23.361(c)
    source: *u_csluas
    tag: standard
    note: >-
      CS-LUAS and FAR 23 do not separate two-stroke and four-stroke and have no single-cylinder
      entry. The Limbach L 275 EF is a two-stroke boxer twin whose cylinders fire simultaneously
      (one combined power stroke per revolution, engine.yaml). By the letter of CS-VLA the factor
      is 3; by CS-LUAS it is 4. Its torque pulse pattern is that of a single-cylinder two-stroke
      (CS-VLA factor 6). See design_loads_recommended.engine_mount.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 361(b), value: see cs_vla tables, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.361(c), value: see cs_luas_and_far23, source: *u_far23, tag: standard}
  - id: ENG-003
    category: engine_mount
    item: Side load on engine mount (limit lateral load factor, independent of other flight conditions)
    value: "max(1.33, n_A/3); = 1.33 for n_A = 3.8"
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.363 (printed CS-LURS.363)
    source: *u_csluas
    tag: standard
    note: CS-LUAS Appendix F simplified criteria use a lateral limit factor of at least 1.47 instead.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 363, value: 1.33, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.363, value: "max(1.33, n_A/3)", source: *u_far23, tag: standard}
      - {document: CS-LUAS, clause: "Appendix F (d)(3)", value: 1.47, source: *u_csluas, tag: standard}
  - id: ENG-004
    category: engine_mount
    item: Gyroscopic, inertia and aerodynamic loads at maximum continuous rpm (all combinations)
    value:
      far23_cs23:
        yaw_rate_rad_per_s: 2.5
        pitch_rate_rad_per_s: 1.0
        normal_load_factor: 2.5
        thrust: maximum continuous
      cs_luas:
        yaw_rate: 1.5 x maximum predicted yaw rate in the FCS-protected envelope
        pitch_rate: 1.5 x maximum predicted pitch rate
        normal_load_factor: 1.5 x maximum predicted load factor
        thrust: maximum continuous
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.371(a)(2)
    source: *u_csluas
    tag: standard
    note: >-
      The alternative (a)(1) uses the conditions of 351 (yaw) and 423 (pitch). Gyroscopic couple
      (AMC LUAS.371 para 1): two-blade propeller M = 2 * Ip * Omega_prop * omega_body; three or
      more evenly spaced blades M = Ip * Omega_prop * omega_body. Asymmetric disc-flow loads may
      be ignored for propellers up to 2.74 m diameter (para 2).
    also_in:
      - {document: FAR 23 (2017), clause: 23.371(a)(2), value: "2.5 rad/s yaw, 1.0 rad/s pitch, n = 2.5, MC thrust", source: *u_far23, tag: standard}
      - {document: STANAG 4703, clause: "Annex E UL.TE.9(b) (turbine engines)", value: gyroscopic loads from normal manoeuvres must be considered, source: *u_stanag4703, tag: standard}
  - id: ENG-005
    category: engine_mount
    item: Engine mount and attachments maximum allowable loads must be specified from the design usage spectrum and withstood without failure or permanent deformation
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: STANAG 4703
    clause: Annex C UL.RE.11
    source: *u_stanag4703
    tag: standard
    also_in:
      - {document: CS-LUAS, clause: "Appendix B, B-LUAS.23", value: same intent, source: *u_csluas, tag: standard}
  - id: ENG-006
    category: engine_mount
    item: Engine mount forward crash load for engines installed behind and above the seating compartment (manned code)
    value: 15.0
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 561(c)
    source: *u_csvla
    tag: standard
    note: >-
      For a UAV this is only a reference. CS-LUAS.561(c)(1) requires that projection of engines
      and payloads outside the forced-landing area be unlikely. FAR 23.561(e)(1) asks for 18 g
      forward plus take-off thrust for engines inside the fuselage aft of the cabin.
    also_in:
      - {document: FAR 23 (2017), clause: 23.561(e)(1), value: "18.0 g forward + maximum take-off thrust", source: *u_far23, tag: standard}
  - id: ENG-007
    category: propeller
    item: Propeller clearances (max weight, adverse CG, adverse pitch)
    value: {ground_nose_wheel_gear_m: 0.180, ground_tail_wheel_gear_m: 0.230, radial_tip_to_structure_m: 0.026, longitudinal_blade_to_structure_m: 0.013}
    unit: m
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 925
    source: *u_csvla
    tag: standard
    note: >-
      Smaller clearances are allowed if substantiated. There must also be positive clearance with
      the critical tyre flat and the strut bottomed (leaf-spring gear: at 1.5 g deflection). For a
      pusher, also check the rotation (tail-down) attitude.

  # ---------------- emergency landing / crashworthiness ----------------
  - id: CRASH-001
    category: emergency_landing
    item: Crash containment (UAV) - minimise projection of parts (engine, propeller, payload), avoid ignition sources and flammable leaks in hazardous quantity, explosion hazard to third parties
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.561(b)-(c) and AMC LUAS.561
    source: *u_csluas
    tag: standard
    note: Applies when a forced-landing area is used for the emergency recovery capability (CS-LUAS.1412(a)(2)). No inertia factors are given.
    also_in:
      - {document: EASA SC Light-UAS, clause: "Light-UAS.2350(a)", value: "self-containment to minimise debris, fire or explosion beyond the crash area", source: *u_sclu, tag: standard}
      - {document: STANAG 4703, clause: ER.1.1.1.2, value: "N/A in AEP-83 (no detailed argument)", source: *u_stanag4703, tag: standard}
  - id: CRASH-002
    category: emergency_landing
    item: Ultimate emergency-landing inertia load factors (manned occupant protection; used as retention criterion for items of mass and fuel tanks)
    value: {upward: 3.0, forward: 9.0, sideward: 1.5}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 561(b)(2)
    source: *u_csvla
    tag: standard
    note: CS-VLA 967(e)(1) and CS-LUAS.967(e)(1) require fuel tanks and fuel system components to retain fuel under these 561 inertia forces. CS-LUAS.561 gives no numbers, so the CS-VLA values are the practical reference.
    also_in:
      - {document: FAR 23 (2017), clause: 23.561(b)(2), value: "up 3.0 (4.5 acrobatic), forward 9.0, side 1.5, down 6.0 (when 23.807(d)(4) is applied)", source: *u_far23, tag: standard}
      - {document: FAR 23 (2017), clause: 23.561(b)(3), value: "items of mass in cabin: up 3.0, forward 18.0, side 4.5", source: *u_far23, tag: standard}
  - id: CRASH-003
    category: emergency_landing
    item: Turnover (manned code) - upward ultimate inertia and ground friction
    value: {upward: 3.0, friction_coefficient: 0.5}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 561(d)
    source: *u_csvla
    tag: standard
  - id: CRASH-004
    category: emergency_landing
    item: Parachute recovery loads - normal recovery is a limit condition; emergency-only parachute is an ultimate-only condition (worst weight and flight envelope point)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.380, CS-LUAS.382
    source: *u_csluas
    tag: standard
    also_in:
      - {document: STANAG 4703, clause: "UL5.4, UL5.5", value: same, source: *u_stanag4703, tag: standard}
  - id: CRASH-005
    category: emergency_recovery
    item: Emergency recovery capability - flight termination system and/or automatic route to a predefined unpopulated forced-landing area; independent of failed systems; protected from inadvertent activation
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.1412
    source: *u_csluas
    tag: standard
    also_in:
      - {document: SHT-IHA 2026, clause: "Madde 18(1)", value: "on C2 loss, automatic flight to a predefined recovery area not over populated areas, or flight termination", source: *u_shtiha, tag: standard}

  # ---------------- fuel system ----------------
  - id: FUEL-001
    category: fuel_system
    item: Unusable fuel - not less than the quantity at first evidence of malfunction under the most adverse feed condition for each intended operation and manoeuvre (established by test)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.959(a)-(b)
    source: *u_csluas
    tag: standard
    note: CS-LUAS adds that the effect of any pump failure on unusable fuel must be determined.
    also_in:
      - {document: STANAG 4703, clause: UL19.2, value: "established by test; first evidence of starvation", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 959, value: same, source: *u_csvla, tag: standard}
  - id: FUEL-002
    category: fuel_system
    item: Fuel flow capacity relative to take-off fuel consumption
    value: {pump_system: 1.25, gravity_system: 1.50}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.955(b)-(c)
    source: *u_csluas
    tag: standard
    note: Shown in the most critical feed attitude with only unusable fuel plus test fuel in the tank, with any flowmeter blocked. After switching tanks, full power must return within 10 s (955(d)).
    also_in:
      - {document: CS-VLA, clause: CS-VLA 955, value: same, source: *u_csvla, tag: standard}
  - id: FUEL-003
    category: fuel_system
    item: Fuel tank pressure test - conventional metal tank or non-metallic tank not supported by structure
    value: "max(24 kPa, pressure at maximum ultimate acceleration with full tank)"
    unit: Pa
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.965(a)
    source: *u_csluas
    tag: standard
    note: "Fuel head pressure p = rho_fuel * g * n_ult * head. Example: 740 kg/m3, 9 g forward, 0.5 m tank length gives 32.7 kPa, more than 24 kPa."
    also_in:
      - {document: CS-VLA, clause: CS-VLA 965(a), value: "24 kPa", source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.965(a)(1), value: "3.5 psi (24.1 kPa) or ultimate-acceleration pressure", source: *u_far23, tag: standard}
      - {document: STANAG 4703, clause: UL19.4, value: "withstand pressure at maximum ultimate acceleration with full tank (should)", source: *u_stanag4703, tag: standard}
  - id: FUEL-004
    category: fuel_system
