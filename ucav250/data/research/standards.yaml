# -----------------------------------------------------------------------------------------------------
# NOTABLE DIFFERENCES BETWEEN DOCUMENTS (the sizing script must pick one; choices in design_loads_recommended)
# -----------------------------------------------------------------------------------------------------
differences_between_documents:
  - topic: second gust point
    detail: STANAG 4703 applies the 7.6 m/s gust at VCmax (at most 0.9 VD). CS-LUAS, CS-VLA and CS-23 apply 7.62 m/s at VD. Recommended - at VD (more conservative).
    sources: [*u_stanag4703, *u_csluas]
  - topic: negative manoeuvre factor
    detail: CS-VLA uses -1.5. CS-LUAS and CS-23 use -0.4 n (-1.52 at n = 3.8). STANAG says at most -1.5. Recommended -1.52.
    sources: [*u_csvla, *u_csluas]
  - topic: overswing factor (vertical tail)
    detail: CS-VLA uses 1.3 and CS-LUAS uses 1.5. Recommended 1.5.
    sources: [*u_csvla, *u_csluas]
  - topic: engine torque factor for two-stroke twins
    detail: CS-VLA gives 3 (two-stroke, two cylinders). CS-LUAS and CS-23 give 4 (two cylinders, no stroke distinction). A simultaneous-firing twin behaves like a single-cylinder two-stroke (CS-VLA 6). Recommended 6 (estimate).
    sources: [*u_csvla, *u_csluas]
  - topic: nose-wheel forward-load case
    detail: CS uses 2.25 x static vertical with 0.4 x vertical forward. The STANAG/ASTM F2245 figure uses 3.2 x static vertical with 0.9 x static forward. Recommended - check both (envelope).
    sources: [*u_csluas, *u_stanag4703]
  - topic: composite factors with RTD-only data
    detail: CS-VLA AMC and STANAG give 1.5. CS-LUAS AMC gives 2.0 hot/wet x 1.2 manufacturing = 2.4. With ETW-conditioned allowables, all three give 1.2. Recommended - generate ETW allowables and use 1.2.
    sources: [*u_csvla, *u_stanag4703, *u_csluas]
  - topic: VC definition
    detail: CS-VLA sets VC_min = 2.4 sqrt(Mg/S). CS-LUAS lets VC follow the operating requirements. Recommended - CS-LUAS rule (mission-defined VC, VD >= 1.25 VC and VD >= VCmax/0.9).
    sources: [*u_csvla, *u_csluas]
  - topic: flutter margin with flight tests
    detail: STANAG allows 1.15 VD if flight flutter tests with excitation are done. CS-LUAS, CS-VLA and CS-23 require 1.2 VD for rational analysis. Recommended 1.2 VD.
    sources: [*u_stanag4703, *u_csluas]

# -----------------------------------------------------------------------------------------------------
# DESIGN LOADS RECOMMENDED - ready for the sizing / structures scripts
# Values are limit loads unless the key says ultimate. Apply ultimate = limit x factor_of_safety x special factor.
# -----------------------------------------------------------------------------------------------------
design_loads_recommended:
  basis: >-
    Certification-basis candidate: JARUS CS-LUAS Ed. 0.3 (closest UAV code; SHT-IHA Art. 5 lists
    EASA/ICAO AMC/GM as acceptable guidance). Each value is the most conservative of CS-LUAS,
    STANAG 4703, CS-VLA Amdt 1 and FAR/CS-23 (2017), unless a note gives the reason.
  constants:
    g_m_per_s2: {value: 9.80665, tag: standard, source: *u_csvla}
    rho0_kg_per_m3: {value: 1.225, tag: standard, source: *u_csvla}
    fuel_density_kg_per_m3: {value: 740.0, tag: estimate, basis: "Same value as engine.yaml (gasoline + 2 % synthetic 2T oil at 50:1)", source: *u_lim_ds_275ef}
  mtow_cap_for_turkish_class_M2_kg:
    value: 149.9
    tag: estimate
    source: *u_shtiha
    basis: "SHT-IHA Art. 8(1): M2 is 25 kg (inclusive) to 150 kg. 150 kg itself is M3 ('150 kg (dahil) ve daha fazla'). Keep MTOW strictly below 150 kg."

  factors:
    factor_of_safety_ultimate: {value: 1.5, status: requirement, document: CS-LUAS, clause: CS-LUAS.303, source: *u_csluas, tag: standard}
    factor_of_safety_ultimate_non_hazardous_secondary_structure: {value: 1.5, tag: estimate, basis: "STANAG UL2.3 would allow 1.25. 1.5 is kept until SHGM accepts the STANAG argument.", source: *u_stanag4703}
    combination_rule: {value: "ultimate = limit x 1.5 x max(applicable special factor), except that composite factors multiply each other", source: *u_csluas, tag: standard, clause: "CS-LUAS.619; AMC LUAS.619"}
    fitting_factor: {value: 1.15, source: *u_csluas, tag: standard, clause: CS-LUAS.625}
    casting_factor_visual_inspection: {value: 2.0, source: *u_csluas, tag: standard, clause: CS-LUAS.621}
    casting_factor_with_radiography_and_3_sample_tests: {value: 1.25, source: *u_csluas, tag: standard, clause: CS-LUAS.621}
    bearing_factor_rotating_bolted_or_pinned_joints: {value: 2.0, source: *u_stanag4703, tag: standard, clause: UL2.4, status: common_practice}
    frequent_assembly_attachment_factor: {value: 1.5, source: *u_stanag4703, tag: standard, clause: UL2.4, status: common_practice, note: "Removable wings, tail and payload modules. Can be dropped after an assembly-cycle test."}
    hinge_bearing_total_factor: {value: 6.67, source: *u_csluas, tag: standard, clause: CS-LUAS.657}
    push_pull_joint_total_factor: {value: 3.33, source: *u_csluas, tag: standard, clause: CS-LUAS.693}
    control_system_hinge_moment_factor: {value: 1.25, source: *u_csluas, tag: standard, clause: CS-LUAS.395}

  composites:
    design_values_basis: {value: "A-basis for single load path, B-basis for redundant structure", source: *u_csluas, tag: standard, clause: CS-LUAS.613(b)}
    special_factor_ETW_conditioned_allowables: {value: 1.2, source: *u_csvla, tag: standard, clause: "AMC VLA 619 a.; STANAG UL2.4; equals the CS-LUAS AMC 619 manufacturing factor with hot/wet = 1.0"}
    special_factor_RTD_only_allowables_cs_vla_stanag: {value: 1.5, source: *u_csvla, tag: standard, clause: "AMC VLA 619 b."}
    special_factor_RTD_only_allowables_cs_luas: {value: 2.4, source: *u_csluas, tag: standard, clause: "AMC LUAS.619 2.1(i) x 2.3 (2.0 x 1.2)"}
    recommended_composite_special_factor:
      value: 1.2
      tag: estimate
      source: *u_csluas
      basis: >-
        Plan qualified prepreg allowables in ETW condition (moisture-conditioned specimens tested
        at the maximum structure temperature) and a controlled cure process. Total ultimate factor
        on composite PSE = 1.5 x 1.2 = 1.8 on ETW allowables. If only RTD typical data exist, use
        1.5 x 2.4 = 3.6 (CS-LUAS) for sizing until ETW data are available.
    max_structure_temperature_degC:
      value: 70.0
      tag: estimate
      source: *u_csvla
      basis: >-
        AMC VLA 613(c) curve gives about 66-71 degC for a light-grey finish (solar absorptivity
        0.5-0.6, assumed) and 54 degC for white. 70 degC is also the CS-LUAS AMC 619 threshold
        above which hot/wet factors must be agreed. A dark finish (absorptivity 0.9) gives about
        84 degC and would need a higher-Tg resin. Keep the external livery light (absorptivity at
        most 0.6).
    required_wet_Tg_min_degC:
      value: 98.0
      tag: estimate
      source: *u_cw_tg
      basis: "MOL = Tg_wet - 28 degC, so Tg_wet >= 70 + 28 = 98 degC. Areas near the engine or exhaust need a separate thermal check."
    damage_tolerance_strain_limits_microstrain:
      value:
        thin_le_2mm_and_sandwich_skins: {tension: 5000, compression: 2600, shear: 5200}
        laminates_gt_2mm: {tension: 5000, compression: 3000, shear: 6000}
      source: *u_stanag4703
      tag: standard
      clause: UL13.1.2
      status: common_practice
      note: Apply at ultimate load (conservative interpretation). Valid only if HW/RTD degradation < 50 %.

  flight_envelope:
    n_limit_pos: {value: 3.8, source: *u_csluas, tag: standard, clause: "CS-LUAS.337(a); STANAG UL5.2; CS-VLA 337"}
    n_limit_neg_at_VC: {value: -1.52, source: *u_csluas, tag: standard, clause: "CS-LUAS.337(b) (0.4 x 3.8)"}
    n_limit_neg_at_VD: {value: 0.0, source: *u_csluas, tag: standard, clause: "CS-LUAS.333(b)(3) (linear from VC to VD)"}
    n_limit_flaps: {value: 2.0, source: *u_csluas, tag: standard, clause: CS-LUAS.345}
    VD_over_VC_min: {value: 1.25, source: *u_csluas, tag: standard, clause: CS-LUAS.335(b)}
    VCmax_over_VD_max: {value: 0.9, source: *u_stanag4703, tag: standard, clause: UL2.1}
    VA_rule: {value: "VA = VS1g_clean * sqrt(n_limit_pos), capped at VC", source: *u_csluas, tag: standard, clause: CS-LUAS.335(c)}
    VF_rule: {value: "VF >= max(1.4 VS, 1.8 VSF)", source: *u_csluas, tag: standard, clause: CS-LUAS.345(b)}
    note_envelope_protection: >-
      CS-LUAS.337(c) and STANAG UL5.2 allow a lower n if the FCS makes exceeding it impossible.
      This is not used: 3.8 is kept and gusts usually govern at these wing loadings (see
      example_evaluation).
    note_existing_code: >-
      ucav250/analysis/structlib.py vn_diagram() keeps n_neg constant up to VD. The codes reduce
      it linearly to 0.0 at VD. Keeping it constant is conservative but should be stated in the
      structures report.

  gust:
    Ude_VC_m_per_s: {value: 15.24, source: *u_csluas, tag: standard, clause: CS-LUAS.333(c)(1)(i)}
    Ude_VD_m_per_s: {value: 7.62, source: *u_csluas, tag: standard, clause: CS-LUAS.333(c)(1)(ii)}
    Ude_VF_m_per_s: {value: 7.62, source: *u_csluas, tag: standard, clause: CS-LUAS.345(a)(2)}
    altitude_reduction:
      full_value_up_to_m: 6096.0
      linear_to_m: 15240.0
      Ude_VC_at_15240m_m_per_s: 7.62
      Ude_VD_at_15240m_m_per_s: 3.81
      source: *u_csluas
      tag: standard
      clause: CS-LUAS.333(c)(1)
    lateral_gust_same_values: {value: true, source: *u_stanag4703, tag: standard, clause: UL5.3}
    formula:
      n: "1 +/- 0.5*rho0*V_EAS*a*Kg*Ude/(M*g/S)"
      Kg: "0.88*mu/(5.3 + mu)"
      mu: "2*(M/S)/(rho*c_mean*a)   (rho = density at altitude)"
      source: *u_csvla
      tag: standard
      clause: CS-VLA 341

  unsymmetric_and_tail:
    rolling_semispan_airload_split: {value: [1.0, 0.7], source: *u_csluas, tag: standard, clause: CS-LUAS.349(a)}
    aileron_condition_load_factor_fraction: {value: 0.667, source: *u_csluas, tag: standard, clause: CS-LUAS.349(b)}
    horizontal_tail_unsym_other_side_percent: {value: "min(100 - 10*(n - 1), 80) (72 % at n = 3.8)", source: *u_csluas, tag: standard, clause: CS-LUAS.427(b)}
    vertical_tail_yaw_angle_deg: {value: 15.0, source: *u_csluas, tag: standard, clause: CS-LUAS.441(a)(3)}
    vertical_tail_overswing_factor: {value: 1.5, source: *u_csluas, tag: standard, clause: CS-LUAS.441(a)(2)}
    combined_tail_fraction: {value: 0.75, source: *u_csvla, tag: standard, clause: CS-VLA 447}
    checked_manoeuvre_pitch_acceleration_rad_per_s2: {value: "20.1/V_m_per_s * n_m*(n_m - 1.5)", source: *u_csvla, tag: standard, clause: CS-VLA 423(b)}

  control_surfaces:
    hinge_line_parallel_inertia_factor: {value: {vertical_surfaces: 24.0, horizontal_surfaces: 12.0}, source: *u_csluas, tag: standard, clause: CS-LUAS.393(b)}
    mass_balance_limit_factors: {value: {normal: 24.0, fore_aft: 12.0, parallel_to_hinge: 12.0}, source: *u_csvla, tag: standard, clause: CS-VLA 659}
    average_surface_loading: {value: "w_bar = K_curve(W/S) * n/4.4, at least 55 kg/m2 (see CTL-007)", source: *u_csvla, tag: standard, clause: "CS-VLA Appendix B Figure B1 (read_from_drawing)"}
    ground_gust: {value: "H = K*c*S*q, V = min(2.01*sqrt(M/S) + 4.45, 26.8) m/s, K = 0.75 / 0.5 / 0.75", source: *u_csvla, tag: standard, clause: CS-VLA 415}
    actuator_sizing_rule: {value: "servo stall torque at the horn >= 1.25 x max computed hinge moment; structure designed for full servo stall torque", source: *u_csluas, tag: standard, clause: "CS-LUAS.395(a)(1)"}

  landing_gear:
    descent_velocity: {value: "V = clip(0.51*(M*g/S)^0.25, 2.13, 3.05) m/s", source: *u_csluas, tag: standard, clause: "CS-LUAS App. H H.2(b)"}
    drop_height: {value: "h = clip(0.0132*sqrt(M*g/S), 0.235, 0.475) m", source: *u_csluas, tag: standard, clause: "CS-LUAS App. H H.13(a)"}
    wing_lift_fraction_L: {value: 0.667, source: *u_csluas, tag: standard, clause: "H.2(c)"}
    gear_efficiency: {value: {spring_or_rubber_or_tyre: 0.50, oleo_shock_stroke: 0.65, tyre: 0.50}, source: *u_stanag4703, tag: standard, clause: "Annex B UL.GL.1 1.1"}
    wheel_load_factor: {value: "nj = (h + (1 - L)*d)/(ef*d); n_inertia = nj + L", source: *u_stanag4703, tag: standard, clause: "Annex B UL.GL.1 1.1"}
    n_inertia_min: {value: 2.67, source: *u_csluas, tag: standard, clause: "H.2(e)"}
    ground_reaction_factor_min: {value: 2.0, source: *u_csluas, tag: standard, clause: "H.2(e)"}
    target_n_inertia_max:
      value: 4.0
      tag: estimate
      source: *u_stanag4703
      basis: >-
        Design target (not a code value). Keep n_inertia <= n_limit_pos + 0.67 (4.47) so that
        concentrated masses are not driven by landing (STANAG Annex B 1.2). This needs about
        0.15-0.20 m of effective stroke for a spring gear (ef = 0.5) at 50 kg/m2, or an oleo strut.
    concentrated_mass_rule: {value: "if nj > n_limit_pos - 0.67: design engine/tanks/payload for nj + 0.67", source: *u_stanag4703, tag: standard, clause: "Annex B UL.GL.1 1.2"}
    level_landing_drag_ratio: {value: 0.25, source: *u_csluas, tag: standard, clause: "H.4(b)"}
    spin_up_spring_back_combinations: {value: {spin_up: [0.6, -0.5], spring_back: [0.8, 0.5], max_vertical: [1.0, 0.3]}, note: "[Pz/Pz_max, Px/Pz_max]", source: *u_csvla, tag: standard, clause: "AMC VLA 479(b)"}
    side_load: {value: {vertical_factor: 1.33, side_total: 0.83, inboard_wheel: 0.50, outboard_wheel: 0.33}, source: *u_csluas, tag: standard, clause: "H.7"}
    braked_roll: {value: {vertical_factor: 1.33, mu: 0.8}, source: *u_csluas, tag: standard, clause: "H.8"}
    nose_gear_multiples_of_static:
      value:
        aft: {vertical: 2.25, drag: 1.80}
        forward: {vertical: 3.2, forward: 0.90}
        side: {vertical: 2.25, side: 1.575}
      source: *u_stanag4703
      tag: standard
      clause: "Annex B UL.GL.6 (envelope with CS-LUAS H.10)"
    reserve_energy: {value: "1.2 x V_sink with lift = weight; gear may yield, not fail", source: *u_csluas, tag: standard, clause: "H.12(b)"}
    ultimate_factor: {value: 1.5, source: *u_stanag4703, tag: standard, clause: "Annex B UL.GL.1 1.3"}
    belly_landing_ultimate: {value: {downward: 3.0, friction: 0.5}, source: *u_csvla, tag: standard, clause: "CS-VLA 561(e)"}

  engine_mount:
    engine: {value: "Limbach L 275 EF (two-stroke boxer twin, simultaneous firing)", source: *u_lim_ds_275ef, tag: datasheet}
    mean_torque_MCP_Nm:
      value: 25.8
      tag: estimate
      source: *u_lim_ds_275ef
      basis: "16.2 kW at 6000 rpm (engine.yaml max_continuous): T = P/omega = 16200/628.3"
    mean_torque_takeoff_Nm:
      value: 23.6
      tag: estimate
      source: *u_lim_ds_275ef
      basis: "17.15 kW at 6950 rpm (engine.yaml take-off): T = 17150/727.8"
    torque_factor:
      value: 6.0
      tag: estimate
      source: *u_csvla
      basis: >-
        CS-VLA 361(b)(2) factor for a single-cylinder two-stroke. Both L 275 cylinders fire
        together, so the gas-torque pulse is that of a single cylinder. By the letter of the codes,
        CS-VLA gives 3 and CS-LUAS/CS-23 give 4. The mass penalty of 6 is small (limit torque
        155 Nm vs 103 Nm). A measured dynamic torque survey could justify reducing it.
    limit_torque_MCP_Nm: {value: 154.7, tag: estimate, source: *u_csvla, basis: "25.8 x 6.0; acts with 100 % flight condition A loads"}
    limit_torque_takeoff_case_Nm: {value: 141.4, tag: estimate, source: *u_csluas, basis: "23.6 x 6.0 (CS-LUAS applies the factor to the take-off case too); acts with 75 % flight condition A loads"}
    vertical_load_factor_with_torque: {value: 3.8, source: *u_csluas, tag: standard, clause: "CS-LUAS.361(a)(2) flight condition A"}
    negative_vertical_load_factor: {value: -1.52, source: *u_csluas, tag: standard, clause: "CS-LUAS.333/337 (mount must carry all envelope points)"}
    side_load_factor: {value: 1.47, tag: estimate, source: *u_csluas, basis: "Max of CS-LUAS.363 (1.33) and CS-LUAS Appendix F (d)(3) simplified value (1.47)"}
    gyroscopic_case:
      yaw_rate_rad_per_s: 2.5
      pitch_rate_rad_per_s: 1.0
      normal_load_factor: 2.5
      thrust: maximum continuous
      couple_formula_two_blade: "M = 2*Ip*Omega_prop*omega_body"
      couple_formula_three_plus_blades: "M = Ip*Omega_prop*omega_body"
      source: *u_far23
      tag: standard
      clause: "FAR 23.371(a)(2); AMC LUAS.371 para 1"
      note: CS-LUAS alternative - 1.5 x FCS-limited max rates and load factor. Use the larger. Ip comes from the propeller vendor.
    landing_case: {value: "engine as concentrated mass at nj + 0.67 if larger than 3.8", source: *u_stanag4703, tag: standard, clause: "Annex B UL.GL.1 1.2"}
    crash_forward_ultimate:
      value: 15.0
      tag: estimate
      source: *u_csvla
      basis: >-
        CS-VLA 561(c) value for engines aft of and above occupants. It is used as the retention
        criterion for a pusher engine behind avionics and payload bays (CS-LUAS.561(c)(1):
        projection of engine/propeller must be unlikely). FAR 23 would ask 18 g plus take-off
        thrust.
    combination_with_special_factors: {value: "mount fittings 1.15; rubber isolator pins 2.0 bearing; castings (crankcase lugs excluded) 2.0", tag: estimate, source: *u_stanag4703, basis: "Factors from MAT-005/006/007 applied to the mount parts"}

  emergency_landing_ultimate_inertia:
    forward: {value: 9.0, source: *u_csvla, tag: standard, clause: "CS-VLA 561(b)(2)"}
    upward: {value: 3.0, source: *u_csvla, tag: standard, clause: "CS-VLA 561(b)(2)"}
    sideward: {value: 1.5, source: *u_csvla, tag: standard, clause: "CS-VLA 561(b)(2)"}
    downward:
      value: 6.0
      tag: estimate
      source: *u_far23
      basis: "FAR 23.561(b)(2)(iv) value. CS-VLA has none. Added so heavy items (battery, payload, tank) are retained in a hard flat impact."
    applies_to: >-
      Fuel tank and fuel system retention (CS-LUAS.967(e)), engine (with 15 g forward),
      payload/EO-IR turret, batteries, parachute canister, ballast. Use as ultimate (no extra 1.5).
    status: common_practice

  flutter:
    analysis_speed_margin_over_VD: {value: 1.2, source: *u_csluas, tag: standard, clause: "CS-LUAS.629(c); STANAG UL.8"}
    flight_test_required_up_to: {value: VD, source: *u_csluas, tag: standard, clause: "CS-LUAS.629(b)"}
    min_total_damping_target: {value: 0.03, source: *u_flutter_paper, tag: paper, status: common_practice}
    single_failure_case: {value: "free-floating surface (servo disconnected) must be flutter-free up to VD", source: *u_csluas, tag: standard, clause: "CS-LUAS.629(f)"}

  fuel_system:
    tank_test_pressure_Pa: {value: "max(24000, rho_fuel*g*n_ult*head)", source: *u_csluas, tag: standard, clause: "CS-LUAS.965(a)"}
    n_ult_for_tank_pressure: {value: 9.0, tag: estimate, source: *u_csvla, basis: "Largest emergency-landing factor (forward) applied along the longest tank head"}
    expansion_space_fraction: {value: 0.02, source: *u_csluas, tag: standard, clause: CS-LUAS.969}
    sump_fraction: {value: 0.001, source: *u_csluas, tag: standard, clause: CS-LUAS.971}
    sump_min_m3: {value: 120.0e-6, source: *u_csvla, tag: standard, clause: CS-VLA 971}
    pump_flow_factor: {value: 1.25, source: *u_csluas, tag: standard, clause: "CS-LUAS.955(c)"}
    strainer_mesh_per_m: {value: [300, 600], source: *u_csvla, tag: standard, clause: "CS-VLA 977(b)"}
    strainer_area_ratio_min: {value: 5.0, source: *u_csluas, tag: standard, clause: "CS-LUAS.977(b)"}
    firewall_clearance_m: {value: 0.013, source: *u_csluas, tag: standard, clause: "CS-LUAS.967(c)"}
    hot_fuel_test_degC: {value: 43.0, source: *u_csvla, tag: standard, clause: "CS-VLA 961"}
    negative_g_duration_s: {value: 2.0, source: *u_csvla, tag: standard, clause: "AMC VLA 943"}
    vent_no_loss_ramp_slope: {value: 0.01, source: *u_csluas, tag: standard, clause: "CS-LUAS.975(a)(7)"}
    tank_vibration_test: {value: "25 h, 0.79 mm total displacement, 0.9 x MC prop rpm, 2/3 full", source: *u_far23, tag: standard, clause: "FAR 23.965(b)", status: common_practice}
    tank_slosh_test: {value: "25 h, +/-15 deg, 16-20 cycles/min", source: *u_far23, tag: standard, clause: "FAR 23.965(b)(5)", status: common_practice}

  electrical_and_lightning:
    bonding_conductor_min_area_m2: {value: 1.3e-6, source: *u_csvla, tag: standard, clause: "CS-VLA 857(b)"}
    bond_resistance_max_ohm: {value: 0.0025, source: *u_icm_bond, tag: paper, status: common_practice}
    refuelling_bonding_point: {value: required, source: *u_csluas, tag: standard, clause: "CS-LUAS.867(d), 973(d)"}
    lightning_strategy:
      value: >-
        Operational limitation (no flight where lightning exposure is likely, per SC
        Light-UAS.2335(b)) plus bonding of the engine, fuel system, metallic tanks and antennas.
        A CFRP airframe without a lightning-strike protection layer cannot claim lightning
        tolerance.
      tag: estimate
      source: *u_sclu
      basis: >-
        Full ARP5577 direct-effects qualification is out of proportion for a 150 kg UAV. CS-LUAS.867
        needs a lightning assessment agreed with the Authority, and the limitation route is
        explicitly accepted by EASA SC Light-UAS.

  propeller_clearance:
    ground_m: {value: 0.180, source: *u_csvla, tag: standard, clause: "CS-VLA 925(a) (nose-wheel gear)"}
    radial_tip_m: {value: 0.026, source: *u_csvla, tag: standard, clause: "CS-VLA 925(c)(1)"}
    longitudinal_m: {value: 0.013, source: *u_csvla, tag: standard, clause: "CS-VLA 925(c)(2)"}
    note: For a pusher, check ground clearance at the rotation/flare attitude with the main gear statically deflected, and with a flat tyre and bottomed strut (positive clearance).

  example_evaluation:
    status: example only - inputs are placeholders, not YK-250 sizing results
    inputs: {M_kg: 145.0, wing_loading_kg_per_m2: 50.0, CLalpha_per_rad: 5.0, c_mean_m: 0.45, VC_EAS_m_per_s: 45.0, VD_EAS_m_per_s: 60.0}
    tag: estimate
    source: *u_csvla
    basis: Formulas of CS-VLA 341 and CS-LUAS App. H applied to assumed placeholder inputs (sea level).
    results:
      mu_g: 36.3
      Kg: 0.768
      gust_n_at_VC: [4.29, -2.29]
      gust_n_at_VD: [3.19, -1.19]
      governing_n_pos: "4.29 (gust at VC exceeds the 3.8 manoeuvre value)"
      governing_n_neg: "-2.29 (gust at VC)"
      sink_speed_m_per_s: 2.40
      drop_height_m: 0.292
      n_inertia_spring_gear_d_0p10m: 7.18
      n_inertia_spring_gear_d_0p15m: 5.23
      n_inertia_spring_gear_d_0p20m: 4.26
      ground_gust_design_speed_m_per_s: 18.7
    note: >-
      With a high-aspect-ratio, lightly loaded wing the 15.24 m/s gust at VC sets the wing design
      load factors. The sizing script must evaluate gusts at every weight and altitude, not only
      n = 3.8. Landing loads strongly favour about 0.2 m effective stroke or an oleo strut.

# -----------------------------------------------------------------------------------------------------
# TURKISH REGULATION - SHGM SHT-IHA (2026)
# -----------------------------------------------------------------------------------------------------
turkey_regulation:
  document:
    name: "Insansiz Hava Araci Sistemleri Talimati (SHT-IHA)"
    issuer: "Sivil Havacilik Genel Mudurlugu (SHGM)"
    version: 2026 issue. It repeals the SHT-IHA of 22/2/2016 and its amendments (Madde 30).
    in_force_date: "2026-07-30"
    in_force_basis: "Madde 31 (in force on publication); publication and date confirmed by press (30 Jul 2026)"
    transition_end_date: "2027-07-31"
    transition_basis: "Gecici Madde 1 (operational rules), Madde 25(7) (registration of existing UAVs), Madde 27 (conversion: remote ID, geofence, software module), Madde 28-29 (existing documents and licences)"
    references_used_by_shgm: "EU 2019/947, EU 2019/945, ICAO Doc 10019. EASA/ICAO AMC and GM may be considered as guidance (Madde 5)."
    source: *u_shtiha
    tag: standard
    date_source: *u_shtiha_news
  classification:
    classes_by_mtom_kg:
      M0: {min_inclusive: 0.5, max_exclusive: 4.0}
      M1: {min_inclusive: 4.0, max_exclusive: 25.0}
      M2: {min_inclusive: 25.0, max_exclusive: 150.0}
      M3: {min_inclusive: 150.0, max_exclusive: null}
    basit_iha_toy: "Cannot leave a 10 m radius x 20 m high cylinder by design and within M0 limits; exempt from licence, registration and import permit (Madde 4(1)(b), 8(2))"
    yk250_class: >-
      M2 if MTOM < 150 kg, M3 at 150 kg or more. The class does not by itself set the operation
      scope. Authority comes from the pilot licence level and the zone status (Madde 8(4)).
    source: *u_shtiha
    tag: standard
    clause: "Madde 8(1)-(4)"
  airworthiness_and_design_approval:
    route_M2_M3: >-
      Airworthiness rests on compliance with technical requirements set by SHGM for the class.
      M0/M1 need a safety and conformity declaration. M2/M3 need an airworthiness certificate
      ("ucusa elverislilik belgesi") issued by SHGM (Madde 8(5)).
    certification_basis_status: >-
      The 2026 text does not publish the technical requirements, and no type-certification code
      is named. Product conformity and market surveillance will be set by a separate technical
      regulation under Law 7223, by mass class M0-M3 (Madde 24(1)). Recommended: propose CS-LUAS
      (JARUS) tailored by risk, with STANAG 4703 cross-references, as the certification basis in
      an early meeting with SHGM.
    software_certification: >-
      Mandatory for all UAVs except Basit IHA. Covers flight control software, control
      station software and multi-UAV command software, issued by SHGM (Madde 23(4)). UAVs subject
      to registration must pass SHGM software certification tests (Madde 8(6)).
    compliance_software_module: >-
      An embedded "uyum yazilim modulu" in the control station must execute IHATTYS commands
      without delay: envelope reduction, re-routing, landing and flight termination
      (Madde 23(3)). The manufacturer, importer or software supplier must integrate it.
    mandatory_functions:
      - "Mobile app or system link; the UAV must not operate unless the app is open and communicating; serial number verified through the database (Madde 23(1)(a))"
      - "Geofence test of staying inside the zones and the envelope allowed by the licence (Madde 23(1)(b)); default geofence 10 m radius x 20 m height until user registration is verified (Madde 23(2))"
      - "Remote identification for every UAV subject to registration (Madde 23(7))"
      - "C2-link loss: automatic flight to a predefined recovery area avoiding populated areas, or flight termination (Madde 18(1))"
      - "Radio equipment compliant with BTK technical regulations; frequency use under Law 5809 (Madde 23(5))"
      - "Noise emission rules to be set by SHGM (Madde 23(6))"
    import: "SHGM import conformity letter needed for imported UAVs (brand, model, serial, MTOM, class). Proof of embedded compliance module and software certification required (Madde 24(2))"
    source: *u_shtiha
    tag: standard
  registration:
    user_registration: "Mandatory for all users except Basit IHA, through IHATTYS (Madde 11(1))"
    aircraft_registration_tescil: >-
      Mandatory for UAVs flown with a P2 licence beyond 120 m height and/or 3000 m horizontal
      distance (VLOS or BVLOS). A registration number and a P2 pilot are needed to receive air
      traffic services. Procedure per SHY-7 (Madde 11(2)).
    yk250_implication: >-
      A MALE-type surveillance mission (above 120 m, BVLOS) requires tescil, a P2 pilot,
      operation inside an operator, and IHATTYS flight notification for every flight.
    existing_uav_deadline: "Registration of UAVs already in use must be done by 2027-07-31 (Madde 25(7))"
    press_note: >-
      Press summaries say certified-category aircraft and aircraft of 150 kg and above go into the
      SHGM aircraft register. The official text found (Madde 11(2)) ties tescil to the
      120 m / 3000 m flight envelope instead. The official text governs.
    source: *u_shtiha
    tag: standard
  pilot_licensing:
    principle: "Licence level is independent of UAV class and mass (Madde 15(2)); IHA0 -> P0, IHA1 -> P1, IHA2/IHA3 -> P2 (Madde 29(2))"
    P0: {use: "amateur, VLOS, daytime", height_max_m: 120, distance_max_m: 3000, min_age: 10, medical: self-declaration, clause: "Madde 15(2)(a), 15(6), 17(1)"}
    P1: {use: "commercial, VLOS, night allowed with suitable equipment", height_max_m: 120, distance_max_m: 3000, min_age: 18, medical: self-declaration, clause: "Madde 15(2)(b), 15(6), 17(2)"}
    P2:
      use: "everything in P0/P1 plus BVLOS, autonomous, cargo, flight over people/crowds, dangerous goods and other high-risk operations that need certification"
      airspace: "Same flight-zone rules as helicopters. Envelope defined by an IHA corridor or allocated volume. Above 120 m only with coordination with the relevant institutions."
      min_age: 18
      medical: "At least a class 3 medical certificate from SHGM or an EASA member state"
      operator: "P2 flights must be done within a light-aircraft operator ('cok hafif hava araci isleticisi', SHY-6A-CH) or a general aviation operator (SHY-6B) (Madde 15(2)(c), 19)"
      clause: "Madde 15(2)(c), 15(6), 17(3), 19"
    licence_process: "Diploma licence (training and exam at an authorised organisation, KDM-ORG), then an operational licence (KDM-ERP). Only the operational licence allows flying (Madde 15(4))."
    autonomous_ops: "Only under P2 with SHGM operational authorisation. The OM must document the mission profile, emergency scenarios and human-intervention conditions (Madde 7(3)-(4)). AI-assisted autonomy needs a controlled permit until a separate instruction is issued (Madde 7(5))."
    source: *u_shtiha
    tag: standard
  operator:
    M2_operator_type: "M0, M1 and M2 UAVs operate within a light-aircraft operator (Madde 19(1))"
    M3_operator_type: "M3 operates within a light-aircraft operator if MTOM is within the SHY-6A-CH category limits, otherwise within a general aviation operator (Madde 19(1))"
    risk_assessment: "No separate per-flight risk methodology (no SORA). Risk is embedded in the licence level (Madde 9(1))."
    sms_and_reporting: "SMS and occurrence reporting per national regulations (Madde 20)"
    source: *u_shtiha
    tag: standard
  airspace:
    zones:
      green: "No operational permit within published altitude/conditions (P0, P1, P2). P2 needs coordination, SHGM permit and NOTAM if the height or long-range nature requires it."
      red: "Closed by authorities. Flight only with the closing institution's consent (and the Presidency where needed), an SHGM permit and a NOTAM for a defined volume."
      orange: "Area with an existing permit/allocation for someone else. Multi-user flights allowed only with the consent of the permit holder and the issuing authority."
      outside_zones: "Treated as restricted. Permit from SHGM after the local governor's consent."
    vlos_limits: {height_max_m: 120, horizontal_max_m: 3000, applies_to: [P0, P1]}
    above_120m: "P2 only, with coordination with the relevant institutions (Madde 15(2)(c))"
    corridors: "SHGM may set up UAV corridors for long-range BVLOS/autonomous operations. Corridor operations are P2 and need operational authorisation (Madde 14)."
    allocated_volume: "Paid allocation of an airspace volume (m3 x days tariff) through IHATTYS. Its ceiling and floor cannot exceed the licence limits (Madde 13)."
    flight_notification: "P2 users file a notification in IHATTYS before each operation (route or area coordinates, altitude, times) and close it after the flight (Madde 22(1))"
    source: *u_shtiha
    tag: standard
    clause: "Madde 12-15, 21-22"
  design_implications_for_yk250:
    - "Keep MTOM strictly below 150 kg (M2). At 150.0 kg the aircraft becomes M3 (operator type may change; SHY-6A-CH limits apply)."
    - "Plan for an SHGM airworthiness certificate (M2) with a negotiated certification basis (CS-LUAS recommended) and for SHGM software certification of the autopilot and GCS software."
    - "Avionics must provide remote ID, geofencing driven by IHATTYS data, a GCS-embedded compliance software module able to execute IHATTYS commands, and lost-link automatic recovery or flight termination."
    - "Airframe registration (tescil) and P2 pilots are needed for the intended surveillance missions (above 120 m, BVLOS)."
    - "BTK-compliant C2 and payload data links."
  open_items:
    - "SHGM technical requirements for the M2 airworthiness certificate are not published in SHT-IHA. Ask SHGM which code (CS-LUAS, STANAG 4703-derived, SC Light-UAS) it will accept."
    - "Separate Law 7223 technical regulation on UAV product conformity (Madde 24) - not yet located."
    - "SHGM software certification procedure and compliance-module command set (Madde 23(3)-(4)) - not yet published or located."
    - "SHY-6A-CH maximum take-off weight limits for light-aircraft operator categories (they decide the M3 operator type) - not checked."
  source: *u_shtiha
  tag: standard

