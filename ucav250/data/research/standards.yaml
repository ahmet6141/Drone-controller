# -----------------------------------------------------------------------------------------------------
# DOCUMENTS - scope, status and how each one is used for the YK-250
# -----------------------------------------------------------------------------------------------------
documents:
  - id: stanag4703
    full_name: NATO STANAG 4703 / AEP-83 Light UAS Airworthiness Requirements
    applicability: "Fixed-wing UAS, MTOW <= 150 kg, impact energy > 66 J, regular flight in non-segregated airspace"
    mtow_limit_kg: {value: 150.0, bound: max_inclusive, source: *u_stanag4703, tag: standard, clause: "Section 1 Scope"}
    style: >-
      Hybrid. Essential requirements (mandatory) plus "detailed arguments" (UL.x) with acceptable
      evidence. Many numbers are "should" values that may be replaced by a rational argument.
    military_origin_note: >-
      A military standard. It is used here only as an engineering reference for a civil UAV. Only
      the structural, propulsion, fuel and electrical design content was extracted.
    use_for_yk250: Cross-check of every load value. It is the only source of UAV-specific special factors (bearing 2.0, frequent-disassembly 1.5, composite damage-tolerance strains).
  - id: cs_luas
    full_name: JARUS CS-LUAS Edition 0.3 (Nov 2016)
    applicability: "Fixed-wing RPA, MTOW <= 750 kg, no human transport, no flight into known icing; BVLOS (DAA not covered)"
    mtow_limit_kg: {value: 750.0, bound: max_inclusive, source: *u_csluas, tag: standard, clause: "CS-LUAS.1(a)"}
    style: >-
      Prescriptive CS-VLA / CS-23 code adapted to RPA. Applicability is tailored to the SORA risk
      (AMC-LUAS.1). JARUS recommendation, not law.
    use_for_yk250: Primary candidate certification basis to propose to SHGM. It covers RPA-specific items (envelope protection, ERC, C2 link, launch, parachute, crash containment).
  - id: cs_vla
    full_name: EASA CS-VLA Amendment 1 (2009)
    applicability: Manned single-engine aeroplanes, MTOM <= 750 kg (reference only for the YK-250)
    use_for_yk250: The numeric source that STANAG 4703 and CS-LUAS were derived from. Gives SI formulas (descent velocity, drop height, VC min) and two-stroke torque factors.
  - id: far23_cs23_legacy
    full_name: 14 CFR Part 23 before Amdt 23-64 (equivalent to CS-23 Amdt 4)
    applicability: Manned normal/utility/acrobatic/commuter aeroplanes (reference only)
    use_for_yk250: Gyroscopic engine-mount conditions, downward emergency factor, tank vibration and slosh tests, casting inspection table, 8-16 mesh strainer.
  - id: easa_sc_light_uas
    full_name: EASA SC Light-UAS Medium Risk 01 (2020)
    applicability: "EU Specific category, medium risk (SAIL III-IV), MTOM <= 600 kg, no humans on board"
    mtow_limit_kg: {value: 600.0, bound: max_inclusive, source: *u_sclu, tag: standard, clause: "Light-UAS.2000(a)(2)"}
    use_for_yk250: >-
      Objective-level checklist only (2235 strength, 2240 durability, 2305 landing gear, 2325 fire,
      2335 lightning, 2350 forced landing containment, 2511 containment). Numbers must come from a
      MoC such as CS-LUAS.
  - id: astm_f3298
    full_name: ASTM F3298-24 (light UAS design, construction and verification)
    applicability: "Light fixed-wing UAS (not necessarily limited to < 55 lb GTOW)"
    use_for_yk250: Not used for numbers (paywalled, not verified). Purchase is recommended if FAA-style D&R or ASTM-based compliance is wanted.
  - id: jarus_cs_lurs
    full_name: JARUS CS-LURS Certification Specification for Light Unmanned Rotorcraft Systems (Oct 2013)
    applicability: Unmanned rotorcraft only
    use_for_yk250: >-
      Not applicable (the YK-250 is fixed-wing). Note: the task brief called it "EASA CS-LURS".
      It is a JARUS document, not an EASA one.
    source: *u_jarus_icao
    tag: paper

# -----------------------------------------------------------------------------------------------------
# REQUIREMENTS - traceable list
# Fields: id, category, item, value, unit, bound (min | max | equal | formula | qualitative),
#         status, text_type, document, clause, source, tag, note, also_in
# -----------------------------------------------------------------------------------------------------
requirements:

  # ---------------- general structure / factor of safety ----------------
  - id: FOS-001
    category: factor_of_safety
    item: Ultimate factor of safety (limit to ultimate)
    value: 1.5
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.303
    source: *u_csluas
    tag: standard
    also_in:
      - {document: CS-VLA, clause: CS-VLA 303, value: 1.5, source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: UL2.3, value: ">= 1.5 for structure whose failure is Hazardous or worse; >= 1.25 for other structure", status: common_practice, source: *u_stanag4703, tag: standard}
  - id: FOS-002
    category: factor_of_safety
    item: Ultimate factor of safety for non-hazardous structure (fairings, non-PSE)
    value: 1.25
    unit: "-"
    bound: min
    status: common_practice
    text_type: should
    document: STANAG 4703
    clause: UL2.3
    source: *u_stanag4703
    tag: standard
    note: CS-LUAS / CS-VLA have no reduced factor. Use 1.5 unless SHGM accepts the STANAG argument.
  - id: FOS-003
    category: factor_of_safety
    item: Limit-load factor of safety on maximum operational loads
    value: 1.0
    unit: "-"
    bound: min
    status: common_practice
    text_type: should
    document: STANAG 4703
    clause: UL2.2 and UL5.2
    source: *u_stanag4703
    tag: standard
    note: >-
      Must be greater than 1.0 if no load-envelope protection or operator warning exists
      (UL5.2). The YK-250 will have FCS envelope protection (CS-LUAS.1329(e)), so 1.0 applies.
  - id: FOS-004
    category: strength_and_deformation
    item: Limit load without detrimental permanent deformation; ultimate load without failure for at least 3 s (static test)
    value: 3.0
    unit: s
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.305(b)
    source: *u_csluas
    tag: standard
    also_in:
      - {document: CS-VLA, clause: CS-VLA 305, value: 3.0, source: *u_csvla, tag: standard}
  - id: GEN-001
    category: design_speeds
    item: Maximum operating speed VCmax relative to design dive speed VD
    value: 0.9
    unit: "VCmax/VD"
    bound: max
    status: common_practice
    text_type: should
    document: STANAG 4703
    clause: UL2.1
    source: *u_stanag4703
    tag: standard
    also_in:
      - {document: CS-LUAS, clause: "CS-LUAS 1505(a)-(b)", value: "0.9 VD_min <= VNE <= 0.9 VD; VNO <= min(VC, 0.89 VNE); max speed allowed by FCS envelope protection <= VNO", source: *u_csluas, tag: standard}
  - id: GEN-002
    category: design_speeds
    item: Design dive speed VD relative to design cruise speed VC
    value: 1.25
    unit: "VD/VC"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.335(b)(1)
    source: *u_csluas
    tag: standard
    note: CS-LUAS.335(a)(1) lets VC be "defined according to RPA operating requirements". It has no minimum formula.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 335(b), value: "VD >= 1.25 VC and VD >= 1.40 VCmin", source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.335(b), value: "VD >= 1.25 VC; VD >= 1.40 VCmin (normal category)", source: *u_far23, tag: standard}
  - id: GEN-003
    category: design_speeds
    item: Minimum design cruising speed (manned code only)
    value: "VC_min = 2.4 * sqrt(M*g/S)   [m/s; M/S in kg/m2]; VC need not exceed 0.9 VH at sea level"
    unit: m/s
    bound: formula
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 335(a)
    source: *u_csvla
    tag: standard
    note: >-
      Not required by CS-LUAS. It gives about 53 m/s at 50 kg/m2, which is faster than a MALE-type
      surveillance cruise. For the YK-250, choose VC from the mission (CS-LUAS) and keep VD >= 1.25 VC.
    also_in:
      - {document: FAR 23 (2017), clause: 23.335(a), value: "VC_min = 33 sqrt(W/S) kt, W/S in lb/ft2 (normal category)", source: *u_far23, tag: standard}
  - id: GEN-004
    category: design_speeds
    item: Design manoeuvring speed VA
    value: "VA >= VS * sqrt(n_limit); VA need not exceed VC"
    unit: m/s
    bound: formula
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.335(c)
    source: *u_csluas
    tag: standard
    also_in:
      - {document: CS-VLA, clause: CS-VLA 335(c), value: same, source: *u_csvla, tag: standard}

  # ---------------- manoeuvre envelope ----------------
  - id: FLT-001
    category: flight_envelope
    item: Positive limit manoeuvring load factor
    value: "n = min(2.1 + 10900/(W_kg + 4536), 3.8); equals 3.8 for any W below 750 kg"
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.337(a)
    source: *u_csluas
    tag: standard
    note: >-
      At W = 100 kg the formula gives 4.45 and at 150 kg it gives 4.43, so the cap of 3.8 governs.
      It is the SI form of FAR 23.337(a)(1): 2.1 + 24000/(W_lb + 10000).
    also_in:
      - {document: STANAG 4703, clause: UL5.2, value: ">= 3.8 (should)", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 337(a), value: ">= 3.8", source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.337(a), value: "normal: formula capped at 3.8; utility 4.4; acrobatic 6.0", source: *u_far23, tag: standard}
  - id: FLT-002
    category: flight_envelope
    item: Negative limit manoeuvring load factor at VC
    value: "-0.4 * n_pos (= -1.52 for n_pos = 3.8)"
    unit: "-"
    bound: min_magnitude
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.337(b)
    source: *u_csluas
    tag: standard
    also_in:
      - {document: STANAG 4703, clause: UL5.2, value: "<= -1.5 (should)", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 337(b), value: "-1.5", source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.337(b), value: "0.4 n (normal/utility/commuter), 0.5 n (acrobatic)", source: *u_far23, tag: standard}
  - id: FLT-003
    category: flight_envelope
    item: Shape of manoeuvre envelope (positive n up to VD; negative n at VC, varying linearly to 0.0 at VD for the normal category)
    value: "n_neg(VD) = 0.0 (normal category); -1.0 for aerobatic categories"
    unit: "-"
    bound: equal
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.333(b)
    source: *u_csluas
    tag: standard
    also_in:
      - {document: CS-VLA, clause: CS-VLA 333(b), value: "linear from n_neg at VC to 0.0 at VD", source: *u_csvla, tag: standard}
  - id: FLT-004
    category: flight_envelope
    item: Reduced manoeuvre load factors allowed if design features make it impossible to exceed them in flight
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.337(c)
    source: *u_csluas
    tag: standard
    also_in:
      - {document: STANAG 4703, clause: UL5.2, value: same, source: *u_stanag4703, tag: standard}
      - {document: FAR 23 (2017), clause: 23.337(c), value: same, source: *u_far23, tag: standard}
  - id: FLT-005
    category: flight_envelope
    item: Flaps extended - manoeuvre load factor at VF
    value: 2.0
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.345(a)(1)
    source: *u_csluas
    tag: standard
    note: "VF >= max(1.4 VS, 1.8 VSF) unless an automatic flap load limiter is used (CS-LUAS.345(b))."
    also_in:
      - {document: CS-VLA, clause: CS-VLA 345(a)-(b), value: same, source: *u_csvla, tag: standard}
  - id: FLT-006
    category: flight_envelope
    item: Flight envelope protection - FCS must keep the RPA within the operational envelope; protected limits compatible with structural limits
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.1329(e) and CS-LUAS.23
    source: *u_csluas
    tag: standard
  - id: FLT-007
    category: unsymmetrical_flight
    item: Rolling condition - semispan airload on one side with fraction on the other side (condition A)
    value: {one_side: 1.00, other_side: 0.70}
    unit: "-"
    bound: equal
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.349(a)
    source: *u_csluas
    tag: standard
    note: "Aileron loads with n >= 2/3 n_pos; wing torsion increment over aileron span dCm = -0.01 * delta_deg (CS-LUAS.349(b))."
    also_in:
      - {document: CS-VLA, clause: CS-VLA 349, value: same, source: *u_csvla, tag: standard}

  # ---------------- gusts ----------------
  - id: GUST-001
    category: gust
    item: Derived gust velocity Ude at VC (vertical and lateral), sea level to 6096 m
    value: 15.24
    unit: m/s (EAS)
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.333(c)(1)(i)
    source: *u_csluas
    tag: standard
    note: "Reduced linearly from 15.24 m/s at 6096 m to 7.62 m/s at 15240 m."
    also_in:
      - {document: STANAG 4703, clause: UL5.3, value: "15.2 m/s at VC, same altitude reduction, same values for lateral gust (should, unless rational analysis)", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 333(c)(1)(i), value: "15.24 m/s (no altitude reduction)", source: *u_csvla, tag: standard}
  - id: GUST-002
    category: gust
    item: Derived gust velocity Ude at VD, sea level to 6096 m
    value: 7.62
    unit: m/s (EAS)
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.333(c)(1)(ii)
    source: *u_csluas
    tag: standard
    note: "Reduced linearly from 7.62 m/s at 6096 m to 3.81 m/s at 15240 m. Gust load factors vary linearly between VC and VD."
    also_in:
      - {document: STANAG 4703, clause: UL5.3, value: "7.6 m/s applied at VCmax (not VD)", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 333(c)(1)(ii), value: "7.62 m/s at VD", source: *u_csvla, tag: standard}
  - id: GUST-003
    category: gust
    item: Gust with flaps extended at VF
    value: 7.62
    unit: m/s (EAS)
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.345(a)(2), (d)(1)
    source: *u_csluas
    tag: standard
    note: Flaps and their supports also take a 7.62 m/s head-on gust combined with 75 % maximum continuous power slipstream (CS-LUAS.345(d)).
  - id: GUST-004
    category: gust
    item: Gust load factor (Pratt) and gust alleviation factor
    value: >-
      n = 1 +/- (0.5 * rho0 * V * a * Kg * Ude) / (M*g/S);  Kg = 0.88*mu/(5.3 + mu);
      mu = 2*(M/S) / (rho * c_mean * a)   [SI: V EAS m/s, M/S kg/m2, c_mean m, a per rad]
    unit: "-"
    bound: formula
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 341
    source: *u_csvla
    tag: standard
    note: >-
      "a" = airplane CNA slope if wing and tail gust loads are applied together. The wing CL slope
      may be used if tail gust loads are a separate condition. Gust shape is 1-cosine over 25
      chords (CS-VLA 333(c)(2)). CS-LUAS.341 refers to the same criteria and requires a rational
      analysis for canard/tandem layouts.
    also_in:
      - {document: FAR 23 (2017), clause: 23.341(c), value: same formula in imperial units, source: *u_far23, tag: standard}
  - id: GUST-005
    category: gust
    item: Horizontal tail incremental gust load
    value: "dL_ht [daN] = Kg * Ude * V * a_ht * S_ht * (1 - deps/dalpha) / 16.3"
    unit: daN
    bound: formula
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 425(d)
    source: *u_csvla
    tag: standard
  - id: GUST-006
    category: gust
    item: Vertical tail lateral gust load at VC
    value: "L_vt [daN] = Kgt * Ude * V * a_vt * S_vt / 16.3;  Kgt = 0.88 mu_gt/(5.3 + mu_gt);  mu_gt = 2M/(rho * c_t * a_vt * S_vt) * (K/l_t)^2"
    unit: daN
    bound: formula
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 443(b)
    source: *u_csvla
    tag: standard
    note: K = yaw radius of gyration (m); l_t = CG to vertical tail lift centre (m).

  # ---------------- tail and control surface loads ----------------
  - id: CTL-001
    category: control_system
