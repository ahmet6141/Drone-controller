      UL11.2.1 has the same 0.5 Ftu rule for Al and steel. For composites, STANAG UL11.2.3 accepts
      strains below the damage-tolerance limits of CMP-007 as safe-life evidence.
    also_in:
      - {document: STANAG 4703, clause: UL11.2.1, value: "Al and steel stress < 0.5 Ftu", source: *u_stanag4703, tag: standard}

