      - {document: STANAG 4703, clause: UL2.4, value: ">= 2.2 special factor on push-pull joints", source: *u_stanag4703, tag: standard}
  - id: CTL-004
    category: control_surface
    item: Inertia loads parallel to hinge line (limit), as multiple of movable surface weight
    value: {vertical_surfaces: 24.0, horizontal_surfaces: 12.0}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.393(b)
    source: *u_csluas
    tag: standard
    note: AMC LUAS.393(a) says to include wear and axial play.
  - id: CTL-005
    category: control_surface
    item: Concentrated mass balance weight attachments (limit load factors)
    value: {normal_to_surface: 24.0, fore_aft: 12.0, parallel_to_hinge: 12.0}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 659
    source: *u_csvla
    tag: standard
    note: CS-LUAS.659 keeps the three directions but leaves the values "as agreed with the Authority". The CS-VLA values are the reference.
  - id: CTL-006
    category: control_surface
    item: Ground gust limit hinge moment
    value: >-
      H = K * c * S * q; q from V >= 2.01*sqrt(M/S) + 4.45 m/s (M/S kg/m2), V need not exceed
      26.8 m/s; K = 0.75 (aileron, stick locked mid), +/-0.50 (ailerons at full throw),
      +/-0.75 (elevator full up/down), +/-0.75 (rudder neutral / full throw)
    unit: N*m
    bound: formula
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 415
    source: *u_csvla
    tag: standard
    note: Applies to the whole control system if design actuator/pilot forces are below the CS-VLA 397(b) minimums. For a UAV, servo stall torque normally sets the limit (CS-LUAS.395(a)(1)).
  - id: CTL-007
    category: control_surface
    item: Limit average manoeuvring control-surface loading (Appendix B Figure B1), w_bar = K * n/4.4
    value:
      K_curve_A_kg_per_m2: "58.6 for W/S <= 24.8; else 58.6 + 2.284*(W/S - 24.8)"
      K_curve_B_kg_per_m2: "58.6 for W/S <= 28.8; else 58.6 + 1.972*(W/S - 28.8)"
      K_curve_C_kg_per_m2: "58.6 for W/S <= 37.1; else 58.6 + 1.556*(W/S - 37.1)"
      w_bar_min_kg_per_m2: 55.0
    unit: kg/m2 (multiply by g for Pa)
    bound: formula
    status: common_practice
    text_type: AMC-like simplified criteria (allowed for conventional aircraft)
    document: CS-VLA
    clause: CS-VLA Appendix B, B11 and Figure B1
    source: *u_csvla
    tag: standard
    read_from_drawing: >-
      Lines digitised from the rendered figure (axis 0-20 lb/ft2). Uncertainty about +/-0.5 lb/ft2
      (+/-2.5 kg/m2) on K. Breakpoints were converted from 5.07, 5.9 and 7.6 lb/ft2. Curve A is
      for deflection >= 30 deg, B for 20 deg, C for <= 10 deg; interpolate in between. Ailerons use
      curve B up and down. The min w_bar of 55 kg/m2 is printed on the figure.
    note: >-
      CS-LUAS Appendix G holds the same loadings for conventional RPA meeting CS-LUAS.391(b). A
      MALE-type UAV with aft spar or high performance may be excluded, in which case rational
      loads are required.
  - id: CTL-008
