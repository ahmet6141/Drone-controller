  - id: MAT-010
    category: fatigue
    item: Safe-life evidence by stress level at maximum limit load (allowable normal stress)
    value:
      glass_fibre_epoxy_rovings_Pa: 250.0e+6
      carbon_fibre_epoxy_rovings_Pa: 400.0e+6
      aluminium_alloy: "0.5 * Ftu"
      steel_alloy: "0.5 * Ftu"
      wood: per ANC-18
    unit: Pa
    bound: max
    status: common_practice
    text_type: AMC
    document: CS-VLA
    clause: AMC VLA 572(b)
