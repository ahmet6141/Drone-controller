  - id: FUEL-008
    category: fuel_system
    item: Fuel tank sump effective capacity
    value: {fraction_of_capacity: 0.001, cs_vla_minimum_m3: 120.0e-6, cs_vla_alternative_sediment_bowl_m3: 25.0e-6}
    unit: m3
    bound: min
    status: requirement
