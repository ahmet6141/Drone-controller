    value: 2.0
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.621
    source: *u_csluas
    tag: standard
    note: >-
      May be reduced to 1.25 if justified by tests on at least 3 sample castings and all production
