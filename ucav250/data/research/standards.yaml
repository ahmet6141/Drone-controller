      - {cv_percent: 6, factor: 1.03}
      - {cv_percent: 7, factor: 1.06}
      - {cv_percent: 8, factor: 1.10}
      - {cv_percent: 9, factor: 1.12}
      - {cv_percent: 10, factor: 1.15}
      - {cv_percent: 12, factor: 1.22}
      - {cv_percent: 14, factor: 1.30}
      - {cv_percent: 15, factor: 1.33}
      - {cv_percent: 20, factor: 1.55}
    unit: "-"
    bound: equal
    status: common_practice
    text_type: AMC
    document: CS-VLA
    clause: AMC VLA 619 Table 1
    source: *u_csvla
    tag: standard
    note: Estimate the CV from at least 6 specimens and correct it to 95 % confidence with the F factor in AMC VLA 619 (Up = 1.6452, c = 0.2 if unknown).
  - id: CMP-005
    category: composite_environment
    item: Temperature/moisture effects must be included in design values (worst operational condition)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: STANAG 4703
    clause: UL9.3
    source: *u_stanag4703
    tag: standard
    also_in:
      - {document: CS-LUAS, clause: "CS-LUAS.603(a)(3), CS-LUAS.613(c)", value: qualitative, source: *u_csluas, tag: standard}
      - {document: CS-VLA, clause: "CS-VLA 603(a)(3), 613(c), 619(c)", value: qualitative, source: *u_csvla, tag: standard}
  - id: CMP-006
    category: composite_environment
    item: Material operational limit (MOL) relative to wet glass-transition temperature
    value: "MOL = Tg_wet - 28 degC"
    unit: degC
    bound: formula
    status: common_practice
    text_type: industry practice (CMH-17 guidance as reported)
    document: CMH-17 practice (via CompositesWorld)
    clause: n/a
    source: *u_cw_tg
    tag: paper
    note: >-
      Same article: CMH-17 suggests a maximum moisture-conditioning temperature of 82 degC for
      177 degC-cure epoxies. Equilibrium is reached when the mass changes by less than 0.02 %
      between weighings.
  - id: CMP-007
    category: composite_damage_tolerance
    item: Composite PSE damage-tolerance design strains (BVID; also accepted as safe-life evidence)
    value:
      sandwich_skins_and_laminates_le_2mm: {tension_microstrain: 5000, compression_microstrain: 2600, shear_microstrain: 5200}
      laminates_gt_2mm: {tension_microstrain: 5000, compression_microstrain: 3000, shear_microstrain: 6000}
    unit: microstrain
    bound: max
    status: common_practice
    text_type: should ("could be designed")
    document: STANAG 4703
    clause: UL13.1.2 (table read from rendered page 1-13)
    source: *u_stanag4703
    tag: standard
    note: >-
      Valid only if hot/wet degradation is less than 50 % of RTD properties; otherwise use 6.0.
      The alternative (UL13.1.1) is a special factor >= 6.0 on the UL2.3 FoS. The load level is
      not stated. Applying the strains at ultimate load is the conservative reading
      (interpretation, estimate).
  - id: CMP-008
    category: composite_damage_tolerance
    item: Composite airframe damage tolerance - ultimate load with damage up to detectability threshold; no-growth or growth established; residual strength at limit (manned code)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: FAR 23 (2017)
    clause: 23.573(a)(1)-(6)
    source: *u_far23
    tag: standard
    note: CS-LUAS.572 requires PSE identification and an adequate safe life (AMC LUAS.572 not extracted in detail). STANAG UL13.1 requires BVID at ultimate with no growth.

  # ---------------- flutter ----------------
  - id: FLU-001
    category: aeroelasticity
    item: Flutter, divergence and control-reversal freedom by rational analysis up to a speed margin over VD
    value: 1.2
    unit: "V/VD"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.629(c) (printed as CS 23.629)
    source: *u_csluas
    tag: standard
    note: >-
      CS-LUAS.629(a)-(b) also requires natural frequencies from vibration tests and flight flutter
      tests up to VD with proper damping margin. AMC LUAS.629(a) para 2 can waive ground vibration
      test frequency determination if VD < 259 km/h (72 m/s), flight tests are done, and FAA
      Report 45 criteria apply. Report 45 is not valid for T-, V- or boom-tails.
    also_in:
      - {document: STANAG 4703, clause: UL.8, value: ">= 1.2 VD; may be reduced to 1.15 with flight flutter tests with excitation", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 629(b), value: 1.2 VD, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.629(c), value: "1.2 VD / 1.2 MD", source: *u_far23, tag: standard}
  - id: FLU-002
    category: aeroelasticity
    item: Minimum total (aero + structural) damping of flutter-critical modes
    value: 0.03
    unit: "-"
    bound: min
    status: common_practice
    text_type: military specification practice (MIL-A-8870C), secondary source
    document: MIL-A-8870C (via paper)
    clause: n/a
    source: *u_flutter_paper
    tag: paper
    note: Low confidence, verified only from an abstract. Use as a target for flight-flutter test clearance, not as a requirement.
  - id: FLU-003
    category: aeroelasticity
    item: Freedom from flutter up to VD after failure or disconnection of any single element of a primary flight control or tab system or flutter damper
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.629(f)
    source: *u_csluas
    tag: standard
    note: For a UAV with one servo per surface, a disconnected servo gives a free-floating surface. Mass-balance or dual-servo choice must be driven by this.

  # ---------------- ground loads / landing gear ----------------
  - id: LDG-001
    category: landing_gear
    item: Limit descent (sink) velocity for ground-load conditions
    value: "V_sink = 0.51 * (M*g/S)^0.25 m/s, at least 2.13 m/s, need not exceed 3.05 m/s"
    unit: m/s
    bound: formula
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.2(b)
    source: *u_csluas
    tag: standard
    note: "Example: M/S = 40, 50, 60 kg/m2 gives 2.27, 2.40, 2.51 m/s."
    also_in:
      - {document: CS-VLA, clause: CS-VLA 473(b), value: same formula, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.473(d), value: "4.4 (W/S)^0.25 ft/s, 7-10 ft/s (2.13-3.05 m/s)", source: *u_far23, tag: standard}
      - {document: STANAG 4703, clause: "Annex B UL.GL.1 1.1", value: "drop height h = 3.6 sqrt(W/S) in (W/S lb/ft2), h > 9 in (0.229 m); numerically the same as CS-VLA 725", source: *u_stanag4703, tag: standard}
  - id: LDG-002
    category: landing_gear
    item: Free drop test height
    value: "h = 0.0132 * sqrt(M*g/S) m, at least 0.235 m, need not exceed 0.475 m"
    unit: m
    bound: formula
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.13(a)
    source: *u_csluas
    tag: standard
    note: "Effective drop mass with wing lift: Me = M*(h + (1 - L)*d)/(h + d), L <= 0.667. Limit inertia factor n = nj*Me/M + L (H.13(b),(e))."
    also_in:
      - {document: CS-VLA, clause: CS-VLA 725, value: same, source: *u_csvla, tag: standard}
  - id: LDG-003
    category: landing_gear
    item: Wing lift during landing impact, and the minimum limit inertia / ground-reaction load factors
    value: {wing_lift_fraction_max: 0.667, inertia_load_factor_min: 2.67, ground_reaction_load_factor_min: 2.0}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.2(c),(e)
    source: *u_csluas
    tag: standard
    note: Lower values are allowed only if they will not be exceeded in taxiing at speeds up to take-off over terrain as rough as expected in service.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 473(c),(e), value: same, source: *u_csvla, tag: standard}
      - {document: FAR 23 (2017), clause: 23.473(e),(g), value: same, source: *u_far23, tag: standard}
  - id: LDG-004
    category: landing_gear
    item: Wheel load factor from energy balance (simplified)
    value: >-
      nj = (h + d/3) / (ef * d); d = tyre + shock travel; ef*d = 0.5*d for tyre and rubber/spring
      gear, or 0.5*d_tyre + 0.65*d_shock for hydraulic (oleo) gear; limit inertia factor
      n = nj + 0.667
    unit: "-"
    bound: formula
    status: common_practice
    text_type: should (guidance annex)
    document: STANAG 4703
    clause: Annex B UL.GL.1 para 1.1
    source: *u_stanag4703
    tag: standard
    note: The formula assumes L = 2/3 (d/3 = (1 - L) d). The text-layer drop-height formula reads "3.6 x W/S". The rendered page shows 3.6 x sqrt(W/S), and the square-root form is the correct one.
  - id: LDG-005
    category: landing_gear
    item: Concentrated masses (engine, fuel tanks, payload, ballast) must also be designed for the landing load factor when it exceeds the flight factor
    value: "if nj > n_max - 0.67 then design masses for n = nj + 0.67"
    unit: "-"
    bound: formula
    status: requirement
    text_type: rule ("must")
    document: STANAG 4703
    clause: Annex B UL.GL.1 para 1.2
    source: *u_stanag4703
    tag: standard
  - id: LDG-006
    category: landing_gear
    item: Ultimate landing factor and reserve energy
    value:
      ultimate_factor: 1.5
      reserve_energy_descent_velocity_factor: 1.2
      reserve_energy_drop_height_factor: 1.44
      fast_energy_absorbing_gear_ultimate_factor: 1.2
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.12(b) and H.15(a)
    source: *u_csluas
    tag: standard
    note: >-
      In the reserve-energy test the gear may yield but not fail, at 1.2 x limit descent velocity
      with wing lift equal to weight. STANAG Annex B 1.3: FoS 1.5 unless a drop test from 1.44 h
      shows a lower factor is safe. For fast energy-absorbing gear, ultimate = 1.2 x limit.
      Dynamic drop-test proof of strength (H.14) uses 2.25 h or enough height for 1.5 x limit
      factor.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 723(b), value: "1.2 x limit descent velocity", source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: Annex B UL.GL.1 para 1.3, value: "1.5; drop from 1.44 h; 1.2 for fast energy-absorbing gear", source: *u_stanag4703, tag: standard}
  - id: LDG-007
    category: landing_gear
    item: Level landing drag component (combined with vertical reaction)
    value: 0.25
    unit: "drag / max vertical reaction"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.4(b)
    source: *u_csluas
    tag: standard
    note: "Proper combination (AMC VLA 479(b)): spin-up Pz = 0.6 Pz_max with Px = -0.5 Pz_max; spring-back Pz = 0.8 Pz_max with Px = +0.5 Pz_max; max vertical Pz = Pz_max with Px = +/-0.3 Pz_max. Appendix C uses K = 0.25 for W <= 1361 kg."
    also_in:
      - {document: CS-VLA, clause: "CS-VLA 479(b), AMC VLA 479(b), Appendix C", value: 0.25, source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: "Annex B UL.GL.1 table (K = 0.25)", value: 0.25, source: *u_stanag4703, tag: standard}
  - id: LDG-008
    category: landing_gear
    item: Landing attitudes - level (nose and main wheels together; nose wheel just clear), tail-down (stall attitude or max clearance angle, vertical reactions), one-wheel (same reactions as level on that side)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.4-H.6
    source: *u_csluas
    tag: standard
  - id: LDG-009
    category: landing_gear
    item: Side load condition (level attitude, main wheels only, static deflections)
    value: {vertical_load_factor: 1.33, side_inertia_factor_total: 0.83, side_inboard_one_wheel_W: 0.50, side_outboard_other_wheel_W: 0.33}
    unit: "-"
    bound: equal
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.7
    source: *u_csluas
    tag: standard
    note: The vertical reaction is split equally between the main wheels (0.67 W each). Side reactions act at the ground contact.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 485, value: same, source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: Annex B UL.GL.3, value: "0.67W vertical per wheel, 0.5W inboard, 0.33W outboard, 0.83W at CG", source: *u_stanag4703, tag: standard}
  - id: LDG-010
    category: landing_gear
    item: Braked roll (static deflections, level-landing attitude)
    value: {vertical_load_factor: 1.33, friction_coefficient: 0.8}
    unit: "-"
    bound: equal
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.8
    source: *u_csluas
    tag: standard
    note: Drag = 0.8 x vertical reaction at each braked wheel (STANAG figure 0.67W vertical and 0.54W rearward per main wheel). It need not exceed the limiting brake torque.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 493, value: same, source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: Annex B UL.GL.4, value: "0.67W vertical, 0.54W rearward per wheel", source: *u_stanag4703, tag: standard}
  - id: LDG-011
    category: landing_gear
    item: Nose wheel supplementary conditions (multiples of static nose-wheel load at the most critical weight/CG)
    value:
      aft_load: {vertical: 2.25, drag_rearward: 1.80, applied_at: axle}
      forward_load: {vertical: 2.25, forward: 0.90, applied_at: ground contact}
      side_load: {vertical: 2.25, side: 1.575, applied_at: axle}
      stanag_forward_case_vertical: 3.2
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.10
    source: *u_csluas
    tag: standard
    note: >-
      CS text: drag 0.8 x vertical, forward 0.4 x vertical, side 0.7 x vertical, with vertical =
      2.25 x static. The STANAG Annex B figure (ASTM F2245 origin) shows the forward case as 3.2 x
      static vertical with 0.9 x static forward. That is more severe than CS (2.25), so the
      recommended set uses 3.2.
    also_in:
      - {document: CS-VLA, clause: CS-VLA 499, value: same as CS-LUAS, source: *u_csvla, tag: standard}
      - {document: STANAG 4703, clause: Annex B UL.GL.6 figure, value: "(a) 2.25 vert + 1.8 rearward; (b) 2.25 vert + 1.57 side; (c) 3.2 vert + 0.9 forward", source: *u_stanag4703, tag: standard}
  - id: LDG-012
    category: landing_gear
    item: Tail wheel / tail bumper supplementary loads
    value: {obstruction: "tail-down landing reaction acting up and aft at 45 deg through axle", side: "vertical = static tail load with equal side load"}
    unit: "-"
    bound: equal
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.9
    source: *u_csluas
    tag: standard
  - id: LDG-013
    category: landing_gear
    item: Energy absorption test required unless analysis is justified (spring/composite gear with rate-insensitive energy absorption may use analysis)
    value: qualitative
    unit: "-"
    bound: qualitative
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS Appendix H, H.12(a)(3)
    source: *u_csluas
    tag: standard
  - id: LDG-014
    category: landing_gear
    item: Retractable gear belly landing (manned code; for a UAV it protects equipment, fuel and third parties)
    value: {downward_ultimate_inertia_factor: 3.0, ground_friction_coefficient: 0.5}
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-VLA
    clause: CS-VLA 561(e)
    source: *u_csvla
    tag: standard
    note: Fuel tanks must retain fuel in a wheels-up landing and in a landing with the most critical leg collapsed (CS-LUAS.967(e)(2)).
    also_in:
