    tag: standard
    notes: >-
      Retrieved section by section with the eCFR point-in-time API
      (https://www.ecfr.gov/api/versioner/v1/full/2017-08-29/title-14.xml?part=23&section=23.xxx).
      Sections read: 23.335, 23.337, 23.341, 23.361, 23.363, 23.371, 23.473, 23.561, 23.573,
