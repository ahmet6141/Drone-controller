      - {document: FAR 23 (2017), clause: 23.621, value: "critical castings 1.25 (100 % visual + radiographic + MPI/penetrant) or 2.0 (100 % visual + 100 % NDI); non-critical table 2.0 / >1.5 / 1.25-1.5; bearing stresses need not exceed 1.25", source: *u_far23, tag: standard}
  - id: MAT-007
    category: special_factors
    item: Bearing factor - bolted or pinned joints subject to rotation
    value: 2.0
    unit: "-"
    bound: min
    status: common_practice
    text_type: should
    document: STANAG 4703
    clause: UL2.4
    source: *u_stanag4703
    tag: standard
    note: >-
      CS-LUAS.623 and CS-VLA 623 require "a bearing factor large enough" for free-fit parts subject
      to pounding or vibration but give no number. For hinges and control joints, 657 and 693 apply
      (CTL-002, CTL-003). Use 2.0 for landing-gear pivots, engine-mount pins and wing-fold or
      quick-release pins with clearance.
  - id: MAT-008
    category: special_factors
