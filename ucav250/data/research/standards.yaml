open_items:
  - "STANAG 4703 values are from the 2014 ratification draft. Check them against the promulgated AEP-83 (2016) if it can be obtained."
  - "ASTM F3298-24 and EUROCAE ED-325 (MoC for SC Light-UAS) are paywalled and were not read. Buy them if an FAA or EASA route is pursued."
  - "CS-LUAS AMC LUAS.572 (fatigue / damage tolerance details) and Appendix G figures were not extracted in detail. The CS-VLA Appendix B Figure B1 digitisation is used instead."
  - "The 54 degC / absorptivity curve was read from a figure (+/-3 degC). The livery solar absorptivity (assumed 0.5-0.6 for light grey) must be measured or taken from the paint supplier."
  - "The engine torque factor of 6 is a conservative interpretation. A dynamic torque measurement on the L 275 EF with the chosen propeller could support a lower value."
  - "The 2.5 mOhm bonding target and the 3 % flutter damping target are from secondary sources (abstract level only)."
  - "Composite ETW knock-down values (strength retention) belong in the materials research file. Only the factors and the method are given here."
