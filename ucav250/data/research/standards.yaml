# =====================================================================================================
# YK-250 (ucav250) - RESEARCH PHASE - AIRWORTHINESS STANDARDS AND REGULATION
# Civil surveillance / research UAV, 100-150 kg MTOW class, single ~250-275 cc piston engine.
# Payload: EO/IR sensors and mission equipment only (no weapons, no hardpoints).
#
# Conventions
#   - SI units, explicit in key names or in a "unit" field. Load factors are dimensionless ("-").
#     Speeds are equivalent airspeed (EAS) unless stated.
#   - Every number carries "source" (URL, via YAML alias to the sources list) and "tag":
#       manufacturer | datasheet | standard | paper | vendor | estimate
#     "paper" is also used for trade journals and news articles. Values tagged "estimate" carry a
#     "basis" that explains the reasoning.
#   - status:
#       requirement     = mandatory ("must") text in the cited document and clause.
#       common_practice = AMC / guidance / "should" text, industry practice, or a design choice
#                         derived for the YK-250. The "text_type" field says which one.
#     None of these codes is legally binding on a Turkish civil UAV by itself. SHT-IHA (2026) says
#     SHGM sets the technical requirements and that EASA/ICAO AMC/GM may be used as guidance
#     (see turkey_regulation). The certification basis must be agreed with SHGM.
#   - Imperial values in the source documents were converted exactly:
#       50 ft/s = 15.24 m/s, 25 ft/s = 7.62 m/s, 1 psi = 6894.757 Pa, 1 in = 0.0254 m,
#       1 lb/ft2 = 4.8824 kg/m2.
#   - Values read from figures in the PDFs are marked read_from_drawing and give their uncertainty.
# Accessed: 2026-10-05
# =====================================================================================================

meta:
  project: YK-250 (ucav250)
  topic: airworthiness_standards_and_regulation
  phase: research
  date: "2026-10-05"
  scope: >-
    Structural and system design requirements used for light fixed-wing UAS. Covered:
    NATO STANAG 4703 / AEP-83 (light UAS, MTOW at most 150 kg), JARUS CS-LUAS (light unmanned
    aeroplanes, MTOW at most 750 kg), EASA SC Light-UAS (objective-based special condition),
    ASTM F3298 (scope only, paywalled), and the manned analogues CS-VLA Amdt 1 and FAR/CS-23
    (prescriptive, pre-2017). The loads in CS-LUAS, STANAG 4703 and CS-VLA have the same origin,
    and most numeric values are identical across them. Turkish regulation (SHT-IHA, July 2026) is
    summarised in turkey_regulation.
  how_to_use: >-
    "requirements" is the traceable list (document / clause / value). "design_loads_recommended"
    is the set of numbers and formulas a sizing script should use. It takes the most conservative
    value of the codes unless a note explains why not. "turkey_regulation" gives the class,
    registration, approval route, licensing and airspace rules for a 100-150 kg civil UAV.
  related_files:
    engine: ucav250/data/research/engine.yaml (recommended engine Limbach L 275 EF; torque data used in engine_mount)
    structures_library: ucav250/analysis/structlib.py (already implements the CS-VLA 341 gust formula)

