    value: 1.25
    unit: "-"
    bound: min
    status: requirement
    text_type: rule
    document: CS-LUAS
    clause: CS-LUAS.395(a)-(b)
    source: *u_csluas
    tag: standard
    note: >-
      The system limit loads are the maximum loads the actuators can produce. The factor may be
      reduced towards 1.0 if hinge moments come from accurate flight-test data.
    also_in:
      - {document: STANAG 4703, clause: UL2.2, value: ">= 1.25 on computed hinge moments", source: *u_stanag4703, tag: standard}
      - {document: CS-VLA, clause: CS-VLA 395(a)-(b), value: 1.25, source: *u_csvla, tag: standard}
