  - id: cs_luas
    url: &u_csluas "http://jarus-rpas.org/wp-content/uploads/2023/06/jar_07_doc_CS_LUAS.pdf"
    title: "JARUS CS-LUAS Recommendations for Certification Specification for Light Unmanned Aeroplane Systems, JAR_DEL_WG3_D.04, Edition 0.3 (Final), 9 Nov 2016 (177 pages)"
    tag: standard
    notes: >-
      Full text read (Book 1 airworthiness code, Book 2 AMC, Appendices F/G/H). Applicable to
      fixed-wing RPA with MTOW at most 750 kg. Derived from CS-VLA/CS-23. Some clauses keep the
      "CS 23." label (for example CS 23.423 and CS 23.629). Clause CS-LUAS.363 is printed as
      "CS-LURS.363" (a typo in the source). A few equation images did not extract to text. Those
      equations were checked against the CS-VLA originals with the same wording.
  - id: cs_vla_ear
    url: &u_csvla "https://www.easa.europa.eu/en/downloads/66874/en"
    title: "EASA Easy Access Rules for Very Light Aeroplanes (CS-VLA), Amendment 1 (ED Decision 2009/003/R), Nov 2018 edition (190 pages)"
    tag: standard
    notes: >-
      Book 1 and AMC. The AMC VLA 613(c) temperature curve and Appendix B Figure B1 were read
