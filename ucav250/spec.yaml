    efficiency: 0.85
    rated_rpm: 7500.0
    power_electronics_efficiency: 0.94
  electrical_load_continuous_W: 303.0
  installed_mass_kg: 10.96
  envelope:
    length_with_sg750: 0.26
    width: 0.3968
    height: 0.2946
    crank_axis_to_cylinder_side: 0.06
    intake_box_width: 0.3
    cylinder_slab_from_flange: [0.05, 0.18]
  cooling:
    airflow_kg_per_s_at_max_power: 0.42
    fuel_flow_at_max_power_kg_per_h: 7.74
    inlet_ram_recovery: 0.88
    fin_pack_dp_over_q: 0.67
    inlet_external_Dq: 0.0008
  installed_items_kg:
    engine_bare: 7.0
    ecu_harness_ignition_coils: 0.8
    fuel_pump_regulator_filter: 0.35
    starter_generator_sg750: 0.44
    generator_power_electronics: 0.4
    generator_adapter_coupling: 0.15
    exhaust_with_silencers: 1.0
    engine_mount_isolators_bolts: 0.7
    throttle_servo_cht_egt_sensors: 0.12
  mount:
    bolts: 4 x M8 threaded bosses on the rear crankcase face
    bolt_pattern_yz_m: [[-0.0295, 0.051], [-0.0295, -0.051], [0.052, 0.031], [0.052, -0.031]]
    isolator_rigid_body_modes_Hz_max: 20.0
  sources:
    power_max_W: baseline.yaml#engine.power_max_W (manufacturer)
    power_max_continuous_W: baseline.yaml#engine.power_max_continuous_W (estimate)
    wot_curve: baseline.yaml#engine.wot_curve (datasheet)
    bsfc_curve: baseline.yaml#engine.bsfc_curve (estimate, 0.20 point extrapolated)
    altitude_power_lapse_exponent: baseline.yaml#engine.altitude_power_lapse (Hirth 4201 fit)
    installed_mass_kg: baseline.yaml#engine.installed_mass_kg.total
    envelope: baseline.yaml#engine.envelope_m
    mount: baseline.yaml#engine.mount (estimate, packaging only)
    generator: 'baseline.yaml#engine.generator (SG750: 800 W continuous / 1000 W for 180 s, 50 V AC 3-phase at rated_rpm
      7500, output proportional to rpm); efficiency 0.85 = machine (shaft to AC terminals), baseline.yaml#cross_checks.loiter_fuel_flow.basis'
    power_electronics_efficiency: 'V1-02 (fix round 2): the SG750 AC output reaches the DC bus through a 3-phase rectifier
      and a regulator with a boost stage (components.yaml C-CMP-01: about 34 V rectified at loiter rpm, below the 14S bus
      voltage of the 48 V-class bus). Estimate 0.94 = active rectifier about 0.98 x synchronous boost regulator about 0.96
      (iPS750 efficiency not published; 0.92-0.96 is the usual range of this converter class); applied to the DC output
      (R-32, R-52, loiter rpm floor) and to the generator shaft draw. To be replaced by the ePropelled iPS750 data.'
    electrical_load_continuous_W: baseline.yaml#subsystems.electrical_load_W.continuous_total
    cooling: baseline.yaml#engine.cooling + identity study cooling-drag method
    fuel: baseline.yaml#engine.fuel.density_kg_per_m3
    electrical_budget: baseline.yaml#subsystems.electrical_load_W (303 W incl. HD59 20 W average); HD59 peak 100 W baseline.yaml#payload_set.eo_ir_gimbal.power_peak_W
      (Trillium HD59 datasheet); components.yaml octopus_e180_launch (E180 40 W normal / 160 W peak at 24 V); research_payload_allowance_W
      = design allocation (the research payload may draw this much continuously; more needs a larger generator)
    buffer_battery: 'fix round 3 (V2-01): components.yaml#categories.electrical.buffer_batteries[liion_12s2p_molicel_p45b]
      (Molicel INR-21700-P45B 3.6 V 4.5 Ah 16.2 Wh, 45 A continuous, 70 g; 12S2P 43.2 V nominal, 389 Wh, 1.98 kg incl. 0.30
      kg BMS/case/wiring) replaces the 14S2P LiFePO4 pack (2.43 kg, 231 Wh). Usable fraction 0.8 (same basis as the LiFePO4
      hold-up figure); the generator-loss / engine-start reserve is kept at the LiFePO4 value 400 W x 28 min (components.yaml
      buffer_battery_choice); the rest is the E180 peak-support share (R-52). Li-ion has a smaller thermal-runaway margin
      than LiFePO4 (components.yaml note): cell-level fusing, venting and a separate vented battery box in the port side
      bay beside the nose-gear keel slot (layout.rules.bay_contents, fix round 4), more than 1 m from the fuel cells, are
      required. 12S max 50.4 V is inside the PDU input range 24-55 V. Engine start: 2 x 45 A = 90 A continuous (the LiFePO4
      pack gave 100 A; SG750 starter current is an open item)'
    cylinder_slab_from_flange: 'estimate: cylinder/head envelope 0.05-0.18 m ahead of the propeller flange (layout keep-out;
      replace with the Limbach installation drawing)'
  electrical_budget:
    continuous_base_W: 303.0
    hd59_average_W: 20.0
    e180_average_W: 40.0
    e180_peak_W: 160.0
    hd59_peak_W: 100.0
    research_payload_allowance_W: 50.0
    battery_model: 12S2P Molicel INR-21700-P45B Li-ion (cell-fused, vented box)
