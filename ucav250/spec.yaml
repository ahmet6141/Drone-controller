        stroke: 0.3
        text: 'outer panel slides inboard along the main-spar line (plan sweep 8.0 deg; the 3 deg dihedral kink lies in
          the outer-panel root bay, the tongue is straight): the tongue enters the fork, the rear-spar lug its slot fitting
          and the blind-mate wing connector its receptacle in the same stroke; then the two main pins and the rear pin are
          inserted (layout.mechanisms.assembly_paths)'
