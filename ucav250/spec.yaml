      part: YK250-CH-120
      zone: mission_computer
      spec: tray with Dzus quarter-turn retainers on the mission-bay floor
    - id: TR-AFTBAY
      part: YK250-CH-121
      zone: equipment_bay_aft
      spec: aluminium 6061-T6 tray 2 mm (ECU / PE heat sink), M4 nutplates on the floor angles
    - id: TR-PAYLOAD
      part: YK250-PL-852
      zone: payload_bay
      spec: payload tray on 2 rails under the forward fuel deck (M-FWDDECK), 4 x M5 captive screws; research payload <=
        mission.payload_max_kg retained for 9 g fwd / 6 g down ultimate
    design_loads:
      basis: 'structures (CS-LUAS tailored, STANAG 4703): limit n +3.8/-1.52 manoeuvre, gust envelope (sizing loads.n_limit_wing_design),
        FoS 1.5, fitting factor 1.15, bearing factor 2.0 (pinned joints), frequent-assembly factor 1.5; emergency landing
        ultimate inertia 9 fwd / 3 up / 1.5 side / 6 down (standards.yaml design_loads_recommended.emergency_landing_ultimate_inertia);
        emergency parachute = ultimate-only case (CRASH-004). Combination: ultimate = limit x 1.5 x max(special factor)
        (CS-LUAS.619).'
      method: 'first-cut pre-sizing of the interface fittings in ucav250.analysis.layout_check (fitting_presizing): closed-form
        pin shear / bending / bearing and bolt-group shear against the spec.materials allowables; reported as margins of
        safety MS = allowable / applied - 1. The detail phase replaces these with the FE / test substantiation.'
      cases:
      - id: DL-WINGJOINT
        item: outer-panel joint y 0.70 (P-MAIN1/2, fork, tongue, drag pin)
        condition: symmetric flight at n = loads.n_limit_wing_design (gust envelope) x MTOM, Schrenk lift on the reference
          trapezoid, no inertia relief (as sizing.wing_structure)
        factors: 1.5 x 1.5 (frequent assembly) on pin shear / bending; x 2.0 bearing factor on bearing
      - id: DL-PARACHUTE
        item: bridle fittings F-RISER-FWD / F-RISER-AFT
        condition: opening shock 13.1 kN (Galaxy GRS 4/240 published value at 240 kg / 240 km/h, larger than UAVOS 200 5
          g x MTOM) taken by EACH leg alone, direction from vertical to 60 deg aft (snatch)
        factors: ultimate-only (CRASH-004) x 1.15 fitting factor
      - id: DL-ENGINE-MOUNT
        item: 4 x M8 crankcase bolts, firewall feet
        condition: (a) limit torque 154.7 N m (MCP x 6, standards.yaml engine_mount) + 3.8 g vertical; (b) 1.47 g side;
          (c) 15 g forward crash (ultimate, retention)
        factors: 1.5 on (a), (b); x 1.15 fitting; (c) ultimate as given x 1.15
      - id: DL-TURRET
        item: elevator rails / carriage
        condition: emergency landing 9 g fwd / 6 g down / 1.5 g side ultimate on the E180 growth turret mass
        factors: ultimate as given x 1.15
      - id: DL-GEAR
        item: trunnion and nose pivot fittings
        condition: 'landing_gear loads (structures.landing: CS-LUAS App. H, STANAG Annex B nose multiples)'
        factors: 1.5 x 1.15 (fittings), bearing x 2.0; numbers in the gear/chassis detail phase (gear unit selection pending)
      - id: DL-TAIL
        item: fin root, stub and ventral fittings, stabilator spindle bearings
        condition: CS-LUAS.441/427 tail loads (detail phase; the spindle is pre-sized in sizing stab_spindle_check)
        factors: 1.5 x 1.15, bearing x 2.0
  shell:
    rules:
      concept: 'chassis + shell: the chassis (frames, longerons, keel members, decks, wing box) is closed and self-supporting
        for the jig assembly; the shell skins are the shear webs of the semi-monocoque. Structural skins (''fixed'', semi-permanent)
        are fastened with M4 screws into floating nutplates at 25-32 mm pitch (>= 3 D, <= 8 D) so every skin can be replaced;
        access panels and hatches are non-structural (framed cut-outs with doublers on frames/longerons) and use Camloc
        quarter-turn fasteners at 75-100 mm; fairings use M4 screws into potted inserts; the LERX/glove skins are primary
        wing skins and are bonded'
      edge_distance: fastener centre to panel edge and to land edge >= 2.5 D in composite (processes.prepreg_ooa_vacbag.edge_distance_D_min)
        -> 10 mm for M4, 12 mm for the Camloc stud; land width >= 25 mm
      sandwich_edges: core ramped out 1:3 to a 1.6 mm solid laminate edge band 20 mm wide at every fastener line, joggle
        and hinge
      joggles: 'removable panels sit flush in a joggled recess of the neighbouring fixed skin or on frame/longeron flanges:
        joggle depth = panel thickness + 0.3 mm, ramp 1:10, land 25 mm; panel gap 1.0 +- 0.3 mm, step <= 0.3 mm (aero surface)'
      seals: hatches and gear/turret doors carry perimeter seals (aero.drag_rules.gear_doors_sealed); fuel-bay panels a
        fuel-resistant gasket
      tolerances: ISO 2768-mK for trimmed edges and holes (processes); hole positions drilled through jigs from the master
        frame datums
      layups: 'body skins and doors: layups.shell_secondary (0.4/5/0.4 mm); LERX/glove: layups.wing_skin_primary; RF windows:
        gfrp_7781_mtm45 (2 plies 0/90 + 5 mm ROHACELL + 2 plies, no carbon within the window); cowl: layups.shell_secondary
        with stainless heat-shield patches at the exhaust exits'
