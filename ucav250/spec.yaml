          tongue carries the joint moment to the pins; between the pins it falls linearly to zero at the inner pin)'
        zones: [[0.0, 0.4, 58], [0.4, 0.55, 34], [0.55, 0.7, 12], [0.7, 0.8, 36], [0.8, 0.9, 35], [0.9, 1.0, 33], [1.0,
            1.1, 31], [1.1, 1.2, 28], [1.2, 1.3, 25], [1.3, 1.4, 23], [1.4, 1.5, 21], [1.5, 1.6, 20], [1.6, 1.7, 18], [
            1.7, 1.8, 15], [1.8, 1.9, 13], [1.9, 2.0, 12], [2.0, 2.1, 10], [2.1, 2.2, 10], [2.2, 3.6, 10]]
      rear_cap:
        material: cfrp_ud_mtm45_as4
        width_m: 0.025
        plies: 2
        text: 'UD strip of 2 plies under the rear-spar web flanges (bending is carried by the main caps at the deeper main-spar
          station: lighter than thicker rear caps)'
      main_web:
        material: cfrp_pw_mtm45_as4
        orientation_deg: 45.0
        zone_breaks_y_m:
        - 0.7
        - 0.85
        - 1.0
        - 1.15
        - 1.3
        - 1.45
        - 1.7
        - 1.95
        - 2.2
        - 2.45
        - 2.7
        - 2.95
        - 3.6
        min_plies: 3
        stiffening: 'none between the ribs: the web panels are long plates with the web depth as the panel width (rib pitch
          > 3 x depth)'
        zones: [[0.7, 0.85, 6], [0.85, 1.0, 6], [1.0, 1.15, 6], [1.15, 1.3, 6], [1.3, 1.45, 5], [1.45, 1.7, 5], [1.7, 1.95,
            5], [1.95, 2.2, 4], [2.2, 2.45, 4], [2.45, 2.7, 4], [2.7, 2.95, 3], [2.95, 3.6, 3]]
      rear_web:
        material: cfrp_pw_mtm45_as4
        orientation_deg: 45.0
        plies: 3
      ct_box:
        cover_layup: ct_box_cover
        covers: 'sandwich covers layups.ct_box_cover (0.4/6/0.4 mm) continuing the glove skins across the body between the
          spar frames, bonded to the caps (replaces the 2.0 mm monolithic covers of the layout phase: a 0.31 m wide 2 mm
          cover buckles at about 7 MPa and cannot carry the bending compression; the glove-skin load needs a continuous
          path across the body); a centre-line rib (rib_panel, solid lands) at y = 0 with the kink fitting reacts the chevron
          kink couple of the main caps into the two spar webs'
        web: frames FS-MS / FS-RS are the box webs inside the body (rib_panel sandwich)
        kink_fitting:
          material: al_7075_t651_plate
          plate_t_m: 0.004
          w_m: 0.04
          length_m: 0.12
          tab_h_m: 0.03
          tab_t_m: 0.003
          bolts: 6
          bolt_d_m: 0.006
          rib_land_plies: 16
          text: 'fix round 2 (VS2-03): one machined 7075 chevron fitting per main cap (upper and lower) at y = 0: 4 mm plate
            40 x 120 mm bonded over the cap kink (no fastener through the cap) with a 30 mm tab bolted 6 x M6 Ti through
            the 16-ply solid land of the centre-line rib; the opposite kink forces of the upper and lower caps form a couple
            carried by the rib in its plane to FS-MS / FS-RS'
        web_doubler_plies_per_face:
          FS-MS: 1
          FS-RS: 0
        web_doubler: +-45 PW ply added on both faces of the main-spar frame web FS-MS between the caps (y -0.40..0.40);
          none on FS-RS
    wing_joint:
      concept: 'composite spar-stub joint (sailplane practice; fix round 1, S1-02 / S1-03 / S1-05): the CFRP tongue of the
        outer panel (continuation of its main-spar caps) in the CFRP fork of the glove main-spar box on two chordwise Ti
        pins in bonded 4130 bushes (vertical couple of the bending moment); rear-spar 7075 lug in a slot fitting on a vertical
        Ti pin (chordwise force + spanwise couple of the drag moment with the main pins; vertical torsion couple on the
        slot plates); no bonded or bolted spar-cap transfer, no fastener through a spar cap'
      tongue:
        flange_material: cfrp_ud_mtm45_as4
        web_material: cfrp_pw_mtm45_as4
        width_m: 0.03
        height_m: 0.061
        flange_t_m: 0.01
        web_plies: 25
        boss_length_m: 0.05
        buildup_length_m: 0.1
        text: 'CFRP spar stub 30 x 61 mm: UD flanges 30 x 10 mm (the outer-panel main caps built up 1:20 over 0.10 m from
          the root rib), +-45 PW web 25 plies (5.0 mm), solid [+-45/0/90] boss blocks 30 x 41 x 50 mm (>= 40 % +-45) around
          the two pin bores with bonded 4130 bushes'
      transition:
        length_m: 0.1
        intro_length_m: 0.03
        root_rib_land_plies: 20
        root_bay_skin_doubler_plies_per_face: 2
        root_bay_doubler_length_m: 0.15
        text: 'fix round 2 (VS2-04): depth transition from the outer-panel main caps (loft-following, under the skins) to
          the tongue flange line in the root bay of the outer panel: the caps ramp linearly over the 0.10 m cap build-up
          zone from the joint rib (y_junction) outboard (one slope per flange, kinks at both ends: at the joint rib into
          its 20-ply solid land, at the outboard end into the 25-ply tongue web); the web depth follows the caps; the skins
          stay on the loft (reduced cap lever arm checked with the skins in the section) and get 2 extra 0/90 PW plies per
          face between the spars over the first 0.15 m of the outer panel (root-bay skin doubler)'
      fork:
        material: cfrp_pw_mtm45_as4
        prong_plies: 10
        prong_pad_t_m: 0.01
        pad_length_m: 0.05
        cap_width_m: 0.052
        text: 'glove main-spar box YK250-CH-001 from the side-of-body rib to the joint rib: two +-45 PW webs 10 plies (2.0
          mm, the prongs) padded to 10 mm [+-45/0/90] blocks 50 mm long around the bushes, UD caps widened to 52 mm over
          the fork'
      bush:
        material: steel_4130_n
        od_m: 0.022
        id_m: 0.016
        length_tongue_m: 0.03
        length_prong_m: 0.01
        text: bonded 4130 bushes 16 H8 x OD 22 (tongue 30 mm, prongs 10 mm), line-reamed in the jig; bearing of the bush
          OD on the laminate checked against the QI open-hole compression strength (the bore edge distance is below the
          e/D 3 of the QI bearing value; element test required)
      rear:
        lug_material: al_7075_t651_plate
        lug_fitting_bolts: 4
        lug_fitting_bolt_d_m: 0.005
        slot_plate_arm_m: 0.016
        rib_bolts: 2
        rib_bolt_d_m: 0.004
        web_bolts: 2
        web_bolt_d_m: 0.005
        web_pad_plies: 16
        text: rear-spar lug 7075-T651 (layout.chassis.wing_joint.rear_spar.lug) bolted 4 x M5 Ti to the outer-panel rear-spar
          web pad (16 plies); slot fitting 2 x M4 Ti to the joint rib land and 2 x M5 Ti to the centre-section rear-spar
          web pad (16 plies)
      drag_moment: 'in-plane (drag) moment about the vertical axis at the joint plane: a spanwise couple F_y = Mz / dx between
        the main pins (shared equally) and the rear pin; chordwise force on the rear pin; cases PHAA (C = L tan(alpha) at
        the wing CLmax), NHAA (C = L tan(alpha) at the negative CLmin), VD drag (cd_min of the section, aft)'
      factors: frequent-assembly factor 1.5 on the pins, bushes, bores and lugs (the means of attachment, STANAG UL2.4),
        bearing factor 2.0 on bearing; composite special factor 1.2 (with A-basis 0.85 on the single-load-path tongue flanges)
        on the laminates; fitting factor 1.15 on the bolted fittings
    body:
      box_attachment_bolts_per_side_per_frame: 4
      box_attachment_bolt_d_m: 0.006
      frame_land_plies: 16
      shear_wall_doubler_plies_per_face: 0
      midfloor_stiffeners: 2
      aft_keel:
        material: al_7075_t651_plate
        process: cnc_milling_metal
        w_m: 0.024
        h_m: 0.04
        t_m: 0.0025
        replaces:
          material: al_2024_t3_sheet
          w_m: 0.024
          h_m: 0.04
          t_m: 0.0016
        text: 'M-AFTKEEL machined 7075-T651 channel 24 x 40 x 2.5 mm (was formed 2024-T3 1.6 mm: fails the bumper load;
          a formed 7075 / thicker 2024 channel cannot meet the bend-radius rule at this width)'
      fs3738_lower_segment:
        material: al_7075_t651_plate
        depth_m: 0.06
        flange_w_m: 0.02
        flange_t_m: 0.003
        web_t_m: 0.0025
        span_y_m: 0.3
        keel_bolts: 4
        keel_bolt_d_m: 0.005
        end_bolts: 3
        end_bolt_d_m: 0.005
        replaces:
          material: al_2024_t3_sheet
          t_m: 0.002
          depth_m: 0.03
          flange_w_m: 0.02
        text: 'fix round 2 (VS2-03): machined 7075-T651 lower segment of the FS3738 U-ring, I-section 60 mm deep (flanges
          20 x 3 mm, web 2.5 mm) between y +-0.15 (free height to the engine envelope + 10 mm is 150-180 mm there), the
          aft keel beam bolted to its web (4 x M5 12.9), spliced to the 2024 ring legs at both ends (3 x M5 12.9 each):
          reacts the tail-bumper keel reaction at FS3738'
      midfloor_stiffener: 'M-MIDFLOOR: two bonded longitudinal hat stiffeners (PW 4 plies, 20 x 15 mm) under the floor along
        the edges of the equipment-tray cut-out (y +-0.125), FS1810 to FS-FUEL; the fixed outer strips (chine to y +-0.125)
        are the lower chord of the forward body, the removable tray TR-MISSION is not credited'
      frame_land: solid laminate land (core ramped out) 16 plies PW (3.2 mm) at every fitting / box attachment of the fitting
        frames
    tail:
      stab_spar_cap_plies: 12
      stab_spar_cap_width_m: 0.025
      stab_spar_web_plies: 4
      spindle:
        material: ti_6al_4v_annealed_sheet
        od_m: 0.025
        id_m: 0.022
        spline:
          length_m: 0.02
          tooth_depth_m: 0.0005
          position: 'outboard end of the spindle: the last 20 mm of the 0.10 m socket engagement (tip), where the socket''s
            bending moment has fallen to ~10 % of its value at the socket mouth (fix round 2, VS2-08)'
        text: Ti-6Al-4V tube 25 x 1.5 mm (bearing seats ground; involute spline cut on the outboard end, the last 20 mm
          of the socket engagement; Ti sheet allowables used as tube estimate)
      socket:
        material: al_7075_t651_plate
        od_m: 0.031
        length_m: 0.1
        text: 'stabilator root socket: 7075 sleeve 31 x 3 mm, 0.10 m, bonded and cross-bolted into the stabilator root rib
          and spar (internal spline, cross-bolt M6)'
      node:
        material: al_7075_t651_plate
        base_t_m: 0.008
        cheek_t_m: 0.01
        inboard_web_t_m: 0.006
        bearing_od_m: 0.037
        fill:
          base: 0.55
          outboard: 0.7
        text: 'machined 7075-T651 node F-SPINDLE-NODE (layout boxes = envelopes): base flange 8 mm with bolt bosses and
          edge rails (55 % of its envelope), inboard arm = 6 mm web carrying the bearing boss (the layout cylinder: OD 42
          = 2 x tail spindle_housing_radius, bore 37 for the 61805, 30 mm long), outboard cheek 10 mm with pockets outside
          the torsion band (70 %); the stub root moment is carried by the outboard cheek in torsion (open section b t^3/3)
          into the base flange, the base bolts take the in-plane couple'
      fin_spar_cap_plies: 12
      fin_spar_cap_width_m: 0.025
      fin_spar_web_plies: 4
      fin_root_bolt_spacing_m: 0.045
    gear:
      main_leg:
        material: al_7075_t6_sheet
        od_m: 0.042
        wall_m: 0.0035
        text: outer cylinder of the telescopic spring/oil damper leg (SAGITTA architecture); bar allowables taken as the
          7075-T6 sheet values (estimate)
      main_trunnion_pin_d_m: 0.02
      main_trunnion_lug_t_m: 0.012
      main_downlock_pin_d_m: 0.01
      main_downlock_radius_m: 0.035
      main_downlock:
        material: steel_4130_n
        ear_t_m: 0.006
        inner_t_m: 0.01
        gap_m: 0.0005
        text: 'fix round 2 (VS2-07): down-lock = 4130 lock bolt d 10 in double shear in a tight clevis of F-TRUNNION (ears
          2 x 6 mm, gaps <= 0.5 mm) through a 10 mm lock lug of the leg yoke at r 35 mm from the retraction axis; requirement
          for the gear-unit supplier (lock bolt d >= 10 mm 4130 or equivalent, clevis gaps <= 0.5 mm)'
      trunnion_fitting:
        insert_flange_od_m: 0.014
        nutplate_base_m: 0.02
        k_axial_over_shear: 1.0
        text: 'fix round 2 (VS2-02): F-TRUNNION bolt group analysed as a rigid fitting on 9 elastic bolts (5 x M6 12.9 axis
          y into flanged through-thickness inserts of the 16-ply gear-beam land, 4 x M6 12.9 axis z into sealed dome nutplates
          under the 16-ply well-roof land; equal axial and shear bolt stiffness, estimate): force + three moments of the
          leg at the trunnion point; insert flange OD 14 mm, dome nutplate base 20 mm (estimates for the pull-through rows)'
      roof_fitting_doubler_plies_per_face: 2
      roof_fitting_doubler: 'fix round 2 (VS2-02): two 0/90 PW plies added on each face of the well roof (fuel-bay floor)
        over 150 x 100 mm under each trunnion fitting (roof-bolt couple of the leg moments, G-ROOF-TORSION)'
      beam_torsion:
        text: 'fix round 2 (VS2-02): the roll moment M_x of the leg (down-lock reaction) leaves the fitting as a couple
          of y-forces on the gear-beam wall (beam-insert bolts) and z-forces on the well roof (roof bolts); the beam wall
          carries its share by plate bending between its top edge (well-roof deck, diaphragm) and its bottom edge (lower
          skin corner, diaphragm) over the flange length of the fitting; the diaphragms carry the edge forces in shear to
          FS-GEAR and the well forward wall'
      nose_leg:
        material: al_7075_t6_sheet
        od_m: 0.036
        wall_m: 0.003
      nose_pivot_pin_d_m: 0.016
      nose_pivot_pin_id_m: 0.01
      nose_pivot_lug_t_m: 0.006
      nose_pivot_bush_od_m: 0.022
      uplock:
        insert: potted M5 insert sleeves, potting diameter 24 mm (one potted block under the 20 mm pattern), in the well-roof
          sandwich; hook load line within 6 mm of the pattern centre
        b_p_m: 0.012
        hook_offset_m: 0.006
      beam_end_clip:
        bolts: 3
        bolt_d_m: 0.005
        text: 'gear-beam ends: bonded 7075 angle clips along the beam height, 3 x M5 Ti into the 16-ply solid lands of FS-RS
          / FS-GEAR'
      gear_operating_speed_factor_vs: 1.6
      door_hinge_pin_d_m: 0.004
      door_hinge_count: 3
    engine_mount:
      strut_od_m: 0.0127
      strut_wall_m: 0.00089
      ring_od_m: 0.0159
      ring_wall_m: 0.00089
      foot_bolts: 2
      foot_bolt: M8 12.9
      backing_plate_m: [0.056, 0.032, 0.005]
    firewall:
      core_insert:
        core: core_rohacell_71wf
        area_m2: 0.12
        text: 'ROHACELL 71 WF core in the lower and outboard part of the firewall (y +-0.01..0.25, z 0.02..0.27: lower engine
          feet and stabilator-node bases), core splice to the 51 WF'
      foot_land:
        core: core_rohacell_71wf
        core_insert_m: 0.2
        land_plies: 24
        land_r_m: 0.085
        core_shear_peak_factor: 1.23
        peak_basis: 'fix round 2 (VS2-06): the core shear round the land is not uniform (the nearest edge support draws
          more of the foot load); peak / mean = 1.23 from the review''s plate-shear distribution (structures-2 VS2-06; no
          own FE), applied to the mean tau = P / (2 pi r d); land radius 66 -> 85 mm to restore the margin'
        text: 'lower engine-mount feet (F-EMOUNT-LO): the firewall sandwich gets a ROHACELL 71 WF core insert 200 x 200
          mm and a solid PW land of 24 plies (4.8 mm, core ramped out 1:3) of radius 85 mm around each foot; the out-of-plane
          (x) foot load is carried by plate bending and core shear to the firewall perimeter (no longeron at the lower feet)'
      plate_support_m: distance from the foot to the nearest firewall edge support (fuselage contour - inset)
    parachute:
      shackle_pin_d_m: 0.008
      shackle_material: ti_6al_4v_annealed_sheet
      lug_ear_t_m: 0.006
      lug_w_m: 0.031
      lug_e_m: 0.0155
      frame_bolts: 2
      frame_bolt_d_m: 0.005
      floor_bolts: 4
      floor_bolt_d_m: 0.004
      floor_bolt_rows_m: 0.024
      floor_washer_plate:
        material: al_7075_t651_plate
        w_m: 0.048
        l_m: 0.04
        t_m: 0.003
        text: 'one 7075 washer plate 48 x 40 x 3 mm under the four floor bolts, below the spine floor pad (fix round 2,
          VS2-01: pull-through of the fitting moment)'
      frame_land_plies: 32
      spine_pad_plies: 16
      spine_plies: 4
      skin_screw: ISO 7380 M4 A2-70 into nutplates, pitch 25 mm, both spine flanges, FS1810 -> FS-FUEL (P-MB-UPPER)
      skin_screw_pitch_m: 0.025
      text: 'bridle fittings in the dorsal spine channel M-SPINE: x-component and the fitting moment by 4 x M4 12.9 (axis
        z, nuts on a 48 x 40 mm washer plate under the 16-ply spine pad), z-component by 2 x M5 12.9 (axis x) into a 32-ply
        (6.4 mm) solid land of the frame; Ti-6Al-4V shackle pin d 8 in a tight clevis (ears 6 mm, gaps 0.5 mm) through a
        4130 bridle spool (fix round 2, VS2-01) (FS1810 / FS-RS, core ramped out); spine 4 plies PW (0.8 mm) U 44 x 24 with
        60 mm flanges, screwed to the fixed mission-bay upper skin P-MB-UPPER (net x-component in shear to the chine longerons)'
    fuel_bay:
      floor_layup: fuel_floor_wellroof
      floors: [M-WELLROOF]
      floor_note: 'the aft-cell floor (well roof) keeps the 6.8 mm thickness of the layout (no interface change) with 3-ply
        faces and the denser ROHACELL 71 WF core (core shear and face strain under the bay pressure); the forward-cell floor
        M-FWDDECK keeps layups.rib_panel: the two payload-tray rails are bonded and screwed to its underside at 50 mm pitch
        as stiffeners and halve its span'
      payload_rails_y_m: 0.1
      payload_rail:
        material: al_6061_t6_sheet
        flange_w_m: 0.02
        flange_t_m: 0.0025
        stem_h_m: 0.02
        stem_t_m: 0.0025
        text: payload-tray rails 6061-T6 T-section 20 x 20 x 2.5 mm at y +-0.10, FS-FUEL to the main-spar frame, bonded
          + M4 screws at 50 mm to the deck underside
      well_web_t_m: 0.001
      well_web_y_m: 0.0105
      well_web_height_m: 0.12
      well_web: 'M-WELLKEEL: two keel webs 1.0 mm solid PW laminate (5 plies, 0/90 and +-45 alternating) at y +-0.0105..0.0115,
        the walls of the centre-line harness channel between the two main wells (well forward wall to FS-GEAR, well roof
        to 0.12 m below it): halve the span of the well roof under the aft fuel cell; the inner-door hinge brackets (hinge
        lines y +-0.01) are bolted to their lower-edge flanges'
    turret:
      rail_screws_per_rail_end: 4
      screw: M3 A2-70
      roof_block: bearing block through-bolted 4 x M4 A2-70 with a 2 mm 7075 backing plate on the upper roof face (no potted
        inserts in tension)
      door_area_each_m2: 0.0223
      door_rail: 6061-T6 rail with a 1 mm retaining lip, PTFE slider
    ground_handling:
      tow_load_fraction_W: 0.3
      tow_load_basis: '0.3 W, the CS-23.509 / FAR 23.509 towing load for W <= 30 000 lb, used as a conservative design choice:
        the CS-LUAS / CS-VLA towing clause text is not in the research files; tow bar on the nose-fork axle (layout.chassis.ground_handling)'
      tow_load_basis_tr: 'W <= 30 000 lb için CS-23.509 / FAR 23.509 çekme yükü 0,3 W, muhafazakâr tasarım kararı olarak:
        CS-LUAS / CS-VLA çekme maddesi metni araştırma dosyalarında yok; çekme demiri burun çatalı dingilinde (layout.chassis.ground_handling)'
      tie_down: 'not designed for outdoor mooring: the operating concept keeps the aircraft in its transport cradle / shelter
        when not flying (van transport, assembled on the field, assembly.transport); tie-down points and their wind loads
        are an open item if outdoor parking is required'
      jacking: 'no jacking points: the aircraft is lifted by two persons or rests on the transport cradle saddles (FS1810
        / FS-GEAR lower lands, structures TR-PAD / TR-FRAME) for gear work'
    transport:
      factors_limit:
        vertical: 3.0
        fore_aft: 1.5
        lateral: 1.5
      basis: 'design choice (no transport load specification in the research files): road transport in the cradle, limit
        load factors 3.0 g vertical, 1.5 g fore/aft, 1.5 g lateral (each alone), FoS 1.5; to be replaced by the transport
        specification of the operator'
    mass:
      note: bottom-up masses of the sized structure (structures.mass_tally), before the growth allowance; read by sizing.wing_structure
        (caps, webs, rear spar, joints, skins_add), sizing.mass_items (carry-through, keel and floor additions, firewall
        lands, stabilator node fittings and bearings, nose-gear pivot fitting, parachute spine and fittings) and sizing.tail_structure
        (stabilator spindle + socket)
      wing:
        caps_kg: 2.478
        webs_kg: 0.51
        rear_spar_kg: 0.344
        joints_kg: 1.274
        skins_add_kg: 0.242
      chassis:
        carry_through_kg: 2.058
        keel_beams_longerons_add_kg: 0.148
        floors_trays_rails_add_kg: 0.266
        frames_bulkheads_add_kg: 0.409
        stabilator_spindle_bearing_housings_kg: 0.736
        nose_pivot_fitting_kg: 0.198
        parachute_spine_fittings_kg: 0.451
      tail:
        stabilator_fittings_kg_each: 0.236
      delta_vs_concept_allocation_kg:
        A_wing_primary: -0.607
        B_carry_through: 0.458
        C_chassis_changes: 0.823
        D_spindles: 0.108
        E_allocation_replacements: -0.001
      delta_total_kg: 0.781
    summary:
      n_margins: 256
      n_requirements: 19
      ms_min: 0.0
      ms_min_id: W-CAP-11
      report: out/structures.md, out/structures.json, docs/04_yapi_hesaplari.md

