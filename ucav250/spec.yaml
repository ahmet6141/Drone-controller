  mechanisms:
    rules: 'Joint = core.parts.Joint in the REST pose (all joints at rest = 0: gear down, turret in, surfaces neutral, hatch
      closed). Producers register these names exactly (checks.py and layout.clearances refer to them); a port joint is the
      mirrored starboard joint with the axis chosen so that the same prop value gives the same physical motion. ''expr''
      is the Blender simple expression of a coupled joint (control properties of YK250_Root); ''sequences'' are the sampled
      states the swept-interference check evaluates.'
    controls:
      gear_up:
        range: [0, 1]
        unit: '-'
        text: 0 = gear down and locked, 1 = up and locked; legs move in 0.15-0.85, main inner doors open/close at the ends
      turret:
        range: [0, 1]
        unit: '-'
        text: 0 = retracted (flush, doors closed); 0-0.2 doors open; 0.2-1 elevator extends 0.12 m
      aileron_deg:
        range: [-20, 20]
        unit: deg
        text: + = roll right (starboard TE up)
      flap_deg:
        range: [0, 40]
        unit: deg
        text: take-off 35, landing 0
      elevator_deg:
        range: [-20, 15]
        unit: deg
        text: stabilator, + = TE down
      rudder_deg:
        range: [-25, 25]
        unit: deg
        text: + = trailing edges to port
      steer_deg:
        range: [-20, 20]
        unit: deg
        text: nose-wheel steering, gear down only
      para_hatch_deg:
        range: [0, 110]
        unit: deg
        text: parachute hatch (deployment only)
      prop_deg:
        range: [0, 120]
        unit: deg
        text: propeller phase
    joints:
    - name: aileron_R
      kind: revolute
      origin: [3.02162, 2.15993, 0.07777]
      axis: [0.079842, 0.995212, 0.056371]
      lo: -0.349066
      hi: 0.349066
      rest: 0.0
      prop: aileron_deg
      scale: -0.0174533
      moves: YK250-FC-200-R (+ its horn; FC parts of the wing module)
      side: R
      notes: hinge line at 0.75 chord, mid-thickness, y 2.160-3.420 m; + = TE down
    - name: aileron_L
      kind: revolute
      origin: [3.02162, -2.15993, 0.07777]
      axis: [-0.079842, 0.995212, -0.056371]
      lo: -0.349066
      hi: 0.349066
      rest: 0.0
      prop: aileron_deg
      scale: 0.0174533
      moves: YK250-FC-200-L
      side: L
      mirror_of: aileron_R
      notes: + = TE down (port)
    - name: flap_R
      kind: revolute
      origin: [2.90661, 0.7307, -0.01136]
      axis: [0.080066, 0.994847, 0.062194]
      lo: 0.0
      hi: 0.698132
      rest: 0.0
      prop: flap_deg
      scale: 0.0174533
      moves: YK250-FC-202-R (+ its horn; FC parts of the wing module)
      side: R
      notes: hinge line at 0.75 chord, mid-thickness, y 0.730-2.088 m; + = TE down
    - name: flap_L
      kind: revolute
      origin: [2.90661, -0.7307, -0.01136]
      axis: [-0.080066, 0.994847, -0.062194]
      lo: 0.0
      hi: 0.698132
      rest: 0.0
      prop: flap_deg
      scale: 0.0174533
      moves: YK250-FC-202-L
      side: L
      mirror_of: flap_R
      notes: + = TE down (port)
    - name: rudder_R
      kind: revolute
      origin: [3.79162, 0.18743, 0.37861]
      axis: [0.448124, 0.334892, 0.828874]
      lo: -0.436332
      hi: 0.436332
      rest: 0.0
      prop: rudder_deg
      scale: -0.0174533
      moves: YK250-FC-300-R
      side: R
      notes: fin span coordinate 0.3-0.88 m (root clear of the cowl, tip cap above 0.88 m); rudder_deg + = trailing edges
        to port
    - name: rudder_L
      kind: revolute
      origin: [3.79162, -0.18743, 0.37861]
      axis: [0.448124, -0.334892, 0.828874]
      lo: -0.436332
      hi: 0.436332
      rest: 0.0
      prop: rudder_deg
      scale: -0.0174533
      moves: YK250-FC-300-L
      side: L
      mirror_of: rudder_R
      notes: 'axis = mirrored up-span axis: + still moves the trailing edge to starboard'
    - name: stabilator_R
      kind: revolute
      origin: [3.73784, 0.34044, 0.21829]
      axis: [0.0, 1.0, 0.0]
      lo: -0.349066
      hi: 0.261799
      rest: 0.0
      prop: elevator_deg
      scale: 0.0174533
      moves: YK250-TL-256-R + spindle YK250-TL-301-R + horn
      side: R
