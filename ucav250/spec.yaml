# ---------------------------------------------------------------------------------------------------------------------
# configuration: configuration decisions
# ---------------------------------------------------------------------------------------------------------------------
configuration:
  name: D · HANÇER (kullanıcı seçimi, ucav250/data/concepts_v2/directions.yaml#hancer)
  propulsion: 'single open pusher propeller (Mejzlik 31x12 3B, 5 deg down-thrust) on the Limbach L 275 EF, direct drive
    with a 110 mm hub spacer, plane 0.10 D behind the cowl lip (R-50); guards measured in the inclined disc plane: the canted-fin
    trailing edges cross it 75 mm outside the tip circle about 36 deg either side of the top, the ventral fin trailing edge
    about 50 mm outside the tip circle at the bottom with the replaceable bumper skid under the disc; the stabilators lie
    in the hub plane about 0.4 m outside the tip circle; the remaining sectors are open (no duct: user decision) - the disc
    is not a personnel guard (ground-handling procedure: propeller stopped)'
  tail: twin outward-canted fins with rudders (roots buried in the dorsal skin along the whole chord) + two all-moving horizontal
    tails (stabilators, NACA 0014) on stub spindles at the forward end of the vortex-lattice AC band, each beside a fixed
    root stub (constant 8 mm root gap) + ventral fin/tail bumper as the lower propeller guard; sizes from the trim (local
    stabilator CL incl. eta_t and the full-throttle lift-off/go-around cases) and directional-stability rules (tail.sizing_rules)
  wing_position: mid wing on the chine plane; the chines run into curved leading-edge root extensions (LERX) that blend
    into the high-aspect-ratio NLF(1)-0416 outer panels
  gear: 'retractable tricycle: main legs on longitudinal trunnions in the belly gear frame, inward retraction (wheels side
    by side under the wing box, fuller flat belly at the wells); steerable nose leg retracting aft into a keel slot ahead
    of the turret bay; flush doors with perimeter seals; 2.5 deg nose-up static attitude; electric actuation (SAGITTA practice)'
  fuselage_style: chined lifting body (diamond-like sections, crisp chine and dorsal/keel ridges, fuller flat belly between
    the payload bay and the main wells, round cowl closure at the propeller hub)
  turret: 'retractable EO/IR turret: Trillium HD59 lowered from a belly bay on a ball-screw lift for the mission through
    a flush aperture ring (5 mm radial clearance), bay doors closing the ring opening for take-off, landing and transit;
    bay sized for the Octopus E180 growth envelope (0.18 m x 0.23 m, own ring)'
  transport_breakdown: centre body with the integral LERX/glove (2 x y_junction = 1.40 m wide) + two removable outer wing
    panels (span/2 - y_junction = 2.90 m each) + removable stabilators; propeller removed
  reasons_tr: ['Kullanıcı ilk kavramları ''yine aynı tip'' bularak reddetti; v2 tasarım yönü çalışmasında (MANTA, OK, HALKA,
      HANÇER) D · HANÇER seçildi: köşeli taşıyıcı gövde + LERX + ikiz eğik dikey kuyruk + hareketli yatay kuyruk.', 'Kanal
      (duct) içindeki fan kullanıcı tarafından reddedildi; açık itici pervanenin üst-yan bölgelerini eğik dikey kuyrukların
      firar kenarları (eğik disk düzleminde uç çemberinin 75 mm dışında), alt bölgesini ventral kanatçık ve diskin altındaki
      değiştirilebilir tampon kızağı korur; stabilatörler göbek düzleminde uç çemberinin yaklaşık 0,4 m dışındadır. Diğer
      bölgeler açıktır; disk personel koruması değildir (yerde pervane durdurulur).', 'İçeri katlanır iniş takımı ve geri
      çekilir taret kullanıcının isteğidir; kütle (SAGITTA referansı, taret kaldırma mekanizması) ve hacim boyutlandırmada
      açıkça sayılmıştır (ödünleşim tabloları sizing.md).', 'Kanat açıklığı 7,2 m: dış panel boyu (span/2 − y_junction)
      taşıma için 3,4 m sınırının altında kalır; gövde + LERX orta kesiti tek parça taşınır. Daha uzun açıklık indüklenmiş
      sürüklemeyi azaltır.', 'Kanat açıklığı 7,2 m; v1.2''de eldiven/dış panel birleşimi y = 0,70 m''ye alındı: dış paneller
      2,90 m (taşıma hedefi; R-29 sınırı 3,4 m), orta kesit 1,40 m. Daha küçük LERX (tepe x = 1,80 m) ve sivrilme 0,35 kanat-gövde
      AM''sini geriye alır, burun aşağı sıfır taşıma momentini ve trim yükünü azaltır.', 'Paraşüt: UAVOS 200 (4,5 kg) GRS
      4/240 SOFT (5,9 kg) yerine seçildi; taşıyıcı gövdenin iç hacmi büyük bölmeyi (0,300 x 0,300 x 0,275 m) taşır, 1,4
      kg kazanç dayanıma gider.', 'Faydalı yük bölmesi boş kütle ağırlık merkezine ortalanır; ağırlık merkezi aralığı daralır,
      trim kaybı ve trim sürüklemesi azalır; ana takım bölmenin arkasına yerleşir.', 'Pervane 31x12 3B: hız/güç bağımlı
      soğutma sürüklemesiyle 32x18 2B tırmanmada 3,9 m/s''de kalır (R-05 ≥ 4,0 karşılanmaz) ve kalkış koşusu ile takım yuvası
      kurallarını da bozar; 3B bunları karşılar; jeneratör devir alt sınırıyla (R-52) 2B''nin düşük bekleme devri dayanımı
      da düşürür (ödünleşim tablosu).', 'v1.2: R-02 için tasarım değişiklikleri: kanat planı (sivrilme, LERX, eldiven),
      contalı takım kapakları, taret açıklık halkası, bekleme 1,2 VS tabanının görev ağırlık merkezinde hesaplanması. v1.3''te
      R-02 ayrıca onaylanmamış bir R-52 gevşetmesine dayanıyordu; v1.4''te bu gevşetme geri alındı ve küt kaporta tabanı
      için kurulum katsayısı 0,93 tahmin edildi (9,90 h). v1.5: proje liderinin gereksinim kararı: kullanıcının seçtiği
      özellikler (içeri katlanır takım, geri çekilir taret, dört kuyruk yüzeyi, köşeli geniş gövde) korunur; R-02 tasarım
      görevi faydalı yüküyle (sizing.py türetir) ≥ 10 h, azami 20 kg yükle ≥ 9,5 h (R-02b); docs/02 ''Gereksinim kararı''.',
    'Tampon batarya 12S2P Li-ion (Molicel P45B, 1,98 kg): R-52''nin E180 tepe destek payını jeneratör kaybı yedeğinin üstüne
      taşır ve LiFePO4 14S2P''den 0,45 kg hafiftir; LiFePO4 ile aynı yetenek ya E180 devir tabanında uçmayı (dayanım kaybı)
      ya da iki kat batarya kütlesini gerektirir. Li-ion''un ısıl kaçak payı daha küçüktür: hücre sigortası, havalandırmalı
      kutu ve yakıt hücrelerinden 1 m''den uzak, burun takımı kuyusunun yanındaki sol yan bölme zorunludur.', 'Kumanda yüzeyleri
      dört çubuk bağlantıyla: kanatçık ve dümen Volz DA 26 2:1, flap Volz DA 30 2:1 (orta açıda nötr), stabilatör Volz DA
      30 2,5:1; menteşe momenti ve eyleyici kontrolleri R-57…R-59 ile her sapmada.']
  trade_study: ucav250/data/concepts_v2/directions.yaml (design directions), ucav250/data/concepts/*/concept.yaml (conventional
    reference concepts), out/sizing_trades.json (propeller, gear, turret, span/loading, tail arm)

