    wing_joint:
      plane:
        y: 0.7
        kind: streamwise joint rib faces (centre-section rib M-JOINTRIB / outer-panel root rib), 1.5 mm elastomer seal strip
          on the outer-panel face
      insertion:
        axis_inboard: [-0.1392, -0.9903, -0.0]
        stroke: 0.25
        text: 'outer panel slides inboard along the main-spar line (plan sweep 8.0 deg, no dihedral in the tongue: the 3
          deg dihedral kink is machined into the tongue root at the outer-panel root rib); the tongue enters the fork and
          the drag pin its bushing in the same stroke'
