    momentinin ≥ 1,1 katı, bütün sapma aralığında (mil, girdap kafesi AM bandının ön ucunda)'
  metric: stab_hinge_rated_margin_max
  op: '>='
  value: 1.1
  unit: '-'
  source: finding F2 (hinge moments within the actuator rating with margin); components.yaml volz_da30 rated torque 8 N
    m
- id: R-48
  text_tr: 'Pervane koruması (alt): ventral kanatçığın firar kenarı eğik disk düzlemini uç çemberinin ≥ 26 mm dışında keser;
    değiştirilebilir tampon kızağı diskin altındadır'
  metric: prop_guard_ventral_margin_m
  op: '>='
  value: 0.026
  unit: m
  source: finding F10; CS-VLA 925(c)(1) radial clearance
- id: R-49
  text_tr: 'Pervane koruması (alt): ventral kanatçığın firar kenarı disk düzlemini uç çemberinin ≤ 120 mm dışında keser
    (alt bölgeyi yakından korur)'
  metric: prop_guard_ventral_margin_m
  op: <=
  value: 0.12
  unit: m
  source: finding F10 (guard close to the disc)
- id: R-50
  text_tr: Pervane düzlemi kaporta firar kenarının ≥ 0,10 D gerisinde (itici pervane gövde izinde; kaporta tabanı küt olduğundan
    kurulum katsayısı k_inst için 0,93 tahmini kullanılır, duyarlılık doc 02 §6.5)
  metric: prop_plane_behind_cowl_over_D
  op: '>='
  value: 0.1
  unit: '-'
  source: 'aero.yaml#propellers.recommendation caveats (prop plane 0.10-0.15 D behind the cowl trailing edge; pusher installation
    factor 0.93-0.97, engineering judgement); finding F12 (pusher in the body wake); fix round 3 (V2-02) and round 4 (V3-06):
    bluff cowl base -> k_inst estimate 0.93 (propeller.sources.k_inst)'
- id: R-51
  text_tr: 'Yanal koruma: uçak kanat ucu yere değene kadar yatarsa pervane ucu yerden ≥ 0,05 m yukarıda kalır (kanat ucu
    önce değer)'
  metric: prop_clear_wingtip_on_ground_m
  op: '>='
  value: 0.05
  unit: m
  source: finding F10 (lateral protection of the open propeller on the ground); design rule
- id: R-52
  text_tr: 'E180 büyüme taretinin tepe elektrik yükü (+ temel yük + araştırma yükü payı) tasarım görevinin beklemesi boyunca
    kesintisiz karşılanır (v1.2 yeteneği): jeneratörün DC çıkışı (güç elektroniği verimi dahil) ile tampon bataryanın tepe
    destek payı birlikte; tepe yükün bütün bekleme boyunca sürdüğü varsayılır (görev çevrimi kredisi yok); tepe destek payı
    = kullanılabilir batarya enerjisi − jeneratör kaybı/marş yedeği (400 W × 28 dk); E180 büyüme görevi de aynı kuralla
    kontrol edilir'
  metric: e180_peak_support_margin
  op: '>='
  value: 1.0
  unit: '-'
  source: 'finding F16; fix round 2 (V1-02): DC output = 800 W x rpm/7500 x 0.94 (rectifier/boost); fix round 3 (V2-01):
    the v1.3 restructure ("installed turret peak on each configuration''s own mission") was a requirement relaxation the
    user had not approved and is withdrawn; the v1.2 capability (E180 peak available throughout the design-mission loiter)
    is restored and met by design: generator output plus a sized and massed battery peak-support share (engine.electrical_budget
    battery_*, mission.loiter_rpm_floor = e180_peak_battery_support); metric = peak-support share / battery energy the E180
    peak would draw over the loiter (the larger of the design and E180 missions); components.yaml octopus_e180_launch peak
    160 W; engine.electrical_budget'
- id: R-53
  text_tr: 'Kuyruk kök yapıları (gövde dış yüzeyinde budanmış dikey, sabit stabilatör kök parçası ve ventral kökleri: kök
    kaburgası + bağlantı bandı) ve stabilatör milleri iç yerleşim bölgeleriyle ve birbirleriyle çakışmaz (çakışma sayısı
    0)'
  metric: tail_root_interferences
  op: ==
  value: 0.0
  unit: '-'
  source: verification finding V1-04 (fix round 2); ARCHITECTURE.md §1.4 (nothing colliding); tail.root_structure
- id: R-54
  text_tr: 'İşletme sınırları (CS-LUAS 1505): VNE = 0,9 VD, VNO = min(VC; 0,89 VNE); uçuş kontrol sisteminin zarf koruması
    hızı VNO''nun altında tutar (sınır hız ≤ VNO; tam güçte düz uçuş hızı VNE''yi aşar)'
  metric: fcs_speed_limit_margin_m_s
  op: '>='
  value: 0.0
  unit: m/s
  source: verification finding V1-09 (fix round 2); standards.yaml GEN-001 / CS-LUAS 1505(a)-(b) (max speed allowed by FCS
    envelope protection <= VNO); structures.operating_limits
- id: R-55
  text_tr: 'MTOM''da acil/geri dönüş inişi (flapsız, ISA deniz seviyesi) yer koşusu ≤ 300 m pist uzunluğu (anormal durum:
    1,5 alan katsayısı uygulanmaz; normal iniş R-07 ve en büyük iniş kütlesi işletme sınırıdır)'
  metric: landing_ground_roll_mtow_m
  op: <=
  value: 300.0
  unit: m
  source: verification finding V1-10 (fix round 2); baseline.yaml#mission_targets.runway_length_m (300 m); no fuel dump
    (doc 02 sec. 6.5 / 7)
- id: R-56
  text_tr: Boş kütle bütçesi (mass.budget, grup tavanları) ve yedek payı, R-02'yi (tasarım görevi faydalı yükü, 10 h) ve
    R-02b'yi (20 kg, 9,5 h) tam karşılayan iki boş kütlenin küçüğünü aşmaz (pay ≥ 0); her grubun tahmini kendi tavanının
    altında kalır
  metric: mass_budget_margin_kg
  op: '>='
  value: 0.0
  unit: kg
  source: 'verification finding V1-03 (fix round 2); fix round 4: both payload requirements (R-02, R-02b) after the requirement
    decision; doc 02 sec. 14 (budget managed as a ceiling)'
- id: R-57
  text_tr: 'Kanatçık, flap ve dümen eyleyicileri: anma torku × dört çubuk bağlantısının o sapmadaki tork oranı ≥ 1,1 × menteşe
    momenti, bütün sapma aralığında (kanatçık ve dümen VA''da tam sapma ve VD''de 1/3 sapma, flap VF''de; R-47 kuralı)'
  metric: control_actuator_rated_margin_min
  op: '>='
  value: 1.1
  unit: '-'
  source: 'verification finding V2-03 (fix round 3): the rudder DA 26 had no hinge-moment check and failed the project''s
    own rated rule; the same rule as R-47 applied to every surface (sizing.control_hinge_moments); hinge moments from the
    components.yaml hinge-moment screening coefficients (aero.hinge_moment_rules)'
- id: R-58
  text_tr: 'Kanatçık, flap ve dümen eyleyicileri: tepe tork × dört çubuk bağlantısının o sapmadaki tork oranı ≥ 1,25 × menteşe
    momenti, bütün sapma aralığında (CS-LUAS.395(a)(1))'
  metric: control_actuator_peak_margin_min
  op: '>='
  value: 1.0
  unit: '-'
  source: verification finding V2-03 (fix round 3); standards.yaml actuator_sizing_rule (CS-LUAS.395(a)(1))
- id: R-59
  text_tr: Bütün kumanda yüzeylerinde (kanatçık, flap, dümen, stabilatör) dört çubuk bağlantısı istenen sapma aralığına
    eyleyicinin hareket sınırı içinde ulaşır (pay ≥ 0°)
  metric: control_linkage_travel_margin_deg
  op: '>='
  value: 0.0
  unit: deg
  source: 'verification findings V2-03 / V2-06 (fix round 3): a symmetric N:1 crank-rocker reaches about asin(1/N) only
    (long-pushrod limit; a finite pushrod moves one side slightly past it, at the toggle); exact four-bar kinematics (sizing.FourBar)
    against the actuator travel (components.yaml volz_da26 / volz_da30 travel options)'
- id: R-60
  text_tr: 'Kalkış dönüşü (uçuş kontrol sistemi dönüş yasası): yunuslama hızı komutu sıfırdan komut hızına rampalanır ve
    tutulur; burun tekeri yerden kesikken stabilatörün ana teker temas noktasına göre (I_yy + m a²) × açısal ivme momenti
    için gereken aşağı kuvveti her adımda azami aşağı kuvveti aşmaz (pay kırpılmadan ölçülür, ≥ 0; bütün MTOM yükleme durumları);
    yerden kesilmede ana teker tepkisi sıfırdır ve aşağı kuvvet havadaki değere (sabit hızda güç-açık trim) eşittir; moment
    artığı ya da bu süreklilik 1e-6''yı aşarsa ölçüt negatif olur'
  metric: takeoff_rotation_download_margin_min_N
  op: '>='
  value: 0.0
  unit: N
  source: 'verification finding V3-03 (fix round 4): the v1.4 rule ''stabilator returns to the power-on trim during rotation''
    broke the moment balance about the main wheels; rotation law in sizing.Flight.takeoff (moments about the main-wheel
    contact at the actual attitude). Fix round 5: V4-01 - the margin is recorded UNCLIPPED (needed download vs maximum)
    and gated by the moment residual / lift-off continuity (sizing.r60_metric); V4-05 - pitch inertia I_yy of each loading
    (mass items, sizing.distributed_pitch_inertia) with a pitch-rate spin-up (mission.rotation_spin_up_s)'

# ---------------------------------------------------------------------------------------------------------------------
# mission: design mission
# ---------------------------------------------------------------------------------------------------------------------
mission:
  payload_design_kg: 18.0
  payload_max_kg: 20.0
  endurance_max_payload_requirement_h: 9.5
  payload_design_rule:
    robustness_margin_h: 0.25
    step_kg: 0.5
  loiter_altitude: 3000.0
  transit_radius: 100000.0
  reserve_fraction_of_trip_time: 0.1
  reserve_altitude: 1000.0
  trapped_fuel_fraction: 0.02
  loiter_speed_floor_eas: 26.0
  cruise_speed_band: [30.0, 36.0]
  service_ceiling: 4500.0
  runway_length: 300.0
  field_roll_max: 200.0
  climb_rate_sl_target: 4.9
  descent_rate: 2.5
  rolling_friction: 0.04
  braking_friction: 0.3
  touchdown_speed_factor: 1.15
  endurance_requirement_h: 10.0
  stall_speed_max: 24.0
  profile:
  - segment: warmup
    model: sizinglib fraction 0.996
    source: sizinglib.py (endurance study)
  - segment: taxi
    model: sizinglib fraction 0.997
  - segment: takeoff
    model: sizinglib fraction 0.995
  - segment: climb
    to_m: 3000.0
    model: best rate of climb at WOT, mid-altitude point (Flight.climb_point)
  - segment: transit_out
    distance_m: 100000.0
    model: best-range speed, >= cruise band minimum, turret retracted
  - segment: loiter
    altitude_m: 3000.0
    model: minimum fuel flow, never below max(26 m/s EAS, 1.2 VS); turret extended
  - segment: transit_back
    distance_m: 100000.0
    model: as transit_out
  - segment: descent
    rate_m_s: 2.5
    model: sizinglib fraction 0.998
  - segment: landing
    model: sizinglib fraction 0.997
  - segment: reserve
    model: 10 % of the airborne time at best loiter, 1000 m, turret retracted; 2 % trapped fuel
  sources:
    payload_design_kg: 'derived (fix round 4, requirement decision of the project lead): the largest payload on the 0.5
      kg grid (rounded down) that gives endurance_requirement_h + payload_design_rule.robustness_margin_h (10.25 h) on the
      design mission at MTOM 149.9 kg; computed by sizing.evaluate (performance.payload_design_rule) and checked by --check.
      v1.5: 19.0 kg; v1.6 (fix round 5): 18.0 kg after the re-based gear-door item (V4-03); headroom to the 10.25 h threshold
      in performance.payload_design_rule'
    loiter_altitude: baseline.yaml#mission_targets.operating_altitude_m (top of the band; endurance study)
    transit_radius: endurance study design mission (2 x 100 km)
    reserve_fraction_of_trip_time: baseline.yaml#mission_targets.endurance_h basis (10 % reserve)
    loiter_speed_floor_eas: baseline.yaml#mission_targets.loiter_speed_m_per_s_eas.range[0]
    cruise_speed_band: baseline.yaml#mission_targets.cruise_speed_m_per_s.range
    service_ceiling: baseline.yaml#mission_targets.service_ceiling_m
    runway_length: baseline.yaml#mission_targets.runway_length_m
    climb_rate_sl_target: baseline.yaml#mission_targets.climb_rate_sea_level_m_per_s (goal; R-05 sets 4.0 m/s)
    touchdown_speed_factor: endurance study (1.15 VS)
    rolling_friction: endurance study (paved/prepared strip)
    braking_friction: endurance study
    stall_speed_max: docs/01_arastirma.md wing-loading rule
    endurance_requirement_h: R-02 (with the design-mission payload, fix round 4)
    trapped_fuel_fraction: endurance study (estimate)
    descent_rate: endurance study (estimate)
    rotation_time_s: Raymer 6th ed. 17.8.2 (rotation about 1 s for small aircraft)
    rotation_spin_up_s: 'design choice of the FCS rotation law (fix round 5, V4-05): the pitch-rate command is ramped from
      zero to the commanded rate in 0.3 s (constant pitch acceleration; upper end of the 0.1-0.3 s range of the verification
      estimate); the stabilator gives the moment (I_yy + m a_cg^2) x pitch acceleration about the main-wheel contact, I_yy
      estimated from the mass items (sizing.distributed_pitch_inertia); 0.1 s sensitivity in performance.takeoff_pitch_inertia_effect'
    stall_floor_cg: 'v1.2 (R-02 trade, doc 02 sec. 14): the 1.2 VS loiter/transit floor uses the trimmed CLmax at the design-mission
      CG (loading case 0, CG moving with the fuel burned); the stall-speed requirement R-08 and the take-off/landing checks
      stay at the forward CG limit'
    loiter_rpm_floor: 'fix round 3 (V2-01, R-52 restored to its v1.2 capability): the E180 growth-turret peak (493 W with
      the base load and the research allowance) must be available throughout the loiter of the design mission. The SG750
      DC output is proportional to the rpm (800 W x rpm / 7500 x power-electronics efficiency 0.94); the part of the peak
      above the generator output is supplied by the peak-support share of the buffer battery (engine.electrical_budget),
      sized for the peak lasting the whole loiter (no duty-cycle credit). The loiter speed is raised where needed so that
      the generator output never falls more than peak_support_deficit_cap_W below the E180 peak (rpm floor); the cap is
      the design choice that keeps the battery energy drawn over the loiter inside the peak-support share (R-52). The E180
      growth mission flies the same rule. History: v1.2 flew the design mission at the generator-only E180 floor (generator_peak,
      -0.5 h); v1.3 restructured R-52 to the installed turret only (installed_turret_peak), a requirement relaxation the
      user had not approved; withdrawn in fix round 3'
    peak_support_deficit_cap_W: 'design choice (fix round 3; re-searched in fix round 4 for the design-mission payload of
      the requirement decision, whose longer loiter draws more battery energy): the largest deficit cap on a 0.5 W grid
      that keeps the E180-peak battery draw over the design-mission and E180-mission loiters inside the battery peak-support
      share (R-52 >= 1.0): 18 W -> 0.973, 17.5 W -> 0.995, 17 W -> 1.019, 16 W -> 1.069 with the full mission model and
      the derived payload of v1.5 (19.0 kg); re-checked in fix round 5 for the v1.6 design payload 18.0 kg: 17.5 W -> 0.979,
      17 W -> 1.002, 16 W -> 1.052 (17 W kept; doc 02 sec. 12)'
    payload_max_kg: 'baseline.yaml#mass_targets.payload_design_kg (20 kg: the research starting target, lower end of the
      20-35 kg comparables band); the maximum payload after the round-4 decision (R-02b, R-03)'
    endurance_max_payload_requirement_h: R-02b (fix round 4 requirement decision)
    payload_design_rule: 'fix round 4 requirement decision: robustness margin 0.25 h above R-02 so that the design mission
      keeps a margin against model updates; payload rounded down to 0.5 kg'
  rotation_time_s: 1.0
  rotation_spin_up_s: 0.3
  stall_floor_cg: design_mission
  loiter_rpm_floor: e180_peak_battery_support
  peak_support_deficit_cap_W: 17.0

