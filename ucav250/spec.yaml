        kind: tongue-in-fork (sleeve) joint, bending reacted as a vertical couple on two chordwise shear pins 250 mm apart
        fork:
          part: YK250-CH-053
          owner: chassis
          material: al_7075_t651_plate
          process: cnc_milling_metal
          geometry: two prongs (front/rear webs) 6 mm thick, 61 mm high, from y 0.43 to the joint rib, bonded (EA 9394)
            and bolted (2 x 6 M6, 12.9, nutplates) to the glove main-spar caps and web; mouth chamfer 3 x 30 deg
          slot:
            width: 0.0304
            height: 0.061
            y: [0.43, 0.7]
        tongue:
          part: YK250-WG-151
          owner: wing
          material: al_7075_t651_plate
          process: cnc_milling_metal
          geometry: solid tongue 30 mm wide x 61 mm high, 250 mm engagement, bonded and bolted to the outer-panel spar caps
            (3 x 4 M6); 3 deg dihedral kink at the root rib
        pins:
        - id: P-MAIN1
          position: [2.5785, 0.455, -0.0025]
          axis: [0.9903, -0.1392, 0.0]
          diameter: 0.014
          spec: headed pin, Ti-6Al-4V (ti_6al_4v_annealed_sheet allowables used as bar estimate), d 14 h8 x 52 mm, keeper
            plate 2 x M4 on the fork front face
          fit: pin 14 h8 in 14 H8 reamed bores (fork prongs) and 14 H8 bush (tongue)
          oml_depth_at_pin: 0.0929
        - id: P-MAIN2
          position: [2.6101, 0.68, 0.0049]
          axis: [0.9903, -0.1392, 0.0]
          diameter: 0.014
          spec: headed pin, Ti-6Al-4V (ti_6al_4v_annealed_sheet allowables used as bar estimate), d 14 h8 x 52 mm, keeper
            plate 2 x M4 on the fork front face
          fit: pin 14 h8 in 14 H8 reamed bores (fork prongs) and 14 H8 bush (tongue)
          oml_depth_at_pin: 0.0915
        access: pins inserted from the front through the glove wing-joint access panel (SH-422-R/L), head forward, keeper
          plate on the fork front face; 75 mm free space ahead of the fork for the pin and the drift
      rear_spar:
        kind: drag / shear pin parallel to the insertion axis (no manual action at assembly)
