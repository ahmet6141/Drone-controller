    reserve_kg: 0.05
    note: 'V1-03 (fix round 2): each group target is a CEILING for the detailed design (one-sided: --check fails when a
      group estimate exceeds it; tol_kg only flags a stale allocation far below the estimate). The sum of the ceilings plus
      reserve_kg (numerical tolerance of the closure, 0.05 kg) may not exceed the smaller of the empty masses at which R-02
      (design-mission payload, 10 h) and R-02b (maximum payload, 9.5 h) are met exactly at fixed MTOM (R-56, mass.budget_check
      in out/sizing.json; fix round 4)'
  budget_note: 'targets = group CEILINGS (fix round 2: sizing estimates incl. the growth allowance, rounded up to 10 g;
    fix round 5 (V4-03): gear 13.75 -> 14.34 kg for the re-based door item (door area of the v1.5 scheme, two inner-door
    actuators + linkages, leg-door brackets, seals on the actual joint length), hardware 1.50 -> 1.51 kg (its fraction of
    the larger gear base) and tail 7.87 -> 7.89 kg (stabilator +0.2 % in the re-closure); layout phase: re-closure with
    the layout changes (layout.mass_placement; stabilator spindle station on the inclined cylinder face; sliding turret-bay
    doors with one DA 22 each, mass.rules.turret_mechanism_kg 1.66 -> 1.786 kg): systems 14.66 -> 14.79 kg (estimate 14.789),
    controls 8.31 -> 8.32 kg (rudders, 8.311), tail 7.89 -> 7.90 kg (7.890), wing 16.40 kg unchanged (16.399); no item deleted;
    see budget_rules); structures phase (ucav250.analysis.structures, spec.structures.sizing.mass): bottom-up masses of
    the sized spar caps / webs / rear spar / outer-panel joint hardware replace the concept wing-model terms and the carry-through,
    keel, floor and spindle-housing allocations (+-45-dominated wing skins with spar caps sized to the skin strain limit,
    sandwich CT-box covers, M-WELLKEEL, machined 7075 aft keel, Ti spindles); the wing re-closure moved the wing 8 mm forward;
    ceilings re-allocated to the new estimates rounded up to 10 g: chassis 11.15 -> 11.58 kg (11.572), wing 16.40 -> 15.98
    kg (15.973), tail 7.90 -> 7.91 kg (7.905), shell 10.47 -> 10.48 kg (10.473), controls 8.32 -> 8.31 kg (8.301); tol_kg
    = 3 % of the new ceilings; the registry mass of the detailed design (analysis/mass.py) must stay at or below each ceiling;
    tol_kg = 3 % (min 0.05 kg) marks an allocation that has become stale (estimate far below the ceiling) fix round 1 (structures
    S1-01..S1-06, packaging VPK-01): composite outer-panel joint (CFRP tongue / fork, pinned), glove caps sized for the
    glove-box moment, Ti spindle 25 x 1.5, 7075 root-socket sleeve 31 x 3, machined firewall-mounted stabilator node fittings,
    dorsal spine channel for the bridle, firewall lower-foot lands, nose-pivot and parachute bottom-ups; ceilings re-allocated
    to the new estimates rounded up to 10 g: chassis 11.58 -> 12.38 kg (12.370), tail 7.91 -> 7.60 kg (7.597), wing 15.98
    -> 15.46 kg (15.453); tol_kg = 3 % of the new ceilings'
  cases:
  - name: mtow_design_payload_turret_retracted
    fuel_fraction: 1.0
    turret: retracted
    payload: [eo_ir_turret_hd59_mount, mission_computer_recorder, payload_tray_harness, research_payload_allowance]
