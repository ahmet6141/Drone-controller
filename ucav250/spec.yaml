# ---------------------------------------------------------------------------------------------------------------------
# processes: processes (materials.yaml spec_ready)
# ---------------------------------------------------------------------------------------------------------------------
processes:
  prepreg_ooa_vacbag:
    name: OOA prepreg, oven vacuum-bag cure
    name_tr: Otoklav disi prepreg, vakum torbasi ve firin kurlama
    min_thickness: 0.0006
    tolerance: ISO 2768-mK for trimmed/machined edges and holes; laminate thickness +/-10 % (estimate); tool-side surface
      profile +/-0.3 mm (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.003
      male: 0.0015
    min_bend_radius_t: null
    edge_distance_D: 3.0
    edge_distance_D_min: 2.5
    notes: stacking rules in processes.composite_moulding; ply drop 1:20; MH cure per NPS 81451
    tag: estimate
    source: https://elib.dlr.de/107894/1/__Bsfait00_fa_Archive_IB_2016_IB_2016_173_MA%20Werthen.pdf
  wet_layup_vacbag:
    name: Wet lay-up with vacuum-bag consolidation
    name_tr: Islak yatirma ve vakum torbasi
    min_thickness: 0.0006
    tolerance: ISO 2768-c on moulded features, ISO 2768-m after CNC trim (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.004
      male: 0.002
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: secondary structure and fairings only, unless qualified by coupon tests
    tag: estimate
    source: https://journal.unimma.ac.id/AutomotiveExperiences/article/view/16310
  vacuum_infusion:
    name: Vacuum infusion
    name_tr: Vakum infuzyon
    min_thickness: 0.0008
    tolerance: ISO 2768-m after CNC trim; thickness +/-10 % (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.003
      male: 0.002
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: large panels, foam-core sandwich (Airex C70); needs flow-media design and witness panels
    tag: estimate
    source: https://journal.unimma.ac.id/AutomotiveExperiences/article/view/16310
  cnc_milling_metal:
    name: CNC milling (aluminium, steel, titanium)
    name_tr: CNC frezeleme
    min_thickness: 0.0015
    tolerance: ISO 2768-mK general; +/-0.125 mm default, +/-0.025 mm on fits (ISO 286)
    draft_deg: 0.0
    min_inside_radius: 0.003
    min_bend_radius_t: null
    edge_distance_D: 2.0
    notes: pocket depth <= 4 x width; internal radius > depth/3; threads <= 3 D engaged; Ra 3.2 um as machined
    tag: vendor
    source: https://www.hubs.com/guides/cnc-machining/
  sheet_metal_aluminium:
    name: Sheet-metal cutting and press-brake bending (aluminium)
    name_tr: Sac kesme ve abkant bukum (aluminyum)
    min_thickness: 0.0005
    tolerance: ISO 2768-mK linear; bend angle +/-1 deg for bends up to 610 mm (SendCutSend)
    draft_deg: 0.0
    min_bend_radius_t:
      al_5052_H32: 1.5
      al_6061_T6: 3.0
      al_2024_T3: 6.0
      al_7075_T6: 7.0
      al_6061_T4: 2.0
    min_bend_radius_note: upper end of AC 43.13-1B Table 4-6 at 3.25 mm (0.128 in) thickness; use the table for other thicknesses
    edge_distance_D: 2.0
    hole_to_bend: 2.5 t + R
    notes: K-factor 0.33-0.5 by R/t (estimate)
    tag: standard
    source: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf
  tig_welding_4130:
    name: TIG welding of 4130 normalised tube (engine mount, gear frames)
    name_tr: 4130 boru TIG kaynagi
    min_thickness: 0.00089
    tolerance: jig-located, ISO 2768-c on the weldment; machine attachment pads/bores after welding to ISO 2768-m and ISO
      286 fits (estimate)
    draft_deg: null
    min_bend_radius_t: null
    edge_distance_D: 2.0
    notes: design near-weld Ftu 80 ksi (552 MPa); filler AMS 6457; Group 1 welder
    tag: standard
    source: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf
  sls_pa12:
    name: SLS printing PA12
    name_tr: SLS baski (PA12)
    min_thickness: 0.001
    tolerance: +/-0.3 % with lower limit +/-0.3 mm (estimate)
    draft_deg: 0.0
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: non-structural / secondary parts only (processes.additive_manufacturing.acceptable_use_on_yk250)
    tag: estimate
    source: https://www.shapeways.com/wp-content/uploads/2021/10/Material-Data-sheet-Nylon-12-PA2200.pdf
  fdm_pa_cf:
    name: FDM printing PA-CF
    name_tr: FDM baski (karbon katkili PA)
    min_thickness: 0.0012
    tolerance: +/-0.2 mm (estimate)
    draft_deg: 0.0
    min_bend_radius_t: null
