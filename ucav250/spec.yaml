    longitudinal_blade_to_structure_min: 0.013
  sources:
    table_ref: 'aero.yaml#propeller_tables_mejzlik.0164 (Mejzlik sheet 0164; baseline.yaml#propeller.alternative). Selected
      over the v1 32x18 2B (sheet 0161): with the speed/power-dependent cooling drag the 2B climbs only about 3.9 m/s at
      MTOM (R-05 >= 4.0 fails); the 3B meets R-05, R-06 and R-31 with margin at an endurance cost of about 0.25 h (trade
      study)'
    diameter: aero.yaml#propeller_tables_mejzlik.0164 (31 in = 0.7874 m)
    mass_kg: baseline.yaml#propeller.alternative.mass_kg (Mejzlik 31x12 3B)
    k_wot: endurance study (Falcon/Mejzlik ratio)
    k_inst: 'estimate (fix round 3, V2-02; wording corrected in fix round 4, V3-06): the short cowl closure leaves a separated
      base (about 0.11 m2) directly ahead of the disc, so the inner third of the disc area works in a bluff-base wake. aero.yaml
      gives 0.93-0.97 for a pusher behind a fuselage as engineering judgement (not from a test; baseline.yaml#propeller.primary.installation_factor
      0.95 = its middle); 0.93, the bottom of that range, is used as the ESTIMATE for this bluff-base installation. It is
      not a bound: no test or reference bounds the bluff-base case. Sensitivity (doc 02 sec. 6.5): k_inst 0.90 / 0.95 /
      0.97 with the design-mission payload. To be replaced by a propeller/fuselage installation test; blade cyclic loading
      in the base wake is an open item (doc 02 sec. 16)'
    k_inst_wot_ramp_speed: 'fix round 3 (V2-04): the installation loss applies at full throttle too; WOT thrust x (1 - (1
      - k_inst) min(V / 15 m/s, 1)): uninstalled static thrust (aero.yaml: static installation about 1.0) ramping to the
      full k_inst by 15 m/s (take-off, climb, ceiling)'
    clearances: standards.yaml#propeller_clearance (CS-VLA 925)
    hub_spacer: 'design choice: 110 mm spacer (blade-root to cowl-face clearance, CS-VLA 925(c)(2) R-34); Limbach approval
      open'
    hub_half_thickness: estimate (Mejzlik hub; replace with the drawing)
    thrust_line_inclination_deg: 'design choice: 5 deg down-thrust; the thrust line of the high pusher then passes about
      0.06 m above the CG instead of 0.19 m, which reduces the power-on pitching moment that sizes the stabilator (lift-off
      trim at full throttle, R-36) and delays the nose-wheel lift-off (R-06)'
    blade_model: 'estimate: blade planform stand-in for the 31x12 3B (chord, pitch angle); replace with the Mejzlik drawing'
    spinner: estimate (render geometry)
  hub_half_thickness: 0.02
