    factor_of_safety: baseline.yaml#design_loads.factors.factor_of_safety (CS-LUAS.303)
    fitting_factor: baseline.yaml#design_loads.factors.fitting_factor (CS-LUAS.625)
    casting_factor: baseline.yaml#design_loads.factors.casting_factor (CS-LUAS.621)
    bearing_factor_pinned_joints: baseline.yaml#design_loads.factors.bearing_factor_rotating_or_pinned_joints
    frequent_assembly_attachment_factor: baseline.yaml#design_loads.factors.frequent_assembly_attachment_factor
    control_system_load_factor: baseline.yaml#design_loads.factors.control_system_load_factor (CS-LUAS.395)
    VC_eas: endurance concept study (VC 45 m/s EAS; baseline.yaml#design_loads.gust.baseline_evaluation)
    VD_eas: max(1.25 VC, VH) evaluated by sizing.py; 57 m/s floor (baseline evaluation)
    gust: baseline.yaml#design_loads.gust (CS-LUAS.333(c))
    clmin_negative: endurance concept study (structlib.vn_diagram input)
    landing: baseline.yaml#design_loads.landing
    damage_tolerance_strain_ue: baseline.yaml#design_loads.composites.damage_tolerance_strain_limits_microstrain.thick_gt_2mm
    a_basis_factor_single_load_path: endurance concept study (B- to A-basis knock-down, CS-LUAS.613(b))
