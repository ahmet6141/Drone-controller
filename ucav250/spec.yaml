# ---------------------------------------------------------------------------------------------------------------------
# layout: layout (sizing-phase zones; filled by the layout phase)
# ---------------------------------------------------------------------------------------------------------------------
layout:
  datum: Z = 0 on the centre-body chine plane, X = 0 at the nose tip
  rules:
    turret_x: 1.22
    payload_bay_half_width: 0.2
    payload_bay_roof_z: -0.06
    fuel_top_z: 0.16
    fuel_cell_fwd_length: 0.24
    fuel_cell_aft_length: 0.2
    firewall_gap: 0.02
    boxes:
      power_switching_bay:
        x: [0.672, 0.797]
        half_width: 0.075
        z: [0.018, 0.078]
        clearance: 0.008
        content: main contactor / fuse block and the 28-to-12 V DC-DC module, on the deck above the nose-gear well, ahead
          of the PDU
      avionics_power_deck:
        x: [0.797, 1.085]
        half_width: 0.1005
        z: [0.018, 0.08]
        clearance: 0.008
        content: VISIONAIRtronics 1000 W PDU (235 x 195 x 54.5 mm, connectors forward) on the deck above the nose-gear well
      avionics_side_bays:
        x: [0.857, 1.1]
        y_inner: 0.05
        half_width: 0.142
        z: [-0.089, 0.0155]
        clearance: 0.008
        content: 'pair of side bays beside the nose-gear keel slot: port = 12S2P Li-ion buffer battery in its vented, cell-fused
          box; starboard = autopilot (GNSS/IMU inside), C2/video datalink, backup C2 link, transponder, Remote ID'
      parachute_bay:
        x: [1.5, 1.8]
        half_width: 0.15
        z: [-0.172, 0.103]
        clearance: 0.006
        content: UAVOS 200 parachute compartment 0.300 x 0.300 x 0.275 m, dorsal hatch ahead of the wing
      mission_computer:
        x: [1.84, 2.06]
        half_width: 0.08
        z: [-0.12, -0.03]
        clearance: 0.008
        content: mission computer / recorder, video encoder
      equipment_bay_aft:
        x: [3.2, 3.56]
        half_width: 0.1
        z: [-0.06, 0.08]
        clearance: 0.008
        content: ECU, generator power electronics, fuel pump/filter
    payload_bay_length: 0.42
    payload_bay_to_well_gap: 0.03
    bay_contents:
      clearance_to_oml: 0.01
      clearance_to_wall: 0.003
      gap_between_items: 0.01
      note: 'V3-02 (fix round 4): real envelopes of the declared contents of the nose equipment zones (datasheet boxes from
        components.yaml, cell pack from the cell datasheet, allocation boxes where no unit is selected) + a connector/harness
        allowance on one face; centre = body centre (installed axes x, y, z); checked by sizing.bay_contents_check (part
        of R-26)'
      items:
      - name: contactor_fuses
        zone: power_switching_bay
        side: centre
        dims: [0.1, 0.06, 0.05]
        center: [0.74, -0.037, 0.048]
        connector_allowance: 0.015
        connector_face: -x
        mass_kg: 0.4
        source: 'estimate: allocation box for the main contactor + fuse block (components.yaml electrical.recommended.mass_estimate_kg
          0.40 kg; no unit selected)'
      - name: dcdc_28_12
        zone: power_switching_bay
        side: centre
        dims: [0.06, 0.06, 0.025]
        center: [0.745, 0.037, 0.0355]
        connector_allowance: 0.015
        connector_face: -x
        mass_kg: 0.1
        source: 'estimate: allocation box for the 28-to-12 V DC-DC module (components.yaml electrical.recommended: estimate
          0.1 kg; no unit selected)'
      - name: pdu
        zone: avionics_power_deck
        side: centre
        ref: components.yaml#categories.electrical.power_distribution[vat_1000w_pdu].dimensions_m
        orient: [0, 1, 2]
        center: [0.9625, 0.0, 0.04925]
        connector_allowance: 0.04
        connector_face: -x
        mass_kg: 1.6
        source: components.yaml vat_1000w_pdu 0.235 x 0.195 x 0.0545 m, 1.60 kg; MIL-DTL-38999 connector allowance 40 mm
          on the forward face (estimate)
      - name: buffer_battery
        zone: avionics_side_bays
        side: port
        pack:
          cell_diameter: 0.02155
          cell_height: 0.07015
          n_x: 8
          n_y: 3
          wall: 0.006
          bottom: 0.006
          top: 0.02
        center: [0.965, -0.1005, -0.0375]
        connector_allowance: 0.02
        connector_face: +x
        mass_kg: 1.98
        source: '12S2P = 24 cells upright in an 8 x 3 array (components.yaml liion_12s2p_molicel_p45b); cell outline Molicel
          ''Cell Specifications of INR-21700-P45B'', document INR21700P45B-01 ver. 0.2, sec. 2.4.2: diameter 21.40 +- 0.15
          mm, height 70.00 +- 0.15 mm (maximum values used; copy https://www.kronium.cz/uploads/p45b-datasheet.pdf, read
          2026-10-09); case walls 6 mm, bottom 6 mm, top 20 mm for the BMS board, cell-level fuse strips and busbars (estimate)'
      - name: autopilot
        zone: avionics_side_bays
        side: starboard
        ref: components.yaml#categories.avionics.autopilots[veronte_autopilot_1x].dimensions_m
        orient: [0, 1, 2]
        center: [0.898, 0.1, -0.065]
        connector_allowance: 0.025
        connector_face: +x
        mass_kg: 0.209
        source: components.yaml veronte_autopilot_1x (ADS-B variant 0.209 kg); 68-pin + SSMA connector allowance 25 mm (estimate)
      - name: datalink_primary
        zone: avionics_side_bays
        side: starboard
        ref: components.yaml#categories.avionics.datalinks[silvus_sc4200ep].dimensions_m
        orient: [0, 1, 2]
        center: [1.0258, 0.1, -0.0648]
        connector_allowance: 0.02
        connector_face: +x
        mass_kg: 0.137
        source: 'components.yaml silvus_sc4200ep: the EP unit envelope (the 0.137 kg module variant of the mass estimate
          has no published dimensions; the larger EP box is used); connector allowance 20 mm (estimate)'
      - name: datalink_backup
        zone: avionics_side_bays
        side: starboard
        dims: [0.077, 0.055, 0.028]
        center: [0.8985, 0.1, -0.021]
        connector_allowance: 0.02
        connector_face: +x
        mass_kg: 0.05
        source: 'components.yaml microhard_pddl2450 dimensions_m.note: enclosed unit 77 x 55 x 28 mm (the OEM board of the
          mass estimate is smaller); connector allowance 20 mm (estimate)'
      - name: transponder
        zone: avionics_side_bays
        side: starboard
        ref: components.yaml#categories.avionics.surveillance_transponders[uavionix_ping200x].dimensions_m
        orient: [0, 1, 2]
        center: [0.9905, 0.1, -0.0275]
        connector_allowance: 0.02
        connector_face: +x
        mass_kg: 0.05
        source: components.yaml uavionix_ping200x; connector allowance 20 mm (estimate)
      - name: remote_id
        zone: avionics_side_bays
        side: starboard
        ref: components.yaml#categories.avionics.remote_id[dronetag_beacon].dimensions_m
        orient: [0, 1, 2]
        center: [1.0675, 0.1, -0.026]
        connector_allowance: 0.0
        connector_face: +x
        mass_kg: 0.016
        source: components.yaml dronetag_beacon (self-contained)
  fuel_cells:
  - name: forward_cell
    x: [2.24251, 2.48251]
    z: [-0.052, 0.16]
  - name: saddle_cell
    x: [2.52251, 2.8159]
    z: [0.05113, 0.16]
  - name: aft_cell
    x: [2.8559, 3.0559]
    z: [-0.052, 0.16]
  zones_preliminary:
    power_switching_bay:
      box: [[0.672, 0.0, 0.018], [0.797, 0.075, 0.078]]
      symmetric: true
      clearance: 0.008
      content: main contactor / fuse block and the 28-to-12 V DC-DC module, on the deck above the nose-gear well, ahead
        of the PDU
    avionics_power_deck:
      box: [[0.797, 0.0, 0.018], [1.085, 0.1005, 0.08]]
      symmetric: true
      clearance: 0.008
