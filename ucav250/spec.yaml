    fcs_speed_limit_eas: 45.0
    note: VNE = 0.9 VD and VNO = min(VC, 0.89 VNE) are derived by sizing.py (loads.operating_limits); the FCS envelope protection
      (CS-LUAS.1329(e)) limits the speed to fcs_speed_limit_eas <= VNO by throttle and pitch; full-throttle level flight
      (about 55 m/s) would exceed VNE, so the protection is a required FCS function (R-54)
