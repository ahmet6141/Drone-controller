    rib_pitch_m: endurance concept study (estimate)
    outer_panel_joint_kg: endurance concept study (estimate, per joint)
    chine_edge_band_kg_per_m: identity concept study (estimate)
    fuel: endurance concept study (bladder expansion space, tank volume efficiency; estimates)
