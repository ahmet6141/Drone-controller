        cg_used: [2.6298, 0.0, 0.0376]
      load_path: canopy -> riser -> confluence ring -> 2 legs -> U-lug fittings (4 x M6 12.9 each, 7075 doublers both faces)
        -> FS1810 / rear-spar frame -> chine longerons, keel and the wing box
