# ---------------------------------------------------------------------------------------------------------------------
# assembly: assembly (sequence, transport, field assembly, maintenance access)
# ---------------------------------------------------------------------------------------------------------------------
assembly:
  general: ['Montaj sırası şasi -> sabit kabuk -> sistemler -> itki -> iniş takımı -> kuyruk ve kanat -> kabuk kapanışı
      -> ayar ve fonksiyon testleri şeklindedir. Her adımın parça listesi ve bağlantı elemanları, ayrıntılı tasarım modüllerinin
      Part.step / Fastener.step değerlerinden outputs/assembly_guide.py ile üretilir.', 'Kök parça orta kanat kutusudur
      (layout.root_part = YK250-CH-001). Bütün çerçeveler, uzun kirişler ve bağlantılar ana montaj tezgâhında bu kutuya
      göre konumlanır; ölçü referansı spec.yaml çerçevesidir (X burundan geriye, Y sancak, Z yukarı; Z = 0 kenar çizgisi
      düzlemi).', 'Genel toleranslar ISO 2768-mK; geçmeler ISO 286 (pim yuvaları H8/h8, yatak yuvaları H7). Kritik yuvalar
      (kanat çatalı pim delikleri, ana takım ve burun takımı mafsal yuvaları, stabilatör mil yatakları) tezgâh üzerinde,
      mastarla birlikte hat raybalama ile işlenir.', 'Yapıştırma: EA 9394, yüzey hazırlığı (zımpara + çözücü silme), 0,2
      mm yapıştırıcı kalınlığı, kür süresi boyunca tezgâh baskısı; her yapışma bölgesi tanık numunesiyle birlikte kürlenir
      ve tıklama testiyle denetlenir.', 'Kompozit parçalarda bağlantı elemanı merkezi ile kenar arası >= 2,5 D, metal parçalarda
      >= 2,0 D; delikler ISO 273 orta sınıf boşlukla, matkap şablonundan delinir; sandviç panellerde bağlantı hattında çekirdek
      1:3 eğimle dolu laminata iner.', Sıkma torkları kuru dişler içindir; vida sabitleyici (orta mukavemet) ve emniyet
      teli/kopilyası çizimde belirtilen yerlerde zorunludur. Her tork uygulaması tork işaretiyle (renkli çizgi) işaretlenir.,
    Yakıt bölmeleri buhar sızdırmazdır; yakıt bölmesinden kablo geçmez. Li-ion batarya yakıt hücrelerinden en az 1 m uzaktadır.
      Egzoza 50 mm'den (ısı kalkanıyla 25 mm) yakın kompozit parça yoktur., 'Elektriksel bağlama: motor, yakıt sistemi,
      metal bağlantılar ve antenler bağlama hattına bağlanır (CS-VLA 857: >= 1,3 mm² bakır; geçiş direnci <= 2,5 mΩ). Yakıt
      ikmal noktasında topraklama ucu vardır.', 'Kapsam meta.scope_tr ile tanımlıdır: yalnızca sivil EO/IR gözetleme ve
      araştırma. Dış yük taşıma bağlantısı yoktur; gövde altındaki yük bölmesi yalnızca araştırma sensörleri içindir.']
  steps:
  - step: 1
    title_tr: Ana montaj tezgâhının hazırlanması
    subassembly: şasi tezgâhı
    text: 'Ana tezgâh çerçeve istasyonlarına göre kurulur: her çerçeve için iki konum pimi ve tabla, orta kanat kutusu için
      kök destekleri, kanat çatalı ve ana takım mafsal mastarları. Tezgâh lazer izleyiciyle spec.yaml çerçevesine bağlanır
      (X burundan geriye, Z = 0 kenar çizgisi düzlemi).'
    tools: [lazer izleyici, 'tezgâh mastarları (çatal, mafsal, motor bağlantısı)', tork anahtarı seti]
    checks: ['tezgâh referans noktaları ±0,2 mm', 'çerçeve istasyonları ±0,3 mm (layout.stations)', mastarların kalibrasyon
        etiketi geçerli]
  - step: 2
    title_tr: Orta kanat kutusunun yerleştirilmesi (kök parça)
    subassembly: orta kanat kutusu YK250-CH-001
    text: Ana ve arka kiriş başlıkları kesintisiz, ortada kırık bağlantısıyla (7075-T651) birleştirilmiş orta kanat kutusu
      tezgâhın kök desteklerine yerleştirilir ve kilitlenir. Kutunun ana kiriş hattı ve arka kiriş hattı tezgâh mastarlarına
      göre doğrulanır.
    tools: [vinç askısı (kutu kaldırma noktalarından), lazer izleyici]
    checks: ['ana kiriş hattı x (merkezde) = layout.stations FS-MS ±0,3 mm', 'kutu simetrisi ±0,5 mm', kırık bağlantısı
        cıvataları torklu ve işaretli]
  - step: 3
    title_tr: Ana ve arka kiriş çerçeveleri
    subassembly: FS-MS, FS-RS
    text: Ana kiriş ve arka kiriş çerçeveleri (kutunun üstünde yakıt bölmesi duvarı, altında yük bölmesi dışındaki dikmeler)
      kiriş gövdelerine yapıştırılır ve M6 cıvatalarla bağlanır.
    tools: [yapıştırıcı tabancası (EA 9394), matkap şablonları, tork anahtarı]
    checks: [yapışma tanık numunesi, 'çerçeve dikliği ±0,5 mm', yakıt bölmesi duvar yüzeyi sızdırmazlık için temiz]
  - step: 4
    title_tr: Gövde yanı, eldiven ve birleşim kaburgaları
    subassembly: eldiven yapısı (L/R)
    text: 'Gövde yanı kaburgası (y = ±0,40 m), eldiven kaburgası (±0,55 m) ve birleşim kaburgası (±0,70 m) kutunun kirişlerine
      yapıştırılır ve cıvatalanır. LERX burun kaburgası yoktur: pim, pim çekici ve rayba koridorları (layout.mechanisms.assembly_paths)
      çatalın önünde serbesttir.'
    tools: [kaburga konum mastarları, yapıştırıcı]
    checks: ['kaburga istasyonları ±0,3 mm', 'birleşim kaburgası yüzü düzlemsellik 0,2 mm']
  - step: 5
    title_tr: Kompozit kanat çatalı burçları ve arka kiriş yuva bağlantısı
    subassembly: kanat birleşim bağlantıları (L/R)
    text: Kompozit çatalın (eldiven ana kiriş kutusu, YK250-CH-053) pim bölgelerindeki dört 4130 burç (16 H8 / dış çap 22)
      usta dil mastarı takılıyken yapıştırılır ve kürden sonra önden hat raybalanır; rayba koridoru serbesttir (LERX kaburgası
      yok, eldiven kaplamaları henüz takılı değil). Arka kiriş yuva bağlantısı (YK250-CH-054, iki 4 mm 7075 plaka, Ø8 H8)
      aynı mastara göre birleşim kaburgasına 2 x M4 ve arka kiriş gövdesine 2 x M5 Ti ile bağlanır.
    tools: [usta dil mastarı, Ø16 H8 ve Ø8 H8 raybalar, matkap kılavuzu]
    checks: ['iki pim deliği arası 0,184 m ±0,05 mm (kiriş ekseni boyunca)', 'burç merkezi ile çatal ağzı arası >= 2,5 D
        (burç dış çapı)', 'usta dil sıkışmasız kayar, boşluk <= 0,1 mm']
  - step: 6
    title_tr: Ön gövde çerçeveleri
    subassembly: FS0300, FS0600, FS1110, FS1330, FS1490, FS1810, FS-FUEL
    text: Burun ve orta gövde perde/çerçeveleri tezgâh pimlerine yerleştirilir. Kablo, pito ve yakıt geçiş kesikleri layout.stations
      listesine göre açılmış olmalıdır.
    tools: [tezgâh pimleri, lazer izleyici]
    checks: ['her çerçeve istasyonu ±0,3 mm', kesiklerin konumu ve kenar payı]
  - step: 7
    title_tr: 'Burun kutusu: omurga duvarları, aviyonik güverte, burun takımı mafsalı'
    subassembly: burun kutusu
    text: İki omurga duvarı FS0600 ile FS1110 arasına, aviyonik güverte bunların üstüne yapıştırılır. Burun takımı mafsal
      burç blokları (7075) her iki duvara bağlanır ve Ø16 H7 yuvalar mafsal mastarıyla birlikte hat raybalanır. Yukarı kilit
      kancası güvertenin altına takılır.
    tools: [mafsal mastarı, Ø16 H7 rayba, yapıştırıcı]
    checks: ['burun takımı mafsal ekseni = landing_gear.nose.pivot ±0,2 mm', 'omurga yarığı iç genişliği 0,083 m ±0,3 mm']
  - step: 8
    title_tr: Taret, paraşüt ve görev bölmeleri
    subassembly: bölme duvarları ve tabanları
    text: Taret bölmesi yan duvarları ve tavanı, paraşüt bölmesi duvarları ve tabanı, görev bölmesi tabanı yerleştirilir.
      Taret bölmesi kapak rayları için duvar alt kenarındaki yarık bırakılır.
    tools: [yapıştırıcı, kare mastar]
    checks: ['taret bölmesi iç ölçüsü 0,212 x 0,212 m', 'paraşüt bölmesi iç ölçüsü >= 0,300 x 0,312 m']
  - step: 9
    title_tr: Kenar çizgisi uzun kirişleri
    subassembly: YK250-CH-020 (L/R)
    text: Kenar çizgisi uzun kirişleri FS0600'den ana kiriş çerçevesine ve arka kiriş çerçevesinden yangın perdesinin ön
      yüzüne uzanır; kutu bölgesinde gövde yanı kaburgasına 2 x 4 M6 ile eklenir. Arka uçtaki 7075 uç bağlantısı adım 13'te
      perdeden geçen cıvatalarla stabilatör düğüm bağlantısına eklenir; motor bölmesine karbon parça geçmez.
    tools: [matkap şablonları, tork anahtarı]
    checks: ['kenar çizgisi hattı OML''ye göre 20 mm içeride ±0,5 mm', ek cıvataları torklu]
  - step: 10
    title_tr: Omurga kirişleri, güverteler ve ana takım yapısı
    subassembly: omurga kirişleri, ön yakıt güvertesi, kuyu tavanı, ana takım kirişleri, mafsal bağlantıları
    text: Yük bölmesi kenarındaki iki omurga kirişi, ön yakıt bölmesi tabanı, kuyu tavanı ve iki ana takım kirişi yerleştirilir.
      7075 mafsal bağlantıları (YK250-CH-070) kirişe ve tavana bağlanır; Ø20 H7 yatak yuvaları mafsal mastarıyla hat raybalanır.
    tools: [ana takım mafsal mastarı, Ø20 H7 rayba]
    checks: ['mafsal ekseni = landing_gear.main.trunnion ±0,2 mm, x eksenine paralel 0,05°', 'iki taraf simetrisi ±0,3 mm']
  - step: 11
    title_tr: 'Arka gövde: sırt uzun kirişleri, kuyruk ve ventral bağlantıları'
    subassembly: FS-GEAR, FS3480, sırt uzun kirişleri, arka omurga kirişi, kuyruk bağlantıları
    text: FS-GEAR ve FS3480 çerçeveleri, sırt uzun kirişleri (yangın perdesinin önünde biter), ventral omurga şeridi ve
      arka omurga kirişi takılır. Dikey ön kiriş bağlantısı, sabit kök parçası ön bağlantısı ve üç ventral bağlantısı matkap
      şablonlarından delinerek bağlanır.
    tools: [kuyruk bağlantı şablonları, tork anahtarı]
    checks: ['dikey kök bağlantı noktaları layout.chassis.fittings ±0,3 mm', ventral bağlantıları aynı hatta]
  - step: 12
    title_tr: Yangın perdesi ve motor bağlantı parçaları
    subassembly: FS3670
    text: Kompozit sandviç perde takılır; 12 paslanmaz ara parça üzerine 0,5 mm AISI 304 kalkan perçinlenir. İki köşe bağlantısı
      (motor üst ayağı 2 x M8, dikey arka kiriş çatalı 2 x M6, sırt uzun kirişi eki) ve iki alt motor ayağı (2 x M8) 7075
      destek plakaları ve paslanmaz ara borularla perdeye bağlanır. Kablo, yakıt ve itme çubuğu geçişlerine yanmaz rondela/körük
      takılır.
    tools: [perçin tabancası, tork anahtarı]
    checks: ['paslanmaz kalkan >= 0,38 mm (FIRE-001), açık delik yok', 'motor bağlantı parçası konumları ±0,3 mm']
  - step: 13
    title_tr: Stabilatör düğüm bağlantıları ve motor bölmesi alt U halkası
    subassembly: F-SPINDLE-NODE, FS3738
    text: İşlenmiş 7075 stabilatör düğüm bağlantıları (iç yatak yuvası işlenmiş halde) mil hizalama fikstürüyle (sahte mil
      + FS3480 kök parçası ön bağlantısı deliklerine bağlanan şablon) konumlanır ve 7 x M5 ile yangın perdesinden geçirilerek
      bağlanır; kenar çizgisi uzun kirişi uç bağlantıları aynı cıvatalarla eklenir. 2024-T3 alt U halka takılır ve uçları
      düğümün dış yanaklarına perçinlenir. Dış yatak yuvası kök parçası uç kaburgasında adım 31'de düğüm yuvasıyla eş eksenli
      işlenir.
    tools: [mil hizalama fikstürü (iki taraf), tork anahtarı]
    checks: ['düğüm yatak ekseni = tail.surfaces.stabilator.pivot ±0,2 mm, y eksenine paralel 0,05°', düğüm - motor dinamik
        zarfı >= 10 mm]
  - step: 14
    title_tr: Paraşüt, taret asansörü, yakıt bölmesi ve teçhizat bağlantıları
    subassembly: kayış bağlantıları, asansör ray bağlantıları, yakıt bölmesi astarları, tepsiler
    text: Sırt omurga kanalı (M-SPINE) FS1810 ile arka kiriş çerçevesi arasına, çerçeve kesiklerinden geçirilerek sızdırmaz
      yapıştırılır ve vidalanır; paraşüt ön ve arka kayış bağlantıları kanalın iki ucuna (taban 4 x M5, çerçeve 2 x M5),
      konteyner bağlama braketleri, taret asansör ray ve motor bağlantıları, yakıt bölmesi astarları ve hücre askıları,
      aviyonik/arka teçhizat tepsileri takılır.
    tools: [tork anahtarı]
    checks: [kayış bağlantıları 6 x M5 12.9 torklu, astarlarda keskin kenar yok]
  - step: 15
    title_tr: Şasi muayenesi ve tezgâhtan ayırma
    subassembly: şasi
    text: Şasi lazer izleyiciyle ölçülür, yapışmalar tıklama/ultrason testiyle denetlenir, şasi tartılır ve elektriksel
      bağlama hattının sürekliliği ölçülür. Şasi kendi kendini taşır; tezgâh ayrılır, şasi kaplama tezgâhına alınır.
    tools: [lazer izleyici, UT cihazı, terazi, mikro-ohmmetre]
    checks: ['ölçü raporu ±0,5 mm', şasi kütlesi <= mass.budget.chassis, 'bağlama direnci <= 2,5 mΩ']
  - step: 16
    title_tr: Sabit gövde kaplamaları
    subassembly: yapısal kaplamalar
    text: Yapısal kaplamalar (burun, orta, merkez, arka) çerçeve ve uzun kiriş flanşlarına M4 somun plakalı vidalarla 25-35
      mm aralıkla bağlanır; görev bölmesi üst kaplaması sırt kanalı flanşlarına da vidalanır (kayış x yükünün kesme yolu).
      Delikler kaplama şablonlarından delinir. Yakıt bölmesi çevresinde sızdırmazlık macunu kullanılır.
    tools: [kaplama şablonları, somun plakası perçin aleti]
    checks: ['kenar payı >= 2,5 D', 'kaplama basamağı <= 0,3 mm, aralık 1,0 ±0,3 mm']
  - step: 17
    title_tr: LERX/eldiven kaplamalarının yapıştırılması
    subassembly: LERX/eldiven (L/R)
    text: Birincil sandviç LERX/eldiven üst ve alt kaplamaları kaburgalara, kiriş başlıklarına ve kenar çizgisine yapıştırılır;
      birleşim erişim kapağı için çerçeveli kesik bırakılır.
    tools: [vakum torbası, ısıtıcı battaniye, yapıştırıcı]
    checks: [yapışma tanık numunesi, 'hücum kenarı profil mastarı ±0,3 mm']
  - step: 18
    title_tr: Yakıt sistemi
    subassembly: yakıt hücreleri ve hatları
    text: Üç esnek hücre (ön, eyer, arka) erişim kapaklarından yerleştirilir; ara bağlantı, havalandırma, dolum (sol kuru
      bağlantı), besleme/dönüş hatları, pompa/filtre, kesme valfi (perdenin önünde) ve seviye algılayıcıları bağlanır. Basınç
      ve sızıntı testi yapılır.
    tools: [basınç test seti, tork anahtarı]
    checks: ['test basıncı CS-LUAS.965(a)''ya göre, sızıntı yok', hücreler perdeye >= 13 mm, bağlama sürekliliği]
  - step: 19
    title_tr: Elektrik tesisatı
    subassembly: kablo demetleri
    text: Ana ve koaksiyel demetler layout.systems.harness yollarından, her çerçevede rondelalı geçişle döşenir; ana tekerlek
      kuyuları arasındaki merkez kanalı kapatılır; kanat ve kuyruk konnektörleri takılır.
    tools: [kablo bağı aleti, megger, süreklilik test cihazı]
    checks: [süreklilik ve yalıtım direnci, demet egzozdan >= 50 mm, hareketli parçalara >= 10 mm]
  - step: 20
    title_tr: Aviyonik ve güç dağıtımı
    subassembly: aviyonik güverte ve yan bölmeler
    text: PDU, kontaktör/sigorta bloğu ve DC-DC aviyonik güverteye; Li-ion tampon batarya havalandırmalı kutusuyla ön bölmenin
      üst kısmına, bağımsız uçuş sonlandırma birimi onun altına; jeneratör güç elektroniği ile fren eyleyicisi + ana silindir
      sol yan bölmeye; otopilot, veri bağları, transponder sağ yan bölmeye, uzaktan kimlik vericisi burun konisi perdesinin
      ön yüzüne takılır; motor ECU'su görev bölmesinin sökülebilir ekipman tepsisine bağlanır.
    tools: [tork anahtarı, ESD bileklik]
    checks: [bağlayıcı payları serbest (layout.rules.bay_contents), batarya havalandırma çıkışı ön bölme kapağında, 'güç-açık
        testi: bara gerilimleri']
  - step: 21
    title_tr: Antenler ve hava verisi
    subassembly: antenler, pito
    text: GNSS antenleri GFRP pencerelerin altına, veri bağı ve FTS antenleri burun konisine, transponder bıçak anteni burun
      altına (bakır ağ zemin düzlemiyle), uzaktan kimlik vericisi burun konisinin içine yerleşir; anten zarfları iç kaplama
      yüzeyinden en az 2 mm içeridedir. Burun pitosu ve kanat HASA sondası bağlanır, pito-statik hatlar sızdırmazlık testinden
      geçer.
    tools: [pito-statik test seti, VSWR ölçer]
    checks: ['VSWR <= 2,0', pito-statik sızıntı yok, anten önünde karbon yok (RF pencere)]
  - step: 22
    title_tr: Paraşüt sistemi
    subassembly: UAVOS 200 + Y-kayış
    text: Paraşüt konteyneri bölmeye bağlanır; Y-kayışın ön ayağı FS1810, arka ayağı arka kiriş çerçevesi bağlantısına takılır;
      arka ayak sırt kanalına yerleştirilip yırtılır örtüyle kapatılır. Menteşesiz kapak dört köşe pimiyle oturtulur, pim
      çekici mandal, kapak bağlama ipi (1,5 m) ve tetik hattı (FTS) bağlanır; emniyet pimleri takılı kalır.
    tools: [kayış uzunluk mastarı]
    checks: [kayış ayak uzunlukları layout.chassis.parachute.bridle, emniyet pimleri takılı (kırmızı flama)]
  - step: 23
    title_tr: Görev bilgisayarı ve yük tepsisi rayları
    subassembly: görev bölmesi, yük bölmesi
    text: Görev bilgisayarı/kayıtçı ve motor ECU'su sökülebilir ekipman tepsisine bağlanır; tepsi alttan P-MBHATCH açıklığından
      kaldırılıp taban kesiğinin kenar takviyelerine 8 x M4 ile vidalanır. Yük tepsisi rayları ön güvertenin altına takılır.
    tools: [tork anahtarı]
    checks: ['ray paralelliği 0,2 mm']
  - step: 24
    title_tr: Taret asansörü, kayar kapaklar ve HD59
    subassembly: taret bölmesi
    text: Asansör rayları, bilyalı vida ve motor takılır; kayar kapaklar raylarına, her kapağın DA 22 eyleyicisi FS1330'un
      arka yüzüne, alt kaplamadaki P-TDOORACC kapağından (FS1330-FS1490 arası, kapak süpürme bandının dışında) bağlanır;
      tahrik mili C-TDOOR-SHAFT kesiğinden geçer. Açıklık halkası (HD59, 14 x M4 gömme dişli burç) takılır, taret taşıyıcıya
      bağlanır. Kapak konum algılayıcıları ve asansör sınır anahtarları kilitlemesi ayarlanır; asansör 10 tam çevrim çalıştırılır.
    tools: [asansör test kutusu]
    checks: ['asansör yalnız iki kapak tam açık algılanınca hareket eder, kapaklar yalnız tam içeride kapanır', top ile
        halka arası >= 5 mm, içeride top ile kapak iç yüzü arası bütün top izdüşümünde >= 10 mm (payload.turret.bay.door_clearance)]
  - step: 25
    title_tr: Motorun takılması
    subassembly: L 275 EF + SG750
    text: 4130 kafes ve titreşim takozları perde bağlantı parçalarına bağlanır; motor 4 x M8 ile karter arka yüzündeki göbeklere
      takılır. İtki ekseni 5° aşağı eğim mastarla doğrulanır.
    tools: [motor askısı, tork anahtarı, eğim mastarı]
    checks: [M8 civataları torklu + emniyet teli, 'itki ekseni eğimi 5° ±0,2°', motor dinamik zarfı ile yapı arası >= 10
        mm]
  - step: 26
    title_tr: Egzoz, soğutma, motor yardımcıları
    subassembly: itki sistemi
    text: Egzoz/susturucular, soğutma kanalı ve silindir perdeleri, yakıt pompası/filtresi, gaz servosu ve motor demeti
      bağlanır; motor demeti adım 20'de takılan ECU'ya (görev bölmesi) ve jeneratör güç elektroniğine (sol yan bölme) bağlanır;
      perde geçişleri kapatılır.
    tools: [tork anahtarı, sıcaklık etiketi]
    checks: [egzoz-kompozit arası >= 50 mm (kalkanlı 25 mm), yangın kılıfları takılı]
  - step: 27
    title_tr: Pervane göbeği, pervane ve spinner
    subassembly: pervane
    text: 110 mm göbek ara parçası, Mejzlik 31x12 3B pervane ve spinner takılır; cıvatalar torklanır, pala izi ve balans
      ölçülür.
    tools: [tork anahtarı, pala izi mastarı, balans cihazı]
    checks: ['pala ucu izi <= 0,5 mm', pervane düzlemi x = propeller.plane_x, 'yapıya radyal >= 26 mm, boyuna >= 13 mm']
  - step: 28
    title_tr: Ana iniş takımı
    subassembly: ana bacaklar (L/R)
    text: Bacaklar mafsal yataklarına takılır, döner EMA'lar ve kilitler bağlanır; tekerlek/fren, hidrolik fren hatları
      ve bacak kapakları takılır.
    tools: [kriko seti, tork anahtarı, fren hava alma seti]
    checks: [aşağı/yukarı kilit çalışması, fren testi, tekerlek-kuyu arası >= 12 mm (tüm hareket)]
  - step: 29
    title_tr: Burun iniş takımı
    subassembly: burun bacağı
    text: Burun bacağı mafsala, döner EMA sağ omurga duvarına, direksiyon eyleyicisi bacağa takılır.
    tools: [kriko seti, tork anahtarı]
    checks: ['direksiyon ±20°, toplama öncesi merkezleme', kilit çalışması]
  - step: 30
    title_tr: Takım kapakları ve sıralama
    subassembly: iç kapaklar, istiridye kapaklar
    text: İç kapaklar menteşe millerine, DA 22 eyleyicileri FS-GEAR arka yüzüne bağlanır; burun istiridye kapakları takılır.
      Kapak contaları ve kapak kapalı anahtarları ayarlanır; tam toplama-açma dizisi çalıştırılır.
    tools: [kriko seti, ayar mastarları]
    checks: ['dizi: kapak açık -> bacak hareketi -> kapak kapalı', 'kapalı kapak yüzey basamağı <= 0,5 mm']
  - step: 31
    title_tr: Stabilatör kök parçaları, milleri ve eyleyicileri
    subassembly: stabilatör tahriki (L/R)
    text: Sabit kök parçaları FS3480 bağlantısına ve düğüm bağlantısının dış yanağına (4 x M6) takılır; dış yatak yuvası
      düğüm yuvasıyla eş eksenli işlenir (mil hizalama fikstürü); miller iki yatağa yerleştirilir. DA 30 eyleyicileri yangın
      perdesinin ön yüzüne bağlanır; itme çubukları yanmaz körüklerden geçirilip mil kollarına takılır.
    tools: [tork anahtarı, açı ölçer]
    checks: [kök boşluğu 8 mm (R-38), 'bağlantı oranı 2,5:1 nötrde', hareket sırasında sürtünme yok]
  - step: 32
    title_tr: Dikey kuyruklar ve dümenler
    subassembly: dikeyler (L/R)
    text: Dikeyler ön ve arka kiriş kök bağlantılarına takılır; dümen eyleyicileri ve demetler bağlanır; uç kapakları (GFRP,
      antenli) takılır.
    tools: [tork anahtarı]
    checks: ['dikey eğimi 22° ±0,2°', dümen kökü kaportaya >= 8 mm (±25°)]
  - step: 33
    title_tr: Ventral kanatçık ve tampon kızağı
    subassembly: ventral
    text: Ventral kanatçık arka omurga kirişine üç bağlantıyla, değiştirilebilir UHMW-PE kızak 4130 şerit üzerine takılır.
    tools: [tork anahtarı]
    checks: [kızak pervane diskinin altında (R-48)]
  - step: 34
    title_tr: Stabilatörlerin takılması
    subassembly: stabilatörler (L/R)
    text: Stabilatörler mil uçlarına geçirilir ve çapraz cıvatayla emniyetlenir.
    tools: [tork anahtarı]
    checks: [-20° / +15° hareket serbest, kök boşluğu sabit 8 mm]
  - step: 35
    title_tr: Dış kanat panelleri (ilk takma)
    subassembly: dış paneller (L/R)
    text: Panel ana kiriş ekseni boyunca içeri sürülür; kompozit dil çatala, arka kiriş kulağı yuva bağlantısına ve kör
      takılan kanat konnektörü yuvasına aynı anda girer. İki Ø16 ana pim önden (P-JOINTACCESS), Ø8 arka pim alttan (P-REARACCESS,
      bilyalı kilit) takılır, emniyet plakaları vidalanır; kanatçık ve flap eyleyicileri kontrol edilir.
    tools: [kanat sehpası (2 adet), pim itici, tork anahtarı]
    checks: ['pimler tam oturmuş, emniyet plakaları takılı', birleşim contası sürekli, konnektör kilitli]
  - step: 36
    title_tr: Kabuğun kapatılması
    subassembly: kaportalar, kapaklar, radom
    text: Kaporta parçaları (alt yarımlar, üst yan parçalar, üst orta parça; dikey ve kök parçası kök şeritleri sabit),
      aviyonik kapağı, yan bölme kapakları, görev ve yük bölmesi kapakları, arka teçhizat kapağı, stabilatör eyleyici kapak
      yarımları, birleşim erişim kapakları ve burun konisi kapatılır.
    tools: [Camloc anahtarı, tork anahtarı]
    checks: [her Camloc kilitli (işaret çizgisi), 'kapak basamağı <= 0,3 mm']
  - step: 37
    title_tr: Kumanda yüzeylerinin ayarı
    subassembly: kumanda
    text: Kanatçık, flap, dümen ve stabilatör nötr konumları, hareket aralıkları ve yönleri ayarlanır; boşluklar ölçülür.
    tools: [açı ölçer, kumanda yer istasyonu]
    checks: [aralıklar wing.controls / tail.*.controls.range_deg, 'boşluk <= 0,5° (eyleyici) + 0,3° (bağlantı)', yön testi
        (her yüzey)]
  - step: 38
    title_tr: Fonksiyon testleri
    subassembly: bütün sistemler
    text: Takım toplama/açma dizisi (5 çevrim), taret indirme/kaldırma (10 çevrim), paraşüt kapağı mandal testi (piroteknik
      olmadan), ışıklar, veri bağları, uçuş sonlandırma uçtan uca, yakıt sistemi ve motor yer çalıştırması (CHT sınırlı)
      yapılır.
    tools: [yer istasyonu, yangın söndürücü, takozlar]
    checks: [bütün diziler hatasız, CHT <= 240 °C yer çalıştırmasında]
  - step: 39
    title_tr: Tartı ve denge
    subassembly: uçak
    text: Uçak üç teraziyle (burun ve iki ana teker) boş ve yükleme durumlarında tartılır; ağırlık merkezi stability.cg_range_x
      ve R-09 ile karşılaştırılır.
    tools: [3 platform terazi, eğim ölçer]
    checks: [boş kütle <= mass.budget toplamı, ağırlık merkezi zarf içinde, yanal AM <= 5 mm]
  - step: 40
    title_tr: Son muayene ve kabul
    subassembly: uçak
    text: Bütün tork işaretleri, emniyet telleri, kapak kilitleri ve belgeler denetlenir; uçuşa elverişlilik dosyası tamamlanır.
    tools: [kontrol listesi]
    checks: [açık bulgu yok]
  - step: 41
    title_tr: Taşıma için sökme
    subassembly: taşıma
    text: Pervane, stabilatörler ve dış kanat panelleri sökülür (assembly.transport); paneller kılıflarına, orta gövde taşıma
      beşiğine konur.
    tools: [kanat sehpası, taşıma beşiği]
    checks: [pimler ve emniyet plakaları torbasında, bütün açık konnektörler kapaklı]
  - step: 42
    title_tr: Sahada montaj
    subassembly: saha
    text: Dış paneller, stabilatörler ve pervane takılır (assembly.field_assembly); uçuş öncesi denetimler yapılır.
    tools: [saha alet çantası, tork anahtarı]
    checks: [pim ve emniyet plakaları, kumanda yön testi, pervane torku ve emniyet]
  transport:
    units:
    - unit: centre body with LERX/glove, fins, stubs, ventral, gear, engine
      size_m: [4.23, 1.4, 1.29]
      mass_note: empty mass minus outer panels, stabilators, propeller
      support: transport cradle on the FS1810 and FS-GEAR lower frame lands (two padded saddles), gear retracted (height
        without cradle) or on the gear with chocks; fin tips under padded covers
    - unit: outer wing panel (x2)
      size_m: [3.199, 0.728, 0.11]
      basis: 'loft of the outer panel (wing.split at y 0.7) in the panel frame: span 2.904 m along the dihedral + tongue
        0.295 m; chord-wise extent 0.728 m (sweep and taper) and normal extent 0.096 m (twist, dihedral frame) of the loft;
        with the wing pitot probe (AD-PITOT-WING, ahead of and below the leading edge) included 0.728 x 0.110 m; the rear-spar
        lug (44 mm) lies inside the tongue length; control horns stay inside the coves (fix round 2, PK2-12)'
      case_inner_m: [3.25, 0.78, 0.16]
      support: padded rack / case (inner size = envelope + 25 mm foam each side, design choice), panel on its leading edge
        with the pitot removed or in a cut-out; tongue cap and rear-lug cap (length incl. the 0.29 m tongue)
    - unit: stabilator (x2)
      size_m: [0.79, 0.73, 0.08]
      support: foam box; root socket cap
    - unit: propeller (3 blades, one piece)
      size_m: [0.68, 0.59, 0.12]
      support: propeller box (blade-tip triangle; depth 0.12 m estimate incl. the blade twist)
    requirements: R-29 (outer panel <= 3.4 m) and R-30 (centre section <= 2.0 m) of the spec; van/trailer transport
    text_tr: 'Taşıma dört parçalıdır: kanat eldiveni, dikeyler, kök parçaları ve ventral ile birlikte orta gövde (1,40 m
      genişlik, 4,23 m boy, takım içeride 1,29 m yükseklik), iki dış kanat paneli (2,90 m açıklık, dil dahil 3,20 m), iki
      stabilatör ve pervane.'
  field_assembly:
  - n: 1
    text_tr: Orta gövdeyi düz zemine takozlarla yerleştir, kanat sehpalarını kur.
    people: 2
    minutes: 3
  - n: 2
    text_tr: Birleşim erişim kapaklarını ve arka pim deliği kapağını aç; dil ve kulak kapaklarını çıkar, çatal ağzını ve
      contayı denetle.
    people: 1
    minutes: 3
  - n: 3
    text_tr: Dış paneli ana kiriş ekseni boyunca içeri sür (bir kişi uçta), dil, arka kiriş kulağı ve konnektör aynı anda
      girer; panel oturunca iki Ø16 pimi önden, Ø8 arka pimi alttan tak, emniyet plakalarını 2 x M4 ile vidala.
    people: 2
    minutes: 7
  - n: 4
    text_tr: Konnektörün kilitlendiğini denetle, erişim kapaklarını kapat. Diğer kanat için tekrarla.
    people: 1
    minutes: 5
  - n: 5
    text_tr: Stabilatörleri mil uçlarına geçir, çapraz cıvatayı tork ve emniyetle.
    people: 1
    minutes: 4
  - n: 6
    text_tr: Pervaneyi tak, cıvataları torkla ve emniyetle; spinner'ı tak.
    people: 1
    minutes: 5
  - n: 7
    text_tr: 'Uçuş öncesi denetim: kumanda yön testi, pim emniyetleri, paraşüt emniyet piminin çıkarılması (son adım), yakıt
      drenajı.'
    people: 2
    minutes: 8
  maintenance_access:
  - item: spark plugs, cylinders, CHT/EGT sensors, exhaust, baffles
    access: [P-COWL-UP, P-COWL-UPS, P-COWL-LO]
    fasteners: Camloc
    primary_structure_removed: false
    notes: 'fix round 1 (VPK-05): the cowl is split around the fin, stub and ventral roots (fixed root strips), so no fixed
      surface is removed'
    item_tr: bujiler, silindirler, CHT/EGT algılayıcıları, egzoz, hava yönlendiricileri
    access_tr: [P-COWL-UP, P-COWL-UPS, P-COWL-LO]
    fasteners_tr: Camloc
  - item: engine (removal)
    access: [P-COWL-UP, P-COWL-UPS, P-COWL-LO]
    fasteners: Camloc + 4 x M8 mount bolts
    primary_structure_removed: false
    notes: propeller and spinner off; the engine slides 0.25 m aft along the thrust axis off the mount face and is then
      lifted 0.35 m clear of the fin and stub roots (assembly_paths engine_removal + engine_lift, swept in layout_check
      C05; fix round 2, PK2-11)
    item_tr: motor (sökme)
    access_tr: [P-COWL-UP, P-COWL-UPS, P-COWL-LO]
    fasteners_tr: Camloc + 4 x M8 bağlantı cıvatası
  - item: fuel pump/filter + drain, inner-door actuators, tail connector, engine harness junction
    access: [P-AFTHATCH]
