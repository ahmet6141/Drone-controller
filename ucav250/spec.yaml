# ---------------------------------------------------------------------------------------------------------------------
# layups: layups
# ---------------------------------------------------------------------------------------------------------------------
layups:
  wing_skin_primary:
    plies: [[cfrp_pw_mtm45_as4, '+-45,0/90,+-45', 3]]
    core: core_rohacell_51wf
    core_t: 0.005
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,+-45', 2]]
    adhesive_areal: 0.0
    use: 'wing and LERX skins (primary sandwich, 0.6/5/0.4 mm); structures phase: +-45-dominated faces (one 0/90 ply per
      sandwich = 10 % 0 and 90 deg, +-45 outer plies) so that the skin''s low spanwise modulus leaves the bending to the
      spar caps and the skin stays below its shear-crimping load (the earlier ''0/90,+-45,0/90 / +-45,0/90'' faces crimp
      at the cap design strain; docs/04_yapi_hesaplari.md)'
    source: endurance concept study areal-mass rule; baseline.yaml#processes min laminate; structures.py (ply orientation,
      same ply count and thickness)
  shell_secondary:
    plies: [[cfrp_pw_mtm45_as4, '0/90,+-45', 2]]
    core: core_rohacell_51wf
    core_t: 0.005
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,0/90', 2]]
    adhesive_areal: 0.0
    use: body skins, doors, fairings (secondary sandwich, 0.4/5/0.4 mm)
    source: endurance concept study areal-mass rule
  tail_skin:
    plies: [[cfrp_pw_mtm45_as4, '0/90,+-45,0/90', 3]]
    core: core_rohacell_51wf
    core_t: 0.004
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,0/90', 2]]
    adhesive_areal: 0.0
    use: stabilators, fins, ventral fin (0.6/4/0.4 mm)
    source: endurance concept study
  rib_panel:
    plies: [[cfrp_pw_mtm45_as4, '+-45,0/90', 2]]
    core: core_rohacell_51wf
    core_t: 0.006
    inner_plies: [[cfrp_pw_mtm45_as4, '0/90,+-45', 2]]
    adhesive_areal: 0.0
    use: ribs, frames, bulkheads (0.4/6/0.4 mm)
    source: endurance concept study
  spar_cap_ud:
    plies: [[cfrp_ud_mtm45_as4, 0, from loads]]
    core: null
    core_t: 0.0
    adhesive_areal: 0.0
    use: wing spar caps (area from the CS-LUAS gust envelope, sizing.py)
    source: sizing.py wing_structure (endurance-study spar-cap rule)
  spar_web:
    plies: [[cfrp_pw_mtm45_as4, +-45, 'from loads, min 0.6 mm']]
    core: null
    core_t: 0.0
    adhesive_areal: 0.0
    use: spar shear webs
    source: sizing.py wing_structure
  chine_edge_band:
    plies: [[cfrp_pw_mtm45_as4, '0/90,+-45', 6]]
    core: null
    core_t: 0.0
    adhesive_areal: 0.0
    use: solid laminate along the chines (impact, edge closure)
    source: identity concept study (estimate)
  wing_box_skin_upper:
    plies: [[cfrp_pw_mtm45_as4, '+-45,0/90,+-45', 3]]
    core: core_rohacell_51wf
    core_t: 0.006
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,+-45', 2]]
    adhesive_areal: 0.0
    use: 'upper wing skin between the main- and rear-spar caps from the side-of-body rib to structures.sizing.wing.box_skin_upper_y_end_m
      (0.6/6/0.4 mm): core 1 mm thicker than wing_skin_primary (buckling and shear crimping under the bending compression);
      OML unchanged, the inner surface steps 1 mm at the cap edges (core ramp)'
    source: structures.py (check W-SKINBUCK / W-SKINCRIMP)
  ct_box_cover:
    plies: [[cfrp_pw_mtm45_as4, '+-45,0/90', 2]]
    core: core_rohacell_51wf
    core_t: 0.006
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,+-45', 2]]
    adhesive_areal: 0.0
    use: carry-through box covers (upper and lower) between the spar frames FS-MS / FS-RS, y -0.40..0.40 (0.4/6/0.4 mm),
      bonded to the CT-box caps and continuing the glove skins across the body
    source: structures.py (checks W-SKINBUCK-CT / W-SKINCRIMP-CT)
  fuel_floor_wellroof:
    plies: [[cfrp_pw_mtm45_as4, '+-45,0/90,0/90', 3]]
    core: core_rohacell_71wf
    core_t: 0.0056
    inner_plies: [[cfrp_pw_mtm45_as4, '+-45,0/90,0/90', 3]]
    adhesive_areal: 0.0
    use: 'aft fuel-cell floor = main-well roof M-WELLROOF (0.6/5.6/0.6 mm = 6.8 mm, the layout thickness): 3-ply faces and
      the denser ROHACELL 71 WF core for the bay design pressure'
    source: structures.py (checks F-*-030)

# ---------------------------------------------------------------------------------------------------------------------
# processes: processes (materials.yaml spec_ready)
# ---------------------------------------------------------------------------------------------------------------------
processes:
  prepreg_ooa_vacbag:
    name: OOA prepreg, oven vacuum-bag cure
    name_tr: Otoklav disi prepreg, vakum torbasi ve firin kurlama
    min_thickness: 0.0006
    tolerance: ISO 2768-mK for trimmed/machined edges and holes; laminate thickness +/-10 % (estimate); tool-side surface
      profile +/-0.3 mm (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.003
      male: 0.0015
    min_bend_radius_t: null
    edge_distance_D: 3.0
    edge_distance_D_min: 2.5
    notes: stacking rules in processes.composite_moulding; ply drop 1:20; MH cure per NPS 81451
    tag: estimate
    source: https://elib.dlr.de/107894/1/__Bsfait00_fa_Archive_IB_2016_IB_2016_173_MA%20Werthen.pdf
  wet_layup_vacbag:
    name: Wet lay-up with vacuum-bag consolidation
    name_tr: Islak yatirma ve vakum torbasi
    min_thickness: 0.0006
    tolerance: ISO 2768-c on moulded features, ISO 2768-m after CNC trim (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.004
      male: 0.002
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: secondary structure and fairings only, unless qualified by coupon tests
    tag: estimate
    source: https://journal.unimma.ac.id/AutomotiveExperiences/article/view/16310
  vacuum_infusion:
    name: Vacuum infusion
    name_tr: Vakum infuzyon
    min_thickness: 0.0008
    tolerance: ISO 2768-m after CNC trim; thickness +/-10 % (estimate)
    draft_deg: 2.0
    min_inside_radius:
      female: 0.003
      male: 0.002
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: large panels, foam-core sandwich (Airex C70); needs flow-media design and witness panels
    tag: estimate
    source: https://journal.unimma.ac.id/AutomotiveExperiences/article/view/16310
  cnc_milling_metal:
    name: CNC milling (aluminium, steel, titanium)
    name_tr: CNC frezeleme
    min_thickness: 0.0015
    tolerance: ISO 2768-mK general; +/-0.125 mm default, +/-0.025 mm on fits (ISO 286)
    draft_deg: 0.0
    min_inside_radius: 0.003
    min_bend_radius_t: null
    edge_distance_D: 2.0
    notes: pocket depth <= 4 x width; internal radius > depth/3; threads <= 3 D engaged; Ra 3.2 um as machined
    tag: vendor
    source: https://www.hubs.com/guides/cnc-machining/
  sheet_metal_aluminium:
    name: Sheet-metal cutting and press-brake bending (aluminium)
    name_tr: Sac kesme ve abkant bukum (aluminyum)
    min_thickness: 0.0005
    tolerance: ISO 2768-mK linear; bend angle +/-1 deg for bends up to 610 mm (SendCutSend)
    draft_deg: 0.0
    min_bend_radius_t:
      al_5052_H32: 1.5
      al_6061_T6: 3.0
      al_2024_T3: 6.0
      al_7075_T6: 7.0
      al_6061_T4: 2.0
    min_bend_radius_note: upper end of AC 43.13-1B Table 4-6 at 3.25 mm (0.128 in) thickness; use the table for other thicknesses
    edge_distance_D: 2.0
    hole_to_bend: 2.5 t + R
    notes: K-factor 0.33-0.5 by R/t (estimate)
    tag: standard
    source: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf
  tig_welding_4130:
    name: TIG welding of 4130 normalised tube (engine mount, gear frames)
    name_tr: 4130 boru TIG kaynagi
    min_thickness: 0.00089
    tolerance: jig-located, ISO 2768-c on the weldment; machine attachment pads/bores after welding to ISO 2768-m and ISO
      286 fits (estimate)
    draft_deg: null
    min_bend_radius_t: null
    edge_distance_D: 2.0
    notes: design near-weld Ftu 80 ksi (552 MPa); filler AMS 6457; Group 1 welder
    tag: standard
    source: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_43.13-1B_w-chg1.pdf
  sls_pa12:
    name: SLS printing PA12
    name_tr: SLS baski (PA12)
    min_thickness: 0.001
    tolerance: +/-0.3 % with lower limit +/-0.3 mm (estimate)
    draft_deg: 0.0
    min_bend_radius_t: null
    edge_distance_D: 3.0
    notes: non-structural / secondary parts only (processes.additive_manufacturing.acceptable_use_on_yk250)
    tag: estimate
    source: https://www.shapeways.com/wp-content/uploads/2021/10/Material-Data-sheet-Nylon-12-PA2200.pdf
  fdm_pa_cf:
