# =====================================================================================================================
# ucav250/spec.yaml — YK-250 HANÇER, v1 (sizing phase)
# Single source of truth (ARCHITECTURE.md §1, §9). SI units, metres, kg, W, degrees in keys ending _deg.
# Frame: X aft from the nose tip, Y starboard, Z up; Z = 0 on the centre-body chine plane (layout.datum).
# Derived blocks (wing sections, fuselage stations, tail sections, landing-gear positions, mass items, layout zones,
# reference copies) are written by `python3 -m ucav250.analysis.sizing --update-spec` (design closure from the inputs
# and rules in this file) and verified by `python3 -m ucav250.analysis.sizing --check` (exit 1 on any deviation or
# requirement violation). Workflow: edit inputs/rules here -> --update-spec -> --check.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# meta: identity and scope
# ---------------------------------------------------------------------------------------------------------------------
meta:
  name: YK-250 HANÇER
  project: YK-250 (ucav250) — 150 kg sınıfı sivil EO/IR gözetleme ve araştırma İHA'sı
  revision: v1.1
  date: '2026-10-06'
  description_tr: 'HANÇER: köşeli (chine) taşıyıcı gövde; elmas benzeri kesitlerin keskin kenar çizgileri kavisli ön kenar
    uzantılarına (LERX) akar ve yüksek açıklık oranlı NLF kanada kaynaşır. Dışa eğik ikiz dikey kuyruk (dümenli), sabit
    kök parçalı tamamen hareketli yatay kuyruk (stabilatör), açık itici pervane (eğik dikeylerin firar kenarları diskin
    üst-yan bölgelerinde uç çemberinin 50 mm dışından geçer; alttan ventral kanatçık/kuyruk tamponu korur), içeri katlanır
    üç tekerlekli iniş takımı ve gövde altındaki bölmeden indirilip kaldırılan EO/IR taret. v1.1: bağımsız doğrulama bulgularının
    (F1–F19) düzeltmeleri. Bu dosya boyutlandırma fazının tek doğruluk kaynağıdır; türetilmiş değerleri `python3 -m ucav250.analysis.sizing
    --check` doğrular.'
  scope_tr: 'Kapsam: yalnızca sivil EO/IR gözetleme ve araştırma. Platform silah (weapon), mühimmat (munition), sert bağlantı
    noktası (hardpoint), pilon (pylon) veya yük bırakma (release) mekanizması içermez ve bunlar için tasarlanmamıştır; görünüm
    dili yalnızca biçimdir.'

# ---------------------------------------------------------------------------------------------------------------------
# requirements: requirements (metric = key of out/sizing.json -> metrics)
# ---------------------------------------------------------------------------------------------------------------------
requirements:
- id: R-01
  text_tr: Azami kalkış kütlesi 150 kg'ın altında (SHT-İHA M2 sınıfı, 149,9 kg tavan)
  metric: mtow_kg
  op: <=
  value: 149.9
  unit: kg
  source: baseline.yaml#mass_targets.mtow_kg.hard_cap (SHT-IHA Madde 8(1))
- id: R-02
  text_tr: Tasarım görevi dayanımı ≥ 10 h (tırmanma, 2 x 100 km geçiş, 3000 m'de taret dışarıda bekleme, alçalma; %10 yedek
    ayrıca)
  metric: endurance_h
  op: '>='
  value: 10.0
  unit: h
  source: baseline.yaml#mission_targets.endurance_h
- id: R-03
  text_tr: Tasarım faydalı yükü ≥ 20 kg (EO/IR taret + görev bilgisayarı + araştırma yükü payı)
  metric: payload_kg
  op: '>='
  value: 20.0
  unit: kg
  source: baseline.yaml#mass_targets.payload_design_kg
- id: R-04
  text_tr: Servis tavanı (0,5 m/s) ≥ 4500 m, MTOM
  metric: ceiling_service_m
  op: '>='
  value: 4500.0
  unit: m
  source: baseline.yaml#mission_targets.service_ceiling_m
- id: R-05
  text_tr: Deniz seviyesi tırmanma hızı ≥ 4,0 m/s, MTOM, tam gaz (4,9 m/s karşılaştırma hedefi pervane sınırlı; bkz. pervane
    ödünleşimi)
  metric: roc_sl_m_s
  op: '>='
  value: 4.0
  unit: m/s
  source: baseline.yaml#mission_targets.climb_rate_sea_level_m_per_s (4.9 m/s comparables estimate); v1 requirement set
    to the propeller-limited value of the reference concepts (endurance 4.35, identity 4.24 m/s)
- id: R-06
  text_tr: Kalkış yer koşusu ≤ 200 m (MTOM, ISA deniz seviyesi; 300 m pist / 1,5)
  metric: takeoff_ground_roll_m
  op: <=
  value: 200.0
  unit: m
  source: baseline.yaml#mission_targets.runway_length_m / 1.5 field factor (endurance study)
- id: R-07
  text_tr: İniş yer koşusu ≤ 200 m (görev sonu kütlesi, ISA deniz seviyesi)
  metric: landing_ground_roll_m
  op: <=
  value: 200.0
  unit: m
  source: baseline.yaml#mission_targets.runway_length_m / 1.5 field factor (endurance study)
- id: R-08
  text_tr: Tutunma hızı ≤ 24 m/s (temiz, trimli, MTOM, deniz seviyesi)
  metric: vs_clean_sl_mtow_m_s
  op: <=
  value: 24.0
  unit: m/s
  source: docs/01_arastirma.md wing-loading rule (flapless CLmax 1.4, VS <= 24 m/s); endurance study constraint
- id: R-09
  text_tr: Statik marj ≥ %10 OAK (tüm yükleme durumları, öndeki nötr nokta)
  metric: static_margin_min
  op: '>='
  value: 0.1
  unit: '-'
  source: endurance study design rule (aero.stability_rules.sm_min)
- id: R-10
  text_tr: Statik marj ≤ %30 OAK (tüm yükleme durumları)
  metric: static_margin_max
  op: <=
  value: 0.3
  unit: '-'
  source: endurance study design rule (aero.stability_rules.sm_max)
- id: R-11
  text_tr: Yön kararlılığı Cnβ ≥ 0,057 1/rad (0,001 1/derece)
  metric: cn_beta_per_rad
  op: '>='
  value: 0.057
  unit: 1/rad
  source: endurance study directional_stability_target_per_rad
- id: R-12
  text_tr: Geri devrilme açısı ≥ 15° (en arka zemin ağırlık merkezi)
  metric: tipback_deg
  op: '>='
  value: 15.0
  unit: deg
  source: landing_gear.rules.tipback_min_deg (Raymer practice, endurance study)
- id: R-13
  text_tr: Yana devrilme açısı ≤ 55°
  metric: turnover_deg
  op: <=
  value: 55.0
  unit: deg
  source: landing_gear.rules.turnover_max_deg (Raymer practice, endurance study)
- id: R-14
  text_tr: Burun tekerleği yükü ≥ %8 (en arka ağırlık merkezi)
  metric: nose_load_aft_cg
  op: '>='
  value: 0.08
  unit: '-'
  source: landing_gear.rules.nose_load_min (Raymer 8-15 % guidance)
- id: R-15
  text_tr: Burun tekerleği yükü ≤ %20 (en ön ağırlık merkezi)
  metric: nose_load_fwd_cg
  op: <=
  value: 0.2
  unit: '-'
  source: landing_gear.rules.nose_load_max (Raymer guidance)
- id: R-16
  text_tr: 'Pervane yer açıklığı ≥ 0,18 m: statik tutum, kalkış (yerden kesilme) tutumu ve teker koyma tutumunun en kritiği
    (MTOM; kalkışta amortisör statik çökmede, teker koymada yüksüz)'
  metric: prop_clear_min_925a_m
  op: '>='
  value: 0.18
  unit: m
  source: 'standards.yaml#propeller_clearance.ground_m (CS-VLA 925(a): level, normal take-off and taxi attitudes, gear statically
    deflected) + note "for a pusher check the rotation/flare attitude"; touch-down attitude added (gear unloaded at first
    contact)'
- id: R-17
  text_tr: Sönük ana lastik + dibe oturmuş amortisörde pozitif pervane açıklığı (≥ 0,02 m)
  metric: prop_clear_flat_tyre_m
  op: '>='
  value: 0.02
  unit: m
  source: standards.yaml#ENG-007 note (CS-VLA 925) + 20 mm design margin
- id: R-18
  text_tr: Kuyruk tamponu pervaneden önce yere değer (açı farkı ≥ 1°)
  metric: bumper_before_prop_margin_deg
  op: '>='
  value: 1.0
  unit: deg
  source: 'design rule: ventral bumper protects the open pusher propeller (landing_gear.rules)'
- id: R-19
  text_tr: Kalkış ve flare açısında kuyruk tamponu yere değmez (pay ≥ 2°)
  metric: bumper_rotation_margin_deg
  op: '>='
  value: 2.0
  unit: deg
  source: landing_gear.rules.bumper_margin_deg (endurance study)
- id: R-20
  text_tr: Teker koyma açısı ≥ 3° (ana tekerler önce değer)
  metric: touchdown_attitude_deg
  op: '>='
  value: 3.0
  unit: deg
  source: endurance study theta_touchdown_target_deg
- id: R-21
  text_tr: Ana iniş takımı gövde içine toplanır (teker, bacak, mafsal; kanat kutusu ile çakışma yok)
  metric: main_gear_stowed
  op: ==
  value: 1.0
  unit: '-'
  source: 'configuration.gear (user requirement: retractable)'
- id: R-22
  text_tr: Burun iniş takımı omurga yuvasına toplanır
  metric: nose_gear_stowed
  op: ==
  value: 1.0
  unit: '-'
  source: 'configuration.gear (user requirement: retractable)'
- id: R-23
  text_tr: Taret içeride kapakların üstünde kalır (gömülü)
  metric: turret_flush_margin_m
  op: '>='
  value: 0.0
  unit: m
  source: 'configuration.turret (user requirement: retractable turret)'
- id: R-24
  text_tr: E180 büyüme zarfı (0,18 x 0,23 m) taret bölmesine sığar
  metric: turret_growth_inside
  op: ==
  value: 1.0
  unit: '-'
  source: baseline.yaml#payload_set.turret_bay_growth_envelope
- id: R-25
  text_tr: 'Taret dışarıda: nadirden en az −5° yükselime kadar her azimutta engelsiz görüş'
  metric: turret_fov_upper_min_deg
  op: '>='
  value: -5.0
  unit: deg
  source: design rule for EO/IR surveillance (look-down field of regard)
- id: R-26
  text_tr: Yerleşim bölgeleri gövdeye sığar (hata sayısı 0)
  metric: packaging_zones_failed
  op: ==
  value: 0.0
  unit: '-'
  source: ARCHITECTURE.md §1.4 (nothing colliding)
- id: R-27
  text_tr: Yerleşim bölgeleri ve yakıt hücreleri çakışmaz (çakışma sayısı 0)
  metric: zone_overlaps
  op: ==
  value: 0.0
  unit: '-'
  source: ARCHITECTURE.md §1.4 (nothing colliding)
- id: R-28
  text_tr: Yakıt hacmi gereken hacmi karşılar (pay ≥ 0)
  metric: fuel_volume_margin
  op: '>='
  value: 0.0
  unit: '-'
  source: structures.fuel (bladder expansion 2 %, tank efficiency 0.85)
- id: R-29
  text_tr: 'Taşıma: çıkarılabilir dış kanat paneli ≤ 3,4 m'
  metric: outer_panel_length_m
  op: <=
  value: 3.4
  unit: m
  source: comparables.yaml#recommended_ranges.span_m (6.8 m = 2 x 3.4 m one-piece transport panels)
- id: R-30
  text_tr: Gövde + LERX orta kesiti ≤ 2,0 m (tek parça taşıma)
  metric: centre_section_width_m
  op: <=
  value: 2.0
  unit: m
  source: design rule (road transport in a van/trailer)
- id: R-31
  text_tr: Statik pervane uç Mach sayısı ≤ 0,75
  metric: prop_tip_mach_static
  op: <=
  value: 0.75
  unit: '-'
  source: aero.yaml#propellers tip_speed_guidance (static helical tip Mach <= ~0.75)
- id: R-32
  text_tr: Jeneratör çıkışı beklemede en büyük sürekli elektrik yükünün ≥ 1,2 katı (E180 büyüme tareti ve araştırma yükü
    güç payı dahil; tepe yükler tampon bataryadan)
  metric: generator_margin_loiter
  op: '>='
  value: 1.2
  unit: '-'
  source: 'baseline.yaml#subsystems.electrical_load_W (303 W) + #payload_set E180 40 W normal / 160 W peak (components.yaml
    octopus_e180_launch) + engine.electrical_budget.research_payload_allowance_W; SG750 rpm scaling (engine.generator);
    design margin'
- id: R-33
  text_tr: Pervane uçları ile yapı arasında radyal açıklık ≥ 0,026 m (CS-VLA 925(c)(1))
  metric: prop_clear_radial_m
  op: '>='
  value: 0.026
  unit: m
  source: standards.yaml#propeller_clearance.radial_tip_m (CS-VLA 925(c)(1))
- id: R-34
  text_tr: Pervane palaları ile sabit yapı (kaporta, kuyruk yüzeyleri) arasında boyuna açıklık ≥ 0,013 m (CS-VLA 925(c)(2))
  metric: prop_clear_longitudinal_m
  op: '>='
  value: 0.013
  unit: m
  source: standards.yaml#propeller_clearance.longitudinal_m (CS-VLA 925(c)(2))
- id: R-35
  text_tr: 'Kalkışta dönme yetkisi: stabilatörler burun tekerini ana tekerler hâlâ yüklüyken kaldırır (tekerlek arabası
    etkisi yok; bütün MTOM yükleme durumları)'
  metric: takeoff_main_gear_load_at_rotation_N
  op: '>'
  value: 0.0
  unit: N
  source: 'take-off physics (Raymer 6th ed. 17.8; verification finding F1): nose-wheel lift-off before the main wheels unload'
- id: R-36
  text_tr: Stabilatör trim gereksinimi (yerel CL, η_t dahil; temiz/kalkış CLmax ve tam güçte yerden kesilme/pas geçme, en
    ön ağırlık merkezleri) ≤ 0,8 × stabilatör CLmax
  metric: stab_trim_cl_local_max
  op: <=
  value: 0.72
  unit: '-'
  source: aero.stability_rules.stabilator_clmax 0.9 x 0.8 (20 % gust/control margin; endurance study rule)
- id: R-37
  text_tr: 'Stabilatör eyleyicisi: tepe tork × bağlantı oranı ≥ 1,25 × en büyük menteşe momenti (CS-LUAS.395(a)(1))'
  metric: stab_hinge_peak_margin
  op: '>='
  value: 1.0
  unit: '-'
  source: standards.yaml actuator_sizing_rule (CS-LUAS.395(a)(1)); components.yaml volz_da30
- id: R-38
  text_tr: Stabilatör kök boşluğu ≤ 10 mm (sabit kök parçasına karşı, bütün sapma aralığında sabit)
  metric: stab_root_gap_m
  op: <=
  value: 0.01
  unit: m
  source: verification finding F3; all-moving tail practice (constant small root gap)
- id: R-39
  text_tr: Stabilatör kökü bütün sapma aralığında gövdeye girmez (gövde yarı genişliği ile pay ≥ 5 mm)
  metric: stab_root_body_clearance_m
  op: '>='
  value: 0.005
  unit: m
  source: ARCHITECTURE.md §1.4 (no interference in any joint position); finding F3
- id: R-40
  text_tr: Dikey kuyruk kökü bütün kök veteri boyunca gövdeye gömülü (boşluk ≤ 0)
  metric: fin_root_max_gap_m
  op: <=
  value: 0.0
  unit: m
  source: ARCHITECTURE.md §1.4 (nothing floating); finding F4
- id: R-41
  text_tr: 'Pervane koruması: eğik dikeylerin firar kenarı pervane düzlemini disk ucundan ≥ 26 mm dışarıda keser'
  metric: prop_guard_fin_crossing_margin_m
  op: '>='
  value: 0.026
  unit: m
  source: user requirement (open pusher guarded by the canted fins); CS-VLA 925(c)(1) radial clearance
- id: R-42
  text_tr: 'Pervane koruması: eğik dikeylerin firar kenarı pervane düzlemini disk ucundan ≤ 80 mm dışarıda keser (diski
    yakından çevreler)'
  metric: prop_guard_fin_crossing_margin_m
  op: <=
  value: 0.08
  unit: m
  source: user requirement (fins bracket the disc); finding F10 (r about 0.40-0.45 m)
- id: R-43
  text_tr: Ana kiriş hattında OML derinliği (gövde yanından dış panel bağlantısına) ≥ birleşim kalınlığının %95'i
  metric: spar_depth_main_ratio
  op: '>='
  value: 0.95
  unit: '-'
  source: finding F7 (carry-through depth); wing.planform.spar_depth_main_frac
- id: R-44
  text_tr: Arka kiriş hattında OML derinliği (gövde yanından dış panel bağlantısına) ≥ dış panel bağlantı kesitinin arka
    kiriş derinliğinin %95'i (arka kiriş kademesiz devam eder)
  metric: spar_depth_rear_ratio
  op: '>='
  value: 0.95
  unit: '-'
  source: finding F7 (spar path from the body side to the outer-panel joint); wing.planform.spar_depth_rear_frac x the NLF(1)-0416
    joint section depth at the rear spar chord fraction (spar_depth_targets)
- id: R-45
  text_tr: Kanat kökü ile köşe çizgisi arasında basamak ≤ 10 mm (LERX/köşe çizgisi geçişi)
  metric: wing_root_chine_step_m
  op: <=
  value: 0.01
  unit: m
  source: finding F8 (LERX/chine blend)
- id: R-46
  text_tr: Flap, sökülebilir dış panelin üzerinde kalır (iç ucu panel bağlantısının dışında)
  metric: flap_inboard_end_outboard_of_joint_m
  op: '>='
  value: 0.0
  unit: m
  source: finding F11 (one flap per outer panel, one actuator each)

# ---------------------------------------------------------------------------------------------------------------------
# mission: design mission
# ---------------------------------------------------------------------------------------------------------------------
mission:
  payload_design_kg: 20.0
  loiter_altitude: 3000.0
  transit_radius: 100000.0
  reserve_fraction_of_trip_time: 0.1
  reserve_altitude: 1000.0
  trapped_fuel_fraction: 0.02
  loiter_speed_floor_eas: 26.0
  cruise_speed_band: [30.0, 36.0]
  service_ceiling: 4500.0
  runway_length: 300.0
  field_roll_max: 200.0
  climb_rate_sl_target: 4.9
  descent_rate: 2.5
  rolling_friction: 0.04
  braking_friction: 0.3
  touchdown_speed_factor: 1.15
  endurance_requirement_h: 10.0
  stall_speed_max: 24.0
  profile:
  - segment: warmup
    model: sizinglib fraction 0.996
    source: sizinglib.py (endurance study)
  - segment: taxi
    model: sizinglib fraction 0.997
  - segment: takeoff
    model: sizinglib fraction 0.995
  - segment: climb
    to_m: 3000.0
    model: best rate of climb at WOT, mid-altitude point (Flight.climb_point)
  - segment: transit_out
    distance_m: 100000.0
    model: best-range speed, >= cruise band minimum, turret retracted
  - segment: loiter
    altitude_m: 3000.0
    model: minimum fuel flow, never below max(26 m/s EAS, 1.2 VS); turret extended
  - segment: transit_back
    distance_m: 100000.0
    model: as transit_out
  - segment: descent
    rate_m_s: 2.5
    model: sizinglib fraction 0.998
  - segment: landing
    model: sizinglib fraction 0.997
  - segment: reserve
    model: 10 % of the airborne time at best loiter, 1000 m, turret retracted; 2 % trapped fuel
  sources:
    payload_design_kg: baseline.yaml#mass_targets.payload_design_kg
    loiter_altitude: baseline.yaml#mission_targets.operating_altitude_m (top of the band; endurance study)
    transit_radius: endurance study design mission (2 x 100 km)
    reserve_fraction_of_trip_time: baseline.yaml#mission_targets.endurance_h basis (10 % reserve)
    loiter_speed_floor_eas: baseline.yaml#mission_targets.loiter_speed_m_per_s_eas.range[0]
    cruise_speed_band: baseline.yaml#mission_targets.cruise_speed_m_per_s.range
    service_ceiling: baseline.yaml#mission_targets.service_ceiling_m
    runway_length: baseline.yaml#mission_targets.runway_length_m
    climb_rate_sl_target: baseline.yaml#mission_targets.climb_rate_sea_level_m_per_s (goal; R-05 sets 4.0 m/s)
    touchdown_speed_factor: endurance study (1.15 VS)
    rolling_friction: endurance study (paved/prepared strip)
    braking_friction: endurance study
    stall_speed_max: docs/01_arastirma.md wing-loading rule
    endurance_requirement_h: R-02
    trapped_fuel_fraction: endurance study (estimate)
    descent_rate: endurance study (estimate)
    rotation_time_s: Raymer 6th ed. 17.8.2 (rotation about 1 s for small aircraft)
  rotation_time_s: 1.0

# ---------------------------------------------------------------------------------------------------------------------
# engine: engine (Limbach L 275 EF)
# ---------------------------------------------------------------------------------------------------------------------
engine:
  model: Limbach L 275 EF
  vendor: Limbach Flugmotoren GmbH (Königswinter, Germany)
  type: two-stroke boxer twin, loop scavenged, port fuel injection with ECU (altitude/temperature compensation), air-cooled,
    single spark plug per cylinder, both cylinders fire together
  displacement_m3: 0.000274
  power_max_W: 18000.0
  power_max_continuous_W: 16200.0
  rpm_max_operating: 7500.0
  rpm_hard_cut: 8000.0
  altitude_power_lapse_exponent: 1.23
  wot_curve:
    rpm: [4000, 4500, 5000, 5500, 6000, 6500, 7000, 7500]
    torque_N_m: [25.3, 25.4, 25.9, 25.6, 25.7, 24.7, 24.0, 23.7]
  bsfc_curve:
    points: [[0.2, 600], [0.3, 540], [0.5, 470], [0.75, 460], [1.0, 430]]
  fuel:
    density_kg_per_m3: 740.0
  generator:
    power_continuous_W: 800.0
    efficiency: 0.85
  electrical_load_continuous_W: 303.0
  installed_mass_kg: 10.96
  envelope:
    length_with_sg750: 0.26
    width: 0.3968
    height: 0.2946
    crank_axis_to_cylinder_side: 0.06
    intake_box_width: 0.3
  cooling:
    airflow_kg_per_s_at_max_power: 0.42
    fuel_flow_at_max_power_kg_per_h: 7.74
    inlet_ram_recovery: 0.88
    fin_pack_dp_over_q: 0.67
    inlet_external_Dq: 0.0008
  installed_items_kg:
    engine_bare: 7.0
    ecu_harness_ignition_coils: 0.8
    fuel_pump_regulator_filter: 0.35
    starter_generator_sg750: 0.44
    generator_power_electronics: 0.4
    generator_adapter_coupling: 0.15
    exhaust_with_silencers: 1.0
    engine_mount_isolators_bolts: 0.7
    throttle_servo_cht_egt_sensors: 0.12
  mount:
    bolts: 4 x M8 threaded bosses on the rear crankcase face
    bolt_pattern_yz_m: [[-0.0295, 0.051], [-0.0295, -0.051], [0.052, 0.031], [0.052, -0.031]]
    isolator_rigid_body_modes_Hz_max: 20.0
  sources:
    power_max_W: baseline.yaml#engine.power_max_W (manufacturer)
