    - name: nose_gear
      kind: revolute
      origin: [0.65, 0.0, -0.12445]
      axis: [0.0, -1.0, 0.0]
      lo: 0.0
      hi: 1.570796
      rest: 0.0
      prop: ''
      scale: 1.0
      expr: 1.57080*clamp((gear_up-0.15)/0.7,0,1)
