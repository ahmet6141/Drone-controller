            rib: UD caps 40 mm wide (structures.sizing.wing.main_cap) top and bottom, two +-45 PW webs 2 mm (prongs, 10
            plies) 30.4 mm apart, padded up to 10 mm (>= 40 % +-45, [+-45/0/90] blocks 50 mm long) around the pin bores,
            caps widened to 52 mm over the fork; four bonded 4130 bushes 16 H8 x OD 22 x 10 mm (YK250-CH-053 = bush set);
