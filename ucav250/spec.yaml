      hardware:
        groups: [hardware]
        sub_ranges:
          'fastener parts generated by hardware.py: YK250-HW-<fastener id> (fastener id = <owner part id>-<Bn|Pn|Cn>)': [
            0, 0]
          stand-alone hardware items (keeper plates, shims, ballast plates): [870, 999]
