      deg at about -/+43 deg of servo travel); the v1.3 direct drive did not meet the rated rule at VF'
    planform_v1.3: 'design choices (fix round 2, R-02 closure after the honest endurance model of V1-01/V1-02; full design
      closures, out/sizing_trades.json r02_ladder): quarter-chord sweep 6 -> 8 deg (the wing root moves forward with the
      static-margin closure: longer tail arms, smaller stabilators and fins, shorter LERX), LERX apex x 1.85 -> 1.80 m (LERX
      leading edge stays single-valued with the larger sweep), washout 3 -> 4 deg (more elliptic loading, tip-stall margin),
      stall-speed target 23.9 -> 23.95 m/s (R-08 <= 24.0 m/s kept). Rejected: incidence 3.0-3.25 deg and washout >= 4.5
      deg (+0.03..+0.10 h but the main gear no longer stows, R-21/R-26), sweep 9-10 deg, span 7.4 m, taper 0.32, junction
      y 0.65/0.75 m, LERX apex 1.95 m, spar-depth rule 0.97, dihedral 4 deg (all lower or infeasible). CLmax now includes
      cos(sweep) (Raymer eq. 12.15)'
    glove_blend_u: 'V1-06 (fix round 2): LERX/glove sections morph from the LERX section (blend weight 0) to NLF(1)-0416
      (1) linearly between these LERX span fractions, rounded to steps of 0.25 (sizing.glove_blend_weight): no airfoil-family
      switch between neighbouring sections (the v1.2 NACA 0012 -> NLF(1)-0416 switch at y 0.53/0.585 m made a visible kink
      in the lower contour). LERX section NACA 0016-34 (lerx_section): sharp nose for the strake, maximum thickness moved
      aft to 40 % so the spar-depth rule needs a 108 mm instead of a 128 mm root section (less forward blister); trade at
      fixed planform (fix round 2): 0016-36 (max t at 60 %) 99 mm but wing CLmax 1.326 (-1.7 %, larger wing), 0016-34 1.346,
      NACA 0012 (v1.2) 1.349 / 128 mm'
    planform_v1.2: 'design choices (v1.2, R-02 closure; trade out/sizing_trades.json r02_ladder): taper 0.42 -> 0.35, LERX
      apex x 1.55 -> 1.85 m, glove/outer-panel junction y 0.82 -> 0.70 m (outer panels 2.90 m, transport limit); the smaller
      LERX/glove moves the configuration AC aft, reduces the nose-down zero-lift moment and the trim load, and removes glove
      wetted area and mass'

