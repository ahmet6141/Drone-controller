# ---------------------------------------------------------------------------------------------------------------------
# configuration: configuration decisions
# ---------------------------------------------------------------------------------------------------------------------
configuration:
  name: D · HANÇER (kullanıcı seçimi, ucav250/data/concepts_v2/directions.yaml#hancer)
  propulsion: 'single open pusher propeller (Mejzlik 31x12 3B, 5 deg down-thrust) on the Limbach L 275 EF, direct drive
    with a 110 mm hub spacer; the trailing edges of the canted fins cross the propeller plane 50 mm outside the tip circle
    in the upper-lateral sectors (about 35 deg either side of the top) and the ventral fin with a replaceable tail-bumper
    skid protects the lower sector; the lateral sectors at hub height are open (duct rejected by the user: mass, drag, ground
    clearance)'
  tail: twin outward-canted fins with rudders (roots buried in the dorsal skin along the whole chord) + two all-moving horizontal
    tails (stabilators) on spindles at 20 % of the panel MAC, each beside a fixed root stub (constant 8 mm root gap) + ventral
    fin/tail bumper; sizes from the trim (local stabilator CL incl. eta_t and the full-throttle lift-off/go-around cases)
    and directional-stability rules (tail.sizing_rules)
  wing_position: mid wing on the chine plane; the chines run into curved leading-edge root extensions (LERX) that blend
    into the high-aspect-ratio NLF(1)-0416 outer panels
  gear: 'retractable tricycle: main legs on longitudinal trunnions in the belly gear frame, inward retraction (wheels side
    by side under the wing box, fuller flat belly at the wells); steerable nose leg retracting aft into a keel slot ahead
    of the turret bay; 2.5 deg nose-up static attitude; electric actuation (SAGITTA practice)'
  fuselage_style: chined lifting body (diamond-like sections, crisp chine and dorsal/keel ridges, fuller flat belly between
    the payload bay and the main wells, round cowl closure at the propeller hub)
  turret: 'retractable EO/IR turret: Trillium HD59 lowered from a belly bay on a ball-screw lift for the mission (bay doors
    fold inward along the bay walls), retracted above the closed flush doors for take-off, landing and transit; bay sized
    for the Octopus E180 growth envelope (0.18 m x 0.23 m)'
  transport_breakdown: centre body with the integral LERX/glove (2 x y_junction wide) + two removable outer wing panels
    (span/2 - y_junction long each) + removable stabilators; propeller removed
  reasons_tr: ['Kullanıcı ilk kavramları ''yine aynı tip'' bularak reddetti; v2 tasarım yönü çalışmasında (MANTA, OK, HALKA,
      HANÇER) D · HANÇER seçildi: köşeli taşıyıcı gövde + LERX + ikiz eğik dikey kuyruk + hareketli yatay kuyruk.', 'Kanal
      (duct) içindeki fan kullanıcı tarafından reddedildi; açık itici pervaneyi üst-yan bölgelerde eğik dikey kuyrukların
      firar kenarları (disk ucundan 50 mm dışarıda), alttan ventral kanatçık (kuyruk tamponu) korur; göbek yüksekliğindeki
      yan bölgeler açıktır. Yere çarpma, kuyruk sürtmesi ve CS-VLA 925 açıklıkları hesaplanır.', 'İçeri katlanır iniş takımı
      ve geri çekilir taret kullanıcının isteğidir; kütle (SAGITTA referansı, taret kaldırma mekanizması) ve hacim boyutlandırmada
      açıkça sayılmıştır (ödünleşim tabloları sizing.md).', 'Kanat açıklığı 7,2 m: dış panel boyu (span/2 − y_junction)
      taşıma için 3,4 m sınırının altında kalır; gövde + LERX orta kesiti tek parça taşınır. Daha uzun açıklık indüklenmiş
      sürüklemeyi azaltır.', 'Kanat alanı tutunma hızı kuralından (VS ≤ 24 m/s, temiz, trimli, MTOM) gelir; dayanım W/S
      ile arttığı için en iyi nokta bu sınırdadır (konvansiyonel dayanım çalışmasıyla aynı bulgu; ödünleşim: VS 24,5 m/s
      R-08''i bozar).', 'Paraşüt: UAVOS 200 (4,5 kg) GRS 4/240 SOFT (5,9 kg) yerine seçildi; taşıyıcı gövdenin iç hacmi
      büyük bölmeyi (0,300 x 0,300 x 0,275 m) taşır, 1,4 kg kazanç dayanıma gider.', 'Faydalı yük bölmesi boş kütle ağırlık
      merkezine ortalanır; ağırlık merkezi aralığı daralır, trim kaybı ve trim sürüklemesi azalır; ana takım bölmenin arkasına
      yerleşir.', 'Pervane 31x12 3B: hız/güç bağımlı soğutma sürüklemesiyle 32x18 2B tırmanmada 3,9 m/s''de kalır (R-05
      ≥ 4,0 karşılanmaz) ve kalkış koşusu ile takım yuvası kurallarını da bozar; 3B bunları karşılar, dayanımdan yaklaşık
      0,3 h götürür (ödünleşim tablosu).', 'v1.1 sonucu: dürüst modelle tasarım görevi dayanımı 10 saatin altında kalır
      (R-02 karşılanmıyor); kapatma seçenekleri docs/02 §14''te kullanıcı kararına sunuldu, gereksinim düşürülmedi.']
  trade_study: ucav250/data/concepts_v2/directions.yaml (design directions), ucav250/data/concepts/*/concept.yaml (conventional
    reference concepts), out/sizing_trades.json (propeller, gear, turret, span/loading, tail arm)

