requirements:
- id: R-01
  text_tr: Azami kalkış kütlesi 150 kg'ın altında (SHT-İHA M2 sınıfı, 149,9 kg tavan)
  metric: mtow_kg
  op: <=
  value: 149.9
  unit: kg
  source: baseline.yaml#mass_targets.mtow_kg.hard_cap (SHT-IHA Madde 8(1))
- id: R-02
  text_tr: 'Tasarım görevi dayanımı ≥ 10 h, tasarım görevi faydalı yüküyle (mission.payload_design_kg: MTOM 149,9 kg''da
    aynı görevde ≥ 10,25 h veren, 0,5 kg''a aşağı yuvarlanmış en büyük faydalı yük; tırmanma, 2 x 100 km geçiş, 3000 m''de
    taret dışarıda bekleme, alçalma; %10 yedek ayrıca)'
  metric: endurance_h
  op: '>='
  value: 10.0
  unit: h
  source: 'baseline.yaml#mission_targets.endurance_h (10 h); project-lead requirement decision (fix round 4, 2026-10-09):
    three independent verification rounds showed that with every user-chosen feature (retractable gear, retractable turret,
    four tail surfaces, chined wide body) the 10 h / 20 kg pair does not fit under the 149.9 kg M2 cap (9.90 h); 10 h /
    20 kg was a research starting target, not a user requirement (doc 02, ''Gereksinim kararı''); the design-mission payload
    is derived by sizing.py (mission.payload_design_rule)'
- id: R-02b
  text_tr: Azami faydalı yükle (20 kg) aynı tasarım görevinde dayanım ≥ 9,5 h (MTOM 149,9 kg; yakıt = MTOM − boş kütle −
    20 kg; azami yükün kendi ağırlık merkezi)
  metric: endurance_max_payload_h
  op: '>='
  value: 9.5
  unit: h
  source: 'project-lead requirement decision (fix round 4, 2026-10-09): three independent verification rounds showed that
    with every user-chosen feature (retractable gear, retractable turret, four tail surfaces, chined wide body) the 10 h
    / 20 kg pair does not fit under the 149.9 kg M2 cap (9.90 h); 10 h / 20 kg was a research starting target, not a user
    requirement (doc 02, ''Gereksinim kararı''); mission.payload_max_kg, mission.endurance_max_payload_requirement_h'
- id: R-03
  text_tr: 'Azami faydalı yük ≥ 20 kg: MTOM''daki yükleme durumlarından biri 20 kg faydalı yük taşır ve bütün kontroller
    (ağırlık merkezi zarfı, statik marj, kalkış, R-02b) bu yükle de yapılır'
  metric: payload_max_checked_kg
  op: '>='
  value: 20.0
  unit: kg
  source: 'baseline.yaml#mass_targets.payload_design_kg (20 kg: research starting target, the maximum payload after the
    round-4 requirement decision; R-02b)'
- id: R-04
  text_tr: Servis tavanı (0,5 m/s) ≥ 4500 m, MTOM
  metric: ceiling_service_m
  op: '>='
  value: 4500.0
  unit: m
  source: baseline.yaml#mission_targets.service_ceiling_m
- id: R-05
