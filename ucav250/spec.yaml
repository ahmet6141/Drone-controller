  part_numbering:
    convention: 'YK250-<CODE>-NNN[-L|-R]: CODE = group code (CH chassis, SH shell, WG wing, TL tail, FC flight controls,
      PR propulsion, FU fuel, LG landing gear, SY systems, PL payload, HW hardware); NNN = three-digit number from the range
      of the PRODUCING MODULE (layout.part_numbers, ranges disjoint across modules, so a number is unique whatever the group
      code); -R starboard part modelled in +y, -L its mirrored port copy (core.parts.mirror_part), no suffix on the centre
      line'
    codes:
      chassis: CH
      shell: SH
      wing: WG
      tail: TL
      controls: FC
      propulsion: PR
      fuel: FU
      gear: LG
      systems: SY
      payload: PL
      hardware: HW
    modules:
      chassis:
        groups: [chassis]
        sub_ranges:
          centre wing box and joint fittings: [1, 1]
          frames and bulkheads (stations): [2, 19]
          longerons, keel members, decks, walls: [20, 49]
          wing joint / glove ribs and fittings: [50, 69]
          landing-gear fittings: [70, 84]
          engine mount and firewall: [85, 94]
          tail fittings and stabilator bearings: [95, 109]
          turret, parachute, fuel and equipment supports: [110, 149]
      wing:
        groups: [wing, controls]
        sub_ranges:
          outer panel structure: [150, 199]
          ailerons, flaps, hinges, actuators, linkages (FC): [200, 249]
      tail:
        groups: [tail, controls]
        sub_ranges:
          fins, stubs, ventral, stabilators: [250, 299]
          rudders, stabilator drives, hinges, linkages (FC): [300, 349]
      shell:
        groups: [shell]
        sub_ranges:
          body skins and access panels: [350, 419]
          LERX/glove skins and wing-joint panels: [420, 449]
          cowling and fairings: [450, 499]
      propulsion:
        groups: [propulsion]
        sub_ranges:
          engine, mount isolators, exhaust: [500, 539]
          propeller, spinner, cooling ducts and baffles: [540, 569]
      fuel:
        groups: [fuel]
        sub_ranges:
          cells, lines, valves, vents, filler, sensors: [570, 619]
      gear:
        groups: [gear, controls]
        sub_ranges:
          legs, wheels, brakes, actuators: [620, 669]
          doors, hinges, locks, door drives: [670, 719]
      systems:
        groups: [systems]
        sub_ranges:
