    payload: [eo_ir_turret_hd59_mount, mission_computer_recorder, payload_tray_harness, research_payload_allowance]
    note: 'payload: list of mass.payload_items names (truthy = with payload for analysis/mass.py)'
  - name: mtow_max_payload_turret_retracted
    fuel_fraction: 0.901456
    fuel_rule: mtom
    turret: retracted
    payload: [eo_ir_turret_hd59_mount, mission_computer_recorder, payload_tray_harness, research_payload_allowance, research_payload_max_increment]
    note: 'payload: list of mass.payload_items names (truthy = with payload for analysis/mass.py); fuel_rule mtom: fuel
      fraction = (MTOM - zero-fuel mass) / mass.fuel_kg (derived)'
  - name: mtow_max_payload_turret_extended
