    basis: B-basis ETW 93 degC (NCAMP), Yt = 0.8 x ETW mean
    density: 1542.0
    E: 127620000000.0
    E2: 7929000000.0
    G12: 2964700000.0
    nu12: 0.31
    Ftu: 1556700000.0
    Fcu: 771730000.0
    F2tu: 21994000.0
    F2cu: 90666000.0
    Fsu: 25580000.0
    estimated_fields: [F2tu, Fbru]
    ply_t: 0.0001397
