          t: 0.0005
        text: layout.firewall_x is the AFT face (stainless shield); the stack lies forward of it so the firewall_gap of
          the sizing (SG750 front 20 mm aft of the shield) is kept; penetrations only through fireproof unions, grommets
          and bellows (stations FS3670 cut-outs); fuel cells >= 13 mm ahead of the forward face (CS-LUAS.967(c))
      removal: engine off the isolators to the aft after removing propeller, spinner, cowls, exhaust, harness plugs, fuel
        quick-disconnects and 4 M8 bolts; the mount stays on the firewall
