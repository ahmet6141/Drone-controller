# ---------------------------------------------------------------------------------------------------------------------
# layout: layout (interface definition: stations, chassis, shell, mechanisms, keep-outs, clearances, systems; zones from sizing)
# ---------------------------------------------------------------------------------------------------------------------
layout:
  datum: Z = 0 on the centre-body chine plane, X = 0 at the nose tip
  note: 'layout phase v1: interface definition (stations, chassis members and fittings, shell panel breakdown, mechanisms,
    keep-outs, clearances, systems, harness) for the detail modules, who build from it without reading each other''s geometry;
    zones_preliminary / fuel_cells / bay_contents_check remain sizing outputs'
  sources:
    turret_x: 'design choice: turret bay 40 mm aft of v1 so that the longer nose leg of the nose-up ground attitude stows
      ahead of the bay (R-22, R-27)'
    layout_phase: 'layout phase v1 (this section): interface definition for the detail modules; checked by ucav250.analysis.layout_check
      (out/layout.md, docs/03_yerlesim_ve_yapi_konsepti.md); generated by ucav250.layout_build.build'
    rules.boxes.z: 'layout phase: power-switching / avionics-deck zones raised 3 mm and the side bays lowered 2 mm so that
      the 6.8 mm deck sandwich (M-DECK-NOSE, z 0.0140-0.0208) fits between them; bay_contents centres follow'
    mass_placement: 'layout phase: positions of the listed mass items = centroids of the placed layout objects (sizing.mass_items
      applies them; layout_check verifies them)'
  rules:
    turret_x: 1.22
    payload_bay_half_width: 0.2
