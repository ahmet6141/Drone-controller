# ---------------------------------------------------------------------------------------------------------------------
# layout: layout (sizing-phase zones; filled by the layout phase)
# ---------------------------------------------------------------------------------------------------------------------
layout:
  datum: Z = 0 on the centre-body chine plane, X = 0 at the nose tip
  rules:
    turret_x: 1.22
    payload_bay_half_width: 0.2
    payload_bay_roof_z: -0.06
    fuel_top_z: 0.16
    fuel_cell_fwd_length: 0.24
    fuel_cell_aft_length: 0.2
    firewall_gap: 0.02
    boxes:
      avionics_power_bay:
        x: [0.8, 1.06]
        half_width: 0.07
        z: [0.035, 0.095]
        clearance: 0.008
        content: flight computer, GNSS/IMU, datalink, battery 14S2P, PDU, DC-DC
      parachute_bay:
        x: [1.5, 1.8]
        half_width: 0.15
        z: [-0.172, 0.103]
        clearance: 0.006
        content: UAVOS 200 parachute compartment 0.300 x 0.300 x 0.275 m, dorsal hatch ahead of the wing
      mission_computer:
        x: [1.84, 2.06]
        half_width: 0.08
        z: [-0.12, -0.03]
        clearance: 0.008
        content: mission computer / recorder, video encoder
      equipment_bay_aft:
        x: [3.2, 3.56]
        half_width: 0.1
        z: [-0.06, 0.08]
        clearance: 0.008
        content: ECU, generator power electronics, fuel pump/filter
    payload_bay_length: 0.42
    payload_bay_to_well_gap: 0.03
  fuel_cells:
  - name: forward_cell
    x: [2.333, 2.573]
    z: [-0.052, 0.16]
  - name: saddle_cell
    x: [2.613, 2.88959]
    z: [0.04849, 0.16]
  - name: aft_cell
    x: [2.92959, 3.12959]
    z: [-0.052, 0.16]
  zones_preliminary:
    avionics_power_bay:
      box: [[0.8, 0.0, 0.035], [1.06, 0.07, 0.095]]
      symmetric: true
      clearance: 0.008
      content: flight computer, GNSS/IMU, datalink, battery 14S2P, PDU, DC-DC
    parachute_bay:
      box: [[1.5, 0.0, -0.172], [1.8, 0.15, 0.103]]
      symmetric: true
      clearance: 0.006
      content: UAVOS 200 parachute compartment 0.300 x 0.300 x 0.275 m, dorsal hatch ahead of the wing
    mission_computer:
      box: [[1.84, 0.0, -0.12], [2.06, 0.08, -0.03]]
      symmetric: true
      clearance: 0.008
      content: mission computer / recorder, video encoder
    equipment_bay_aft:
      box: [[3.2, 0.0, -0.06], [3.56, 0.1, 0.08]]
      symmetric: true
      clearance: 0.008
      content: ECU, generator power electronics, fuel pump/filter
    nose_gear_well:
      box: [[0.62, -0.039, -0.20114], [1.082, 0.039, 0.01286]]
      symmetric: true
      clearance: 0.0
      content: stowed nose wheel (vertical) + leg slot; checked on the tyre envelope
    turret_bay:
      box: [[1.12, 0.0, -0.21], [1.32, 0.1, 0.104]]
      symmetric: true
      clearance: 0.0
      content: E180 growth envelope (sphere + cylinder) + lift mechanism; checked on the envelope (turret_checks)
      ball_center_retracted_z: -0.106
    wing_carry_through:
      box: [[2.583, 0.0, -0.0364933], [2.91959, 0.3, 0.0364933]]
      symmetric: true
      clearance: 0.0
      content: spar box through the body
    main_gear_wells:
      box: [[2.9046, 0.0, -0.18756], [3.1186, 0.37479, -0.07135]]
      symmetric: true
      clearance: 0.0
      content: stowed main wheels side by side + trunnion fittings; checked on the tyre envelopes (gear_stowage)
    payload_bay:
      box: [[2.4546, 0.0, -0.19705], [2.8746, 0.2, -0.06]]
      symmetric: true
      clearance: 0.0
      content: belly research-payload bay under the forward fuel cell
    engine_cylinder_slab:
      box: [[3.77, 0.0, 0.16], [3.9, 0.1984, 0.28]]
      symmetric: true
      clearance: 0.01
      content: L 275 EF cylinders/heads
    engine_intake_box:
      box: [[3.77, 0.0, -0.0146], [3.9, 0.15, 0.16]]
      symmetric: true
      clearance: 0.01
      content: intake box below the crank
    engine_crankcase_sg750:
      box: [[3.69, 0.0, 0.12], [3.93, 0.1, 0.27]]
      symmetric: true
      clearance: 0.01
      content: crankcase + SG750
    firewall_x:
      x: 3.67
  firewall_x: 3.67
  ground_z: -0.43034
  root_part: null
  part_numbers: {}
  clearances:
    prop_tip_to_structure_radial: 0.026
    prop_blade_to_structure_longitudinal: 0.013
    tyre_to_well: 0.012
    composite_to_exhaust: [0.025, 0.05]
    source: standards.yaml#propeller_clearance; baseline.yaml#engine.cooling
  note: 'sizing-phase placeholder: zones_preliminary are keep-out boxes for the layout phase (part numbers, frames and interface
    points are added there)'
  sources:
    turret_x: 'design choice: turret bay 40 mm aft of v1 so that the longer nose leg of the nose-up ground attitude stows
      ahead of the bay (R-22, R-27)'

