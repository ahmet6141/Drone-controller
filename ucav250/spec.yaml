          part: YK250-WG-152
          owner: wing
          position: [2.8867, 0.7, -0.012]
          axis: [-0.1392, -0.9903, -0.0]
          diameter: 0.01
          engagement: 0.03
          spec: 17-4PH H1025 or Ti-6Al-4V pin d 10 f7, bonded + pinned into the outer-panel rear-spar root fitting; tapered
            nose 15 mm
        bushing_fitting:
          part: YK250-CH-054
          owner: chassis
          material: al_7075_t651_plate
          process: cnc_milling_metal
          geometry: block fitting on the joint rib at the rear spar with a pressed bronze bush 10 H8, bolted 4 x M5 to the
