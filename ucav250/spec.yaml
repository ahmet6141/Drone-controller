        the belly), upper/lower skin attachment land at the chine, LERX/glove root attachment between FS1810 and the main-spar
        frame; forward piece FS0600 -> main-spar frame, aft piece rear-spar frame -> forward face of the firewall FS3670,
        spliced to the side-of-body rib of the wing box with 2 x 4 M6 bolts; fix round 1 (VPK-01/VPK-06): no carbon aft
        of the firewall - the aft end is spliced (2 x M5 Ti) to the forward tongue of the metallic stabilator node fitting
        F-SPINDLE-NODE, which is through-bolted with the firewall stack'
