# =====================================================================================================================
# ucav250/spec.yaml — YK-250 HANÇER, v1 (sizing phase)
# Single source of truth (ARCHITECTURE.md §1, §9). SI units, metres, kg, W, degrees in keys ending _deg.
# Frame: X aft from the nose tip, Y starboard, Z up; Z = 0 on the centre-body chine plane (layout.datum).
# Derived blocks (wing sections, fuselage stations, tail sections, landing-gear positions, mass items, layout zones,
# reference copies) are written by `python3 -m ucav250.analysis.sizing --update-spec` (design closure from the inputs
# and rules in this file) and verified by `python3 -m ucav250.analysis.sizing --check` (exit 1 on any deviation or
# requirement violation). Workflow: edit inputs/rules here -> --update-spec -> --check.
# =====================================================================================================================

# ---------------------------------------------------------------------------------------------------------------------
# meta: identity and scope
# ---------------------------------------------------------------------------------------------------------------------
meta:
  name: YK-250 HANÇER
  project: YK-250 (ucav250) — 150 kg sınıfı sivil EO/IR gözetleme ve araştırma İHA'sı
  revision: v1.6
  date: '2026-10-09'
  description_tr: 'HANÇER: köşeli (chine) taşıyıcı gövde; elmas benzeri kesitlerin keskin kenar çizgileri kavisli ön kenar
    uzantılarına (LERX) akar ve yüksek açıklık oranlı NLF kanada kaynaşır. Dışa eğik ikiz dikey kuyruk (dümenli), sabit
    kök parçalı tamamen hareketli yatay kuyruk (stabilatör), açık itici pervane (eğik dikeylerin firar kenarları üst-yan
    bölgelerde, ventral kanatçık ve tampon kızağı alt bölgede disk düzlemini uç çemberinin dışında keser; yan bölgeler açıktır),
    içeri katlanır üç tekerlekli iniş takımı ve gövde altındaki bölmeden açıklık halkasından indirilip kaldırılan EO/IR
    taret. v1.2: doğrulama bulgularının (F1–F19) tamamlanması. v1.3: ikinci doğrulama turu (V1-01…V1-11): görev yakıtı nokta
    yakıt akışının doğrudan zaman integrasyonuyla, jeneratör DC çıkışı güç elektroniği verimiyle, kuyruk kökleri gövde dış
    yüzeyinde budanmış ve iç bölgelerle çakışma kontrolünde, LERX–eldiven kesit geçişi aileden aileye sıçramasız, stabilatör
    menteşe momentleri panel CN_maks ile, işletme sınırları (VNE/VNO) ve MTOM inişi eklendi; v1.3''te R-02, kullanıcı onayı
    olmayan bir R-52 gevşetmesine dayanıyordu. v1.4: üçüncü doğrulama turu (V2-01…V2-08): R-52''nin v1.2 yeteneği geri getirildi
    (E180 tepe yükü bütün bekleme boyunca jeneratör + Li-ion tampon bataryanın tepe destek payıyla), küt kaporta tabanı
    için itici kurulum katsayısı 0,93 tahmini (tam gazda da), alçalma jeneratör devir tabanında integre, kalkışta gerçek
    yerden kesilme, bütün kumanda yüzeylerinde menteşe momenti ve dört çubuk bağlantı kontrolü (R-57…R-59). v1.5: proje
    liderinin gereksinim kararı ve dördüncü doğrulama turu (V3-01…V3-11): 10 h / 20 kg çifti kullanıcının seçtiği özelliklerle
    149,9 kg M2 tavanının altına sığmadığından (9,90 h) R-02 tasarım görevi faydalı yüküyle (≥ 10,25 h veren, 0,5 kg''a
    aşağı yuvarlanmış en büyük yük; sizing.py türetir) ≥ 10 h, yeni R-02b azami 20 kg yükle ≥ 9,5 h oldu; aviyonik/güç bölmesi
    gerçek bileşen zarflarıyla yeniden yerleştirildi ve içerik kontrolü eklendi; kalkış dönüşü ana teker temas noktasına
    göre moment dengesiyle; E180 görevi kendi elektrik yüküyle; renderlarda kuyular, kapaklar ve taret açıklığı. v1.6: beşinci
    doğrulama turu (V4-01…V4-08): takım kapağı kalemi v1.5 kapak düzenine göre yeniden kuruldu (kapak alanı, iç kapak eyleyicileri,
    bacak kapağı ayakları) ve görev yükü kuralı yeni kapanışta 18,0 kg verdi; kalkış dönüşünde yunuslama ataleti; R-60 payı
    kırpılmadan; yük – dayanım tablosu izin verilen en hafif yüklemeden (temel EO/IR seti) başlar ve dolu depolu hafif yükleme
    yükleme durumlarına eklendi. Bu dosya boyutlandırma fazının tek doğruluk kaynağıdır; türetilmiş değerleri `python3 -m
    ucav250.analysis.sizing --check` doğrular.'
  scope_tr: 'Kapsam: yalnızca sivil EO/IR gözetleme ve araştırma. Platform silah (weapon), mühimmat (munition), sert bağlantı
    noktası (hardpoint), pilon (pylon) veya yük bırakma (release) mekanizması içermez ve bunlar için tasarlanmamıştır; görünüm
    dili yalnızca biçimdir.'

# ---------------------------------------------------------------------------------------------------------------------
# requirements: requirements (metric = key of out/sizing.json -> metrics)
