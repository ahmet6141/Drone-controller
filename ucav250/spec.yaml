  sources:
    mtow_kg: 'design choice: MTOM at the 149.9 kg SHT-IHA M2 cap (R-01); any later empty-mass growth is paid with fuel (fuel
      = MTOM - empty - payload), the 5 % growth allowance is still carried in every item'
    mtow_cap_kg: baseline.yaml#mass_targets.mtow_kg.hard_cap
    rules: components.yaml / baseline.yaml / concept studies (see each item's basis)
    rules.growth_allowance: endurance study (5 % concept-phase allowance on every empty-mass item)
    rules.sagitta_main_leg_kg: components.yaml#landing_gear.items[sagitta_retractable_gear]
    rules.sagitta_nose_leg_kg: components.yaml#landing_gear.items[sagitta_retractable_gear]
    rules.gear_doors: 'V4-03 (fix round 5): re-based on the v1.5 door scheme (landing_gear.doors; sizing.gear_doors_mass).
      Identity concept study RETRACT items (data/concepts/identity/concept.yaml, estimates): doors_0p15m2_sandwich_hinges_links
      0.41 kg -> 0.41 / 0.15 = 2.733 kg/m2 applied to the actual door area; well_close_outs_3x 0.36; cut_out_reinforcement_frames_longerons
      0.50; up_down_lock_sensors_controller_harness 0.25. Perimeter seals 0.0235 kg/m = the v1.2 estimate 0.08 kg / 3.40
      m of joint, applied to the actual joint length (well outlines + door split lines). Sequenced inner doors: one door
      actuator each, Volz DA 22-30-4128 (components.yaml, 0.132 kg datasheet, 1.8 N m rated; the door lies in the flow plane
      (hinge line along x), so its aerodynamic hinge moment is small - not checked numerically) + crank/pushrod/over-centre
      lock and door-closed switch 0.04 kg each (estimate). Leg doors: two standoff brackets per leg 0.02 kg each (estimate).
      v1.5 used the identity-study total 1.60 kg for five doors without door drives'
