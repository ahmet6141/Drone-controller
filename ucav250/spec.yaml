    fix round 5 (V4-03): gear 13.75 -> 14.34 kg for the re-based door item (door area of the v1.5 scheme, two inner-door
    actuators + linkages, leg-door brackets, seals on the actual joint length), hardware 1.50 -> 1.51 kg (its fraction of
    the larger gear base) and tail 7.87 -> 7.89 kg (stabilator +0.2 % in the re-closure); no item deleted; see budget_rules);
    the registry mass of the detailed design (analysis/mass.py) must stay at or below each ceiling; tol_kg = 3 % (min 0.05
    kg) marks an allocation that has become stale (estimate far below the ceiling)'
